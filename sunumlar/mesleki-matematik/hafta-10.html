    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #0ea5e9;
            --accent-glow: #0ea5e940;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Mesleki Matematik: Hafta 10", "altbaslik": "Hafta 10: Temel Olasılık", "icerik": "Program: Bilişim Güvenliği Teknolojisi (Önlisans)\nModül: Olasılık ve Risk Analizi\nHaftalık Odak: Örnek Uzay, İstenen Olay, Bağımsız Olaylar, Spam Filtreleme ve Güvenlik Tehdit Modellemesi\nHedef: Güvenlik risklerini ve arıza olasılıklarını matematiksel olarak modellemek.", "gorsel": {"type": "image", "query": "probability risk assessment cyber security matrix mathematics"}}, {"baslik": "Neden Bu Konuyu Öğreniyoruz?", "altbaslik": "Sektörel Bağlam: Spam Filtresi ve Tehdit Olasılığı", "icerik": "Gelen bir e-postanın 'Kredi', 'Bedava', 'Şifre Sıfırlama' kelimelerini içermesi durumunda spam olma olasılığı nedir?\nİki yedekli sunucunun aynı anda çökme olasılığı nasıl hesaplanır?\nOlasılık teorisi, yapay zeka tabanlı antivirüs motorlarının ve risk yönetiminin merkezindedir.", "gorsel": {"type": "image", "query": "spam filter email security probability machine learning"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bologna ve Akreditasyon Odaklı Çıktılar", "icerik": "1. Deney, örnek uzay, çıktı ve olay kavramlarını açıklar.\n2. Basit olayların olasılığını P(E) = n(E)/n(S) formülüyle hesaplar.\n3. Ayrık ve bağımsız olayların olasılık kurallarını uygular.\n4. Sistem güvenliğinde hata, kesinti ve saldırı risklerini olasılıkla yorumlar.", "gorsel": {"type": "image", "query": "academic learning outcomes checklist education"}}, {"baslik": "Olasılık Temel Kavramları", "altbaslik": "Deney, Örnek Uzay ve Olay", "icerik": "- Deney: Sonucu önceden kesin olarak bilinmeyen işlem (Örn: Ağdan rastgele bir paket çekmek)\n- Örnek Uzay (S): Deneyin tüm olası çıktılarının kümesi (Tüm ağ trafiği)\n- Olay (E): Örnek uzayın herhangi bir alt kümesi (Zararlı paketler kümesi)\n- İmkansız Olay: Olasılığı 0 olan durum\n- Kesin Olay: Olasılığı 1 olan durum.", "gorsel": {"type": "image", "query": "probability sample space event outcome diagram"}}, {"baslik": "Klasik Olasılık Tanımı ve Sınırları", "altbaslik": "0 <= P(E) <= 1", "icerik": "Formül: P(E) = (İstenen Olayın Eleman Sayısı) / (Tüm Örnek Uzayın Eleman Sayısı) = n(E) / n(S)\nKurallar:\n- Olasılık daima 0 ile 1 arasındadır (0 <= P <= 1 veya %0 ile %100 arası).\n- Bir olayın gerçekleşme olasılığı P(E) ise, gerçekleşmeme olasılığı P(E') = 1 - P(E)'dir.", "gorsel": {"type": "image", "query": "probability formula 0 to 1 scale mathematics"}}, {"baslik": "Ayrık Olaylar (Mutually Exclusive)", "altbaslik": "Aynı Anda Gerçekleşemeyen Durumlar", "icerik": "Tanım: Ortak elemanı olmayan olaylardır (A n B = bos kume).\nAyrık Olaylarda VEYA Olasılığı:\nP(A veya B) = P(A) + P(B)\nÖrnek: Bir paketin TCP olma olasılığı 0.6, UDP olma olasılığı 0.3 ise, TCP veya UDP olma olasılığı = 0.6 + 0.3 = 0.9'dur.", "gorsel": {"type": "image", "query": "mutually exclusive events venn diagram probability"}}, {"baslik": "Bağımsız Olaylar (Independent Events)", "altbaslik": "Birbirinin Sonucunu Etkilemeyen Olaylar", "icerik": "Tanım: Bir olayın gerçekleşmesi diğerinin olasılığını değiştirmiyorsa bağımsızdır.\nBağımsız Olaylarda VE Olasılığı (Çarpım Kuralı):\nP(A ve B) = P(A) * P(B)\nÖrnek: İki farklı veri merkezindeki sunucuların çökme olasılıkları 0.01 ve 0.02 ise, ikisinin aynı anda çökme olasılığı = 0.01 x 0.02 = 0.0002 (%0.02).", "gorsel": {"type": "image", "query": "independent events multiplication rule probability"}}, {"baslik": "Ayrık Olmayan Olaylarda Toplama Kuralı", "altbaslik": "P(A u B) = P(A) + P(B) - P(A n B)", "icerik": "Kural: Olayların ortak kesişimi varsa kesişim olasılığı bir kez çıkarılır.\nÖrnek: Bir paketin dış IP'den gelme olasılığı 0.40, şifreli olma olasılığı 0.50, hem dış hem şifreli olma olasılığı 0.20 ise;\nDış IP veya Şifreli olma olasılığı = 0.40 + 0.50 - 0.20 = 0.70 (%70).", "gorsel": {"type": "image", "query": "addition rule non mutually exclusive probability"}}, {"baslik": "Tümleyen Olay Mantığı: 'En Az Bir'", "altbaslik": "P(En Az Bir) = 1 - P(Hiçbiri)", "icerik": "Çok güçlü bir olasılık stratejisidir:\n'En az bir sunucunun ayakta kalma olasılığı' sorulduğunda;\n1. Tüm sunucuların aynı anda çökme olasılığı bulunur: P(Tümü Çöktü)\n2. 1'den çıkarılır: P(Ayakta) = 1 - P(Tümü Çöktü)\nBu yöntem yüksek erişilebilirlik (HA) hesaplarında esastır.", "gorsel": {"type": "image", "query": "complement rule at least one probability"}}, {"baslik": "Koşullu Olasılık Fikri (Bayes Sezgisi)", "altbaslik": "P(A | B) - B Bilindiğinde A'nın Olasılığı", "icerik": "Tanım: B olayının gerçekleştiği bilindiğinde A'nın olma olasılığıdır.\nFormül: P(A | B) = P(A n B) / P(B)\nSpam Filtresi Örneği:\nBir e-postada 'Banka' kelimesi geçiyorsa (B), bu postanın oltalama (phishing) olma olasılığı (A) genel e-postalara göre çok daha yüksektir.", "gorsel": {"type": "image", "query": "conditional probability bayes theorem machine learning"}}, {"baslik": "Risk Skoru Formülü", "altbaslik": "Risk = Olasılık x Etki", "icerik": "Siber güvenlik risk değerlendirme standardı (ISO 27001):\nRisk = Tehdidin Gerçekleşme Olasılığı (P) x Tehdidin Sisteme Etkisi (I)\n- Yüksek Olasılık (0.8) x Düşük Etki (2) = Risk 1.6\n- Düşük Olasılık (0.05) x Kritik Etki (100) = Risk 5.0 (Daha öncelikli!).", "gorsel": {"type": "image", "query": "risk matrix probability impact severity cybersecurity"}}, {"baslik": "Yedeklilik ve Güvenilirlik Hesabı", "altbaslik": "Paralel Sistem Güvenilirliği", "icerik": "İki özdeş yedekli bileşen için (Bileşen arıza olasılığı = q):\n- Sistemin Tamamen Çökme Olasılığı = q * q = q^2\n- Sistemin Çalışma Güvenilirliği R = 1 - q^2\nÖrnek: q = 0.05 (%5 arıza) ise sistem çökmesi = 0.05^2 = 0.0025 (%0.25). Güvenilirlik %99.75'e yükselir.", "gorsel": {"type": "image", "query": "redundancy reliability parallel systems formula"}}, {"baslik": "Çözümlü Uygulama 1: Basit Ağ Paketi Olasılığı", "altbaslik": "Seviye: Başlangıç (n(E)/n(S))", "icerik": "Soru: Bir ağ arayüzünden geçen 200 paketten 30 tanesi ICMP (Ping) paketidir. Rastgele seçilen bir paketin ICMP olma olasılığı nedir?\nİşlem: P(ICMP) = 30 / 200\nSadeleştirme: 3 / 20 = 0.15 (%15).", "gorsel": {"type": "image", "query": "network packets sampling probability calculation"}}, {"baslik": "Çözümlü Uygulama 2: Tümleyen Olay (Ters Olasılık)", "altbaslik": "Seviye: Kolay (P(E'))", "icerik": "Soru: Bir antivirüs motorunun bilinmeyen bir zararlı yazılımı tespit etme olasılığı 0.94'tür (%94). Bu antivirüsün zararlıyı kaçırma (tespit edememe) olasılığı kaçtır?\nÇözüm: P(Kaçırma) = 1 - P(Tespit) = 1 - 0.94 = 0.06 (%6).", "gorsel": {"type": "image", "query": "antivirus malware detection probability rate"}}, {"baslik": "Çözümlü Uygulama 3: İki Bağımsız Güvenlik Katmanı", "altbaslik": "Seviye: Orta (Çarpım Kuralı)", "icerik": "Soru: Bir saldırganın Şirket Güvenlik Duvarını aşma olasılığı 0.10 (%10), EDR antivirüsü aşma olasılığı ise 0.05 (%5)'tir. Bu iki sistem bağımsız çalıştığına göre, saldırganın her iki katmanı birden aşarak sunucuya sızma olasılığı nedir?\nİşlem: P(Sızma) = 0.10 x 0.05 = 0.005 (%0.5 - Binde 5).", "gorsel": {"type": "image", "query": "defense in depth layers probability bypass"}}, {"baslik": "Çözümlü Uygulama 4: Yedekli Sunucularda 'En Az Biri'", "altbaslik": "Seviye: Orta (Tümleyen ile Yüksek Erişilebilirlik)", "icerik": "Soru: 3 adet yedekli web sunucusu vardır. Her bir sunucunun gün içinde çökme olasılığı 0.20'dir. Gün içinde EN AZ BİR sunucunun çalışır durumda kalma olasılığı nedir?\nAdım 1: 3 sunucunun da aynı anda çökme olasılığı = 0.20 x 0.20 x 0.20 = 0.008\nAdım 2: En az biri ayakta = 1 - 0.008 = 0.992 (%99.2).", "gorsel": {"type": "image", "query": "high availability server cluster reliability"}}, {"baslik": "Çözümlü Uygulama 5: Şifreli ve Şüpheli Paket Analizi", "altbaslik": "Seviye: Orta-İleri (Ayrık Olmayan Toplama)", "icerik": "Soru: 1000 paketlik örneklemde;\n- 400 paket şifresiz (HTTP)\n- 300 paket dış ülkeden gelen trafik\n- 100 paket hem şifresiz hem dış ülke trafiğidir.\nRastgele seçilen bir paketin Şifresiz VEYA Dış Ülke trafiği olma olasılığı nedir?\nİşlem: P(A u B) = (400/1000) + (300/1000) - (100/1000) = 600 / 1000 = 0.60 (%60).", "gorsel": {"type": "image", "query": "traffic packet analysis venn probability"}}, {"baslik": "Çözümlü Uygulama 6: Spam Filtresi Yanlış Pozitif (False Positive)", "altbaslik": "Seviye: İleri (Hata Olasılıkları)", "icerik": "Soru: Bir e-posta ağında gelen postaların %80'i normal, %20'si spamdir. Filtre normal postaların %2'sini yanlışlıkla spam olarak işaretlemektedir. Gelen rastgele bir normal e-postanın spam kutusuna düşme olasılığı nedir?\nİşlem: P(Normal VE Hatalı Engelleme) = 0.80 x 0.02 = 0.016 (%1.6).", "gorsel": {"type": "image", "query": "false positive spam detection rate diagram"}}, {"baslik": "Çözümlü Uygulama 7: Güvenlik Riski Karşılaştırma", "altbaslik": "Seviye: İleri (Risk Skoru)", "icerik": "Soru: Tehdit A: Olasılık = 0.40, Etki = 50.000 TL.\nTehdit B: Olasılık = 0.05, Etki = 600.000 TL.\nHangi tehdit şirkete daha büyük beklenen mali risk oluşturur?\n- Beklenen Kayıp A = 0.40 x 50.000 = 20.000 TL\n- Beklenen Kayıp B = 0.05 x 600.000 = 30.000 TL\nTehdit B'nin olasılığı düşük olmasına rağmen beklenen riski daha yüksektir.", "gorsel": {"type": "image", "query": "cyber risk quantitative monetary assessment"}}, {"baslik": "Sık Yapılan Hatalar ve Uyarılar (1)", "altbaslik": "Olasılık Kurallarını Karıştırmak", "icerik": "1. Olasılığı 1'den büyük veya negatif bulup fark etmemek (Olasılık daima [0, 1] aralığındadır).\n2. Bağımsız olaylarda olasılıkları toplamak (Bağımsız olaylarda VE durumu ÇARPILIR, toplanmaz!).\n3. Kesişimi olan olayları toplarken kesişimi çıkarmayı unutmak.", "gorsel": {"type": "image", "query": "probability common mistakes warning sign"}}, {"baslik": "Sık Yapılan Hatalar ve Uyarılar (2)", "altbaslik": "Yedeklilik Yanılgısı", "icerik": "1. İki sunucu varsa arıza olasılığı yarıya iner sanmak (Bağımsız iseler arıza olasılıkları çarpılarak katlanarak azalır: 0.1 -> 0.01).\n2. Bağımlı olayları bağımsız kabul etmek (Örn: İki sunucu aynı elektrik hattına bağlıysa arızaları bağımsız DEĞİLDİR!).", "gorsel": {"type": "image", "query": "system dependency common failure point caution"}}, {"baslik": "Sektörel Vaka: Bulut Veri Merkezi Çöküşü", "altbaslik": "Yedeklilik ve Gerçek Hayat Olasılıkları", "icerik": "Olay: Bir kurum iki farklı veri merkezinde çalışan yedekli mimariye sahipti. Her merkezin yıllık çökme olasılığı 0.01 idi.\nKurum yöneticisi ikisinin aynı anda çökme olasılığını 0.01 x 0.01 = 0.0001 (On binde bir) hesaplamıştı.\nAncak her iki merkez aynı DNS sağlayıcısını kullanıyordu. DNS çökünce iki merkez de erişilemez oldu.\nHata: Ortak bağımlılık (Single Point of Failure) olasılıkları bağımsız olmaktan çıkarmıştır.", "gorsel": {"type": "image", "query": "cloud outage single point of failure dns incident"}}, {"baslik": "Vaka Çözüm Planı ve İyileştirme", "altbaslik": "Tam Bağımsız Altyapı Mimarisi", "icerik": "Alınan Önlemler:\n1. DNS sağlayıcılarının da ikincil ve yedekli olarak farklı operatörlerden alınması.\n2. Matematiksel modelin koşullu olasılık P(A | Ortak Hata) şeklinde revize edilmesi.", "gorsel": {"type": "image", "query": "redundant multi-cloud architecture diagram"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Basit Olasılık", "icerik": "Soru: 500 ağ isteğinden 25'i DDoS saldırısı içeriyorsa, rastgele bir isteğin DDoS olma olasılığı nedir?\nA) 0.02\nB) 0.05\nC) 0.25\nD) 0.50\n\nDoğru Cevap: B (25 / 500 = 5 / 100 = 0.05)", "gorsel": {"type": "image", "query": "probability question quiz classroom"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Ters Olasılık", "icerik": "Soru: Bir diskin 1 yıl içinde bozulma olasılığı 0.08 ise, bozulmama (sağlam kalma) olasılığı nedir?\nA) 0.08\nB) 0.80\nC) 0.92\nD) 0.98\n\nDoğru Cevap: C (1 - 0.08 = 0.92)", "gorsel": {"type": "image", "query": "hard drive failure probability test"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Bağımsız Olay", "icerik": "Soru: A sunucusunun çökme olasılığı 0.1, B sunucusunun çökme olasılığı 0.2'dir. İkisinin aynı anda çökme olasılığı nedir?\nA) 0.30\nB) 0.02\nC) 0.15\nD) 0.002\n\nDoğru Cevap: B (0.1 x 0.2 = 0.02)", "gorsel": {"type": "image", "query": "server downtime independent events test"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Olasılık Değer Sınırı", "icerik": "Soru: Aşağıdakilerden hangisi bir olayın olasılığı OLAMAZ?\nA) 0\nB) 0.45\nC) 1.0\nD) 1.25\n\nDoğru Cevap: D (Olasılık 1'den büyük olamaz)", "gorsel": {"type": "image", "query": "probability scale bounds question"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- Olasılık 0 (İmkansız) ile 1 (Kesin) arasında değer alır.\n- P(A') = 1 - P(A) kuralı ters olasılık ve 'en az bir' problemlerinde en hızlı çözümdür.\n- Bağımsız olaylarda VE olasılığı çarpılarak bulunur.\n- Siber güvenlik risk analizi 'Olasılık x Etki' modeline dayanır.", "gorsel": {"type": "image", "query": "summary probability risk assessment cybersecurity"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 11: Temel İstatistik (Ortalama, Medyan, Mod)", "icerik": "Gelecek Konular:\n- Merkezi Eğilim Ölçüleri: Aritmetik Ortalama, Medyan (Ortanca), Mod (Tepe Değer)\n- Log ve Yanıt Süreleri Analizi\n- Anomali ve Aykırı Değer (Outlier) Tespiti\n- Dağılım Sezgisi.", "gorsel": {"type": "image", "query": "statistics mean median mode data analytics"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Terk Etmeden Önce", "icerik": "Günün Sorusu:\n'Bir güvenlik duvarı cihazının güç kaynağı arıza olasılığı %4'tür. Cihaza yedekli ikinci bir bağımsız güç kaynağı takılmıştır. Sistemin elektriksiz kalması için her iki kaynağın da arızalanması gerektiğine göre, sistemin elektriksiz kalma olasılığı yüzde kaçtır?'\n\nİşlemlerinizi yazıp kağıdı teslim ediniz.", "gorsel": {"type": "image", "query": "dual redundant power supply server exit ticket"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Aritmetik & Bilişim Mantığı`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
