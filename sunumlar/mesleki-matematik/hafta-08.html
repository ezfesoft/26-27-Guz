<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mesleki Matematik - Hafta 08 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #0284c7;
            --accent-glow: #0284c725;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Mesleki Matematik: Hafta 8", "altbaslik": "Hafta 8: Temel Mantık ve Küme İşlemleri", "icerik": "Program: Bilişim Güvenliği Teknolojisi (Önlisans)\nModül: Ayrık Matematik ve Karar Yapıları\nHaftalık Odak: Boole Mantığı (AND/OR/NOT/XOR), Firewall Kuralları ve Küme Kesişim/Birleşim ile Log Filtreleme\nHedef: Güvenlik kurallarını ve veri sorgularını mantık/küme kurallarıyla hatasız yapılandırmak.", "gorsel": {"type": "image", "query": "boolean logic firewall rules venn diagram cybersecurity"}}, {"baslik": "Neden Bu Konuyu Öğreniyoruz?", "altbaslik": "Sektörel Bağlam: Firewall ve SIEM Filtreleme Mantığı", "icerik": "Bir güvenlik duvarında (Firewall) 'Port 80 VE Kaynak IP = X' kuralı ile 'Port 80 VEYA Kaynak IP = X' kuralı tamamen farklı çalışır.\n- 'VE' (AND) kesişim kümesini daraltır (daha sıkı filtre).\n- 'VEYA' (OR) birleşim kümesini genişletir (daha geniş izin).\nBoole mantığını yanlış kurmak, yetkisiz erişime veya meşru trafiğin engellenmesine yol açar.", "gorsel": {"type": "image", "query": "firewall access control list rules configuration"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bologna ve Akreditasyon Odaklı Çıktılar", "icerik": "1. Önerme ve doğruluk tablosu (0 ve 1) kavramlarını açıklar.\n2. AND, OR, NOT ve XOR mantıksal bağlaçlarını güvenlik kurallarında uygular.\n3. De Morgan kurallarını kural sadeleştirmede kullanır.\n4. Kümeler teorisi (Kesişim, Birleşim, Fark) ile log ve kullanıcı gruplarını filtreler.", "gorsel": {"type": "image", "query": "academic learning outcomes checklist education"}}, {"baslik": "Önerme (Proposition) Nedir?", "altbaslik": "Kesin Doğru veya Yanlış Bildiren İfadeler", "icerik": "Tanım: Doğru (1) ya da Yanlış (0) kesin bir hüküm bildiren ifadelere önerme denir.\nBilişim Örnekleri:\n- p: 'Kaynak portu 443'tür' (Doğru veya Yanlış)\n- q: 'Kullanıcı yönetici rolündedir' (1 veya 0)\n- r: 'Paket boyutu 1500 Byte'tan büyüktür'\nSistem kararları (if-else blokları) önermelerin doğruluk değerine göre çalışır.", "gorsel": {"type": "image", "query": "boolean proposition logic true false visual"}}, {"baslik": "Mantıksal Bağlaçlar: VE (AND - ^)", "altbaslik": "Her İki Şartın da Sağlanması Gerekliliği", "icerik": "Tanım: p VE q ifadesi, sadece her iki önerme de 1 (Doğru) iken 1 olur.\nDoğruluk Tablosu:\n- 1 AND 1 = 1\n- 1 AND 0 = 0\n- 0 AND 1 = 0\n- 0 AND 0 = 0\nKullanım: 'Kullanıcı adı doğru VE Parola doğru' ise giriş yapılır.", "gorsel": {"type": "image", "query": "logic gate AND truth table circuit"}}, {"baslik": "Mantıksal Bağlaçlar: VEYA (OR - v)", "altbaslik": "En Az Bir Şartın Sağlanması Yeterlidir", "icerik": "Tanım: p VEYA q ifadesi, en az biri 1 iken 1 (Doğru) olur. Yalnızca 0-0 durumunda 0'dır.\nDoğruluk Tablosu:\n- 1 OR 1 = 1\n- 1 OR 0 = 1\n- 0 OR 1 = 1\n- 0 OR 0 = 0\nKullanım: 'Admin rolü VEYA Güvenlik rolü' varsa panele erişebilir.", "gorsel": {"type": "image", "query": "logic gate OR truth table diagram"}}, {"baslik": "DEĞİL (NOT) ve XOR (Özel VEYA)", "altbaslik": "Ters Çevirme ve Eşitsizlik Mantığı", "icerik": "- DEĞİL (NOT - ~p): 1 ise 0, 0 ise 1 yapar.\n- XOR (Özel VEYA - (+) ): İki girdi FARKLI ise 1, AYNI ise 0 üretir.\n  * 1 XOR 0 = 1 | 0 XOR 1 = 1 | 1 XOR 1 = 0 | 0 XOR 0 = 0\nXOR, simetrik şifrelemenin (One-Time Pad, Vernam Şifresi) temel yapı taşıdır.", "gorsel": {"type": "image", "query": "XOR logic gate cryptography truth table"}}, {"baslik": "De Morgan Kuralları", "altbaslik": "NOT(p AND q) = NOT p OR NOT q", "icerik": "1. Kural: ~(p ^ q) = ~p v ~q  (VE ifadesinin olumsuzu VEYA'ya dönüşür)\n2. Kural: ~(p v q) = ~p ^ ~q  (VEYA ifadesinin olumsuzu VE'ye dönüşür)\nFirewall ve SQL sorgularında karmaşık NOT şartlarını sadeleştirmek için kullanılır.", "gorsel": {"type": "image", "query": "de morgan laws discrete mathematics formula"}}, {"baslik": "Küme İşlemleri: Kesişim (Intersection)", "altbaslik": "A kesişim B (AND Mantığı)", "icerik": "Tanım: Hem A hem de B kümesinde ortak bulunan elemanlar kümesidir.\nSembol: A n B\nBilişim Örneği:\n- A = 'Zararlı IP Listesi'\n- B = 'Şirket Sunucularına Bağlanan IP'ler'\n- A n B = 'Sisteme Sızmaya Çalışan Tehdit Aktörleri' (Acil Engellenmeli).", "gorsel": {"type": "image", "query": "venn diagram intersection set theory"}}, {"baslik": "Küme İşlemleri: Birleşim (Union)", "altbaslik": "A birleşim B (OR Mantığı)", "icerik": "Tanım: A veya B kümelerindeki tüm benzersiz elemanların toplamıdır.\nSembol: A u B\nEleman Sayısı Formülü: s(A u B) = s(A) + s(B) - s(A n B)\n(Kesişim iki kez sayılmaması için bir kez çıkarılır).", "gorsel": {"type": "image", "query": "venn diagram union set theory math"}}, {"baslik": "Küme İşlemleri: Fark ve Tümleyen", "altbaslik": "A \\ B ve A' (NOT Mantığı)", "icerik": "- Fark (A \\ B): A'da olup B'de olmayan elemanlar (Yetkili olup MFA açmayan kullanıcılar)\n- Tümleyen (A'): Evrensel kümede olup A'da olmayanlar (Kurum ağı dışındaki tüm IP adresleri)\nLog analizinde 'anomali' tespiti fark kümesi ile yapılır.", "gorsel": {"type": "image", "query": "set difference complement diagram"}}, {"baslik": "Doğruluk Tablosu Kurma Prosedürü", "altbaslik": "Adım Adım Değerlendirme", "icerik": "1. Değişken sayısına göre 2^n satır oluştur (Örn: 2 değişken -> 4 satır, 3 değişken -> 8 satır).\n2. Tüm 0 ve 1 permütasyonlarını sırala.\n3. Parantez içlerindeki bağlaçları sırayla hesapla.\n4. En dıştaki ana bağlacı hesaplayıp sonuç sütununu belirle.", "gorsel": {"type": "image", "query": "truth table construction steps table"}}, {"baslik": "Çözümlü Uygulama 1: Doğruluk Tablosu Değerlendirme", "altbaslik": "Seviye: Başlangıç (p ^ ~q)", "icerik": "Soru: (p ^ ~q) ifadesinin p=1, q=1 iken sonucu nedir?\nAdım 1: ~q değerini bul -> ~1 = 0\nAdım 2: p ^ ~q -> 1 ^ 0\nAdım 3: 1 AND 0 = 0 (Yanlış).\nSonuç: İfade 0 üretir.", "gorsel": {"type": "image", "query": "truth table evaluation step by step"}}, {"baslik": "Çözümlü Uygulama 2: Kümelerde Eleman Sayısı", "altbaslik": "Seviye: Kolay (Birleşim Formülü)", "icerik": "Soru: Bir şirkette;\n- 45 personel VPN kullanıyor (V)\n- 30 personel SSH bağlantısı yapıyor (S)\n- 15 personel hem VPN hem SSH kullanıyor (V n S)\nVPN veya SSH kullanan toplam kaç farklı personel vardır?\nFormül: s(V u S) = s(V) + s(S) - s(V n S)\nİşlem: s(V u S) = 45 + 30 - 15 = 60 personel.", "gorsel": {"type": "image", "query": "venn diagram calculation 45 30 15 sets"}}, {"baslik": "Çözümlü Uygulama 3: Firewall Kuralı Sadeleştirme", "altbaslik": "Seviye: Orta (De Morgan)", "icerik": "Soru: Güvenlik duvarındaki 'NOT (IP_A VEYA Port_80)' kuralını De Morgan kuralı ile eşdeğer hale getiriniz.\nÇözüm:\n~(A v B) = ~A ^ ~B\nEşdeğer Kural: '(IP_A DEĞİL) VE (Port_80 DEĞİL)'\nYani paket IP_A olmayacak VE Port 80 olmayacak şartı birlikte aranır.", "gorsel": {"type": "image", "query": "firewall rule simplification logic"}}, {"baslik": "Çözümlü Uygulama 4: XOR ile Basit Şifreleme / Çözme", "altbaslik": "Seviye: Orta (Kripto)", "icerik": "Soru: 4-bitlik '1011' verisi, '1100' anahtarı ile XOR'lanarak şifreleniyor. Şifreli metin nedir? Tekrar anahtarla XOR'layınca orijinal veri çıkar mı?\nŞifreleme: 1011 XOR 1100 = 0111 (Şifreli Metin)\nÇözme: 0111 XOR 1100 = 1011 (Orijinal Veri)\nÖzellik: (A XOR K) XOR K = A (Simetrik şifreleme ilkesi).", "gorsel": {"type": "image", "query": "xor encryption decryption demonstration"}}, {"baslik": "Çözümlü Uygulama 5: SIEM Log Filtreleme (3 Kümeli Problem)", "altbaslik": "Seviye: İleri (Venn Şeması Analizi)", "icerik": "Soru: 100 log kaydı incelenmiştir:\n- 50 kayıt Port 443 (A)\n- 40 kayıt Dış IP (B)\n- 20 kayıt Başarısız Giriş (C)\n- 15 kayıt (A n B), 10 kayıt (B n C), 5 kayıt (A n C), 3 kayıt (A n B n C)\nHem Dış IP olup hem Başarısız olan ama Port 443 OLMAYAN kaç log vardır?\nİşlem: s(B n C) - s(A n B n C) = 10 - 3 = 7 kayıt.", "gorsel": {"type": "image", "query": "three set venn diagram siem log analysis"}}, {"baslik": "Çözümlü Uygulama 6: Çok Faktörlü Kimlik Doğrulama (MFA) Mantığı", "altbaslik": "Seviye: İleri (Doğruluk Tablosu)", "icerik": "Soru: Giriş kuralı = (Parola Doğru) AND ((SMS Kodu Doğru) OR (Biyometrik Doğru))\nKullanıcının parolası doğru (1), SMS yanlış (0), Biyometrik onaylı (1) ise giriş izni verilir mi?\nİşlem:\n1 AND (0 OR 1) = 1 AND 1 = 1 (GİRİŞE İZİN VERİLİR).", "gorsel": {"type": "image", "query": "multi factor authentication boolean logic flow"}}, {"baslik": "Çözümlü Uygulama 7: Erişim Kontrol Listesi (ACL) Çelişki Tespiti", "altbaslik": "Seviye: İleri (Mantıksal Tutarlılık)", "icerik": "Soru: Kural 1: 'Tüm trafiği ENGELLE (DENY ALL)' kuralı listenin başına yazılırsa sonraki kurallara ne olur?\nAnaliz: Kural 1 önermesi her zaman TRUE olacağı için paket alt satırlara inemez.\nSonuç: Mantıksal çelişki (Shadowing kuralı) oluşur. Özel kurallar üste, genel kurallar alta yazılmalıdır.", "gorsel": {"type": "image", "query": "acl rule order shadowing conflict network"}}, {"baslik": "Sık Yapılan Hatalar ve Uyarılar (1)", "altbaslik": "Bağlaç ve Küme Hataları", "icerik": "1. VE (AND) ile VEYA (OR) bağlaçlarını karıştırmak (AND şartı sıkılaştırır, OR genişletir).\n2. De Morgan uygularken parantez açıldığında bağlacı tersine çevirmeyi unutmak (~(A ^ B) != ~A ^ ~B).\n3. Küme birleşiminde kesişimi iki kere toplayıp çıkarmayı unutmak.", "gorsel": {"type": "image", "query": "logic error warning signs math"}}, {"baslik": "Sık Yapılan Hatalar ve Uyarılar (2)", "altbaslik": "XOR ve Filtreleme Tuzakları", "icerik": "1. XOR'u normal OR sanmak (XOR'da iki girdi de 1 ise sonuç 0'dır!).\n2. SQL sorgusunda 'WHERE x=1 AND x=2' yazmak (Tek değişken aynı anda iki farklı değer alamaz, sonuç daima boştur).", "gorsel": {"type": "image", "query": "sql query logic error caution"}}, {"baslik": "Sektörel Vaka: Hatalı Güvenlik Duvarı Kuralı", "altbaslik": "Web Servisi Kesintisi Olayı", "icerik": "Olay: Ağ yöneticisi 'Sadece Türkiye dışından GELEN VE Port 80 kullananları engelle' yerine yanlışlıkla 'Türkiye dışından gelenler VEYA Port 80 kullananları engelle' kuralı yazdı.\nSonuç: Türkiye içindeki tüm yerel kullanıcıların da Port 80 web erişimi kilitlendi.\nAnaliz: 'VE' yerine 'VEYA' yazılması filtre kümesini tüm meşru kullanıcıları kapsayacak şekilde genişletmiştir.", "gorsel": {"type": "image", "query": "firewall misconfiguration network outage incident"}}, {"baslik": "Vaka Çözüm Planı ve İnceleme", "altbaslik": "Kural Zincirinin Düzeltilmesi", "icerik": "Uygulanan Düzeltme:\nKural: DENY IF (Geo != TR) AND (Port == 80)\nEk olarak kural test ortamında doğruluk tablosu ile simüle edilip canlıya öyle alınmıştır.", "gorsel": {"type": "image", "query": "firewall rule testing verification dashboard"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Doğruluk Değeri", "icerik": "Soru: p = 1 ve q = 0 iken (p OR q) AND (NOT q) ifadesinin sonucu nedir?\nA) 0\nB) 1\n\nDoğru Cevap: B ( (1 OR 0) AND NOT(0) = 1 AND 1 = 1 )", "gorsel": {"type": "image", "query": "boolean logic quiz question exam"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "XOR İşlemi", "icerik": "Soru: 1 XOR 1 işleminin sonucu nedir?\nA) 0\nB) 1\n\nDoğru Cevap: A (XOR'da girdiler aynıysa sonuç 0'dır)", "gorsel": {"type": "image", "query": "xor operation logic gate test"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Küme Birleşimi", "icerik": "Soru: s(A)=20, s(B)=15 ve s(A n B)=5 ise s(A u B) kaçtır?\nA) 25\nB) 30\nC) 35\nD) 40\n\nDoğru Cevap: B (20 + 15 - 5 = 30)", "gorsel": {"type": "image", "query": "set union calculation quiz"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "De Morgan", "icerik": "Soru: ~(p v q) ifadesinin De Morgan dengi nedir?\nA) ~p v ~q\nB) ~p ^ ~q\nC) p ^ q\nD) ~p v q\n\nDoğru Cevap: B (~p ^ ~q)", "gorsel": {"type": "image", "query": "de morgan law question test"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- Önermeler 1 (Doğru) veya 0 (Yanlış) değer alır.\n- AND kesişimi daraltır, OR birleşimi genişletir, XOR fark durumunda 1 üretir.\n- De Morgan kuralları karmaşık güvenlik kurallarını sadeleştirir.\n- Küme teorisi log filtreleme ve yetkilendirme mimarisinin temelidir.", "gorsel": {"type": "image", "query": "summary logic sets discrete math diagram"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 9: Temel Permütasyon ve Kombinasyon", "icerik": "Gelecek Konular:\n- Temel Sayma İlkeleri (Toplama ve Çarpma)\n- Faktöriyel Kavramı (n!)\n- Parola Karmaşıklığı ve Brute-Force Deneme Uzayı\n- Permütasyon (Sıralama) vs Kombinasyon (Seçim).", "gorsel": {"type": "image", "query": "permutation combination password cracking probability"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Terk Etmeden Önce", "icerik": "Günün Sorusu:\n'Bir güvenlik logunda 80 adet IP adresi bulunmaktadır. Bunların 50 tanesi Port 22 (SSH) kullanmış, 40 tanesi Port 80 (HTTP) kullanmıştır. 20 IP adresi ise her iki portu da kullanmıştır. Sadece Port 22 kullanan (Port 80 kullanmayan) kaç IP adresi vardır?'\n\nKümeyi çizip çözümü yazınız.", "gorsel": {"type": "image", "query": "venn diagram log exit ticket classroom"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Aritmetik & Bilişim Mantığı`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
