            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #0284c7;
            --accent-glow: #0284c725;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>

}, {"baslik": "Vaka Adımı 1: Ağ Segmentasyonu Çözüm Prosedürü", "altbaslik": "192.168.0.0/23 Bloğunun Bölünmesi (VLSM)", "icerik": "İhtiyaçlar:\n1. Sunucular: 120 IP -> /25 gerekir (126 kullanılabilir host)\n2. Kullanıcılar: 200 IP -> /24 gerekir (254 kullanılabilir host)\n3. Misafir Wi-Fi: 60 IP -> /26 gerekir (62 kullanılabilir host)\nPlanlama:\n- Kullanıcılar: 192.168.0.0/24 (Host: .1 - .254, Bcast: .255)\n- Sunucular: 192.168.1.0/25 (Host: 1.1 - 1.126, Bcast: 1.127)\n- Misafir: 192.168.1.128/26 (Host: 1.129 - 1.190, Bcast: 1.191).", "gorsel": {"type": "image", "query": "vlsm network design calculation solution steps"}}, {"baslik": "Vaka Adımı 2: Depolama ve Disk Süresi Çözümü", "altbaslik": "Log Kapasite Hesabı (1024 Tabanı ve Denklem)", "icerik": "Veri: 300 cihaz günde ortalama 200 MB log üretiyor. Diskte 12 TB (12,288 GB) alan var.\nAdım 1: Günlük toplam log = 300 x 200 MB = 60,000 MB = ~58.59 GB/gün (60 GB SI)\nAdım 2: Gzip sıkıştırma oranı %75 -> Kalan veri = %25\nAdım 3: Sıkıştırılmış günlük log = 60 GB x 0.25 = 15 GB/gün\nAdım 4: Disk dolma süresi = 12,000 GB / 15 GB/gün = 800 gün (~2.2 yıl).", "gorsel": {"type": "image", "query": "storage capacity compression timeline solution"}}, {"baslik": "Vaka Adımı 3: SLA Uptime ve Kesinti Hesabı", "altbaslik": "%99.95 SLA Analizi", "icerik": "Veri: Yıllık 8760 saat.\n- İzin verilen kesinti = %0.05 = 0.0005\n- Yıllık Maksimum Kesinti = 8760 x 0.0005 = 4.38 saat = 4 saat 22.8 dakika.\nŞirket iki bağımsız yedekli sunucu (her birinin yıllık arıza olasılığı q=0.01) kullanırsa;\nİki sunucunun aynı anda çökme olasılığı = 0.01 x 0.01 = 0.0001 (%0.01) olur ve SLA %99.99'a çıkar.", "gorsel": {"type": "image", "query": "sla uptime calculation steps math"}}, {"baslik": "Vaka Adımı 4: Parola Entropisi ve Kaba Kuvvet Güvenliği", "altbaslik": "Kombinatorik Güvenlik Analizi", "icerik": "Kural: 12 karakterli karmaşık parola (94 sembol)\nToplam Olasılık Uzayı = 94^12 ~ 4.75 x 10^23 kombinasyon.\nSaniyede 100 milyar (10^11) deneme yap lü Mini Tekrar 5: Subnet Host Bulma", "altbaslik": "Hızlı Hatırlatma", "icerik": "Soru: /29 maskesinde kaç adet kullanılabilir host IP'si vardır?\nÇözüm: h = 32 - 29 = 3 bit -> 2^3 - 2 = 8 - 2 = 6 host.", "gorsel": {"type": "image", "query": "slash 29 subnet host calculation"}}, {"baslik": "Çözümlü Mini Tekrar 6: Boole Mantığı", "altbaslik": "Hızlı Hatırlatma", "icerik": "Soru: p=1, q=0 iken (p XOR q) AND (NOT q) ifadesi ne üretir?\nÇözüm: (1 XOR 0) AND (NOT 0) = 1 AND 1 = 1.", "gorsel": {"type": "image", "query": "boolean logic review question"}}, {"baslik": "Çözümlü Mini Tekrar 7: Olasılık ve İstatistik", "altbaslik": "Hızlı Hatırlatma", "icerik": "Soru: [4, 6, 9, 15, 6] veri setinin medyanı kaçtır?\nÇözüm: Sıralı [4, 6, 6, 9, 15] -> Ortanca = 6.", "gorsel": {"type": "image", "query": "median statistics quick test"}}, {"baslik": "Final Sınavında En Sık Yapılan 5 Hata", "altbaslik": "Sınav Öncesi Hayati Uyarılar", "icerik": "1. Subnetting'de -2 çıkarmayı unutmak (Ağ ve Broadcast).\n2. MB ile Mbps dönüşümünde 8 ile çarpmayı atlamak.\n3. Medyan bulurken sayıları küçükten büyüğe sıralamamak.\n4. Yüzde değişiminde paydaya yeni değeri yazmak.\n5. Olasılık sonucunu 1'den büyük bulup fark etmemek.", "gorsel": {"type": "image", "query": "exam top 5 mistakes alert checklist"}}, {"baslik": "Sınav Stratejisi ve Zaman Kullanımı", "altbaslik": "Final Başarı Rehberi", "icerik": "- Kolay sorulardan başlayın ve moral kazanın.\n- Her soru için işlem adımlarını kâğıda temiz yazın (kısmi puan alırsınız).\n- Sonuçların mantıksal tutarlılığını birim kontrolüyle denetleyin.", "gorsel": {"type": "image", "query": "exam success strategy checklist student"}}, {"baslik": "Sektörel Vaka: Dönem Projesi Yönetim Sunumu", "altbaslik": "FinTech Secure Altyapı Kabulü", "icerik": "Yönetim Özeti:\n- Matematiksel modeller sayesinde kurum altyapısı sıfır donanım israfıyla kuruldu.\n- Ağ güvenliği segmentasyonla %100 izole edildi.\n- 12 TB depolama sıkıştırma ile 2.2 yıl kesintisiz çalışacak.\n- Şirket siber güvenlik denetiminden tam not alarak lisansını yeniledi.", "gorsel": {"type": "image", "query": "executive management cybersecurity project presentation"}}, {"baslik": "Vaka Değerlendirme Rubriği ve Kanıtlar", "altbaslik": "Akreditasyon ve Kalite Ölçütleri", "icerik": "- İşlem Doğruluğu: %40\n- Birim ve Mantık Tutarlılığı: %30\n- Adım Açıklığı ve Gerekçelendirme: %20\n- Sektörel Uygunluk: %10\nÖğrenciler dönem boyunca bu rubrik doğrultusunda yetkinlik kazanmıştır.", "gorsel": {"type": "image", "query": "grading rubric accreditation academic assessment"}}, {"baslik": "Dönem Sonu Quiz: Soru 1", "altbaslik": "Sayı Sistemleri", "icerik": "Soru: 2^16 sayısı aşağıdakilerden hangisine eşittir?\nA) 256\nB) 1024\nC) 65,536\nD) 1,048,576\n\nDoğru Cevap: C (Toplam port sayısı: 65,536)", "gorsel": {"type": "image", "query": "final quiz question 1 powers of two"}}, {"baslik": "Dönem Sonu Quiz: Soru 2", "altbaslik": "Subnetting", "icerik": "Soru: /27 önekine sahip bir ağda kaç adet kullanılabilir host IP'si vardır?\nA) 14\nB) 30\nC) 62\nD) 126\n\nDoğru Cevap: B (2^5 - 2 = 30)", "gorsel": {"type": "image", "query": "final quiz question 2 subnetting"}}, {"baslik": "Dönem Sonu Quiz: Soru 3", "altbaslik": "Mantık", "icerik": "Soru: ~(A ^ B) ifadesinin dengi nedir?\nA) ~A ^ ~B\nB) ~A v ~B\nC) A v B\nD) ~A v B\n\nDoğru Cevap: B (~A v ~B - De Morgan)", "gorsel": {"type": "image", "query": "final quiz question 3 boolean logic"}}, {"baslik": "Dönem Sonu Quiz: Soru 4", "altbaslik": "İstatistik", "icerik": "Soru: [2, 5, 8, 11, 14] veri setinin aritmetik ortalaması kaçtır?\nA) 7\nB) 8\nC) 9\nD) 10\n\nDoğru Cevap: B (40 / 5 = 8)", "gorsel": {"type": "image", "query": "final quiz question 4 statistics"}}, {"baslik": "Dönem Kapanışı ve Mezuniyet Mesajı", "altbaslik": "Matematik Bilişim Güvenliğinin Temel Taşıdır", "icerik": "Tebrikler!\n14 haftalık Mesleki Matematik maratonunu başarıyla tamamladınız.\nArtık sayı sistemlerini, ağ hesaplarını, algoritmik mantığı, kriptografik büyüklükleri ve istatistiksel analizleri yetkinlikle uygulayabilen birer Siber Güvenlik Uzmanı adayısınız.\nSınavlarınızda ve meslek hayatınızda üstün başarılar dileriz!", "gorsel": {"type": "image", "query": "graduation success university technology students celebration"}}, {"baslik": "Final Sınavı Hatırlatmaları", "altbaslik": "Sınav Takvimi ve Kuralları", "icerik": "- Sınav Tarihi ve Salonu: Akademik Takvimde İlan Edilmiştir.\n- Gerekli Araçlar: Kurşun kalem, silgi, kimlik belgesi.\n- Soru Dağılımı: 1-11. haftalar arası tüm çekirdek konulardan dengeli sorular içerecektir.", "gorsel": {"type": "image", "query": "exam schedule university classroom notice"}}, {"baslik": "Final Çıkış Bileti (Dönem Sonu Anketi)", "altbaslik": "Son Değerlendirme", "icerik": "Günün Sorusu:\n'Bu dönem boyunca öğrendiğiniz 14 konu arasından mesleki kariyerinizde en çok fayda sağlayacağını düşündüğünüz 2 konuyu ve nedenini kısaca yazınız.'\n\nGörüşlerinizi yazıp teslim ediniz. Başarılar!", "gorsel": {"type": "image", "query": "course evaluation feedback exit ticket"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Aritmetik & Bilişim Mantığı`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
