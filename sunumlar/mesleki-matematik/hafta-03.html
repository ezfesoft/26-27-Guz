<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesleki Matematik - Hafta 03 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #0ea5e9;
            --accent-glow: #0ea5e940;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

": "Negatif Üsler ve Kesirli Gösterim", "altbaslik": "Ters Çevirme İlkesi: a^(-n) = 1 / a^n", "icerik": "Negatif üs sayının işaretini eksi yapmaz; sayıyı paydaya atarak çarpmaya göre tersini alır.\nÖrnekler:\n- 2^(-1) = 1 / 2 = 0.5\n- 2^(-2) = 1 / 2^2 = 1 / 4 = 0.25\n- 2^(-3) = 1 / 2^3 = 1 / 8 = 0.125\n- 10^(-3) = 1 / 1000 = 0.001 (Milisaniye seviyesi)", "gorsel": {"type": "image", "query": "negative exponents reciprocal math formula"}}, {"baslik": "Köklü Sayılar ve Karekök Mantığı", "altbaslik": "Üs Alma İşleminin Tersi", "icerik": "Tanım: sqrt(x) = y ise y^2 = x'tir.\nKarekök, 'Hangi sayının karesi bu sayıyı verir?' sorusunun cevabıdır.\nÖrnekler:\n- sqrt(16) = 4 (Çünkü 4^2 = 16)\n- sqrt(64) = 8\n- sqrt(256) = 16\n- sqrt(1024) = 32\nKöklü ifadeler rasyonel üs olarak da yazılabilir: sqrt(a) = a^(1/2).", "gorsel": {"type": "image", "query": "square root radical mathematics function board"}}, {"baslik": "Köklü Sayılarda Çarpma ve Bölme", "altbaslik": "Kök İçinde İşlem Yapabilme", "icerik": "Çarpma: sqrt(a) * sqrt(b) = sqrt(a * b)\n- Örnek: sqrt(4) * sqrt(25) = 2 * 5 = 10 = sqrt(100)\nBölme: sqrt(a) / sqrt(b) = sqrt(a / b)\n- Örnek: sqrt(144) / sqrt(16) = 12 / 4 = 3 = sqrt(9)\nUyarı: Toplama ve çıkarmada kökler ayrı ayrı toplanamaz!", "gorsel": {"type": "image", "query": "square root properties arithmetic operations"}}, {"baslik": "Bilişimde Adresleme ve n-Bit Mantığı", "altbaslik": "Kapasite = 2^n", "icerik": "Bir sistemde n adet bit (adres hattı) varsa, üretilebilecek benzersiz durum sayısı 2^n'dir.\n- 8 bit mimari -> 2^8 = 256 farklı durum (0 - 255)\n- 16 bit mimari -> 2^16 = 65,536 port\n- 32 bit mimari -> 2^32 = 4,294,967,296 adres (Maksimum 4 GB RAM sınırı)\n- 64 bit mimari -> 2^64 = 18.4 Kentilyon adres (Pratikte sınırsız bellek).", "gorsel": {"type": "image", "query": "32 bit vs 64 bit processor memory addressing diagram"}}, {"baslik": "Çözümlü Uygulama 1: 2'nin Kuvveti ile Çarpma", "altbaslik": "Seviye: Başlangıç", "icerik": "Soru: 2^6 sayısının 2^5 katı kaçtır? Desimal değerini hesaplayınız.\nİşlem Adımı: Tabanlar aynı olduğu için üsler toplanır.\n2^6 * 2^5 = 2^(6+5) = 2^11\nDesimal Değeri: 2^10 = 1024 olduğuna göre;\n2^11 = 1024 x 2 = 2048.", "gorsel": {"type": "image", "query": "math step by step solution powers multiplication"}}, {"baslik": "Çözümlü Uygulama 2: RAM Kapasite Hesabı", "altbaslik": "Seviye: Kolay (Mimari Hesaplama)", "icerik": "Soru: 32 bitlik bir işletim sistemi her bellek adresinde 1 Byte saklayabilmektedir. Bu sistem en fazla kaç GB RAM adresleyebilir?\nAdım 1: Adres sayısı = 2^32 Byte\nAdım 2: 1 GB = 2^30 Byte olduğuna göre;\nAdım 3: Kapasite = 2^32 / 2^30 = 2^(32-30) = 2^2 = 4 GB.\nSonuç: 32-bit sistemlerin maksimum 4 GB RAM destekleme sınırı buradan gelir.", "gorsel": {"type": "image", "query": "computer ram modules motherboard 4gb limit"}}, {"baslik": "Çözümlü Uygulama 3: Kriptografik Anahtar Uzayı", "altbaslik": "Seviye: Orta (Brute-Force Zorluğu)", "icerik": "Soru: 4 bitlik bir şifreleme anahtarı ile 8 bitlik bir anahtarın olası deneme (kombinasyon) sayılarını karşılaştırınız.\n- 4-bit anahtar: 2^4 = 16 farklı anahtar\n- 8-bit anahtar: 2^8 = 256 farklı anahtar\nOran = 256 / 16 = 16 kat (Yani 2^(8-4) = 2^4 = 16 kat daha zor).\nAnahtar uzunluğu 1 bit arttığında güvenlik 2 katına çıkar.", "gorsel": {"type": "image", "query": "brute force attack cryptographic keys diagram"}}, {"baslik": "Çözümlü Uygulama 4: Büyük Depolama Birimlerini Bölme", "altbaslik": "Seviye: Orta (Veri Tabanı Bölümleme)", "icerik": "Soru: 1 PB (Petabyte = 2^50 Byte) kapasiteli bir veri merkezinde, her biri 256 GB (2^38 Byte) olan sanal sunucu disklerinden en fazla kaç tane oluşturulabilir?\nİşlem: 2^50 / 2^38 = 2^(50-38) = 2^12\nDesimal Hesap: 2^10 = 1024 -> 2^12 = 1024 x 4 = 4096 adet sanal sunucu diski oluşturulabilir.", "gorsel": {"type": "image", "query": "cloud data center petabyte virtualization server rack"}}, {"baslik": "Çözümlü Uygulama 5: Karekök ile Ağ Matrisi Boyutu", "altbaslik": "Seviye: Orta-İleri (Köklü Sayı)" qrt(a+b) != sqrt(a) + sqrt(b)).\n   Örnek: sqrt(9 + 16) = sqrt(25) = 5 iken, 3 + 4 = 7 olur!\n2. Çift dereceli köklerin içinin negatif olamayacağını unutmak (Reel sayılarda sqrt(-4) tanımsızdır).", "gorsel": {"type": "image", "query": "mathematical caution root errors rules"}}, {"baslik": "Sektörel Vaka: Ransomware Şifre Kırma Girişimi", "altbaslik": "Olay Müdahale ve Risk Değerlendirmesi", "icerik": "Olay: Şirket veritabanı RSA-2048 ve AES-128 ile şifrelendi. Yönetim 'En güçlü süper bilgisayarı kiralayıp tüm anahtarları deneyerek şifreyi çözelim' teklifinde bulundu.\nAnalitik İnceleme: Saniyede 1 trilyon (10^12) anahtar deneyen bir süper bilgisayar 2^128 (yaklaşık 3.4 x 10^38) anahtarı test etmek için milyarlarca yıla ihtiyaç duyar.\nUzman Raporu: Kaba kuvvet imkansızdır; yedekten geri dönülmelidir.", "gorsel": {"type": "image", "query": "ransomware incident supercomputer brute force analysis"}}, {"baslik": "Vaka Çözüm Planı ve Kriptografik Önlem", "altbaslik": "Geleceğe Hazırlık: Post-Quantum", "icerik": "Alınan Önlemler:\n1. 3-2-1 Yedekleme kuralı (3 kopya, 2 farklı ortam, 1 offsite/çevrimdışı).\n2. Kuantum bilgisayarların Shor algoritmasına karşı anahtar uzunluklarının AES-256 seviyesine yükseltilmesi.\n3. Matematiksel güvenlik modellerinin operasyonel risk analizine entegrasyonu.", "gorsel": {"type": "image", "query": "quantum computing cryptography future security"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Üslü Çarpma", "icerik": "Soru: 2^8 * 2^4 işleminin sonucu nedir?\nA) 2^32\nB) 4^12\nC) 2^12\nD) 2^2\n\nDoğru Cevap: C (8 + 4 = 12 -> 2^12)", "gorsel": {"type": "image", "query": "math test question board"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "2'nin Kuvveti Değeri", "icerik": "Soru: 2^10 sayısı desimal olarak kaça eşittir?\nA) 100\nB) 1000\nC) 1024\nD) 2048\n\nDoğru Cevap: C (2^10 = 1024)", "gorsel": {"type": "image", "query": "computer science binary math quiz"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Üslü Bölme", "icerik": "Soru: 2^24 / 2^16 işleminin sonucu nedir?\nA) 2^8\nB) 2^384\nC) 2^(1.5)\nD) 2^40\n\nDoğru Cevap: A (24 - 16 = 8 -> 2^8 = 256)", "gorsel": {"type": "image", "query": "division exponents exam question"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Kök Alma", "icerik": "Soru: sqrt(1024) ifadesinin değeri kaçtır?\nA) 16\nB) 32\nC) 64\nD) 512\n\nDoğru Cevap: B (32 x 32 = 1024, yani (2^10)^(1/2) = 2^5 = 32)", "gorsel": {"type": "image", "query": "square root evaluation math test"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- Üs, bir sayının kaç kez çarpılacağını belirler.\n- Tabanlar aynı ise çarpmada üsler toplanır, bölmede çıkarılır.\n- Bilişimde tüm kapasite, adres ve portlar 2'nin kuvvetleriyle ifade edilir (2^n).\n- Karekök üssün 1/2 kuvvetidir ve algoritmik karmaşıklık analizinde temel araçtır.", "gorsel": {"type": "image", "query": "summary lesson overview mindmap mathematics"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 4: Kesirler, Ondalık Sayılar ve Yüzdeler", "icerik": "Gelecek Konular:\n- SLA (Hizmet Seviyesi Anlaşması): %99.9 Uptime ne anlama gelir?\n- Ağ paket kaybı oranı (%2 packet loss) nasıl hesaplanır?\n- Disk doluluk yüzdesi ve veri sıkıştırma oranları.", "gorsel": {"type": "image", "query": "sla uptime percentage server reliability monitor"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Terk Etmeden Önce", "icerik": "Günün Sorusu:\n'Bir güvenlik kamerası ağında 2^14 adet paket iletilmiştir. Bu paketlerin 2^11 adedi başarıyla hedefe ulaştığına göre, iletilen paketlerin kaçta kaçı (2'nin kuvveti olarak) hedefe varmıştır?'\n\nİşlemlerinizi yazıp kağıdı teslim ediniz.", "gorsel": {"type": "image", "query": "network packets data flow diagram exit ticket"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Aritmetik & Bilişim Mantığı`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
