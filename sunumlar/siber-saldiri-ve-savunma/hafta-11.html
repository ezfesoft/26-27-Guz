<html lang="tr" data-theme="light">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siber Saldırı ve Savunma Yöntemleri - Hafta 11 Sunumu | ezfesoft 26-27 Güz</title>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --accent-glow: #e11d4825;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>

QL/MSSQL)]\n- GET: Parametreler URL içinde taşınır (?id=1&kategori=kitap).\n- POST: Veriler istek gövdesinde gizli taşınır (Giriş formları).", "gorsel": {"type": "image", "query": "web client server database architecture http request diagram"}}, {"baslik": "HTTP Durum Kodları (Status Codes)", "altbaslik": "Sunucunun Bize Verdiği Yanıtlar", "icerik": "- 200 OK: İstek başarılı, sayfa yüklendi.\n- 301/302 Redirect: Sayfa başka bir adrese yönlendirildi.\n- 403 Forbidden: Erişim yetkiniz yok, yasak!\n- 404 Not Found: Aranan sayfa sunucuda bulunamadı.\n- 500 Internal Server Error: Sunucu tarafında yazılım/kod hatası oluştu (SQLi ipucu!).", "gorsel": {"type": "image", "query": "http status codes 200 404 500 error screen icons"}}, {"baslik": "OWASP Top 10 Nedir?", "altbaslik": "Küresel Web Güvenliği Standardı", "icerik": "OWASP (Open Web Application Security Project), dünya çapında en kritik 10 web güvenlik açığını listeleyen bağımsız kuruluştur.\n2021-2026 Zirvesi:\n- A01: Broken Access Control (Hatalı Yetkilendirme)\n- A02: Cryptographic Failures (Kriptografik Hatalar)\n- A03: Injection (SQLi, Komut Enjeksiyonu)\n- A04: Insecure Design (Güvensiz Tasarım)\n- A05: Security Misconfiguration (Hatalı Yapılandırma)", "gorsel": {"type": "image", "query": "owasp top 10 vulnerabilities logo list web security"}}, {"baslik": "SQL Injection (SQLi) Nasıl Oluşur?", "altbaslik": "Kullanıcı Girdisine Güvenme Hatası", "icerik": "Geliştiricinin yazdığı arka plan kodu:\nSELECT * FROM users WHERE id = '$id';\nKullanıcı girdi kutusuna şunu yazarsa: 1' OR '1'='1\nOluşan son SQL sorgusu:\nSELECT * FROM users WHERE id = '1' OR '1'='1';\nSonuç:\n'1'='1' mantıksal olarak daima DOĞRU (TRUE) olduğu için veritabanı tüm kullanıcı kayıtlarını ve parolalarını ekrana döker!", "gorsel": {"type": "image", "query": "sql injection code snippet query explanation diagram"}}, {"baslik": "SQL Injection Türleri", "altbaslik": "In-band, Inferential ve Out-of-band", "icerik": "1. In-band (Klasik SQLi): Sonuçlar doğrudan web sayfasında ekrana basılır (Union-based, Error-based).\n2. Inferential (Kör / Blind SQLi): Ekranda veri görünmez; veritabanına True/False soruları sorularak veya sunucu uyutularak (Time-based: SLEEP(5)) veri karakter karakter çekilir.\n3. Out-of-band: Veriler DNS sorguları veya e-posta yoluyla dışarı sızdırılır.", "gorsel": {"type": "image", "query": "sql injection types union based blind error based diagram"}}, {"baslik": "SQLMap: Otomatize Veritabanı Ele Geçirme", "altbaslik": "Veritabanının Korkulu Rüyası", "icerik": "SQLMap, web parametrelerindeki SQLi açıklarını otomatik tespit edip sömüren dünyanın 1 numaralı aracıdır.\nNeler Yapar?\n- Hedef veritabanı türünü (MySQL, Oracle, MSSQL) ve sürümünü bulur.\n- Tüm veritabanı isimlerini listeler (--dbs).\n- Tabloları ve kolonları listeler (--tables, --columns).\n- Parolaları ve tüm verileri indirir (--dump).", "gorsel": {"type": "image", "query": "sqlmap logo terminal database penetration testing"}}, {"baslik": "Temel SQLMap Parametreleri", "altbaslik": "Komut Satırı Sözdizimi", "icerik": "- -u <URL> : Zafiyetli web adresi\n- --cookie=\"...\" : Giriş yapılmış oturum çerezleri\n- --dbs : Veritabanlarını listele\n- -D <db_adi> : Hedef veritabanını seç\n- --tables : Tabloları getir\n- -T <tablo_adi> : Hedef tabloyu seç\n- -C user,password : Belirli kolonları seç\n- --dump : Verileri indir\n- --batch : Sorulan tüm sorulara varsayılan Evet de", "gorsel": {"type": "image", "query": "sqlmap cheat sheet command line parameters options"}}, {"baslik": "SQL Injection Savunması: Prepared Statements", "altbaslik": "Açığı Kökten Kapatan Çözüm", "icerik": "Hatalı Yaklaşım: String birleştirme (query = 'SELECT * FROM users WHERE id=' + input).\nDoğru ve Kesin Çözüm: Parametrik Sorgular (Prepared Statements / PDO).\nVeritabanı kullanıcı girdisini bir SQL KOMUTU olarak değil, salt bir METİN (Data) olarak işler; tırnak işaretleri kodu kıramaz!", "gorsel": {"type": "image", "query": "prepared statements parameterized queries secu standartlarını belirleyen ve Top 10 listesini yayınlayan kuruluş hangisidir?\nA) IEEE\nB) OWASP\nC) W3C\nD) ISO\n\nDoğru Cevap: B (OWASP)", "gorsel": {"type": "image", "query": "owasp foundation question board"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Veritabanındaki Gizli Bayrağı Bulma", "icerik": "Uygulama Görevi:\nDVWA guestbook tablosunun içine eğitmen tarafından gizli bir parola yerleştirildi.\n- sqlmap -D dvwa -T guestbook --dump komutunu çalıştırın.\n- Gizli metni ilk okuyan öğrenci el kaldırsın!", "gorsel": {"type": "image", "query": "students competition classroom coding linux challenge"}}, {"baslik": "Hatalı Yetkilendirme (Broken Access Control)", "altbaslik": "OWASP A01 Zafiyeti", "icerik": "Broken Access Control, bir kullanıcının yetkisi olmayan sayfalara veya verilere parametre değiştirerek erişebilmesidir.\nÖrnek (IDOR - Insecure Direct Object Reference):\nKullanıcı kendi profiline bakar: /profil.php?id=105\nURL'deki 105'i 106 yapınca başka bir müşterinin gizli verilerini görürse bu bir yetkilendirme açığıdır!", "gorsel": {"type": "image", "query": "broken access control idor parameter tampering diagram"}}, {"baslik": "SQL Injection Korunma: WAF Kuralları", "altbaslik": "ModSecurity ile Savunma", "icerik": "ModSecurity, açık kaynaklı popüler bir WAF (Web Application Firewall) motorudur.\n- Gelen HTTP isteklerindeki ' OR '1'='1 veya UNION SELECT gibi bilinen SQLi imzalarını tespit ettiği anda isteği 403 Forbidden ile engeller.\nWAF kod tarafındaki açıkları kapatmaz ama saldırıyı dışarıda bloke eder.", "gorsel": {"type": "image", "query": "modsecurity waf web firewall blocking sql injection"}}, {"baslik": "Çözümlü Uygulama: Union-Based SQLi", "altbaslik": "Manuel Sütun Sayısı Tespiti", "icerik": "Adım 1: Sütun sayısını bulma (ORDER BY):\n1' ORDER BY 1-- - (Hata vermez)\n1' ORDER BY 2-- - (Hata vermez)\n1' ORDER BY 3-- - (Unknown column hatası! Demek ki 2 sütun var!)\nAdım 2: Veri çekme (UNION SELECT):\n1' UNION SELECT user, password FROM users-- -", "gorsel": {"type": "image", "query": "union based sql injection order by column count diagram"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- Web mimarisinde istemciden gelen hiçbir veriye güvenilmemelidir.\n- SQL Injection veritabanının kontrolünü tamamen saldırgana verir.\n- SQLMap saniyeler içinde tüm tabloları ve şifreleri sızdırabilir.\n- Hazırlıklı İfadeler (Prepared Statements) açığı kapatmanın yegane kesin yoludur.", "gorsel": {"type": "image", "query": "summary concept mind map review"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 12: Ağ ve Servis Parola Saldırıları (Hydra)", "icerik": "Ön Hazırlık:\n- Açık SSH ve FTP portlarına çevrimiçi kaba kuvvet (Brute Force) nasıl yapılır?\n- THC-Hydra aracı nasıl kullanılır?\n- Hesap kilitleme ve Fail2ban savunmaları nasıl çalışır?", "gorsel": {"type": "image", "query": "hydra brute force password attacks network services"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Parametrik Sorguların (Prepared Statements) SQL Injection açığını nasıl engellediğini tek bir cümleyle açıklayınız.'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper feedback classroom student"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
