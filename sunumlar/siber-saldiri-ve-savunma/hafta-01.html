    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --accent-glow: #e11d4825;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

üsü", "altbaslik": "Temel Güvenlik Modeli", "icerik": "Bilgi güvenliği üç temel sütun üzerine inşa edilmiştir:\n1. Gizlilik (Confidentiality): Veriyi sadece yetkilisi okusun.\n2. Bütünlük (Integrity): Veri yolda veya diskte değiştirilmesin.\n3. Erişilebilirlik (Availability): İhtiyaç duyulduğunda sistem çalışır olsun.", "gorsel": {"type": "image", "query": "CIA triad triangle confidentiality integrity availability cybersecurity"}}, {"baslik": "1. Sütun: Gizlilik (Confidentiality)", "altbaslik": "Yetkisiz Gözlerden Korumak", "icerik": "Tanım: Bilginin yetkisiz kişilerin, süreçlerin veya cihazların eline geçmesinin engellenmesidir.\nNasıl Sağlanır?\n- Güçlü Şifreleme (AES-256, RSA)\n- Çok Faktörlü Kimlik Doğrulama (2FA/MFA)\n- Rol Tabanlı Erişim Kontrolü (RBAC)\nİhlal Örneği: Bir hastanenin hasta kayıtlarının sızdırılıp internette yayınlanması.", "gorsel": {"type": "image", "query": "data privacy encryption password key padlock digital"}}, {"baslik": "2. Sütun: Bütünlük (Integrity)", "altbaslik": "Doğruluk ve Değişmezlik Garantisi", "icerik": "Tanım: Verinin yetkisiz kişilerce silinmediğinin, değiştirilmediğinin veya tahrif edilmediğinin garanti edilmesidir.\nNasıl Sağlanır?\n- Kriptografik Özet Fonksiyonları (SHA-256 Hash)\n- Dijital İmzalar ve Sertifikalar\n- Versiyon Kontrol Sistemleri\nİhlal Örneği: Banka transferinde 500 TL gönderilirken saldırganın araya girip tutarı 50.000 TL yapması.", "gorsel": {"type": "image", "query": "data integrity digital signature hash verification checkmark"}}, {"baslik": "3. Sütun: Erişilebilirlik (Availability)", "altbaslik": "Kesintisiz Hizmet Güvencesi", "icerik": "Tanım: Yetkili kullanıcıların ihtiyaç duydukları her an sisteme ve verilere kesintisiz ulaşabilmesidir.\nNasıl Sağlanır?\n- Yedekli Sunucular ve Yük Dengeleme (Load Balancing)\n- Kesintisiz Güç Kaynakları ve RAID Disk Yapıları\n- DoS/DDoS Koruma Sistemleri\nİhlal Örneği: Üniversite sınav kayıt gününde sitenin saldırı alıp çökmesi.", "gorsel": {"type": "image", "query": "server uptime data center high availability 24 7 support"}}, {"baslik": "Özet (Hash) Fonksiyonu Nedir?", "altbaslik": "Bütünlüğün Matematiksel Parmak İzi", "icerik": "Hash fonksiyonu, herhangi bir boyuttaki veriyi girdi olarak alıp sabit uzunlukta benzersiz bir metin üreten tek yönlü matematiksel işlemdir.\n- Tek yönlüdür: Çıktıdan girdi elde edilemez.\n- Hızlıdır: Saniyeler içinde hesaplanır.\n- En popüler algoritmalar: MD5 (Eski/Zayıf), SHA-1 (Eski), SHA-256 (Güncel ve Güvenli).", "gorsel": {"type": "image", "query": "cryptographic hash algorithm SHA256 binary code math"}}, {"baslik": "Çığ Etkisi (Avalanche Effect)", "altbaslik": "1 Bitlik Değişimin Yarattığı Fırtına", "icerik": "Güvenli bir hash fonksiyonunda girdideki tek bir harf veya nokta değiştiğinde, üretilen hash değeri en az yüzde 50 oranında tamamen değişir.\n- Girdi: 'Giresun' -> SHA-256: d823e...\n- Girdi: 'giresun' -> SHA-256: 4a19b...\nBu özellik sayesinde dosyada 1 baytlık tahrifat yapılsa bile anında yakalanır.", "gorsel": {"type": "image", "query": "avalanche effect data mutation comparison cybersecurity"}}, {"baslik": "Uygulama Laboratuvarına Giriş", "altbaslik": "Laboratuvar Mimarimiz ve Kurallarımız", "icerik": "Laboratuvarımızda:\n- 2 adet Xeon işlemcili Windows Server 2019 ana sunucu (192.168.1.10 ve 192.168.1.20)\n- 60 adet Kali Linux yüklü istemci bilgisayar bulunmaktadır.\nTüm öğrenciler Kali terminallerini açsın ve adımları projeksiyondan takip etsin!", "gorsel": {"type": "image", "query": "computer science lab students terminals linux screens"}}, {"baslik": "Uygulama 1: Kendi Cihazını Tanıma", "altbaslik": "Kali Linux Terminalinde IP Bulma", "icerik": "Adım 1: Terminali açın ve şu komutu yazın:\nip a\nAdım 2: eth0 veya ens33 arayüzü altındaki IP adresinizi bulun (Örn: 192.168.1.105).\nAdım 3: Bu IP adresini bir kenara not edin.", "gorsel": {"type": "image", "query": "linux terminal command line ip address screen prompt"}}, {"baslik": "Uygulama 2: Sunucuya Canlılık Sinyali Gönderme", "altbaslik": "Ping Komutu ile Ağ Kontrolü", "icerik": "Adım 1: Windows Server 2019 sunucumuza 4 adet paket gönderelim:\nping -c 4 192.168.1.10\nBeklenen Çıktı:\n4 packets transmitted, 4 received, 0% packet loss\nBu çıktı sunucu ile aranızdaki fiziksel ve mantıksal bağlantının sağlam olduğunu gösterir.", "gorsel": {"type": "image", "query": "network ping test terminal packet transfer packets"}}, {"baslik": "Uygulama 3: Belge Oluşturma ve Hash Alma", "altbaslik": "SHA-256 ile Dosya Parmak İzi Çıkarma", "icerik": "Adım 1: Masaüstünde orijinal bir not dosyası oluşturalım:\necho \"Giresun Universitesi Guvenlik Sinav Notu: 100\" > notum.txt\nAdım 2: Dosyanın SHA-256 özetini alalım:\nsha256sum notum.txt\nEkranda 64 karakterli parmak izini göreceksiniz. Bu değeri not edin!", "gorsel": {"type": "image", "query": "sha256 checksum terminal hash code validation"}}, {"baslik": "Uygulama 4: Saldırgan Simülasyonu ve Tahrifat", "altbaslik": "Bütünlük İhlalinin Kanıtı", "icerik": "Adım 1: Saldırgan gibi araya girip notu değiştirelim:\necho \"Giresun Universitesi Guvenlik Sinav Notu: 050\" > notum.txt\nAdım 2: Tekrar hash değerini hesaplayalım:\nsha256sum notum.txt\nSonuç: Hash tamamen değişti! Sistem dosyanın tahrif edildiğini anında tespit etti.", "gorsel": {"type": "image", "query": "data tampering hacker file modification alert error"}}, {"baslik": "Uygulama 5: Windows PowerShell Tarafı", "altbaslik": "Windows Server 2019'da Hash Doğrulama", "icerik": "Windows PowerShell (Yönetici) ekranında aynı mantık şu komutla çalışır:\nSet-Content -Path C:\\test.txt -Value \"Siber Guvenlik 2026\"\nGet-FileHash -Path C:\\test.txt -Algorithm SHA256\nWindows işletim sistemi de aynı matematiksel SHA-256 algoritmasını kullanır.", "gorsel": {"type": "image", "query": "windows powershell command line scripting blue screen"}}, {"baslik": "Sık Yapılan Hatalar ve İpuçları", "altbaslik": "Terminalde Dikkat Edilecek Noktalar", "icerik": "1. Dosya Bulunamadı Hatası: echo komutunu çalıştırmadan sha256sum yaz apis\nD) Ceza uygulanmaz\n\nDoğru Cevap: B", "gorsel": {"type": "image", "query": "law code justice legal penalty courtroom"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "CIA Prensipleri", "icerik": "Soru: Bir öğrencinin sınav notunun veritabanında izinsiz olarak 50'den 100'e yükseltilmesi CIA ilkelerinden hangisini doğrudan ihlal eder?\nA) Gizlilik (Confidentiality)\nB) Bütünlük (Integrity)\nC) Erişilebilirlik (Availability)\nD) İnkâr Edilemezlik\n\nDoğru Cevap: B (Bütünlük)", "gorsel": {"type": "image", "query": "data alteration integrity test question multiple choice"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Hash Özellikleri", "icerik": "Soru: Girdideki tek bir harf değiştiğinde hash özetinin tamamen değişmesi özelliğine ne denir?\nA) Simetrik Şifreleme\nB) Çığ Etkisi (Avalanche Effect)\nC) Port Yönlendirme\nD) Tersine Mühendislik\n\nDoğru Cevap: B", "gorsel": {"type": "image", "query": "algorithm mathematical function quiz board"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Kendi Parolanızın Güvenliği", "icerik": "Tartışma Konusu:\nKendi belirlediğiniz bir metin dosyasının SHA-256 hashini alın. Dosyanın sonuna sadece bir adet boşluk karakteri ekleyip tekrar hash alın.\n- İki hash arasında kaç karakterlik benzerlik kaldı?\n- Çığ etkisini kendi gözlerinizle teyit ediniz.", "gorsel": {"type": "image", "query": "students discussing cybersecurity laboratory computer screens"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- Siber güvenlik etik kurallar ve TCK 243/244 yasaları çerçevesinde yürütülür.\n- CIA Üçlüsü (Gizlilik, Bütünlük, Erişilebilirlik) savunma mimarisinin temel taşıdır.\n- SHA-256 hash fonksiyonu tek yönlüdür ve veri bütünlüğünü kanıtlar.\n- Çığ etkisi sayesinde en ufak tahrifatlar dahi gizlenemez.", "gorsel": {"type": "image", "query": "summary concept mind map technology review"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 2: Siber Saldırı Yaşam Döngüsü ve Ağ Güvenliği", "icerik": "Ön Hazırlık:\n- Saldırganlar bir hedefe saldırırken hangi 7 aşamadan (Cyber Kill Chain) geçer?\n- Firewall ve IDS/IPS cihazları ağın neresinde konumlandırılır?\n- Gelecek hafta ağ protokollerini ve Netcat ile açık metin iletişim riskini inceleyeceğiz.", "gorsel": {"type": "image", "query": "cyber kill chain network security firewall concept"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Bir şirketin e-ticaret web sitesi Black Friday indirim gününde aşırı trafik sebebiyle çökmüş ve müşteriler 4 saat boyunca siteye girememiştir. Bu durum CIA üçlüsünün hangi ilkesinin ihlalidir ve şirket bunu önlemek için ne yapmalıdır?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket classroom feedback evaluation student"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
