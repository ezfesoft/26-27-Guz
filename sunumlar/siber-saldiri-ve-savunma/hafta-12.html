            padding: 0 16px;

            bottom: 0;
            left: 0;

        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);

            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {

            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);

            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

            white-space: pre-line;
        }

            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);

            padding: 10px 14px;
            border-radius: 0 8px 8px 0;

            align-items: flex-start;
            gap: 10px;

            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);

            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;

            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);

            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;

            font-weight: 600;

            align-items: center;

            text-decoration: none;
            flex-shrink: 0;

            border: 1px solid var(--bg-card-border);

            flex-shrink: 0;

            align-items: center;

            margin-left: auto;

            max-width: 1000px;
            margin: 0 auto;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            color: var(--accent-color);

            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;

            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

                font-size: 1.25rem;

                font-size: 0.9rem;
                line-height: 1.5;

            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;

            .code-block {
                font-size: 0.8rem;
                padding: 10px;

            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;

                gap: 8px;
            }
        }

        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
