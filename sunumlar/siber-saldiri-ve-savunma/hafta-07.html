lir.", "gorsel": {"type": "image", "query": "arp protocol request reply networking diagram"}}, {"baslik": "ARP Zehirlenmesi (ARP Spoofing / Poisoning)", "altbaslik": "Ortadaki Adam (MITM) Saldırısı", "icerik": "Saldırgan ağdaki kurbana: 'Ben Ağ Geçidiyim (Gateway)' der.\nAğ Geçidine: 'Ben Kurban Bilgisayarım' der.\nSonuç:\nKurban internete çıkarken tüm trafiği önce saldırganın bilgisayarına gönderir!\nSaldırgan trafiği dinler, kaydeder ve hedefe iletir (Man in the Middle).", "gorsel": {"type": "image", "query": "arp spoofing man in the middle attack diagram"}}, {"baslik": "Tcpdump: Komut Satırı Paket Analizcisi", "altbaslik": "Hızlı ve Hafif Dinleyici", "icerik": "Tcpdump, Linux konsolundan ağ trafiğini yakalayan güçlü bir araçtır.\nSözdizimi:\nsudo tcpdump -i eth0 -n -c 10 icmp\nParametreler:\n-i eth0 : Dinlenecek ağ kartı\n-n : IP adreslerini isim çözmeden sayısal göster\n-c 10 : 10 paket yakalayınca dur\nicmp : Sadece ping paketlerini filtrele", "gorsel": {"type": "image", "query": "tcpdump terminal command line output packet capture"}}, {"baslik": "Wireshark: Ağın Görsel Mikroskobu", "altbaslik": "Dünyanın En Popüler Paket İnceleyicisi", "icerik": "Wireshark, yakalanan paketleri OSI katmanlarına göre renkli ve detaylı ayrıştıran grafik arayüzlü araçtır.\nAna Bölümler:\n1. Üst Panel: Paket listesi (Zaman, Kaynak IP, Hedef IP, Protokol)\n2. Orta Panel: Paket başlık detayları (Ethernet, IP, TCP/UDP, HTTP)\n3. Alt Panel: Paketin ham Hex ve ASCII baytları.", "gorsel": {"type": "image", "query": "wireshark graphical interface packet tree hex view"}}, {"baslik": "En Popüler Wireshark Filtreleri", "altbaslik": "Samanlıkta İğne Aramak", "icerik": "Filtre Çubuğu Komutları:\n- http : Sadece web trafiğini gösterir.\n- icmp : Sadece ping istek ve yanıtlarını süzer.\n- arp : Sadece ARP istek ve anonslarını getirir.\n- dns : Alan adı sorgularını listeler.\n- ip.addr == 192.168.1.10 : Sadece Windows Server ile olan trafiği süzer.\n- tcp.port == 80 : 80 portuna ait trafiği göste e", "query": "vpn encrypted tunnel secure public wifi shield"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Ağ Kartı Modları", "icerik": "Soru: Ağ kartının sadece kendine gelenleri değil, kablodan geçen tüm paketleri dinlemesini sağlayan moda ne ad verilir?\nA) Master Mod\nB) Promiscuous (Karma) Mod\nC) Stealth Mod\nD) Safe Mod\n\nDoğru Cevap: B (Promiscuous Mod)", "gorsel": {"type": "image", "query": "quiz question multiple choice exam board"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Ağ Donanımı", "icerik": "Soru: Gelen veri paketini tablosuna bakarak SADECE ilgili hedef porta ileten modern ağ cihazı hangisidir?\nA) Hub\nB) Switch\nC) Repeater\nD) Modem\n\nDoğru Cevap: B (Switch)", "gorsel": {"type": "image", "query": "network switch question multiple choice"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Wireshark Filtreleri", "icerik": "Soru: Wireshark'ta sadece web sayfalarına ait HTTP trafiğini görmek için filtre çubuğuna ne yazılmalıdır?\nA) www\nB) web\nC) http\nD) port=80\n\nDoğru Cevap: C (http)", "gorsel": {"type": "image", "query": "wireshark filter http question board"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Saldırı Tespiti", "icerik": "Soru: Switch'e saniyede binlerce sahte MAC adresi göndererek switch'i bir Hub gibi davranmaya zorlayan saldırı hangisidir?\nA) SQL Injection\nB) MAC Flooding (MAC Seli)\nC) Zero-Day\nD) Phishing\n\nDoğru Cevap: B (MAC Flooding)", "gorsel": {"type": "image", "query": "mac flooding question multiple choice"}}, {"baslik": "Mini Quiz: Soru 5", "altbaslik": "Savunma Önlemleri", "icerik": "Soru: Ağ dinleme saldırılarına karşı verilerin açıkta okunmasını engellemenin en kesin çözümü nedir?\nA) Kabloları değiştirmek\nB) Uçtan Uca Şifreleme (HTTPS / SSH / VPN)\nC) Bilgisayarı kapatmak\nD) IP adresini gizlemek\n\nDoğru Cevap: B (Uçtan Uca Şifreleme)", "gorsel": {"type": "image", "query": "encryption defense question test"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Trafik Filtreleme Yarışı", "icerik": "Uygulama Görevi:\nWireshark açıkken tarayıcıdan bir DNS sorgusu tetikleyin (örn: giresun.edu.tr).\n- dns filtresini uygulayıp giden A kaydı sorgusunu ilk yakalayan öğrenci el kaldırsın!", "gorsel": {"type": "image", "query": "students competition classroom coding linux challenge"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- Sniffing ağ trafiğini dinleme işlemidir; Promiscuous mod tüm paketleri yakalar.\n- Wireshark ve Tcpdump paket analizi ve olay müdahalesinin en temel araçlarıdır.\n- Şifresiz HTTP protokolü parolaların açık metin olarak yakalanmasına yol açar.\n- Savunmada HTTPS, SSH, DAI ve VPN tünelleri standart gereksinimdir.", "gorsel": {"type": "image", "query": "summary concept mind map review"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 8: Ağ ve Sistem Güvenliği: Firewall, IDS/IPS", "icerik": "Ön Hazırlık:\n- Güvenlik duvarı (Firewall) kuralları Linux'ta (ufw/iptables) nasıl yazılır?\n- DMZ (Arındırılmış Bölge) neden şirket ağını korur?\n- Sistem sıkılaştırma (Hardening) adımları nelerdir?", "gorsel": {"type": "image", "query": "firewall network security defense system concept"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Neden bankalar HTTP protokolü yerine zorunlu olarak HTTPS protokolünü kullanmak zorundadır? Wireshark örneğiyle açıklayınız.'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper feedback classroom student"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
