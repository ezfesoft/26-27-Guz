<html lang="tr" data-theme="light">
<head>

    <title>Siber Saldırı ve Savunma Yöntemleri - Hafta 05 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --accent-glow: #e11d4825;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Siber Güvenlik: Hafta 5", "altbaslik": "Bilgi Toplama Yöntemleri (Reconnaissance) ve Nmap", "icerik": "Program: Bilişim Güvenliği Teknolojisi\nModül: Keşif ve Zafiyet Analizi\nHaftalık Odak: Pasif Keşif (OSINT, Shodan, Google Dorking) ve Aktif Keşif (Nmap)\nHedef: Hedef sistem hakkında iz bırakmadan ve aktif olarak istihbarat toplamak.", "gorsel": {"type": "image", "query": "network reconnaissance hacker searching target nmap shodan"}}, {"baslik": "Neden Bu Konuyu Öğreniyoruz?", "altbaslik": "Sektörel Bağlam: Savaş Keşifle Kazanılır", "icerik": "Siber saldırıların ve sızma testlerinin yüzde 70'i bilgi toplama aşamasıdır.\n- Hedefin IP'sini, açık portlarını ve çalışan servis sürümlerini bilmeden saldırı yapılamaz.\n- Hatalı bilgi toplamak yanlış exploit seçilmesine ve sistemin çökmesine neden olur.", "gorsel": {"type": "image", "query": "soc analyst threat intelligence dashboard map"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. Pasif ve Aktif bilgi toplama arasındaki teknik/yasal farkları açıklar.\n2. Whois ve DNS sorgulama araçlarını (dig, host) yetkin kullanır.\n3. Google Dorking ve Shodan IoT arama motoru ile özel aramalar yapar.\n4. Nmap port durumlarını (Open, Closed, Filtered) analiz eder.\n5. Nmap ile ağ taraması, servis versiyonu (-sV) ve işletim sistemi (-O) tespiti yapar.", "gorsel": {"type": "image", "query": "learning objectives checklist reconnaissance"}}, {"baslik": "Bilgi Toplama: Pasif vs Aktif Keşif", "altbaslik": "İz Bırakan ve Bırakmayan Yöntemler", "icerik": "Pasif Keşif: Hedef sunucuya doğrudan paket GÖNDERİLMEZ. Herkese açık kaynaklar (OSINT, Whois, Arama Motorları) taranır. Hedef fark edemez.\nAktif Keşif: Hedef sunucuya doğrudan paketler GÖNDERİLİR (Nmap, Zafiyet Taraması). Hedefin Güvenlik Duvarı ve IDS loglarına düşer.", "gorsel": {"type": "image", "query": "passive vs active reconnaissance comparison diagram"}}, {"baslik": "OSINT (Açık Kaynak İstihbaratı) Nedir?", "altbaslik": "Halka Açık Bilgilerin Gücü", "icerik": "Herkesin erişimine açık internet verilerinden istihbarat çıkarma sanatıdır.\n- Şirketin iş ilanları (Hangi firewall ve veritabanını kullandıklarını ele verir!)\n- Çalışanların LinkedIn ve GitHub paylaşımları (Kodların içine unutulan API şifreleri)\n- Sosyal medya fotoğraflarındaki şirket içi panolar ve kimlik kartları.", "gorsel": {"type": "image", "query": "osint open source intelligence globe network nodes"}}, {"baslik": "Whois ve DNS İstihbaratı", "altbaslik": "Alan Adı Kimin Elinde?", "icerik": "- Whois: Bir domainin kime ait olduğunu, kayıt ve bitiş tarihini, sorumlu e-postalarını listeler.\n- DNS Sorguları: Alan adının arkasındaki IP'leri, Mail (MX) sunucularını ve alt alan adlarını (subdomain) ortaya çıkarır.\nAraçlar: whois, dig, host, nslookup.", "gorsel": {"type": "image", "query": "dns server domain name lookup diagram networking"}}, {"baslik": "DNS Kayıt Türleri ve Anlamları", "altbaslik": "A, AAAA, MX, TXT ve NS", "icerik": "- A Kaydı: Domain adını IPv4 adresine eşler.\n- AAAA Kaydı: Domain adını IPv6 adresine eşler.\n- MX Kaydı: Kurumun e-posta sunucularını gösterir.\n- TXT Kaydı: SPF, DKIM gibi güvenlik doğrulama metinlerini tutar.\n- NS Kaydı: Alan adının yetkili Name Server sunucularını listeler.", "gorsel": {"type": "image", "query": "dns record types table a mx txt ns diagram"}}, {"baslik": "Google Dorking (Google Hacking)", "altbaslik": "Arama Motorlarını Güvenlik Açığı İçin Kullanmak", "icerik": "Google'ın gelişmiş operatörleriyle gizli dosya ve panelleri bulma yöntemidir:\n- site:hedef.edu.tr : Sadece ilgili domainde arar.\n- filetype:pdf veya filetype:sql : Dosya uzantısına göre süzer.\n- inurl:admin veya inurl:login : URL içinde admin sayfası arar.\n- intitle:\"index of /\" : Sunucuda dizin listelemesi açık olan klasörleri yakalar.", "gorsel": {"type": "image", "query": "google search bar hacking dorking advanced search"}}, {"baslik": "Shodan: IoT ve Cihaz Arama Motoru", "altbaslik": "İnternetin Karanlık Röntgeni", "icerik": "Web sitelerini değil, internete bağlı TÜM cihazları (IP Kameralar, Trafik Işıkları, SCADA, Sunucular) tarayan motordur.\nÖrnek Filtreler:\n- port:3389 country:\"TR\" (Türkiye'deki açık Uzak Masaüstü sunucuları)\n- product:\"Microsoft IIS httpd\"\n- city:\"Giresun\" webcam", "gorsel": {"type": "image", "query": "shodan search engine iot connected devices world map"}}, {"baslik": "Aktif Keşfin Lideri: Nmap (Network Mapper)", "altbaslik": "Ağ Haritalama Standardı", "icerik": "Nmap, açık kaynaklı en gelişmiş ağ tarama aracıdır.\nNeler Yapar?\n- Ağda ayakta olan canlı cihazları bulur.\n- Cihazlardaki açık portları ve arkasında çalışan servisleri listeler.\n- Servislerin kesin sürüm numaralarını (Apache 2.4.41 vb.) yakalar.\n- Hedefin işletim sistemini (Windows/Linux) tespit eder.", "gorsel": {"type": "image", "query": "nmap network mapper terminal matrix hacking screen"}}, {"baslik": "Nmap Port Durumlarının Anlamı", "altbaslik": "Open, Closed ve Filtered Farkı", "icerik": "1. Open (Açık): Port arkasında bir servis dinliyor ve bağlantıyı kabul etti.\n2. Closed (Kapalı): Port arkasında çalışan servis yok; hedef RST paketiyle reddetti.\n3. Filtered (Filtreli): Güvenlik Duvarı (Firewall) paketi düşürdü (Drop), yanıt dönmedi.", "gorsel": {"type": "image", "query": "nmap port states open closed filtered firewall diagram"}}, {"baslik": "TCP 3'lü El Sıkışma ve Tarama Türleri", "altbaslik": "SYN vs Connect Taraması", "icerik": "- TCP Connect Taraması (-sT): 3'lü el sıkışmayı (SYN -> SYN-ACK -> ACK) tamamlar. Loglarda görünür, yavaştır.\n- TCP SYN Taraması (-sS): Gizli (Stealth) taramadır. SYN gönderir, SYN-ACK gelince bağlantıyı tamamlamadan RST atıp kapatır!\n  * Çok hızlıdır, varsayılan tarama yöntemidir ve root yetkisi gerektirir.", "gorsel": {"type": "image", "query": "tcp three way handshake syn syn-ack ack diagram"}}, {"baslik": "Temel Nmap Parametreleri", "altbaslik": "Komut Satırı Sözdizimi", "icerik": "- -sn : Ping taraması (Sadece ayaktaki IP'leri bulur)\n- -sS : TCP SYN gizli tarama\n- -sV : Servis sürüm tespiti (Version Detection)\n- -O : İşletim sistemi tespiti (OS Detection)\n- -p 80,443,3389 : Sadece belirli portları tara\n- -p- : 1'den 65535'e kadar TÜM portları tara\n- -T4 : Hızlı tarama modu (T0 yavaş, T5 agresif)", "gorsel": {"type": "image", "query": "nmap cheat sheet command line parameters options"}}, {"baslik": "Nmap Script Engine (NSE) Nedir?", "altbaslik": "Gelişmiş Zafiyet Taraması", "icerik": "Nmap sadece port taramaz; bünyesindeki Lua scriptleri ile zafiyetleri de denetler.\n- --script=vuln : Hedefteki bilinen güvenlik açıklarını (CVE) otomatik tarar.\n- --script=banner : Portun karşılama mesajını (banner) çeker.\n- --script=smb-vuln-ms17-010 : EternalBlue açığını test eder.", "gorsel": {"type": "image", "query": "nmap script engine nse lua vulnerability scanning"}}, {"baslik": "Uygulama Laboratuvarı: Nmap Taramaları", "altbaslik": "Laboratuvar Hedeflerimiz", "icerik": "Laboratuvarımızda:\n1. Whois ve DNS sorguları yapacağız.\n2. Tüm laboratuvar ağındaki canlı IP'leri bulacağız (Ping Sweep).\n3. Windows Server 2019 hedefimize yönelik detaylı port ve servis taraması koşturacağız.", "gorsel": {"type": "image", "query": "students working in computer network laboratory terminals"}}, {"baslik": "Uygulama 1: Whois ve DNS Sorgulama", "altbaslik": "Alan Adı Bilgilerini Çekme", "icerik": "Terminalde şu komutları sırayla çalıştırın:\nwhois giresun.edu.tr\nhost -t a giresun.edu.tr\nhost -t mx giresun.edu.tr\ndig giresun.edu.tr ANY\nİnceleyin: Alan adının IP karşılığını ve sorumlu mail sunucularını not edin.", "gorsel": {"type": "image", "query": "whois dig dns terminal output network"}}, {"baslik": "Uygulama 2: Ağdaki Canlı Cihazları Bulma", "altbaslik": "Nmap Ping Sweep (-sn)", "icerik": "Laboratuvar subnetimizdeki (192.168.1.0/24) tüm açık cihazları listeleyelim:\nsudo nmap -sn 192.168.1.0/24\nBeklenen Çıktı:\nNmap scan report for 192.168.1.10 (Host is up)\nNmap scan report for 192.168.1.101 (Host is up)\n...\n60 adet Kali ve 2 adet sunucunun ayakta olduğunu göreceksiniz.", "gorsel": {"type": "image", "query": "nmap ping sweep terminal output live hosts"}}, {"baslik": "Uygulama 3: Windows Server 2019 Taraması", "altbaslik": "Servis ve Versiyon Keşfi (-sV -O)", "icerik": "Windows Server 2019 (192.168.1.10) üzerindeki servisleri tarayalım:\nsudo nmap -sS -sV -O -p 80,445,3389 192.168.1.10\nBeklenen Çıktı:\n80/tcp   open  http          Microsoft IIS httpd 10.0\n445/tcp  open  microsoft-ds  Microsoft Windows Server 2019\n3389/tcp open  ms-wbt-server Microsoft Terminal Services", "gorsel": {"type": "image", "query": "nmap version detection scan output terminal"}}, {"baslik": "Uygulama 4: Hızlı Port Taraması (-F)", "altbaslik": "En Popüler 100 Port", "icerik": "Zaman kısıtlı olduğunda en çok kullanılan 100 portu hızlıca taramak için:\nsudo nmap -F 192.168.1.10\nSonuç birkaç saniye içinde ekrana gelecektir.", "gorsel": {"type": "image", "query": "fast port scan nmap terminal speed"}}, {"baslik": "Sık Yapılan Hatalar ve İpuçları", "altbaslik": "Nmap Taramalarında Dikkat Edilecekler", "icerik": "1. 'Root privileges required' Hatası: TCP SYN (-sS) ve OS (-O) taramaları ham soket kullandığı için başına 'sudo' konulmalıdır.\n2. Taramanın Donması: Çok geniş ağlarda -p- kullanmak saatler sürebilir; önce -p 1-1000 veya -F ile hızlı tarama yapılmalıdır.\n3. Küçük/Büyük Harf: -sV sürüm tespiti yaparken, -sv yazarsanız hata verir.", "gorsel": {"type": "image", "query": "troubleshooting nmap errors sudo checklist"}}, {"baslik": "Sektörel Vaka: Equifax Skandalı", "altbaslik": "Versiyon Tespiti Neden Hayatidir?", "icerik": "Vaka: Kredi derecelendirme devi Equifax'tan 147 milyon kişinin verisi çalındı.\nİnceleme: Saldırganlar Nmap ve zafiyet tarayıcılarıyla sunucuda 'Apache Struts' yazılımının eski ve yamalanmamış bir sürümünün çalıştığını tespit etti.\nSonuç: Bu versiyona ait CVE-2017-5638 açığı istismar edilerek tüm veritabanı sızdırıldı.", "gorsel": {"type": "image", "query": "data breach equifax scandal cyber investigation"}}, {"baslik": "Vaka Analizi: Zafiyet Yönetimi", "altbaslik": "Çıkarılan Mühendislik Dersi", "icerik": "Ders: Nmap ile elde edilen versiyon bilgisi doğrudan Exploit-DB ve Ulusal Zafiyet Veritabanı (NVD) ile karşılaştırılmalıdır.\nEğer sunucuda eski bir IIS veya Apache sürümü görünüyorsa, saldırganlardan önce yama uygulanmalıdır.", "gorsel": {"type": "image", "query": "vulnerability assessment patch management security"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Keşif Yöntemleri", "icerik": "Soru: Hedef sunucuya hiçbir paket göndermeden, arama motorları ve Whois kayıtları üzerinden yapılan bilgi toplamaya ne denir?\nA) Aktif Bilgi Toplama\nB) Pasif Bilgi Toplama\nC) DoS Saldırısı\nD) SQL Injection\n\nDoğru Cevap: B (Pasif Bilgi Toplama)", "gorsel": {"type": "image", "query": "quiz question multiple choice exam board"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Nmap Port Durumları", "icerik": "Soru: Nmap taramasında bir portun durumu 'filtered' olarak görünüyorsa bunun en olası sebebi nedir?\nA) Portta servis çalışmıyordur.\nB) Güvenlik Duvarı (Firewall) paketi engellemiştir.\nC) Sunucu kapalıdır.\nD) IP adresi yanlıştır.\n\nDoğru Cevap: B (Güvenlik Duvarı Engeli)", "gorsel": {"type": "image", "query": "firewall filtered port test question"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Nmap Parametreleri", "icerik": "Soru: Hedefteki portta çalışan servisin marka ve kesin sürüm numarasını (Örn: Apache 2.4.41) tespit eden Nmap parametresi hangisidir?\nA) -sS\nB) -O\nC) -sV\nD) -sn\n\nDoğru Cevap: C (-sV)", "gorsel": {"type": "image", "query": "nmap parameters version detection question"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Arama Motorları", "icerik": "Soru: İnternete bağlı IP kameraları, endüstriyel kontrol sistemlerini ve açık portları listeleyen IoT arama motoru hangisidir?\nA) Google\nB) Shodan\nC) Yahoo\nD) Yandex\n\nDoğru Cevap: B (Shodan)", "gorsel": {"type": "image", "query": "shodan search engine question board"}}, {"baslik": "Mini Quiz: Soru 5", "altbaslik": "TCP Taraması", "icerik": "Soru: Bağlantıyı tamamlamadan SYN-ACK gelince RST paketi atarak kapatan gizli Nmap tarama modu hangisidir?\nA) -sT (Connect)\nB) -sS (SYN Stealth)\nC) -sU (UDP)\nD) -sn (Ping)\n\nDoğru Cevap: B (-sS)", "gorsel": {"type": "image", "query": "tcp syn scan question multiple choice"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Nmap Çıktısı Analizi", "icerik": "Uygulama Görevi:\nEğitmen hedef makinede gizli bir port açtı.\n- sudo nmap -p 1-5000 192.168.1.10 komutunu çalıştırın.\n- Açık portu ve servisi ilk bulan öğrenci el kaldırsın!", "gorsel": {"type": "image", "query": "students competition classroom coding linux challenge"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- Bilgi toplama siber saldırıların temelidir; pasif keşif iz bırakmaz, aktif keşif hedefe dokunur.\n- OSINT, Google Dorking ve Shodan hedef yüzeyini anlamayı sağlar.\n- Nmap -sS ile gizli tarar, -sV ile servis sürümünü, -O ile işletim sistemini yakalar.\n- Port durumları (Open/Closed/Filtered) güvenlik duvarı mimarisini ele verir.", "gorsel": {"type": "image", "query": "summary concept mind map review"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 6: Siber Güvenlikte Parola Kırma Teknikleri", "icerik": "Ön Hazırlık:\n- MD5 ve SHA-256 hashleri nasıl kırılır?\n- Crunch ile hedefe özel kelime listesi (Wordlist) nasıl üretilir?\n- John the Ripper aracıyla parola kırma laboratuvarı yapacağız.", "gorsel": {"type": "image", "query": "password cracking hashcat john the ripper matrix"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Nmap taramasında -sV parametresinin sızma testlerindeki hayati önemini tek bir cümleyle açıklayınız.'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper feedback classroom student"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
