    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --accent-glow: #e11d4825;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>

bi saldırıları süzer.\n4. Yeni Nesil (NGFW): Derin paket incelemesi (DPI), entegre IPS ve antivirüs içerir.", "gorsel": {"type": "image", "query": "firewall generations packet filtering stateful waf ngfw diagram"}}, {"baslik": "Temel Firewall Felsefesi", "altbaslik": "Default Allow vs Default Deny", "icerik": "- Default Allow (Varsayılan İzin Ver): Yasaklananlar hariç her şeye izin verir. GÜVENSİZDİR!\n- Default Deny (Varsayılan Reddet): İzin verilenler hariç HER ŞEYİ yasaklar. ALTIN KURALDIR!\nProfesyonel kurumlarda gelen tüm trafik varsayılan olarak reddedilir, sadece ihtiyaç duyulan portlara (örn: 80, 443) tek tek izin verilir.", "gorsel": {"type": "image", "query": "default deny security firewall policy lock shield"}}, {"baslik": "Ağ Güvenlik Mimarisi: DMZ (Arındırılmış Bölge)", "altbaslik": "Çift Güvenlik Duvarı Modeli", "icerik": "İnternet -> [Dış Firewall] -> [DMZ BÖLGESİ (Web, Mail, DNS)] -> [İç Firewall] -> [KURUMSAL İÇ AĞ]\nKural:\nDMZ'deki bir sunucu internete açıktır ve hacklenebilir. Ancak İç Firewall sayesinde saldırgan iç şirketin Active Directory ve müşteri veritabanına doğrudan sıçrayamaz!", "gorsel": {"type": "image", "query": "dmz demilitarized zone network architecture diagram"}}, {"baslik": "Sistem Sıkılaştırma (Hardening) Nedir?", "altbaslik": "Saldırı Yüzeyini Sıfırlamak", "icerik": "Bir işletim sistemini veya sunucuyu dış tehditlere karşı maksimum güvenlikli hale getirme sürecidir.\nTemel Adımlar:\n1. Kullanılmayan tüm port ve servisleri kapatmak.\n2. Varsayılan parolaları (admin, root) değiştirmek.\n3. En Az Yetki İlkesini (Least Privilege) uygulamak.\n4. Güvenlik yamalarını (Patch) eksiksiz yüklemek.", "gorsel": {"type": "image", "query": "system hardening checklist lock server security"}}, {"baslik": "Linux Güvenlik Duvarı: UFW ve iptables", "altbaslik": "Uncomplicated Firewall Kolaylığı", "icerik": "iptables güçlü fakat karmaşık bir çekirdek filtresidir. UFW bunu insan dostu hale getirir:\n- sudo ufw status verbose : Durumu gösterir\n- sudo ufw default deny incoming : Gelen tüm trafiği varsayılan reddet\n- sudo ufw allow 22/tcp : SSH portuna izin ver\n- sudo ufw allow from 192.168.1.10 : Sadece bu IP'ye izin ver\n- sudo ufw enable : Güvenlik duvarını açar", "gorsel": {"type": "image", "query": "ufw iptables linux firewall terminal command line"}}, {"baslik": "Windows Defender Firewall Kuralları", "altbaslik": "PowerShell ile Yönetim", "icerik": "Windows Server 2019'da PowerShell ile tek satırda gelişmiş kural yazılabilir:\nNew-NetFirewallRule -DisplayName \"Blokla-Port8080\" -Direction Inbound -LocalPort 8080 -Protocol TCP -Action Block\nBu komut 8080 portunu dışarıdan gelen tüm isteklere kapatır.", "gorsel": {"type": "image", "query": "windows defender firewall powershell command line scripting"}}, {"baslik": "Uygulama Laboratuvarı: Firewall & Hardening", "altbaslik": "Laboratuvar Hedeflerimiz", "icerik": "Laboratuvarımızda:\n1. Linux UFW ile Default Deny kuralı tanımlayacağız.\n2. Belirli portlara izin vereceğiz.\n3. Yanımızdaki arkadaşımızın cihazını Nmap ile tarayarak portun 'filtered' olduğunu doğrulayacağız.\n4. ss -tulpn ile açık portları listeleyeceğiz.", "gorsel": {"type": "image", "query": "students typing network lab firewall kali linux"}}, {"baslik": "Uygulama 1: Linux UFW Yapılandırması", "altbaslik": "Varsayılan Politikaları Ayarlama", "icerik": "Terminalde şu komutları sırayla çalıştırın:\nsudo ufw status verbose\nsudo ufw default deny incoming\nsudo ufw default allow outgoing\nsudo ufw allow 22/tcp\nsudo ufw enable\nKontrol: sudo ufw status numbered ile kuralları listeleyin.", "gorsel": {"type": "image", "query": "ufw enable command terminal output rules active"}}, {"baslik": "Uygulama 2: Windows PowerShell ile Kural Yazma", "altbaslik": "Windows Server 2019 Kuralı", "icerik": "Windows PowerShell (Yönetici) ekranında şu komutu çalıştırın:\nNew-NetFirewallRule -DisplayName \"Blokla-Port8080\" -Direction Inbound -LocalPort 8080 -Protocol TCP -Action Block\nKuralı sorgulayalım:\nGet-NetFirewallRule -DisplayName \"Blokla-Port8080\" | Select-Object DisplayName, Enabled, Action", "gorsel": {"type": "image", "query": "powershell new-netfirewallrule command output"}}, {"baslik": "Uygulama 3: Kuralın Etkisini Nmap ile Doğrulama", "altbaslik": "Port Durumu Testi", "icerik": "Yanınızdaki arkadaşınızın IP adresini tarayın:\nsudo nmap -p 22,8080 192.168.1.xxx\nBeklenen Gözlem:\n- İzin verilen port (22) -> open\n- Engellenen port (8080) -> filtered\nFirewall'un paketleri başarıyla düşürdüğünü kendi gözlerinizle görün!", "gorsel": {"type": "image", "query": "nmap scan port filtered open comparison terminal"}}, {"baslik": "Uygulama 4: Sistem Sıkılaştırma Denetimi", "altbaslik": "Açık Portları Bulma (ss -tulpn)", "icerik": "Sistemde arka planda dinleyen tüm portları görelim:\nsudo ss -tulpn\nİnceleyin:\nLocal Address:Port sütununda gereksiz çalışan bir Telnet, FTP veya açık servis var mı kontrol edin.", "gorsel": {"type": "image", "query": "ss socket statistics terminal output linux"}}, {"baslik": "Sık Yapılan Hatalar ve İpuçları", "altbaslik": "Firewall Yönetiminde Dikkat Edilecekler", "icerik": "1. SSH İzni Vermeden UFW Açmak: Uzaktan bağlıysanız bağlantınız anında kopar! Önce 'allow 22' sonra 'enable'.\n2. Ders Bitiminde UFW Açık Bırakmak: Sonraki haftalardaki lab paketlerini engellememek için ders sonunda 'sudo ufw disable' yapılmalıdır.\n3. Kural Sıralaması: Firewall kuralları yukarıdan aşağıya doğru sırayla işletilir.", "gorsel": {"type": "image", "query": "troubleshooting firewall lock out checklist warning"}}, {"baslik": "Sektörel Vaka: Capital One Bulut İhlali", "altbaslik": "WAF Yapılandırma Hatası (SSRF)", "icerik": "Vaka: Finans devi Capital One'dan 106 milyon müşterinin kredi kayıtları çalındı.\nİnceleme: Saldırgan, kurumun Web Uygulama Güvenlik Duvarı (WAF) sunucusundaki SSRF zafiyetini kullandı ve WAF'ın yetkili AWS anahtarını çaldı.\nSonuç: Yanlış yapılandırılan güvenlik duvarının kendisi saldırgana geçiş kapısı oldu!", "gorsel": {"type": "image", "query": "cloud breach capital one aws server data leak"}}, {"baslik": "Vaka Analizi: Katmanlı Savunma (Defense in Depth)", "altbaslik": "Çıkarılan Mühendislik Dersi", "icerik": "Ders: Asla tek bir güvenlik cihazına veya firewall'a güvenilmemelidir.\nKatmanlı Savunma:\n1. Ağ Firewall\n2. WAF\n3. Sunucu İçi Host Firewall (UFW/iptables)\n4. Veri Tabanı Şifreleme\nBiri aşılsa bile diğeri saldırganı durdurmalıdır.", "gorsel": {"type": "image", "query": "defense in depth onion layers cybersecurity model"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Firewall Politikaları", "icerik": "Soru: İzin verilenler haricindeki tüm gelen bağlantıları varsayılan olarak reddeden temel güvenlik kuralına ne ad verilir?\nA) Default Allow\nB) Default Deny\nC) NAT\nD) DMZ\n\nDoğru Cevap: B (Default Deny)", "gorsel": {"type": "image", "query": "quiz question multiple choice exam board"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Ağ Mimarisi", "icerik": "Soru: Web ve e-posta gibi dışarıya açık sunucuları şirket içi veritabanlarından yalıtarak koruyan ara tampon bölgeye ne ad verilir?\nA) LAN\nB) DMZ (Arındırılmış Bölge)\nC) WAN\nD) VPN\n\nDoğru Cevap: B (DMZ)", "gorsel": {"type": "image", "query": "dmz network architecture question board"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Firewall Türleri", "icerik": "Soru: Web uygulamalarına yönelik SQL Injection ve XSS saldırılarını Katman 7 düzeyinde engelleyen güvenlik duvarı hangisidir?\nA) Paket Filtreleme\nB) WAF (Web Application Firewall)\nC) Hub\nD) Router\n\nDoğru Cevap: B (WAF)", "gorsel": {"type": "image", "query": "waf web application firewall question"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Linux Komutları", "icerik": "Soru: Linux'ta UFW güvenlik duvarında 22 numaralı SSH portuna gelen bağlantılara izin vermek için hangi komut yazılır?\nA) sudo ufw allow 22/tcp\nB) sudo ufw block 22\nC) sudo ufw delete 22\nD) sudo ufw reset\n\nDoğru Cevap: A (sudo ufw allow 22/tcp)", "gorsel": {"type": "image", "query": "ufw command line question multiple choice"}}, {"baslik": "Mini Quiz: Soru 5", "altbaslik": "Sistem Sıkılaştırma", "icerik": "Soru: Sistemde çalışan dinleme durumundaki tüm TCP/UDP portları ve servisleri listelemek için hangi komut kullanılır?\nA) ping\nB) ss -tulpn\nC) rm -rf\nD) cat /etc/passwd\n\nDoğru Cevap: B (ss -tulpn)", "gorsel": {"type": "image", "query": "socket statistics command question test"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Engelleme ve Açma Yarışı", "icerik": "Uygulama Görevi:\n1. 80 numaralı portu UFW ile kapatın.\n2. Yanınızdaki arkadaşınız Nmap ile tarasın ve 'filtered' gördüğünü onaylasın.\n3. Portu tekrar açıp 'open' görünmesini sağlayın.\nİlk tamamlayan çift el kaldırsın!", "gorsel": {"type": "image", "query": "students competition classroom coding linux challenge"}}, {"baslik": "Ağ İzolasyonu: VLAN Mantığı", "altbaslik": "Sanal Yerel Ağlar ile Bölümleme", "icerik": "VLAN (Virtual Local Area Network):\nFiziksel tek bir switch'i mantıksal olarak birden fazla bağımsız ağa bölme teknolojisidir.\n- VLAN 10: Muhasebe ve Finans (İzole)\n- VLAN 20: Misafir Wi-Fi (Sadece internete açık)\n- VLAN 30: Sunucular ve Veritabanı\nVLAN'lar arası geçiş sadece Güvenlik Duvarı üzerinden kontrollü yapılır.", "gorsel": {"type": "image", "query": "vlan virtual local area network segmentation switch diagram"}}, {"baslik": "VPN (Sanal Özel Ağ) Teknolojisi", "altbaslik": "Güvenli Uzaktan Erişim Tüneli", "icerik": "İnternet üzerinden şifreli bir tünel (IPsec, OpenVPN, WireGuard) kurarak şirket ağına güvenle bağlanma yöntemidir.\n- Evden veya kafeden çalışan personel şirket sunucularına doğrudan değil, VPN tüneli üzerinden şifreli erişir.\n- Dışarıdaki dinleyiciler sadece anlamsız şifreli paketler görür.", "gorsel": {"type": "image", "query": "vpn encrypted tunnel remote work secure connection"}}, {"baslik": "Çözümlü Uygulama: Firewall Kural Sıralaması", "altbaslik": "Kural Çakışmalarını Önleme", "icerik": "Firewall Kuralları Yukarıdan Aşağıya İşletilir!\nÖrnek Senaryo:\nKural 1: 192.168.1.50 IP'sine 80 portu için İZİN VER.\nKural 2: Tüm gelen trafiği ENGELLE (Default Deny).\nEğer Kural 2'yi Kural 1'in üstüne koyarsanız, 192.168.1.50 dahil her şey engellenir!\nKural: Özel izinler en üstte, genel yasaklama en altta olmalıdır.", "gorsel": {"type": "image", "query": "firewall rule order top down processing diagram"}}, {"baslik": "Sistem Güncellemeleri ve Yama Yönetimi", "altbaslik": "Zafiyetleri Kapatmanın En Etkin Yolu", "icerik": "Windows Server ve Linux sistemlerde güvenlik yamaları düzenli olarak uygulanmalıdır:\n- Linux: sudo apt update && sudo apt upgrade -y\n- Windows: WSUS (Windows Server Update Services)\nYama yapılmayan her sistem bilinen CVE açıklarına karşı savunmasızdır.", "gorsel": {"type": "image", "query": "software update patch management security shield"}}, {"baslik": "Sıkılaştırma Kontrol Listesi (CIS Benchmarks)", "altbaslik": "Dünya Standartlarında Güvenlik", "icerik": "CIS (Center for Internet Security) Sunucu Sıkılaştırma Standartları:\n1. Varsayılan Administrator/root hesap adını değiştirin.\n2. Kullanılmayan USB ve Bluetooth portlarını devre dışı bırakın.\n3. Güvenlik olay günlüklerinin (Event Logs) boyutunu en az 1 GB yapın.\n4. Parola deneme sınırını 5 hatalı girişe ayarlayın.", "gorsel": {"type": "image", "query": "cis benchmarks security compliance checklist"}}, {"baslik": "Ağ Güvenliği Tehditleri: IP Spoofing", "altbaslik": "Sahte Kaynak IP ile Aldatma", "icerik": "IP Spoofing: Saldırganın gönderdiği paketin kaynak IP başlığına şirketin güvendiği bir iç IP adresini yazmasıdır.\nSavunma: Anti-Spoofing Kuralları.\nFirewall, dış internet bacağından gelen paketin kaynak adresi bir 'iç IP' (192.168.x.x) ise bu paketi anında sahte kabul edip düşürmelidir (Drop).", "gorsel": {"type": "image", "query": "ip spoofing packet fake source address diagram"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- Firewall sistemin ilk kapısıdır; Default Deny politikasıyla yönetilmelidir.\n- DMZ mimarisi şirket içi veritabanlarını internet saldırılarından yalıtır.\n- UFW ve PowerShell ile tek satırda kurallar yazılabilir.\n- Katmanlı savunma (Defense in Depth) ve sistem sıkılaştırma en sağlam kalkandır.", "gorsel": {"type": "image", "query": "summary concept mind map review"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 9: Sızma Testleri ve Metasploit Framework", "icerik": "Ön Hazırlık:\n- Pentest süreçleri ve kutu testleri (Black/White/Grey) nelerdir?\n- Metasploit Framework mimarisi (Exploit ve Payload) nasıl çalışır?\n- Hedef sanal makineye Metasploit ile nasıl sızılır?", "gorsel": {"type": "image", "query": "metasploit framework penetration testing concept"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Neden web sunucusunu doğrudan şirket içi muhasebe veritabanıyla aynı yerel ağa koymak yerine DMZ bölgesine koyarız?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper feedback classroom student"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
