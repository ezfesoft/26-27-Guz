: {"type": "image", "query": "students network lab packet capture hping3 wireshark"}}, {"baslik": "Uygulama 1: Kontrollü SYN Paketi Gönderme", "altbaslik": "hping3 ile L4 Paket Analizi", "icerik": "Terminalde Windows Server 2019'a (192.168.1.10) 10 adet SYN paketi yollayalım:\nsudo hping3 -S -p 80 -c 10 192.168.1.10\nBeklenen Çıktı:\nlen=46 ip=192.168.1.10 sport=80 flags=SA seq=0 rtt=0.8 ms\nflags=SA (SYN-ACK) sunucunun bağlantıyı kabul ettiğini doğrular.", "gorsel": {"type": "image", "query": "hping3 terminal output flags sa response"}}, {"baslik": "Uygulama 2: Wireshark ile Trafik Grafiği İzleme", "altbaslik": "I/O Graphs Analizi", "icerik": "Adım 1: Wireshark'ı açın (sudo wireshark &).\nAdım 2: Filtreye şunu yazın:\ntcp.flags.syn == 1 and tcp.flags.ack == 0\nAdım 3: Üst menüden Statistics -> I/O Graphs seçeneğine tıklayın.\nEğitmen test paketi gönderdiğinde grafikteki ani sıçramayı izleyin!", "gorsel": {"type": "image", "query": "wireshark io graphs packet rate spike monitor"}}, {"baslik": "Uygulama 3: Slowhttptest ile L7 Testi", "altbaslik": "Web Sunucu Bağlantı Havuzu", "icerik": "Web sunucunun bağlantı açık tutma kapasitesini test edelim:\nslowhttptest -c 50 -H -i 10 -r 100 -t GET -u http://192.168.1.20/dvwa/ -l 20\nSonuç:\nSunucunun gelen yavaş istekleri kaç saniye askıda tuttuğunu analiz edin.", "gorsel": {"type": "image", "query": "slowhttptest terminal report graph web server"}}, {"baslik": "Uygulama 4: Linux'ta SYN Cookie Savunması", "altbaslik": "Çekirdek Düzeyinde Koruma", "icerik": "SYN Cookie durumunu kontrol edelim (1 = Aktif, 0 = Kapalı):\ncat /proc/sys/net/ipv4/tcp_syncookies\nAktif değilse aktifleştirelim:\nsudo sysctl -w net.ipv4.tcp_syncookies=1\nBu ayar ile sunucu SYN Flood saldırısı alsa bile belleği kilitlenmez!", "gorsel": {"type": "image", "query": "sysctl tcp syncookies terminal command output"}}, {"baslik": "Sık Yapılan Hatalar ve İpuçları", "altbaslik": "Laboratuvar Güvenlik Kuralları", "icerik": "1. Flood Modu Yasağı: Sınıfta kimse --flood parametresi kullanmamalıdır; 60 cihaz aynı anda basarsa laboratuvar omurga switch'i kilitlenir!\n2. Sudo Zorunluluğu: Ham IP paketi üretmek Linux'ta root yetkisi gerektirir (sudo hping3).\n3. Paket Limiti: Mutlaka -c 10 veya -c 20 ile sınır koyulmalıdır.", "gorsel": {"type": "image", "query": "troubleshooting caution warning flood checklist"}}, {"baslik": "Sektörel Vaka: Dyn DNS DDoS Saldırısı", "altbaslik": "İnternetin Yarısının Çöktüğü Gün", "icerik": "Vaka: 2016 yılında Mirai botneti küresel DNS sağlayıcısı Dyn'e 1.2 Tbps şiddetinde devasa bir DDoS saldırısı yaptı.\nSonuç: Twitter, Netflix, Spotify, GitHub, PlayStation Network ve Reddit dahil yüzlerce dünya devi saatlerce tamamen çöktü!\nDers: Tek bir merkezi DNS sağlayıcısına bağımlı olmak kritik bir mimari risktir.", "gorsel": {"type": "image", "query": "dyn dns ddos cyber attack internet outage map"}}, {"baslik": "Vaka Analizi: DDoS Dayanıklılık Mimarisi", "altbaslik": "Çıkarılan Mühendislik Dersi", "icerik": "DDoS'a Karşı Alınacak Tedbirler:\n1. BGP Anycast Yönlendirme: Saldırı trafiği tek bir merkeze değil, dünya geneline dağıtılır.\n2. Cloudflare / AWS Shield / Akamai Entegrasyonu: 100+ Gbps saldırılar bulut temizleme merkezlerinde eritilir.\n3. Yedekli Çoklu DNS (Multi-DNS) Mimarisi.", "gorsel": {"type": "image", "query": "cloud ddos protection anycast cdn architecture diagram"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Saldırı Türleri", "icerik": "Soru: Birden fazla ele geçirilmiş zombi cihaz (Botnet) kullanılarak yapılan dağıtık servis dışı bırakma saldırısına ne ad verilir?\nA) DoS\nB) DDoS\nC) XSS\nD) SQLi\n\nDoğru Cevap: B (DDoS)", "gorsel": {"type": "image", "query": "quiz question multiple choice exam board"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "L4 Saldırıları", "icerik": "Soru: TCP 3'lü el sıkışmayı yarım bırakarak sunucunun bağlantı hafızasını doldurmayı amaçlayan Katman 4 saldırısı hangisidir?\nA) Slowloris\nB) SYN Flood\nC) Phishing\nD) MITM\n\nDoğru Cevap: B (SYN Flood)", "gorsel": {"type": "image", "query": "syn flood question multiple choice"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "L7 Saldırıları", "icerik": "Soru: Web sunucusuna HTTP başlıklarını çok yavaş göndererek bağlantı havuzunu tüketen sinsi Katman 7 saldırısı hangisidir?\nA) Slowloris\nB) Ping of Death\nC) Smurf\nD) Teardrop\n\nDoğru Cevap: A (Slowloris)", "gorsel": {"type": "image", "query": "slowloris question board test"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Savunma Mekanizmaları", "icerik": "Soru: SYN Flood saldırılarına karşı sunucunun bellekte yer ayırmadan matematiksel dizi numaralarıyla el sıkışmasını sağlayan Linux savunması hangisidir?\nA) SYN Cookies\nB) Port Forwarding\nC) Telnet\nD) FTP\n\nDoğru Cevap: A (SYN Cookies)", "gorsel": {"type": "image", "query": "syn cookies defense question test"}}, {"baslik": "Mini Quiz: Soru 5", "altbaslik": "Araç Tanıma", "icerik": "Soru: Özel TCP/IP paketleri üretebilen ve güvenlik analizinde kullanılan komut satırı aracı hangisidir?\nA) hping3\nB) Nano\nC) Steghide\nD) Crunch\n\nDoğru Cevap: A (hping3)", "gorsel": {"type": "image", "query": "hping3 tool question board"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Wireshark'ta SYN Paketlerini Sayma", "icerik": "Uygulama Görevi:\nWireshark açıkken eğitmen tarafından gönderilen 10 adet SYN paketini tcp.flags.syn == 1 filtresiyle yakalayıp ekranda ilk listeleyen öğrenci el kaldırsın!", "gorsel": {"type": "image", "query": "students competition classroom coding linux challenge"}}, {"baslik": "DDoS Saldırı Boyutları ve Hacim Rekorları", "altbaslik": "Terabit Seviyesindeki Saldırılar", "icerik": "Günümüz DDoS Tehdit İstatistikleri:\n- 2016 Mirai Botnet: 1.2 Tbps\n- 2020 AWS Shield Tespiti: 2.3 Tbps\n- 2023 HTTP/2 Rapid Reset Açığı: Saniyede 398 Milyon İstek (RPS)!\nBu devasa saldırılar şirket içi donanımlarla değil, sadece küresel bulut temizleme omurgalarıyla durdurulabilir.", "gorsel": {"type": "image", "query": "ddos attack record volume terabits per second analytics"}}, {"baslik": "HTTP/2 Rapid Reset ve L7 Tehditleri", "altbaslik": "Modern Web Protokolü Zafiyeti", "icerik": "HTTP/2 protokolündeki akış iptali (RST_STREAM) özelliğini istismar eder.\n- Saldırgan sunucuya aynı anda yüz binlerce istek gönderip hemen ardından iptal eder.\n- Sunucu isteği işlemek için CPU harcar ama yanıt dönemez; işlemci yüzde 100'e vurup web sunucusu çöker!", "gorsel": {"type": "image", "query": "http2 rapid reset attack protocol stream multiplexing diagram"}}, {"baslik": "BGP Anycast ve Scrubbing Center Mimarisi", "altbaslik": "Küresel Temizleme Ağı", "icerik": "Anycast Mimarisi:\nDünyanın 300 farklı şehrindeki sunucu aynı IP adresini anons eder.\n- Saldırı başladığında trafik tek bir veri merkezine gitmez; saldırgan hangi ülkedeyse en yakın yerel bulut sunucusunda emilir ve temizlenir.\n- Kurumsal sunucuya yalnızca arındırılmış temiz trafik ulaşır.", "gorsel": {"type": "image", "query": "bgp anycast routing global scrubbing centers diagram"}}, {"baslik": "DDoS Müdahale Planı ve Tatbikatlar", "altbaslik": "Kriz Anında Neler Yapılır?", "icerik": "Kurumsal DDoS Acil Eylem Planı:\n1. Trafik Anomalisi Tespiti (SIEM & NetFlow Alarmları)\n2. Saldırı Türünün Belirlenmesi (L4 Hacimsel mi, L7 Uygulama mı?)\n3. Bulut DDoS Korumasının (Under Attack Mode) Devreye Alınması\n4. ISS (İnternet Servis Sağlayıcı) ile İletişime Geçilip BGP Blackholing Uygulanması.", "gorsel": {"type": "image", "query": "incident response plan ddos team war room cybersecurity"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- DoS tek kaynaktan, DDoS ise devasa botnet ordularından yapılır.\n- SYN Flood ağ katmanını (L4), Slowloris uygulama katmanını (L7) hedefler.\n- hping3 özel paket üretimiyle ağ dayanıklılık testleri yapmayı sağlar.\n- SYN Cookies, Rate Limiting ve Cloud CDN mimarileri en etkin savunmadır.", "gorsel": {"type": "image", "query": "summary concept mind map review"}}, {"baslik": "Dönem Sonu Genel Değerlendirmesi", "altbaslik": "14 Haftalık Büyük Yolculuk", "icerik": "14 Hafta Boyunca Neler Başardınız?\n- Temel Hukuk, CIA ve Linux CLI yönetimi\n- Kriptoloji, Steganografi ve Parola Kırma (John/Hydra)\n- Ağ Dinleme (Wireshark) ve Bilgi Toplama (Nmap)\n- Sızma Testleri (Metasploit) ve Sömürü Sonrası (Meterpreter)\n- Web Güvenliği (SQLi, XSS, Fuzzing) ve DoS/DDoS Savunması!", "gorsel": {"type": "image", "query": "cybersecurity graduate certification achievement student team"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dönemi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'100 Gbps gibi devasa bir DDoS saldırısını şirket içi yerel bir firewall ile durdurmak neden imkansızdır ve çözüm olarak hangi mimari kullanılmalıdır?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper feedback classroom student"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
