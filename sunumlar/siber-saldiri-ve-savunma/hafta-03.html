<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siber Saldırı ve Savunma Yöntemleri - Hafta 03 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #e11d48;
            --accent-glow: #e11d4825;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

aslik": "Kriptografinin Temel Hedefleri", "altbaslik": "4 Temel Güvenlik İlkesi", "icerik": "1. Gizlilik (Confidentiality): Yetkisiz kişilerin okumasını engellemek.\n2. Bütünlük (Integrity): Verinin değiştirilmediğini kanıtlamak.\n3. Kimlik Doğrulama (Authentication): Mesajın iddia edilen kişiden geldiğini teyit etmek.\n4. İnkâr Edilemezlik (Non-Repudiation): İşlemi yapanın bunu sonradan reddedememesini sağlamak.", "gorsel": {"type": "image", "query": "four pillars of information security authentication integrity non-repudiation"}}, {"baslik": "Klasik Kriptografi: Sezar Şifrelemesi", "altbaslik": "Tarihin İlk Yerine Koyma Şifresi", "icerik": "M.Ö. Jül Sezar tarafından ordusuyla haberleşmek için kullanılmıştır.\nKural: Alfabedeki her harfi n basamak ileri kaydır.\nŞifreleme: E(x) = (x + 3) mod 29\nDeşifreleme: D(x) = (x - 3) mod 29\nZayıflığı: Alfabede sadece 29 deneme ile veya harf frekans analiziyle saniyeler içinde kırılır.", "gorsel": {"type": "image", "query": "caesar cipher wheel substitution cryptography ancient"}}, {"baslik": "Vigenère Şifrelemesi: Çoklu Alfabe", "altbaslik": "Tekrarlanan Anahtar Kelime Yöntemi", "icerik": "Sezar'ın tek harf kaydırma açığını kapatmak için geliştirilmiştir.\n- Bir anahtar kelime seçilir (Örn: 'KALE').\n- Metindeki her harf anahtarın sıradaki harfine göre farklı miktarda kaydırılır.\n- Kasiski yöntemi ve frekans analizinin gelişmesiyle bu şifre de çözülmüştür.", "gorsel": {"type": "image", "query": "vigenere cipher table grid square cryptography"}}, {"baslik": "Modern Kriptografi: Simetrik Şifreleme", "altbaslik": "Tek ve Gizli Anahtar Modeli", "icerik": "Şifreleme ve deşifreleme işlemleri için AYNI gizli anahtar kullanılır.\n[Düz Metin] -> [AES Şifreleme (Gizli Anahtar)] -> [Şifreli Metin] -> [AES Deşifreleme (Gizli Anahtar)] -> [Düz Metin]\nAvantajı: Çok hızlıdır, gigabaytlarca veriyi saniyeler içinde şifreler.\nDezavantajı: Gizli anahtarı karşı tarafa güvenle iletmek zordur (Anahtar Dağıtım Problemi).", "gorsel": {"type": "image", "query": "symmetric encryption single secret key diagram"}}, {"baslik": "Popüler Simetrik Algoritmalar", "altbaslik": "DES'ten AES'e Gelişim", "icerik": "- DES (Data Encryption Standard): 56-bit anahtar kullanır. Günümüzde güvensizdir ve kırılmıştır.\n- 3DES: DES'i 3 kez uygular, yavaştır.\n- AES (Advanced Encryption Standard): Günümüzün dünya standardıdır.\n  * 128, 192 ve 256-bit anahtar uzunluklarını destekler.\n  * Kaba kuvvetle kırılması evrenin yaşından daha uzun sürer!", "gorsel": {"type": "image", "query": "AES encryption standard block cipher security"}}, {"baslik": "Blok Şifreleme Modları: ECB vs CBC", "altbaslik": "Şifreleme Modlarının Önemi", "icerik": "- ECB (Electronic Codebook): Her 128-bitlik veri bloğu birbirinden bağımsız şifrelenir. Aynı girdiler aynı çıktıyı üretir, resim şifrelendiğinde deseni görünür kalır!\n- CBC (Cipher Block Chaining): Her blok bir önceki blokla XOR işlemine tabi tutulur. Başlangıç Vektörü (IV) kullanılır, son derece güvenlidir.", "gorsel": {"type": "image", "query": "ecb vs cbc mode linux tux penguin comparison encryption"}}, {"baslik": "Asimetrik (Açık Anahtarlı) Kriptografi", "altbaslik": "Çift Anahtar Mucizesi", "icerik": "İki farklı matematiksel anahtar kullanılır:\n1. Açık Anahtar (Public Key): Herkesle paylaşılır, veriyi şifrelemek için kullanılır.\n2. Gizli Anahtar (Private Key): Sadece sahibinde kalır, şifreyi çözmek için kullanılır.\n[Düz Metin] -> [Alıcının Açık Anahtarı ile Şifrele] -> [Şifreli Metin] -> [Alıcının Gizli Anahtarı ile Çöz] -> [Düz Metin]", "gorsel": {"type": "image", "query": "asymmetric encryption public private key pair diagram"}}, {"baslik": "Asimetrik Algoritmalar: RSA ve ECC", "altbaslik": "Asal Sayıların Gücü", "icerik": "- RSA: İki çok büyük asal sayının çarpımını çarpanlarına ayırmanın zorluğuna dayanır (2048 / 4096-bit).\n- ECC (Elliptic Curve Cryptography): Eliptik eğriler üzerindeki noktalara dayanır.\n  * 256-bit ECC, 3072-bit RSA ile aynı güvenliği sağlar!\n  * Mobil cihazlarda ve kripto paralarda tercih edilir.", "gorsel": {"type": "image", "query": "elliptic curve cryptography mathematics graph RSA"}}, {"baslik": "Hibrit Kriptografi: HTTPS Nasıl Çalışır?", "altbaslik": "En İyilerin Birleşimi", "icerik": "Asimetrik şifreleme güvenlidir ama yavaştır. Simetrik şifreleme hızlıdır ama anahtar paylaşımı zordur.\nHTTPS Çözümü:\n1. Tarayıcı ile sunucu RSA/ECC kullanarak güvenli bir ortak oturum anahtarı paylaşır (Asimetrik El Sıkışma).\n2. Sayfa içeriği ve veri transferi AES-256 ile ışık hızında şifrelenir (Simetrik).", "gorsel": {"type": "image", "query": "https ssl tls handshake padlock browser security"}}, {"baslik": "Steganografi Nedir? (Veri Gizleme)", "altbaslik": "Görünmeyeni Saklama Sanatı", "icerik": "Kriptografi: Mesaj okunamaz ama herkes şifreli bir dosya olduğunu anlar.\nSteganografi: Mesajın VARLIĞI gizlenir. Dışarıdan bakan kişi sadece sıradan bir kedi fotoğrafı veya şarkı görür.\nTarihte: Görünmez mürekkepler, kölelerin kazınmış kafasına yazılan dövmeler.\nDijitalde: Resim, ses ve video dosyalarının piksellerine veri gizleme.", "gorsel": {"type": "image", "query": "steganography hidden message inside image concept"}}, {"baslik": "LSB (Least Significant Bit) Yöntemi", "altbaslik": "En Az Değerli Bit Tekniği", "icerik": "Dijital resimler RGB piksellerinden (0-255 arası baytlar) oluşur.\nPiksel Baytı: 1 1 0 1 0 0 1 [0] <- En sağdaki bit LSB'dir.\nEn sağdaki bu 1 biti değiştirmek piksel renginde insan gözünün ayırt edemeyeceği yüzde 0.4'lük bir ton farkı yaratır.\nGizli mesajın bitleri sırayla resmin LSB bitlerine yazılır.", "gorsel": {"type": "image", "query": "least significant bit LSB pixel byte diagram steganography"}}, {"baslik": "Uygulama Laboratuvarı: OpenSSL ve Steghide", "altbaslik": "Uygulama Adımlarımız", "icerik": "Laboratuvarımızda:\n1. OpenSSL ile AES-256 simetrik dosya şifreleyeceğiz.\n2. Şifreli dosyanın okunamaz olduğunu doğrulayacağız.\n3. Steghide aracıyla bir JPG fotoğrafı içine gizli metin gömüp çıkaracağız.", "gorsel": {"type": "image", "query": "cyber security lab students terminal cryptography practice"}}, {"baslik": "Uygulama 1: OpenSSL ile Dosya Şifreleme", "altbaslik": "AES-256-CBC ile Gizli Rapor Kilitleme", "icerik": "Adım 1: Gizli bir dosya oluşturalım:\necho \"Gizli Proje Raporu: GRU2026\" > rapor.txt\nAdım 2: OpenSSL ile AES-256 şifreleyelim:\nopenssl enc -aes-256-cbc -salt -in rapor.txt -out rapor.enc -pbkdf2\nTerminal sizden bir parola isteyecektir (Örn: siber123).", "gorsel": {"type": "image", "query": "openssl encryption terminal command line linux"}}, {"baslik": "Uygulama 2: Şifreli Dosyayı İnceleme ve Çözme", "altbaslik": "Deşifreleme Adımı", "icerik": "Adım 1: Şifreli dosyayı okumayı deneyin:\ncat rapor.enc\nSonuç: Anlamsız karakterler ve semboller göreceksiniz.\nAdım 2: Dosyayı orijinal haline geri çözelim:\nopenssl enc -d -aes-256-cbc -in rapor.enc -out cozulmus.txt -pbkdf2\ncat cozulmus.txt", "gorsel": {"type": "image", "query": "decrypted text output terminal success checkmark"}}, {"baslik": "Uygulama 3: Steghide ile Resme Veri Gömme", "altbaslik": "Gizli Mesajı Fotoğrafa Saklama", "icerik": "Adım 1: Test resmi ve gizli mesaj hazırlayalım:\nwget http://192.168.1.10/sample.jpg -O resim.jpg\necho \"BULUSMA: SAAT 15:00 LAB-2\" > gizli.txt\nAdım 2: Steghide ile mesajı resme gömelim:\nsteghide embed -cf resim.jpg -ef gizli.txt\nParola belirleyin (Örn: gizli123).", "gorsel": {"type": "image", "query": "steghide embedding process terminal image linux"}}, {"baslik": "Uygulama 4: Gizli Mesajı Resimden Çıkarma", "altbaslik": "Extract İşlemi", "icerik": "Adım 1: Orijinal gizli.txt dosyasını silelim:\nrm gizli.txt\nAdım 2: Resmi açıp bakın, görüntü tamamen normaldir:\nxdg-open resim.jpg\nAdım 3: Resmin içindeki gizli metni kurtaralım:\nsteghide extract -sf resim.jpg\ncat gizli.txt", "gorsel": {"type": "image", "query": "steghide extraction recovered message terminal"}}, {"baslik": "Sık Yapılan Hatalar ve İpuçları", "altbaslik": "Kriptoloji ve Steganografi Tuzakları", "icerik": "1. Format Hatası: Steghide PNG formatını desteklemez; mutlaka JPG veya BMP kullanılmalıdır.\n2. Parola Görünmüyor Endişesi: Linux terminallerinde parola yazarken yıldız veya imleç çıkmaz, yazıp Enter'a basılmalıdır.\n3. Yanlış Şifre Çözme: OpenSSL'de şifrelerken pbkdf2 kullandıysanız çözerken de -pbkdf2 parametresini unutmamalısınız.", "gorsel": {"type": "image", "query": "troubleshooting warning checklist error screen"}}, {"baslik": "Sektörel Vaka: Silk Road Operasyonu", "altbaslik": "Kriptoloji ve Adli Bilişim", "icerik": "Vaka: Karanlık ağdaki (Darknet) Silk Road pazar yerinin yöneticisi yakalandığında dizüstü bilgisayarı açıktı.\nİnceleme: Bilgisayar kapansaydı tüm disk TrueCrypt ile tam şifreli (AES) olduğu için FBI verilere asla ulaşamayacaktı.\nSonuç: Kriptografi matematiksel olarak kusursuz olsa bile fiziksel güvenlik ve insan hatası sistemi ele verir.", "gorsel": {"type": "image", "query": "fbi cyber forensics seized laptop darknet investigation"}}, {"baslik": "Vaka Analizi: Steganaliz Nasıl Yapılır?", "altbaslik": "Gizli Veriyi Tespit Etme Teknikleri", "icerik": "Steganaliz (Steganalysis): Şüpheli resimlerin steganografi içerip içermediğini anlama bilimidir.\nYöntemler:\n1. Histogram Analizi: Resim piksellerinin renk dağılımındaki matematiksel anomalileri arar.\n2. Dosya Boyutu ve İkili Farklılık Taraması.", "gorsel": {"type": "image", "query": "steganalysis histogram chart pixel frequency analysis"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Kriptografi Türleri", "icerik": "Soru: Şifreleme ve şifre çözme işlemlerinde AYNI gizli anahtarın kullanıldığı sistemlere ne ad verilir?\nA) Asimetrik Şifreleme\nB) Simetrik Şifreleme\nC) Steganografi\nD) Özetleme (Hash)\n\nDoğru Cevap: B (Simetrik)", "gorsel": {"type": "image", "query": "quiz test examination question mark classroom"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Algoritma Eşleştirme", "icerik": "Soru: Günümüzde dünya çapında kullanılan en popüler ve güvenli simetrik blok şifreleme standardı hangisidir?\nA) DES\nB) Sezar\nC) AES\nD) MD5\n\nDoğru Cevap: C (AES)", "gorsel": {"type": "image", "query": "encryption standard question multiple choice"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Asimetrik Anahtarlar", "icerik": "Soru: Bir kullanıcıya gizli bir mesaj gönderirken mesajı şifrelemek için kime ait hangi anahtar kullanılır?\nA) Göndericinin Gizli Anahtarı\nB) Alıcının Açık Anahtarı (Public Key)\nC) Alıcının Gizli Anahtarı\nD) Ortak Wifi Şifresi\n\nDoğru Cevap: B (Alıcının Açık Anahtarı)", "gorsel": {"type": "image", "query": "public key encryption security question"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Steganografi Mantığı", "icerik": "Soru: Steganografinin kriptografiden en temel farkı nedir?\nA) Steganografi mesajın varlığını gizler, kriptografi içeriği okunamaz yapar.\nB) Steganografi sadece ses dosyalarında çalışır.\nC) Steganografi şifre çözülemez.\nD) Steganografi yasal değildir.\n\nDoğru Cevap: A", "gorsel": {"type": "image", "query": "steganography vs cryptography comparison quiz"}}, {"baslik": "Mini Quiz: Soru 5", "altbaslik": "Şifreleme Modları", "icerik": "Soru: Her veri bloğunu birbirinden bağımsız şifrelediği için desenleri gizleyemeyen ve önerilmeyen simetrik blok şifre modu hangisidir?\nA) CBC\nB) ECB\nC) GCM\nD) CTR\n\nDoğru Cevap: B (ECB)", "gorsel": {"type": "image", "query": "block cipher mode evaluation quiz"}}, {"baslik": "Sınıf İçi Tartışma ve Uygulama", "altbaslik": "Kendi Stego Mesajınızı Paylaşın", "icerik": "Uygulama Görevi:\nBir resme arkadaşınızın adı ve gizli bir parola gömün. Resmi arkadaşınıza USB veya ağ paylaşımı ile gönderin.\nArkadaşınız doğru parolayla mesajınızı çıkarsın.\nEkranda mesajı gören gruplar el kaldırsın!", "gorsel": {"type": "image", "query": "students collaborating computer lab sharing files"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bu Hafta Neler Öğrendik?", "icerik": "- Simetrik şifreleme (AES) hızlıdır; Asimetrik şifreleme (RSA/ECC) anahtar değişimini güvenli kılar.\n- HTTPS protokolü her iki yöntemi birleştiren hibrit bir modeldir.\n- Steganografi LSB tekniği ile resim piksellerine görünmez mesajlar saklar.\n- OpenSSL ve Steghide sektörde temel komut satırı araçlarıdır.", "gorsel": {"type": "image", "query": "summary concept mind map review"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 4: Kali Linux ve Temel Komut Satırı Yönetimi", "icerik": "Ön Hazırlık:\n- Linux dosya sistemi (FHS) hiyerarşisi nasıl çalışır?\n- chmod 755 veya 644 izinleri ne anlama gelir?\n- Arka planda gizlice çalışan süreçler (Process) nasıl tespit edilip sonlandırılır?", "gorsel": {"type": "image", "query": "linux operating system command line matrix"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Neden bankacılık işlemlerinde sadece RSA kullanmak yerine RSA ile AES anahtarı paylaşılıp veriler AES ile şifrelenir?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket classroom paper feedback"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Siber Güvenlik & SOC`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
