<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görsel Programlama - Hafta 12 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: #6366f140;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 12", "altbaslik": "Koşullu Döngüler (while / do-while) ve ComboBox", "icerik": "Program: Bilgisayar Programcılığı\nModül: Koşula Dayalı Tekrarlar ve Açılır Listeler\nHaftalık Odak: while (Ön Test), do-while (Son Test), ComboBox (SelectedIndex/Item)\nHedef: Tekrar sayısı önceden bilinmeyen dinamik iş süreçlerini modellemek.", "gorsel": {"type": "image", "query": "while loop flow diagram combobox dropdown ui"}}, {"baslik": "Neden while Döngüsü Kullanırız?", "altbaslik": "Sektörel Bağlam: Şart Sürdüğü Sürece Tekrar", "icerik": "for döngüsünde kaç tur koşacağımız baştan bellidir (10 tur).\nAncak gerçek hayatta çoğu zaman kaç tur döneceğini bilmeyiz:\n- 'Kullanıcı doğru şifre girene kadar sor!'\n- 'Para bitene kadar banknot dağıt!'\n- 'Dosyanın sonuna gelene kadar satır oku!'\nBu belirsiz durumlarda while döngüsü kullanılır.", "gorsel": {"type": "image", "query": "atm cash withdrawal looping condition"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. for döngüsü ile while döngüsü arasındaki farkı açıklar.\n2. while (Ön Test) ile do-while (Son Test) mekanizmasını kavrar.\n3. ComboBox kontrolüne eleman ekler ve seçili elemanı okur.\n4. Form_Load olayında arayüzü otomatik hazır hale getirir.\n5. 'Akıllı ATM Banknot Dağıtıcı' projesini tamamlar.", "gorsel": {"type": "image", "query": "learning targets goals programming while loops"}}, {"baslik": "Somut Analoji: Lunapark Treni vs Restoran Hesabı", "altbaslik": "while vs do-while Ayrımı", "icerik": "- while (Lunapark Treni - Ön Test): Trene binmeden önce bilet sorulur. Biletin yoksa 0 kez binersin!\n- do-while (Restoran Hesabı - Son Test): Önce yemeği yersin (do), hesabı çıkışta (while) ödersin. Ne olursa olsun EN AZ 1 KEZ yemek yemiş olursun!", "gorsel": {"type": "image", "query": "rollercoaster ticket vs restaurant bill analogy"}}, {"baslik": "while Döngüsü Temel Sentaksı", "altbaslik": "Ön Test Döngüsü (Pre-test Loop)", "icerik": "while (kosul)\n{\n    // Koşul DOĞRU olduğu sürece çalışır\n    // Koşulu değiştirecek bir adım (i++ veya azaltma) şarttır!\n}\n\nÖrnek:\nint kalanPara = 1000;\nwhile (kalanPara >= 200)\n{\n    kalanPara -= 200; // 200 TL ver ve eksilt\n}", "gorsel": {"type": "image", "query": "while loop flowchart logic code block"}}, {"baslik": "do-while Döngüsü Temel Sentaksı", "altbaslik": "Son Test Döngüsü (Post-test Loop)", "icerik": "do\n{\n    // Kod bloğu EN AZ BİR KEZ kesinlikle çalışır.\n} while (kosul); // Dikkat: Sonda noktalı virgül (;) zorunludur!\n\nKullanım Alanı: Menü gösterme, kullanıcıdan en az bir kez şifre isteme senaryoları.", "gorsel": {"type": "image", "query": "do while loop flowchart post test execution"}}, {"baslik": "Karşılaştırmalı Döngü Özeti", "altbaslik": "for, while ve do-while Tablosu", "icerik": "| Özellik | for | while | do-while |\n| :--- | :--- | :--- | :--- |\n| Tur Sayısı | Baştan Belli | Koşula Bağlı | Koşula Bağlı |\n| Kontrol Noktası | Başta | Başta (Pre-test) | Sonda (Post-test) |\n| Min Çalışma | 0 | 0 | 1 (Garanti) |", "gorsel": {"type": "image", "query": "comparison table loop types computer science"}}, {"baslik": "UI Kilitlenmesi (Freezing UI) Uyarısı", "altbaslik": "Masaüstü Pencerelerinde while Kullanırken Dikkat", "icerik": "Windows Forms tek bir ana iş parçacığında (UI Thread) çalışır.\n- Bir butonun içine uzun süren bir while döngüsü yazarsanız, form donar ve 'Yanıt Vermiyor' der.\n- Form uygulamalarında sayaçları buton tıklamalarıyla birleştirmek arayüzü akıcı tutar.", "gorsel": {"type": "image", "query": "not responding window freeze ui thread lag"}}, {"baslik": "ComboBox (Açılır Liste) ile Tanışma", "altbaslik": "Kullanıcıya Seçenek Sunmak", "icerik": "ComboBox, metin kutusu ile açılır listenin birleşimidir.\n\nTemel Komutları:\n- cmbSecim.Items.Add(\"200 TL\"); -> Listeye seçenek ekler.\n- cmbSecim.SelectedIndex; -> Seçili elemanın 0 tabanlı sıra numarası (Seçim yoksa -1).\n- cmbSecim.SelectedItem.ToString(); -> Seçilen metnin kendisi.", "gorsel": {"type": "image", "query": "combobox dropdown list ui selection element"}}, {"baslik": "Form_Load Olayı Nedir?", "altbaslik": "Pencere Açılmadan Önceki Hazırlık", "icerik": "Formun boş bir yerine çift tıkladığınızda 'Form1_Load' metodu açılır:\n- Bu metot, form ekrana gelmeden önce arka planda çalışır.\n- ComboBox'ları doldurmak, başlangıç ayarlarını yüklemek için en ideal yerdir.", "gorsel": {"type": "image", "query": "loading window initialization startup event"}}, {"baslik": "Günün Büyük Uygulaması: Akıllı ATM Banknot Dağıtıcı", "altbaslik": "Senaryo ve Arayüz Tasarımı", "icerik": "Senaryo: Bankamatikte para çeken müşterinin tutarını banknotlara bölen para sayma mekanizması.\n- Kullanıcı çekmek istediği tutarı girer (Örn: 1450 TL).\n- ComboBox'tan dağıtılacak banknot tipi seçilir (200 TL, 100 TL, 50 TL).\n- 'Parayı Ver' butonuna basılınca while döngüsü parayı adım adım düşer ve fiş olarak döker.", "gorsel": {"type": "image", "query": "atm cash dispenser banknotes bills counting"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Kontrol Listesi", "icerik": "Girdiler: txtTutar, cmbBanknotTipi\nButon: btnParaCek ('💵 Parayı Ver')\nListe: listBoxFis (Banka İşlem Dekontu)\nDurum: lblKalan (Kalan Bozukluk ve Adet Bilgisi)", "gorsel": {"type": "image", "query": "atm ui user interface layout screen forms"}}, {"baslik": "Uygulama Kodları: Form_Load ile Liste Doldurma", "altbaslik": "ComboBox'ı Hazırlamak", "icerik": "private void Form1_Load(object sender, EventArgs e)\n{\n    cmbBanknotTipi.Items.Add(\"200 TL\");\n    cmbBanknotTipi.Items.Add(\"100 TL\");\n    cmbBanknotTipi.Items.Add(\"50 TL\");\n    cmbBanknotTipi.SelectedIndex = 0; // İlk elemanı seçili getir\n}", "gorsel": {"type": "image", "query": "csharp code form load combobox items add"}}, {"baslik": "Uygulama Kodları: while ile Para Dağıtımı", "altbaslik": "Banknot Eksiltme Algoritması", "icerik": "private void btnParaCek_Click(object sender, EventArgs e)\n{\n    try\n    {\n        int cekilecek = Convert.ToInt32(txtTutar.Text);\n        int banknot = 200;\n\n        if (cmbBanknotTipi.SelectedIndex == 0) banknot = 200;\n        else if (cmbBanknotTipi.SelectedIndex == 1) banknot = 100;\n        else if (cmbBanknotTipi.SelectedIndex == 2) banknot = 50;\n\n        listBoxFis.Items.Clear();\n        int adet = 0;\n\n        // WHILE DÖNGÜSÜ: Para yettiği sürece ver!\n        while (cekilecek >= banknot)\n        {\n            adet++;\n            cekilecek -= banknot; // Bakiyeden düş\n            listBoxFis.Items.Add(adet + \". Banknot verildi: \" + banknot + \" TL (Kalan: \" + cekilecek + \" TL)\");\n        }\n        lblKalan.Text = \"Toplam \" + adet + \" adet verildi. Bozuk Kalan: \" + cekilecek + \" TL\";\n    }\n    catch { MessageBox.Show(\"Lütfen geçerli bir tutar giriniz!\"); }\n}", "gorsel": {"type": "image", "query": "csharp code while loop atm cash distribution"}}, {"baslik": "Sektörel Vaka: Akıllı Telefon Pil Tüketimi", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Telefon işletim sistemi arka planda:\nwhile (sarjYuzdesi > 0)\n{\n    EkraniveUygulamalariCalistir();\n}\nTelefonuKapat();\nŞarj tükenene kadar çalışan akıllı cihazlar while döngüsü mimarisine dayanır.", "gorsel": {"type": "image", "query": "smartphone battery charging percentage icon"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "while vs do-while", "icerik": "Soru: Koşul en başta yanlış (false) olsa bile gövdesi EN AZ 1 KEZ çalışan döngü hangisidir?\n\nA) for\nB) while\nC) do-while\nD) foreach\n\nDoğru Cevap: C (do-while son test döngüsü olduğu için koşula bakmadan ilk turu mutlaka çalıştırır).", "gorsel": {"type": "image", "query": "quiz test choice correct answer loops"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "ComboBox", "icerik": "Soru: ComboBox'ta hiçbir eleman seçili olmadığında SelectedIndex özelliği hangi değeri alır?\n\nA) 0\nB) 1\nC) -1\nD) null\n\nDoğru Cevap: C (-1 değeri hiçbir öğenin seçilmediğini ifade ede törü ve Min/Max bulma algoritması.", "gorsel": {"type": "image", "query": "data structures arrays lottery numbers preview next week"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
