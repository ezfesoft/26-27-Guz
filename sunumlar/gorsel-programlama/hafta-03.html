<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Görsel Programlama - Hafta 03 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #4f46e5;
            --accent-glow: #4f46e525;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 3", "altbaslik": "Olaylar (Events), Veri Akışı ve Metin Birleştirme", "icerik": "Program: Bilgisayar Programcılığı\nModül: Etkileşimli Arayüz Programlama\nHaftalık Odak: Girdi-İşlem-Çıktı Döngüsü, Metin Birleştirme (+), Event Handler Anatomisi\nHedef: Kullanıcı girdilerini okuyup işleyen ilk dinamik etkileşimli formu üretmek.", "gorsel": {"type": "image", "query": "event driven programming data flow user interaction"}}, {"baslik": "Neden Bu Konuyu Öğreniyoruz?", "altbaslik": "Sektörel Bağlam: Dinamik Veri Akışı", "icerik": "Statik bir ekran sadece resim gibidir. Bir uygulamanın 'canlı' olması için kullanıcının yazdığı bilgileri okuyabilmesi gerekir.\n- Kullanıcı 'Ahmet' yazdığında ekranda 'Hoş Geldiniz Ahmet Bey' çıkması,\n- Sipariş formunda isim ve adresin birleştirilip kargo etiketine dönüşmesi olay yönetimiyle gerçekleşir.", "gorsel": {"type": "image", "query": "interactive dynamic web desktop form workflow"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. Olay Güdümlü Programlama (Event-Driven Programming) mantığını kavrar.\n2. TextBox'tan .Text ile veri okuma ve Label'a veri aktarma adımlarını uygular.\n3. Metinleri '+' operatörü ile aralarında boşluk bırakarak birleştirir (Concatenation).\n4. '\\n' kaçış karakteriyle çok satırlı görsel çıktılar üretir.\n5. 'VIP Kongre Yaka Kartı' projesini başarıyla tamamlar.", "gorsel": {"type": "image", "query": "goals objectives visual programming milestones"}}, {"baslik": "Görsel Programlamanın Altın Döngüsü", "altbaslik": "Girdi -> İşlem -> Çıktı Mimarisi", "icerik": "Tüm etkileşimli programlar 3 aşamalı bir döngüde çalışır:\n\n1. Girdi (Input): TextBox'tan veriyi oku -> txtAd.Text\n2. İşlem (Process): Verileri birleştir, dönüştür, mantık işlet.\n3. Çıktı (Output): Sonucu kullanıcıya göster -> lblSonuc.Text\n\nBu üç adımın sırası asla bozulmaz!", "gorsel": {"type": "image", "query": "input process output diagram computer science"}}, {"baslik": "Olay (Event) ve Olay İşleyici (Event Handler)", "altbaslik": "Kodlar Ne Zaman Çalışır?", "icerik": "Geleneksel programlar baştan sona çalışır ve kapanır. Görsel programlar ise 'Olay Güdümlü'dür (Event-Driven):\n- Program sürekli arka planda dinlemede bekler (Idle state).\n- Kullanıcı butona tıkladığında (Click Event) C# uyanır, o butona bağlı metodu çalıştırır ve tekrar beklemeye geçer.", "gorsel": {"type": "image", "query": "event listener trigger action reaction software"}}, {"baslik": "Olay Metodunun Anatomisi", "altbaslik": "Visual Studio'nun Oluşturduğu Kod Bloğu", "icerik": "private void btnGiris_Click(object sender, EventArgs e)\n{\n    // Komutlar buraya yazılır\n}\n\n- private: Bu metoda sadece bu form penceresi erişebilir.\n- void: İşlemi yapar ama geriye bir değer döndürmez.\n- btnGiris_Click: Metodun adı (KontrolAdı_OlayAdı).\n- { }: Kodların yazılacağı sınır kapılarıdır.", "gorsel": {"type": "image", "query": "csharp method signature anatomy syntax breakdown"}}, {"baslik": "Metot Parametreleri: sender ve e", "altbaslik": "Korkutmadan Parametre Kavramı", "icerik": "- object sender: Olayı kimin tetiklediğini söyler (Örn: Tıklanan butonun kendisi).\n- EventArgs e: Olayla ilgili ek detayları barındırır (Örn: Fare hangi koordinata tıkladı, klavyeden hangi tuşa basıldı).\n- Şimdilik bu parametreleri değiştirmeden olduğu gibi bırakıyoruz.", "gorsel": {"type": "image", "query": "parameters arguments function caller concept"}}, {"baslik": "TextBox'tan Veri Okuma Mantığı", "altbaslik": ".Text Özelliğine Erişmek", "icerik": "TextBox içindeki yazıyı okumak için 'txtKutuAdi.Text' ifadesi kullanılır.\n\nÖrnek:\nstring kullaniciGirdisi = txtAd.Text;\n\nBu satır, kullanıcının o an kutuya yazdığı harfleri alır ve hafızadaki 'kullaniciGirdisi' alanına kopyalar.", "gorsel": {"type": "image", "query": "reading text input field variable assignment"}}, {"baslik": "Label'a Veri Yazma Mantığı", "altbaslik": "Atama Operatörü (=) ile Yazdırma", "icerik": "Bir Label'ın üzerindeki yazıyı değiştirmek için = operatörü kullanılır:\n\nlblMesaj.Text = \"İşlem Tamamlandı!\";\n\nEşittir (=) işareti matematikteki eşitlik değildir! 'Sağdaki değeri al, soldaki kutunun içine yaz' anlamına gelen Atama Operatörüdür.", "gorsel": {"type": "image", "query": "assignment operator arrow data transfer programming"}}, {"baslik": "Metin Birleştirme (String Concatenation)", "altbaslik": "Metinleri '+' ile Uç Uca Eklemek", "icerik": "Metinlerde (string) artı (+) işareti matematiksel toplama yapmaz; kelimeleri yan yana yapıştırır.\n\nÖrnek:\nstring ad = txtAd.Text;\nlblSonuc.Text = \"Merhaba \" + ad + \", Hoş Geldiniz!\";\n\nKutuya 'Ali' yazılmışsa ekranda 'Merhaba Ali, Hoş Geldiniz!' çıkar.", "gorsel": {"type": "image", "query": "connecting puzzle pieces string concatenation words"}}, {"baslik": "Büyük Tuzak: Boşluk Bırakmayı Unutmak", "altbaslik": "Kelimelerin Birbirine Yapışması Hatası", "icerik": "Öğrencilerin en çok yaptığı hata:\n\nlblSonuc.Text = \"Merhaba\" + txtAd.Text; // HATA: 'MerhabaAli'\n\nC# otomatik boşluk bırakmaz! Kelimelerin arasına mutlaka tırnak içinde boşluk eklenmelidir:\n\nlblSonuc.Text = \"Merhaba \" + txtAd.Text; // DOĞRU: 'Merhaba Ali'", "gorsel": {"type": "image", "query": "spacing typography text layout words gap"}}, {"baslik": "Çok Satırlı Çıktı: Kaçış Karakteri \\n", "altbaslik": "Yazıyı Alt Satıra Geçirmek (Enter Etkisi)", "icerik": "Bir metin içinde alt satıra geçmek için '\\n' (New Line) özel sembolü kullanılır.\n\nÖrnek:\nlblBilgi.Text = \"Ad: Ali\" + \"\\n\" + \"Soyad: Can\";\n\nEkranda Çıktı:\nAd: Ali\nSoyad: Can", "gorsel": {"type": "image", "query": "new line enter key paragraph break typography"}}, {"baslik": "Metin Dönüşüm Fonksiyonları: ToUpper ve ToLower", "altbaslik": "Harf Büyüklüğünü Standartlaştırmak", "icerik": "- .ToUpper(): Tüm harfleri BÜYÜK harfe çevirir (Örn: \"ali\".ToUpper() -> \"ALİ\").\n- .ToLower(): Tüm harfleri küçük harfe çevirir (Örn: \"AHMET\".ToLower() -> \"ahmet\").\n- Kullanım: txtAd.Text.ToUpper() yazarak resmi evraklara uygun büyük harf elde edilir.", "gorsel": {"type": "image", "query": "uppercase lowercase letters text transformation"}}, {"baslik": "Daktiloculuğu Kıran 'Hata Dedektifi'", "altbaslik": "30 Saniyede 3 Hatayı Bulun!", "icerik": "Aşağıdaki hatalı kod satırını inceleyin:\n\nprivate void btnGonder_Click(object sender, EventArgs e)\n{\n    lblsonuc.text = \"Sayın \" + txtAd.Text\n}\n\nHatalar:\n1. lblsonuc -> lblSonuc (Küçük s hatası)\n2. .text -> .Text (Büyük harf duyarlılığı)\n3. Satır sonunda ; (noktalı virgül) eksik!", "gorsel": {"type": "image", "query": "detective magnifying glass error finding bug code"}}, {"baslik": "Günün Büyük Uygulaması: VIP Kongre Yaka Kartı", "altbaslik": "Senaryo ve Arayüz Planı", "icerik": "Senaryo: Uluslararası bir bilim kongresinde kayıt masasında çalışan görevlinin kullandığı yaka kartı otomasyonu.\n- Kullanıcı Ad, Soyad, Kurum ve Unvan bilgilerini girer.\n- 'Yaka Kartı Oluştur' butonuna tıklar.\n- Alttaki altın sarısı VIP panelde formatlı yaka kartı anında basılır.", "gorsel": {"type": "image", "query": "conference badge id card lanyard vip pass"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Girdi ve Çıktı Kontrolleri", "icerik": "Girdi Kutuları:\n- txtAd (Adınız)\n- txtSoyad (Soyadınız)\n- txtKurum (Çalıştığınız Üniversite / Kurum)\n- txtUnvan (Prof., Dr., Mühendis, Öğrenci)\n\nButon: btnKartOlustur ('🎫 Yaka Kartı Oluştur')\nÇıktı Alanı: lblYakaKarti (Geniş etiket, BorderStyle = FixedSingle)", "gorsel": {"type": "image", "query": "ui form controls layout badges conference"}}, {"baslik": "Uygulama Kodları (Adım Adım)", "altbaslik": "Verileri Birleştirip Kartı Oluşturmak", "icerik": "private void btnKartOlustur_Click(object sender, EventArgs e)\n{\n    // 1. Bilgileri oku ve birleştir\n    string tamAd = txtAd.Text.ToUpper() + \" \" + txtSoyad.Text.ToUpper();\n    string kurum = txtKurum.Text;\n    string unvan = txtUnvan.Text;\n\n    // 2. Yaka kartı metni rçek Yaşam Senaryosu", "icerik": "Banka veya e-ticaret siteleri binlerce müşteriye aynı anda şu metni üretir:\n'Sayın ' + musteriAdi + ', ' + siparisNo + ' nolu siparişiniz kargoya verildi.'\nString Concatenation (Metin Birleştirme) kurumsal CRM yazılımlarının temel motorudur.", "gorsel": {"type": "image", "query": "automated email notification template crm customer"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Metin Birleştirme", "icerik": "Soru: string a = \"20\"; string b = \"26\"; string c = a + b; kodunun çıktısı nedir?\n\nA) 46\nB) 2026\nC) 20 26\nD) Hata verir\n\nDoğru Cevap: B (Metinlerde '+' işlemi matematiksel toplama yapmaz, metinleri yan yana yapıştırır).", "gorsel": {"type": "image", "query": "quiz test examination correct answer code"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Kaçış Karakterleri", "icerik": "Soru: C# dilinde metin içinde bir alt satıra geçmeyi sağlayan kaçış sembolü hangisidir?\n\nA) \\t\nB) \\s\nC) \\n\nD) \\r\n\nDoğru Cevap: C (\\n - New Line sembolü imleci alt satıra taşır).", "gorsel": {"type": "image", "query": "multiple choice examination programming skills"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Odaklanma Metodu", "icerik": "Soru: Klavyedeki imleci doğrudan txtAd kutusuna taşımak için hangi metot çağrılır?\n\nA) txtAd.Select()\nB) txtAd.Focus()\nC) txtAd.Active()\nD) txtAd.Cursor()\n\nDoğru Cevap: B (.Focus() metodu giriş odağını o kontrole verir).", "gorsel": {"type": "image", "query": "cursor focus text field input quiz"}}, {"baslik": "Sınıf İçi Tartışma ve Mini Alıştırma", "altbaslik": "Tweet / Durum Mesajı Oluşturucu", "icerik": "Görev:\n- Formunuza Adınız ve Mesajınız için 2 TextBox ekleyin.\n- 'Paylaş' butonuna basınca alt etikette '@[Adiniz] diyor ki: [Mesajiniz]' formatında birleştirip gösterin.", "gorsel": {"type": "image", "query": "social media post card message bubble"}}, {"baslik": "Haftalık Kavram Sözlüğü", "altbaslik": "Bu Haftanın Anahtar Terimleri", "icerik": "- Event (Olay): Kullanıcının arayüzde yaptığı eylem (Tıklama, tuşa basma).\n- Event Handler (Olay İşleyici): Olay olunca çalışan C# metodu.\n- Concatenation: Metinlerin birbirine eklenmesi.\n- Escape Sequence (\\n): Kaçış dizisi / alt satır komutu.\n- Focus(): İmleci ilgili kutuya odaklama metodu.", "gorsel": {"type": "image", "query": "concept map glossary definitions terms"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- Girdi -> İşlem -> Çıktı veri akışını öğrendik.\n- TextBox'tan .Text ile veri okumayı ve Label'a atamayı kavradık.\n- Metin birleştirme (+), boşluk yönetimi ve '\\n' ile çok satırlı metin oluşturduk.\n- VIP Kongre Yaka Kartı projesiyle çalışan bir arayüz inşa ettik.", "gorsel": {"type": "image", "query": "summary roadmap knowledge learning complete"}}, {"baslik": "Kullanıcı Deneyimi (UX): Etiket Yerleşimi", "altbaslik": "Kutunun Üstü mü Yanı mı?", "icerik": "Form tasarımında etiketlerin kutuya göre konumu okunabilirliği belirler:\n- Sol Hizalama: Kutu açıklaması solda, kutu sağda (Giriş formları için standart).\n- Üst Hizalama: Mobilde veya dar panellerde etiketin kutunun üstünde olması.\nTutarlılık profesyonel kullanıcı deneyiminin birinci kuralıdır.", "gorsel": {"type": "image", "query": "ux ui label alignment form design usability"}}, {"baslik": "Performans İpucu: String Bellek Yönetimi", "altbaslik": "Arka Planda Neler Oluyor?", "icerik": "C# dilinde string veri tipi 'immutable' (değiştirilemez) yapıdadır.\n- İki metni '+' ile her birleştirdiğinizde RAM'de yepyeni bir metin alanı açılır.\n- Basit form uygulamalarında bu fark edilmez; ancak milyonlarca veride StringBuilder sınıfı tercih edilir.", "gorsel": {"type": "image", "query": "memory allocation string immutable csharp"}}, {"baslik": "Kullanıcı Deneyimi (UX): Etiket Yerleşimi", "altbaslik": "Kutunun Üstü mü Yanı mı?", "icerik": "Form tasarımında etiketlerin kutuya göre konumu okunabilirliği belirler:\n- Sol Hizalama: Kutu açıklaması solda, kutu sağda (Giriş formları için standart).\n- Üst Hizalama: Mobilde veya dar panellerde etiketin kutunun üstünde olması.\nTutarlılık profesyonel kullanıcı deneyiminin birinci kuralıdır.", "gorsel": {"type": "image", "query": "ux ui label alignment form design usability"}}, {"baslik": "Performans İpucu: String Bellek Yönetimi", "altbaslik": "Arka Planda Neler Oluyor?", "icerik": "C# dilinde string veri tipi 'immutable' (değiştirilemez) yapıdadır.\n- İki metni '+' ile her birleştirdiğinizde RAM'de yepyeni bir metin alanı açılır.\n- Basit form uygulamalarında bu fark edilmez; ancak milyonlarca veride StringBuilder sınıfı tercih edilir.", "gorsel": {"type": "image", "query": "memory allocation string immutable csharp"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'txtSehir kutusundaki metni okuyup \"Gidilecek Şehir: ANKARA\" şeklinde ekrana basan tek satırlık C# kodunu yazınız.'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 4: Bilgiyi Saklamak: Değişkenler ve string Tipi", "icerik": "Gelecek Hafta Neler Yapacağız?\n- Bilgisayar hafızası (RAM) nasıl çalışır?\n- Değişken kavramı ve 'Etiketli Ayakkabı Kutusu' analojisi.\n- Değişken tanımlama, değer atama ve temiz kod kuralları (CamelCase).\n- E-Ticaret Kargo Teslimat Fişi projesini geliştireceğiz.", "gorsel": {"type": "image", "query": "memory ram computer storage preview next week"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
