<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Görsel Programlama - Hafta 01 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #4f46e5;
            --accent-glow: #4f46e525;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

lleri barındırır.\n- Common Controls sekmesi en çok kullanacağımız temel kontrolleri içerir:\n  * Button (Düğme)\n  * Label (Yazı / Etiket)\n  * TextBox (Metin Giriş Kutusu)\n- Kullanım: Kontrolü fareyle tutup form üzerine sürükleyip bırakmanız yeterlidir.", "gorsel": {"type": "image", "query": "toolbox toolbox interface components software design"}}, {"baslik": "Panel 2: Properties (Özellikler Penceresi)", "altbaslik": "Kontrollerin Kimlik ve Görünüm Kartı", "icerik": "Form üzerinde hangi nesneye tıklarsanız, Properties paneli o nesnenin ayarlarını gösterir.\n- Text: Nesnenin üzerinde ekranda görünen yazı.\n- BackColor: Arka plan rengi.\n- ForeColor: Yazı rengi.\n- Font: Yazı tipi, kalınlığı ve boyutu (pt).\n- Size: Genişlik ve yükseklik piksel ölçüsü.", "gorsel": {"type": "image", "query": "software properties settings attributes panel inspector"}}, {"baslik": "Panel 3: Solution Explorer (Çözüm Gezgini)", "altbaslik": "Projenin Dosya Haritası", "icerik": "Projemizi oluşturan tüm parçaların listelendiği klasör yapısıdır:\n- Form1.cs: Görsel tasarım ve arkasındaki C# kodunu barındırır.\n- Program.cs: Programın ana çalışma giriş noktasıdır.\n- References: Projenin kullandığı sistem kütüphanelerini listeler.", "gorsel": {"type": "image", "query": "file tree directory explorer folder structure project"}}, {"baslik": "Tasarım ve Kod Ekranları Arasındaki Geçiş", "altbaslik": "Yazılımın Ön Yüzü ve Arka Yüzü", "icerik": "Görsel programlamada her form iki ayrı sayfadan oluşur:\n1. Form1.cs [Design] (Tasarım Ekranı): Sürükle-bırak yaptığımız görsel sahne.\n2. Form1.cs (Kod Ekranı): Butona tıklandığında çalışacak mantık kodlarının yazıldığı sayfa.\n\nHızlı Geçiş Kısayolu:\n- Klavyeden F7 tuşuna basarak Tasarımdan Koda, Shift + F7 ile Koda geçebilirsiniz.", "gorsel": {"type": "image", "query": "code editor screen and ui design mockup transition"}}, {"baslik": "Form Üzerine İlk Bileşenleri Ekleme", "altbaslik": "Button ve Label ile Tanışma", "icerik": "İlk uygulamamız için form  Tıkla!' butonuna fareyle ÇİFT TIKLAYIN.\n- Visual Studio otomatik olarak kod sayfasına geçecek ve şu bloğu açacaktır:\n\nprivate void button1_Click(object sender, EventArgs e)\n{\n    // İmleç buraya odaklanır\n}\n\nBu iki süslü parantez { } butona tıklandığında çalışacak çalışma odasıdır.", "gorsel": {"type": "image", "query": "double click action creating event handler in csharp"}}, {"baslik": "İlk C# Kod Satırımız", "altbaslik": "Ekrana Yazı Yazdırmak", "icerik": "Süslü parantezlerin arasına aşağıdaki tek satırı yazıyoruz:\n\nlabel1.Text = \"Merhaba Dünya! Kodlama Başladı.\";\n\nKodun Anlamı:\n- label1: Değiştirmek istediğimiz etiketin adı.\n- .Text: Etiketin görünen yazısı.\n- = : Sağdaki metni soldaki özelliğin içine aktar.\n- ; : Komutun bittiğini bildirir.", "gorsel": {"type": "image", "query": "csharp code line label text hello world assignment"}}, {"baslik": "Büyük/Küçük Harf Duyarlılığı (Case-Sensitivity)", "altbaslik": "C# Dilinin En Katı Kuralı", "icerik": "C# dili büyük ve küçük harfleri tamamen farklı kelimeler olarak görür:\n- label1.Text -> DOĞRU (Çalışır)\n- label1.text -> HATALI (Derleyici tanımaz ve kırmızı çizer)\n- Label1.Text -> HATALI (Kontrol adı küçük 'l' ile başlıyorsa tanımaz)\n\nKural: Özellik isimleri her zaman Büyük Harfle başlar (.Text, .Font, .BackColor).", "gorsel": {"type": "image", "query": "case sensitivity uppercase lowercase typography code error"}}, {"baslik": "Programı Çalıştırma ve İlk Zafer!", "altbaslik": "F5 Tuşu ve Start Butonu", "icerik": "1. Üst araç çubuğundaki yeşil 'Start' butonuna veya klavyeden F5 tuşuna basın.\n2. Visual Studio projenizi derler ve gerçek bir Windows penceresi olarak ekrana getirir.\n3. 'Bana Tıkla!' butonuna tıklayın.\n4. Label yazısının anında 'Merhaba Dünya! Kodlama Başladı.' olarak değiştiğini gözlemleyin!", "gorsel": {"type": "image", "query": "green start button compiling running first csharp application"}}, {"baslik": "Daktiloculuğu Önleme: PRIMM Modeli", "altbaslik": "Kopyalamayı Bırak, Tahmin Et ve Değiştir!", "icerik": "Sadece hocanın yazdığını aynen kopyalamak (daktiloculuk) öğrenmeyi engeller.\nŞimdi kodu inceleyip kendi isteğimize göre değiştireceğiz:\n- Adım 1 (Tahmin Et): 'Merhaba Dünya' yerine kendi adınızı yazarsanız ne olur?\n- Adım 2 (Değiştir): Metni 'Merhaba, Ben [Adınız] - Bilgisayar Programcısıyım' yapın.\n- Adım 3 (Test Et): F5 ile çalıştırıp sonucu görün.", "gorsel": {"type": "image", "query": "students experimenting modifying code learning actively"}}, {"baslik": "Kodla Renk Değiştirmek", "altbaslik": "Form ve Yazı Renklerine Hükmetme", "icerik": "Butona tıklandığında sadece yazı değil, renkler de değişebilir!\nKod satırımızın hemen altına şu satırları ekleyin:\n\nlabel1.ForeColor = Color.Red; // Yazı rengini kırmızı yapar\nthis.BackColor = Color.LightGreen; // Pencerenin arka planını yeşil yapar\n\n'this' kelimesi o an açık olan Form penceresini temsil eder.", "gorsel": {"type": "image", "query": "color palette changing background dynamically in software"}}, {"baslik": "Günün Büyük Uygulaması: Sihirli Ruh Hali Paneli", "altbaslik": "Uygulama Senaryosu ve Form Mimarisi", "icerik": "Senaryo: Kullanıcı o anki ruh haline göre 3 farklı butondan birine tıklar. Tıklanan butona göre ekrandaki mesaj ve formun rengi tamamen değişir.\n\nForm Bileşenleri:\n- 3 Adet Buton: btnMutlu ('Mutlu'), btnYorgun ('Yorgun'), btnAc ('Açım')\n- 1 Adet Büyük Label: lblMesaj (16pt Kalın, Ekranın merkezinde)", "gorsel": {"type": "image", "query": "mood selector emoticons smiling tired hungry user interface"}}, {"baslik": "Uygulama Kodları: Adım Adım", "altbaslik": "Ruh Hali Butonlarının Olay Metotları", "icerik": "private void btnMutlu_Click(object sender, EventArgs e)\n{\n    lblMesaj.Text = \"Harika bir gün! Kodlamayı öğreniyorum!\";\n    this.BackColor = Color.LightGreen;\n}\n\nprivate void btnYorgun_Click(object sender, EventArgs e)\n{\n    lblMesaj.Text = \"Bir fincan sıcak kahve molası iyi gelir! ☕\";\n    this.BackColor = Color.LightYellow;\n}\n\nprivate void btnAc_Click(object sender, EventArgs e)\n{\n    lblMesaj.Text = \"Ders biter bitmez kantine koşuyoruz! 🍔\";\n    this.BackColor = Color.LightCoral;\n}", "gorsel": {"type": "image", "query": "csharp event handler code snippet color change"}}, {"baslik": "Sık Karşılaşılan Hatalar ve Dedektiflik", "altbaslik": "Kırmızı Dalgalı Çizgiler Ne Anlatır?", "icerik": "1. Noktalı virgül (;) unutulması: Satırın sonunda ; yoksa kod asla derlenmez.\n2. Tırnak işaretlerinin eksik olması: Metinler daima \" \" çift tırnak arasında olmalıdır.\n3. Yanlış harf kullanımı: .text yerine .Text yazılmalıdır.\n4. Kırmızı çizgi görünce panik yapmayın; farenizi kırmızı çizginin üzerine getirip hata mesajını okuyun.", "gorsel": {"type": "image", "query": "debugging compiler error squiggly red line visual studio"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Temel Paneller", "icerik": "Soru: Form üzerine yeni bir buton eklemek için hangi Visual Studio paneli kullanılır?\n\nA) Solution Explorer\nB) Properties\nC) Toolbox\nD) Output\n\nDoğru Cevap: C (Toolbox / Araç Kutusu tüm görsel bileşenleri barındırır).", "gorsel": {"type": "image", "query": "multiple choice quiz question exam education"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "C# Sentaks Kuralları", "icerik": "Soru: Bir Label nesnesinin üzerindeki yazıyı değiştiren DOĞRU C# satırı hangisidir?\n\nA) label1.text = \"Merhaba\";\nB) label1.Text = \"Merhaba\";\nC) Label1.Text = Merhaba;\nD) label1.Text : \"Merhaba\"\n\nDoğru Cevap: B (.Text büyük harfle yazılır, metin tırnak içinde verilir ve satır sonuna ; konur).", "gorsel": {"type": "image", "query": "coding quiz choice correct answer programming concept"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Başardık?", "icerik": "- Visual Studio IDE ortamını ve 3 ana paneli (Toolbox, Properties, Solution Explorer) tanıdık.\n- Tasarım ekranı ile Kod sayfası arasındaki geçişi (F7) öğrendik.\n- Klavyede programlama için gerekli özel sembolleri ({ }, ;, \") refleks haline getirdik.\n- Buton tıklama olayını (Click) yakalayıp Label metnini ve form renklerini dinamik olarak değiştirdik.", "gorsel": {"type": "image", "query": "weekly summary achievement checklist target met software"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 2: Temel Kontroller (Button, Label, TextBox) ve Özellikler", "icerik": "Gelecek Hafta Neler Yapacağız?\n- Kullanıcıdan klavye ile yazı ve şifre almamızı sağlayan TextBox kontrolü.\n- Name (Kimlik) ile Text (Tabela) arasındaki hayati fark.\n- Şifre gizleme (*), kutu kilitleme (Enabled) ve şık form tasarımları.\n- 'Gizli Ajan Giriş Kartı' projesini geliştireceğiz.", "gorsel": {"type": "image", "query": "login screen password security ui next week preview"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
