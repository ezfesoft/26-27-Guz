<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: #6366f140;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

sa Yol Atama Operatörleri", "altbaslik": "Yazılımcı Kısayolları", "icerik": "- sayac++ : sayacı 1 artır (sayac = sayac + 1)\n- sayac-- : sayacı 1 azalt (sayac = sayac - 1)\n- toplam += 5 : toplama 5 ekle (toplam = toplam + 5)\n- bakiye -= 20 : bakiyeden 20 düş (bakiye = bakiye - 20)\n- fiyat *= 2 : fiyatı ikiye katla", "gorsel": {"type": "image", "query": "increment decrement arithmetic shortcuts keyboard"}}, {"baslik": "Sayıyı Ekrana Yazdırma Köprüsü: .ToString()", "altbaslik": "Sayısal Değeri Metne Çevirmek", "icerik": "Label.Text sadece string (metin) kabul eder. Sayıyı doğrudan Label.Text'e veremezsiniz!\n\nint toplam = 150;\n// lblSonuc.Text = toplam; // HATA! Sayıyı metin kutusuna doğrudan koyamazsınız.\nlblSonuc.Text = toplam.ToString(); // DOĞRU! .ToString() köprü görevi görür.", "gorsel": {"type": "image", "query": "bridge connecting data types integer to string"}}, {"baslik": "Daktiloculuğu Önleyen 'Hesap Tahmini'", "altbaslik": "Bu Kod Ekranda Ne Yazar?", "icerik": "Aşağıdaki kod parçasını inceleyin:\n\nint cay = 3;\nint fiyat = 15;\nint toplam = cay * fiyat;\nlblHesap.Text = \"Ödenecek: \" + toplam + \" TL\";\n\nSoru: '+' işareti burada ne yaptı?\nCevap: C#, metin ile sayıyı '+' ile bağlarken sayıyı otomatik metne çevirip yan yana yapıştırır.", "gorsel": {"type": "image", "query": "receipt calculation tea coffee price tag"}}, {"baslik": "Günün Büyük Uygulaması: Kampüs Kantini Hızlı Adisyon", "altbaslik": "Senaryo ve Arayüz Tasarımı", "icerik": "Senaryo: Üniversite kantininde garsonun kullandığı hızlı adisyon hesabı.\n- Sipariş: Çay (10 TL), Kaşarlı Tost (60 TL), Şişe Su (10 TL).\n- Kullanıcı adetleri belirler, masa kişi sayısını girer.\n- 'Hesapla' butonuna basılınca Toplam Tutar ve Kişi Başı Ödenecek Pay hesaplanır.", "gorsel": {"type": "image", "query": "campus cafe bistro pos terminal receipt bill"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Kontrol Listesi", "icerik": "Sipariş Girdileri:\n- txtCayAdet (Çay Adedi)\n- txtTostAdet (Tost Adedi  "1. 0'a Bölme Hatası (DivideByZeroException): Bir sayıyı asla 0'a bölemezsiniz!\n2. Taşma (Overflow): int tipine 3 milyar yazarsanız sayı taşar ve eksiye döner.\n3. Parantez hatası: Ortalama alırken parantezi unutmak (vize + final / 2 -> önce finali 2'ye böler!).", "gorsel": {"type": "image", "query": "divide by zero error warning calculator"}}, {"baslik": "Sektörel Vaka: Market Barkod Terazisi", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Manav reyonundaki akıllı terazi:\n- Ağırlık = 1.450 kg (double)\n- Birim Fiyat = 35.00 TL (double)\n- Tutar = 1.450 * 35.00 = 50.75 TL\nBarkod terazilerinde ondalıklı dört işlem mekanizması tam olarak bu kodla çalışır.", "gorsel": {"type": "image", "query": "barcode scale grocery supermarket weight calculation"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "İşlem Önceliği", "icerik": "Soru: int x = 20 - 4 * 2 + 6 / 2; ifadesinin sonucu kaçtır?\n\nA) 19\nB) 15\nC) 21\nD) 27\n\nDoğru Cevap: B (Önce çarpma 4*2=8 ve bölme 6/2=3 yapılır. 20 - 8 + 3 = 15).", "gorsel": {"type": "image", "query": "quiz question math exam chalkboard"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Sayı Dönüştürme", "icerik": "Soru: Sayısal bir değişkeni Label kontrolüne yazdırmak için hangi metot kullanılır?\n\nA) .ToNumber()\nB) .ToString()\nC) .ToText()\nD) .Convert()\n\nDoğru Cevap: B (.ToString() metodu herhangi bir sayısal değeri metne çevirir).", "gorsel": {"type": "image", "query": "multiple choice question programming test"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Mod Operatörü", "icerik": "Soru: 25 % 4 işleminin sonucu kaçtır?\n\nA) 6\nB) 1\nC) 0\nD) 4\n\nDoğru Cevap: B (25'i 4'e böldüğümüzde bölüm 6, kalan 1 olur).", "gorsel": {"type": "image", "query": "math remainder modulo arithmetic question"}}, {"baslik": "Sınıf İçi Tartışma ve Mini Alıştırma", "altbaslik": "Taksi Taksimetre Hesabı", "icerik": "Görev:\n- Açılış Ücreti (25 TL) ve Kilometre Başı Ücret (18 TL) sabitlerini belirleyin.\n- Gidilen km (örn: 12.5) için toplam taksimetre tutarını hesaplayıp ekrana yazdırın.", "gorsel": {"type": "image", "query": "taxi taximeter digital receipt calculation"}}, {"baslik": "Haftalık Kavram Sözlüğü", "altbaslik": "Bu Haftanın Anahtar Terimleri", "icerik": "- int: 32-bit tam sayı veri tipi.\n- double: 64-bit ondalıklı sayı veri tipi.\n- Operator Precedence: İşlem önceliği sırası.\n- Integer Division: Tamsayı bölmesinde küsuratın kaybolması.\n- ToString(): Sayıyı görsel metne çeviren köprü metot.", "gorsel": {"type": "image", "query": "concept map glossary definitions terms"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- int ve double veri tiplerinin sınırlarını ve kullanım alanlarını öğrendik.\n- 4 İşlem, Mod alma (%) ve işlem önceliği kurallarını inceledik.\n- Tamsayı bölmesi tuzağını ve (double) casting çözümünü kavradık.\n- .ToString() ile sayıları görsel ekrana aktararak kantin adisyonunu tamamladık.", "gorsel": {"type": "image", "query": "weekly summary success mathematics programming"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'int a = 15; int b = 2; double c = (double)a / b; satırında c değişkeninin değeri ne olur?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 6: Veri Dönüşümü ve try-catch Güvenliği", "icerik": "Gelecek Hafta Neler Yapacağız?\n- TextBox'a girilen sayıları Convert.ToInt32() ile dinamik okuma.\n- Kullanıcı harf girerse program neden çöker?\n- Hava yastığı ve güvenlik zırhı: try-catch blokları.\n- Çökmez Vize-Final Ortalama Hesaplayıcı projesini geliştireceğiz.", "gorsel": {"type": "image", "query": "safety shield error handling preview next week"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
