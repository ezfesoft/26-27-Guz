<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: #6366f140;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 6", "altbaslik": "Tip Dönüşümleri (Convert, Parse) ve try-catch Güvenliği", "icerik": "Program: Bilgisayar Programcılığı\nModül: Savunmacı Programlama (Defensive Coding)\nHaftalık Odak: Convert Sınıfı, FormatException, try-catch, MessageBox.Show()\nHedef: Kullanıcı ne yazarsa yazsın asla çökmeyen zırhlı uygulamalar geliştirmek.", "gorsel": {"type": "image", "query": "shield security error handling software crash prevention"}}, {"baslik": "Neden Tip Dönüşümü Zorunludur?", "altbaslik": "Sektörel Bağlam: TextBox Metin Zarfıdır", "icerik": "TextBox kontrolünün .Text özelliği daima string (metin) tipindedir.\n- Kullanıcı kutuya '50' yazsa dahi C# bunu sayı olarak görmez, '50' yazısı olarak görür.\n- '50' + '20' işlemi 70 değil '5020' yapar!\n- Matematik yapabilmek için o metin zarfını açıp içindeki gerçek sayıyı çıkarmak (Convert) şarttır.", "gorsel": {"type": "image", "query": "text to number conversion data type casting"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. TextBox içeriğini Convert.ToInt32() ve Convert.ToDouble() ile sayıya dönüştürür.\n2. Çalışma zamanı hatalarını (FormatException) ve nedenlerini açıklar.\n3. Savunmacı Programlama (Defensive Programming) felsefesini uygular.\n4. try-catch blokları ile programın çökmesini engeller.\n5. 'Çökmez Vize-Final Ortalama Hesaplayıcı' projesini tamamlar.", "gorsel": {"type": "image", "query": "learning targets goals robust software programming"}}, {"baslik": "Convert Sınıfı ile Tip Dönüşümü", "altbaslik": "Metinleri Sayıya Çeviren Veznedar", "icerik": "C#'ta en popüler ve güvenli dönüşüm Convert sınıfıdır:\n\n1. Tam Sayıya Çevirme:\nint vize = Convert.ToInt32(txtVize.Text);\n\n2. Ondalıklı Sayıya Çevirme:\ndouble fiyat = Convert.ToDouble(txtFiyat.Text);", "gorsel": {"type": "image", "query": "data conversion mechanism code block syntax"}}, {"baslik": "Parse Metotları ile Dönüşüm", "altbaslik": "Tipin Kendi İç Dönüşüm Yeteneği", "icerik": "Doğrudan hedef tipin Parse metodu da kullanılabilir:\n- int sayi = int.Parse(txtSayi.Text);\n- double tutar = double.Parse(txtTutar.Text);\nConvert sınıfı arka planda Parse metodunu çağırır. Convert, null (boş) değerlerde hata vermek yerine 0 döndürdüğü için daha güvenlidir.", "gorsel": {"type": "image", "query": "parsing data type conversion methods csharp"}}, {"baslik": "Programlar Neden Çöker? (Crash & Exception)", "altbaslik": "Kullanıcı Hataları ve FormatException", "icerik": "Kullanıcı sayı beklenen kutuya:\n- Harf yazarsa ('kırk beş')\n- Boş bırakıp butona basarsa\n- Yanlış sembol girerse\nConvert metodu bu metni sayıya çeviremez ve sistem FormatException fırlatarak ÇÖKER.", "gorsel": {"type": "image", "query": "software crash bug error dialog window"}}, {"baslik": "Savunmacı Programlama (Defensive Programming)", "altbaslik": "Kullanıcıya Asla Güvenme!", "icerik": "Yazılım dünyasının 1 numaralı kuralı:\n'Kullanıcılar her zaman en beklenmedik, hatalı ve garip verileri girecektir.'\n- İyi bir yazılımcı kullanıcının hata yapacağını önceden tahmin eder ve programın etrafına güvenlik kalkanı kurar.", "gorsel": {"type": "image", "query": "cyber security defensive shield armor software"}}, {"baslik": "Güvenlik Ağı: try-catch Mimarisi", "altbaslik": "Çöküşü Engelleyen Hava Yastığı", "icerik": "try\n{\n    // RİSKLİ BÖLGE: Hata verme ihtimali olan kodlar buraya yazılır.\n}\ncatch\n{\n    // GÜVENLİK FİLESİ: Hata olursa burası çalışır ve program ÇÖKMEZ!\n}", "gorsel": {"type": "image", "query": "trapeze circus safety net catching acrobats concept"}}, {"baslik": "Somut Analoji: Sirk Cambazı ve Güvenlik Filesi", "altbaslik": "try-catch'i Zihinde Canlandırmak", "icerik": "- try { ... } bloğu: Cambazın ip üzerinde yürüdüğü alandır. Başarıyla geçerse gösteri biter (catch atlanır).\n- catch { ... } bloğu: Cambazın ayağı kayarsa (hata olursa) yere çakılmasını önleyen güvenlik filesidir. Program ölmez, yumuşakça fileye düşer.", "gorsel": {"type": "image", "query": "circus acrobat safety net protection concept"}}, {"baslik": "try-catch Çalışma Akış Şeması", "altbaslik": "Hata Olduğunda ve Olmadığında Akış", "icerik": "1. Normal Akış (Hata Yok):\n   try içi çalışır -> catch ATLANIR -> Program sonraki satırlardan devam eder.\n2. Hatalı Akış (Hata Oluştu):\n   try içinde hata olan satırda durulur -> Anında catch içine sıçranır -> catch kodları biter -> Program devam eder.", "gorsel": {"type": "image", "query": "try catch flowchart decision branch diagram"}}, {"baslik": "Kullanıcıyı Uyarmak: MessageBox.Show()", "altbaslik": "Açılır Mesaj Pencereleri", "icerik": "Kullanıcıya profesyonel uyarı penceresi göstermek için:\n\nMessageBox.Show(\"Lütfen sadece sayı giriniz!\", \"Hatalı Giriş\", MessageBoxButtons.OK, MessageBoxIcon.Warning);\n\nParametreler:\n1. Mesaj Metni\n2. Pencere Başlığı\n3. Buton Tipi (OK)\n4. İkon Tipi (Warning, Error, Information)", "gorsel": {"type": "image", "query": "message box pop up dialog alert notification"}}, {"baslik": "Daktiloculuğu Önleyen 'Çökertme Yarışı'", "altbaslik": "Kodu Bilerek Boz ve Zırhla Koru", "icerik": "Atölye Çalışması:\n1. try-catch olmadan 2 sayıyı toplayan bir buton yazın.\n2. Kutuları boş bırakıp butona basın. Programın patladığını izleyin.\n3. Şimdi aynı kodu try { } catch { } içine alın ve tekrar boş bırakın. Programın çökmek yerine kibarca uyarı verdiğini görün!", "gorsel": {"type": "image", "query": "hands testing debugging error handling visual studio"}}, {"baslik": "Günün Büyük Uygulaması: Çökmez Vize-Final Hesaplayıcı", "altbaslik": "Senaryo ve Arayüz Tasarımı", "icerik": "Senaryo: Üniversite öğrenci işleri not hesaplama modülü.\n- Kullanıcı Vize Notu (%40) ve Final Notu (%60) girer.\n- 'Hesapla' butonuna basar.\n- Ağırlıklı ortalama hesaplanır. Hatalı veya boş girişte sistem asla çökmez, kullanıcıyı uyarır.", "gorsel": {"type": "image", "query": "student exam score grade calculation university"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Girdi ve Çıktı Kontrolleri", "icerik": "Girdiler:\n- txtVize (Vize Notu)\n- txtFinal (Final Notu)\n\nButon: btnHesapla ('📊 Ortalama Hesapla')\nÇıktı Alanı: lblOrtalama (16pt Bold, Renkli Etiket)", "gorsel": {"type": "image", "query": "grade calculator form layout user interface"}}, {"baslik": "Uygulama Kodları (Tam Çözüm)", "altbaslik": "Zırhlı Not Hesaplama Kodu", "icerik": "private void btnHesapla_Click(object sender, EventArgs e)\n{\n    try\n    {\n        // 1. Dönüştürme ve Okuma (Riskli Bölge)\n        double vize = Convert.ToDouble(txtVize.Text);\n        double final = Convert.ToDouble(txtFinal.Text);\n\n        // 2. Ağırlıklı Ortalama Hesabı\n        double ortalama = (vize * 0.40) + (final * 0.60);\n\n        // 3. Sonucu Yazdırma\n        lblOrtalama.Text = \"Ortalamanız: \" + ortalama.ToString(\"0.00\");\n        lblOrtalama.ForeColor = Color.DarkGreen;\n    }\n    catch\n    {\n        // Güvenlik Filesi: Hata Yakalama\n        MessageBox.Show(\"Lütfen not alanlarına geçerli sayısal değerler giriniz!\", \n                        \"Geçersiz Giriş\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n        lblOrtalama.Text = \"Hesaplanamadı!\";\n        lblOrtalama.ForeColor = Color.Red;\n    }\n}", "gorsel": {"type": "image", "query": "csharp code defensive error handling try catch"}}, {"baslik": "Bölgesel Ayarlar (Localization): Virgül vs Nokta", "altbaslik": "Windows Dil Ayarlarının Etkisi", "icerik": "- Türkçe Windows: Ondalık ayıracı olarak virgül (,) kabul eder (Örn: 45,5).\n- İngilizce Windows: Ondalık ayıracı olarak nokta (.) kabul eder (Örn: 45.5).\n- Kullanıcı Türkçe Windows'ta nokta girerse FormatException fırlatılabilir; try-catch bu sorunu da zarifçe yakalar.", "gorsel": {"type": "image", "query": "localization globe language regional settings currency"}}, {"baslik": "Sık Yapılan Hata Yönetimi Kusurları", "altbaslik": "Tüm Kodu try Bloğuna Doldurmak", "icerik": "1. Gereksiz geniş try blokları: Sadece riskli veri dönüşümleri try içi + yas;\n}\nelse\n{\n    MessageBox.Show(\"Lütfen geçerli bir sayı giriniz!\");\n}", "gorsel": {"type": "image", "query": "tryparse safe data validation code logic"}}, {"baslik": "finally Bloğu Nedir?", "altbaslik": "Her Koşulda Kesinlikle Çalışan Kod", "icerik": "try-catch yapısına isteğe bağlı olarak 'finally' eklenebilir:\n\ntry { ... }\ncatch { ... }\nfinally\n{\n    // Hata olsa da olmasa da EN SONDA MUTLAKA çalışır!\n    txtGiris.Clear();\n}\nGenellikle bağlantıları kapatmak ve temizlik yapmak için kullanılır.", "gorsel": {"type": "image", "query": "finally block cleanup execution flowchart"}}, {"baslik": "Kullanıcı Deneyimi: Hatalı Kutuyu Boyamak", "altbaslik": "Görsel Hata Bildirimi", "icerik": "catch bloğu içine kutunun rengini değiştiren kodlar eklenebilir:\n\ncatch\n{\n    txtSayi.BackColor = Color.MistyRose; // Kutuyu pembe/kırmızı yap\n    lblUyari.Text = \"Lütfen bu alanı doldurunuz!\";\n    txtSayi.Focus();\n}\nBu yöntem kullanıcının hangi kutuda hata yaptığını anında görmesini sağlar.", "gorsel": {"type": "image", "query": "form validation error red highlight input field"}}, {"baslik": "Çoklu catch Blokları", "altbaslik": "Hatanın Türüne Göre Farklı Tepki", "icerik": "Farklı hata türlerini ayrı ayrı yakalayabilirsiniz:\n\ntry { ... }\ncatch (FormatException) { MessageBox.Show(\"Harf girmeyiniz!\"); }\ncatch (OverflowException) { MessageBox.Show(\"Sayı çok büyük!\"); }\ncatch (Exception ex) { MessageBox.Show(\"Bilinmeyen hata: \" + ex.Message); }", "gorsel": {"type": "image", "query": "multiple catch blocks exception hierarchy"}}, {"baslik": "Sektörel Vaka: ATM Kart Şifre Denemesi", "altbaslik": "Güvenli Tip Doğrulama", "icerik": "Banka ATM'sinde 4 haneli PIN kodu okunurken:\n- Convert / TryParse ile rakam kontrolü yapılır.\n- Sayısal olmayan tüm girişler kartın güvenliği için bloke edilir.\nDefensive programming finans dünyasının vazgeçilmezidir.", "gorsel": {"type": "image", "query": "atm pin pad keypad entry banking security"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Convert.ToDouble(\"abc\") kodu çalıştığında try-catch bloğu yoksa ne olur, try-catch varsa ne olur?'\n\nCevabınızı 2 cümleyle kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 7: Vize Tekrarı ve Bütünleşik Proje", "icerik": "Gelecek Hafta Neler Yapacağız?\n- İlk 6 haftanın büyük özeti ve vize hazırlık soruları.\n- Sayısal formatlama: .ToString(\"0.00\") ve Para Birimi .ToString(\"C\").\n- Akaryakıt Pompası ve Kasa Fişi ticari otomasyonunu geliştireceğiz.", "gorsel": {"type": "image", "query": "exam review summary gas station pos preview"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
