<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Görsel Programlama - Hafta 14 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #4f46e5;
            --accent-glow: #4f46e525;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 14", "altbaslik": "Büyük Final: Bütünleşik Öğrenci Not Kayıt ve İstatistik Sistemi", "icerik": "Program: Bilgisayar Programcılığı\nModül: Kurumsal Masaüstü Yazılım Mimarisi\nHaftalık Odak: Paralel Diziler (Parallel Arrays), CRUD Mantığı, Sınıf İstatistikleri\nHedef: 14 haftanın tüm becerilerini birleştiren tam teşekküllü bir masaüstü yazılımı üretmek.", "gorsel": {"type": "image", "query": "graduation success student management system final project"}}, {"baslik": "14 Haftalık Yolculuğun Zirvesi", "altbaslik": "Mezuniyet Motivasyonu", "icerik": "14 hafta önce belki klavyede süslü parantez {} bulmakta zorlanıyordunuz.\nBugün ise:\n- Arayüz tasarlayan,\n- Kullanıcı hatalarını zırhla yakalayan (try-catch),\n- Kararlar veren (if-else),\n- Döngülerle binlerce işlemi saniyede yapan (for/while),\n- Verileri dizilerde saklayıp istatistik çıkaran gerçek bir YAZILIMCISINIZ!", "gorsel": {"type": "image", "query": "students celebrating success graduation achievement"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Büyük Projede Neler Başaracaksınız?", "icerik": "1. 14 haftanın tüm temel kavramlarını tek bir projede hatasız entegre eder.\n2. Paralel Diziler (Parallel Arrays) mimarisini kurar ve yönetir.\n3. Veri Ekleme (Create) ve Veri Listeleme (Read) süreçlerini kodlar.\n4. Ağırlıklı ortalama, harf notu baremi ve sınıf istatistiklerini hesaplar.\n5. 'Giresun MYO Öğrenci Not Otomasyonu' kurumsal masaüstü yazılımını üretir.", "gorsel": {"type": "image", "query": "goals milestones capstone project architecture"}}, {"baslik": "Sistem Mimarisi: Paralel Diziler (Parallel Arrays)", "altbaslik": "İlişkili Verileri Aynı İndekste Tutmak", "icerik": "Veritabanı olmadan aynı öğrencinin tüm bilgilerini senkronize saklamak için Paralel Diziler kullanılır:\n- ogrenciAdlari[i] -> Öğrencinin Adı\n- vizeler[i] -> Vize Notu\n- finaller[i] -> Final Notu\n- ortalamalar[i] -> Ortalaması\n- harfNotlari[i] -> Harf Notu\nHerkesin bilgisi aynı 'i' indeks numarasında eşleşir.", "gorsel": {"type": "image", "query": "parallel arrays database table spreadsheet structure"}}, {"baslik": "CRUD Kavramı ve Projedeki Yeri", "altbaslik": "Yazılım Dünyasının Temel 4 İşlemi", "icerik": "- Create (Ekleme): Yeni öğrenci kaydını dizilere eklemek (btnEkle).\n- Read (Okuma/Listeleme): Kayıtlı tüm öğrencileri formatlı listelemek (btnListele).\n- Update (Güncelleme): Mevcut kaydı değiştirmek.\n- Delete (Silme): Kaydı listeden kaldırmak.\nBu projede sistemin omurgası olan Create ve Read işlemlerine odaklanıyoruz.", "gorsel": {"type": "image", "query": "CRUD operations database management data lifecycle"}}, {"baslik": "Büyük Proje: Giresun MYO Öğrenci Not Otomasyonu", "altbaslik": "Senaryo ve İş Kuralları", "icerik": "İş Kuralları:\n1. Kontenjan: En fazla 50 öğrenci.\n2. Not Kontrolü: 0 ile 100 arası geçerli not zorunluluğu.\n3. Ağırlık: %40 Vize + %60 Final.\n4. Harf Baremi: >=90 AA, >=80 BA, >=70 BB, >=60 CB, >=50 CC, <50 FF (Kaldı).\n5. İstatistik: Sınıf Genel Ortalaması, Toplam Öğrenci ve Kalan Sayısı.", "gorsel": {"type": "image", "query": "university grade record dashboard analytics"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Kontrol Listesi", "icerik": "Girdiler: txtAdSoyad, txtVize, txtFinal\nButonlar: btnEkle ('➕ Kaydet'), btnListele ('📋 Listele ve Analiz Et')\nListe: listBoxKayitlar (Font = Consolas 9.75pt)\nİstatistik Paneli: lblToplamKayit, lblGenelOrtalama, lblKalanSayisi", "gorsel": {"type": "image", "query": "student management system form layout ui visual studio"}}, {"baslik": "Global Değişkenler ve Paralel Dizi Tanımları", "altbaslik": "Form Düzeyinde Hafıza Alanı", "icerik": "// FORM SEVİYESİNDE DEĞİŞKENLER (En Üstte)\nstring[] ogrenciAdlari = new string[50];\nint[] vizeler = new int[50];\nint[] finaller = new int[50];\ndouble[] ortalamalar = new double[50];\nstring[] harfNotlari = new string[50];\n\nint toplamKayitliOgrenci = 0; // Sıradaki boş indeks", "gorsel": {"type": "image", "query": "csharp global variables arrays declaration code"}}, {"baslik": "Adım 1: Öğrenci Ekleme Kodu (btnEkle)", "altbaslik": "Veri Doğrulama ve Hesaplama", "icerik": "private void btnEkle_Click(object sender, EventArgs e)\n{\n    try\n    {\n        if (toplamKayitliOgrenci >= 50) { MessageBox.Show(\"Kontenjan Dolu!\"); return; }\n        if (string.IsNullOrWhiteSpace(txtAdSoyad.Text)) { MessageBox.Show(\"Adı boş bırakmayın!\"); return; }\n\n        int vize = Convert.ToInt32(txtVize.Text);\n        int final = Convert.ToInt32(txtFinal.Text);\n        if (vize < 0 || vize > 100 || final < 0 || final > 100) { MessageBox.Show(\"Notlar 0-100 arası olmalı!\"); return; }\n\n        double ort = (vize * 0.40) + (final * 0.60);\n        string harf = \"\";\n        if (ort >= 90) harf = \"AA\";\n        else if (ort >= 80) harf = \"BA\";\n        else if (ort >= 70) harf = \"BB\";\n        else if (ort >= 60) harf = \"CB\";\n        else if (ort >= 50) harf = \"CC\";\n        else harf = \"FF\";\n\n        // Diziye Yaz\n        ogrenciAdlari[toplamKayitliOgrenci] = txtAdSoyad.Text;\n        vizeler[toplamKayitliOgrenci] = vize;\n        finaller[toplamKayitliOgrenci] = final;\n        ortalamalar[toplamKayitliOgrenci] = ort;\n        harfNotlari[toplamKayitliOgrenci] = harf;\n        toplamKayitliOgrenci++;\n\n        MessageBox.Show(\"Öğrenci Kaydedildi! Harf: \" + harf);\n        txtAdSoyad.Clear(); txtVize.Clear(); txtFinal.Clear(); txtAdSoyad.Focus();\n    }\n    catch { MessageBox.Show(\"Lütfen sayısal not giriniz!\"); }\n}", "gorsel": {"type": "image", "query": "csharp code add student record array data validation"}}, {"baslik": "Adım 2: Listeleme ve İstatistik Kodu (btnListele)", "altbaslik": "Döngü ile Raporlama", "icerik": "private void btnListele_Click(object sender, EventArgs e)\n{\n    if (toplamKayitliOgrenci == 0) { MessageBox.Show(\"Kayıtlı öğrenci yok!\"); return; }\n    listBoxKayitlar.Items.Clear();\n    double sinifToplam = 0;\n    int kalanSayisi = 0;\n\n    // DÖNGÜ: Kapasite (50) değil, toplamKayitliOgrenci kadar döner!\n    for (int i = 0; i < toplamKayitliOgrenci; i++)\n    {\n        string satir = (i + 1) + \") \" + ogrenciAdlari[i] + \" | Vize: \" + vizeler[i] + \n                       \" | Final: \" + finaller[i] + \" | Ort: \" + ortalamalar[i].ToString(\"0.00\") + \n                       \" | Harf: [\" + harfNotlari[i] + \"]\";\n        listBoxKayitlar.Items.Add(satir);\n        sinifToplam += ortalamalar[i];\n        if (harfNotlari[i] == \"FF\") kalanSayisi++;\n    }\n    double sinifOrt = sinifToplam / toplamKayitliOgrenci;\n    lblToplamKayit.Text   = \"Toplam Öğrenci: \" + toplamKayitliOgrenci;\n    lblGenelOrtalama.Text = \"Sınıf Ortalaması: \" + sinifOrt.ToString(\"0.00\");\n    lblKalanSayisi.Text   = \"Kalan (FF) Sayısı: \" + kalanSayisi;\n}", "gorsel": {"type": "image", "query": "csharp code report statistics class average list"}}, {"baslik": "Kritik Algoritma Kuralı: Döngü Sınırı", "altbaslik": "50 Değil, Kayıtlı Sayı Kadar Dönmek", "icerik": "Döngüde 'i < 50' yazılırsa ne olur?\n- Eğer sadece 3 öğrenci kaydettiyseniz, 4. elemandan itibaren dizi boştur (null/0).\n- Program boş kutuları okumaya çalışırken çöker!\nAltın Kural: Listeleme yaparken daima 'i < toplamKayitliOgrenci' sınırı kullanılır.", "gorsel": {"type": "image", "query": "loop boundary safety check array count"}}, {"baslik": "Sıfıra Bölme Güvenliği (DivideByZero)", "altbaslik": "Kayıt Yokken Ortalama Hesabı", "icerik": "Eğer hiç öğrenci eklenmeden ortalama hesaplanırsa:\n- sinifOrtalamasi = 0 / 0 işlemi gerçekleşir ve sistem NaN/Hata verir.\n- Çözüm: if (toplamKayitliOgrenci == 0) kontrolü ile en başta erken çıkış yapılmalıdır.", "gorsel": {"type": "image", "query": "divide by zero protection code check"}}, {"baslik": "Sektörel Vaka: Üniversite Öğrenci Bilgi Sistemi (ÖBS)", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Giresun Üniversitesi ÖBS sisteminde hocaların not girdiği ve öğrencilerin transkript aldığı dev yazılımı aması için:\n- Silinen indeksten sonraki tüm elemanlar for döngüsüyle bir basamak sola kaydırılır:\n  ogrenciAdlari[i] = ogrenciAdlari[i + 1];\n- toplamKayitliOgrenci sayacı 1 azaltılır.", "gorsel": {"type": "image", "query": "shift array elements delete row logic"}}, {"baslik": "Arayüz Detayı: Consolas Monospaced Font", "altbaslik": "Sütunların Cetvel Gibi Hizalanması", "icerik": "ListBox içindeki yazıların alt alta tam hizalı durması için 'Consolas' veya 'Courier New' gibi Monospaced (her harfi eşit genişlikte) fontlar kullanılır.\nBöylece adlar farklı uzunlukta olsa bile not ve ortalama sütunları kusursuz hizalanır.", "gorsel": {"type": "image", "query": "monospaced font alignment table terminal text"}}, {"baslik": "Sınıfın En Yüksek Notunu Alan Öğrenciyi Bulmak", "altbaslik": "Bütünleşik Min/Max Algoritması", "icerik": "double enYuksekOrtalama = ortalamalar[0];\nstring enBasariliOgrenci = ogrenciAdlari[0];\n\nfor (int i = 1; i < toplamKayitliOgrenci; i++)\n{\n    if (ortalamalar[i] > enYuksekOrtalama)\n    {\n        enYuksekOrtalama = ortalamalar[i];\n        enBasariliOgrenci = ogrenciAdlari[i];\n    }\n}\nlblDerece.Text = \"Sınıf Birincisi: \" + enBasariliOgrenci + \" (\" + enYuksekOrtalama.ToString(\"0.00\") + \")\";", "gorsel": {"type": "image", "query": "valedictorian student award top score podium"}}, {"baslik": "Dersin Büyük Kapanışı ve Gelecek", "altbaslik": "Görsel Programlama 2 ve İleri Düzey Konular", "icerik": "Önümüzdeki dönem Görsel Programlama 2 dersinde:\n- SQL Veritabanı Entegrasyonu (MSSQL / SQLite)\n- Entity Framework ve Katmanlı Mimari\n- Raporlama araçları ve Modern Arayüz Kütüphaneleri\nile projelerinizi profesyonel piyasa seviyesine taşıyacağız!", "gorsel": {"type": "image", "query": "database sql future programming career path"}}, {"baslik": "Eğitmen Değerlendirmesi ve Tavsiyeler", "altbaslik": "Başarılı Bir Yazılımcı Olmanın Sırrı", "icerik": "1. Kod yazmaktan asla korkmayın; hata yapmak öğrenmenin doğal adımıdır.\n2. Kopyala-yapıştır y         let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
</html>
