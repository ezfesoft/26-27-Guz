<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görsel Programlama - Hafta 08 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-glow: #6366f140;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 8", "altbaslik": "Akış Kontrolü (Control Flow): if ve if-else Yapıları", "icerik": "Program: Bilgisayar Programcılığı\nModül: Algoritmik Karar Verme Mekanizmaları\nHaftalık Odak: if-else Mantığı, Karşılaştırma ve Mantıksal Operatörler (&&, ||)\nHedef: Şartlara göre farklı yollara sapan akıllı masaüstü yazılımları üretmek.", "gorsel": {"type": "image", "query": "decision tree if else condition flow logic"}}, {"baslik": "Neden Karar Yapılarını Öğreniyoruz?", "altbaslik": "Sektörel Bağlam: Akıllı Yazılımların Temeli", "icerik": "Şimdiye kadar yazdığımız programlar düz bir çizgide akıyordu. Ama gerçek hayatta şartlar vardır:\n- Şifre doğruysa içeri al, yanlışsa 'Hata' ver!\n- Bakiye yetersizse parayı verme!\n- Yaş 18'den küçükse ehliyet başvurusunu reddet!\nProgramın düşünebilmesi için 'if-else' karar yapıları kullanılır.", "gorsel": {"type": "image", "query": "crossroads road sign choice decision logic"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. Programlama akış kontrolü (Control Flow) mantığını açıklar.\n2. if ve if-else bloklarının çalışma prensibini kavrar.\n3. Karşılaştırma (==, !=, <, >, <=, >=) operatörlerini hatasız kullanır.\n4. Mantıksal VE (&&) ve VEYA (||) ile çoklu koşulları birleştirir.\n5. 'Akıllı Sayı Tahmin Oyunu' projesini başarıyla tamamlar.", "gorsel": {"type": "image", "query": "learning targets decision making coding skills"}}, {"baslik": "Somut Analoji: Tren Rayındaki Makas", "altbaslik": "if-else'i Zihinde Canlandırmak", "icerik": "Bir tren makas noktasına geldiğinde:\n- Makas kolu AÇIK ise (Koşul Doğru - true) -> 1. Perona gider (if bloğu çalışır).\n- Makas kolu KAPALI ise (Koşul Yanlış - false) -> 2. Perona gider (else bloğu çalışır).\n- Tren ASLA aynı anda iki yoldan birden gidemez!", "gorsel": {"type": "image", "query": "railroad switch track junction train forks"}}, {"baslik": "Temel if Sentaksı", "altbaslik": "Koşul Sağlanıyorsa Çalıştır", "icerik": "if (kosul)\n{\n    // Sadece koşul DOĞRU (true) ise bu süslü parantezlerin içi çalışır.\n}\n\nÖrnek:\nif (yas >= 18)\n{\n    lblDurum.Text = \"Reşitsiniz, ehliyet alabilirsiniz.\";\n}", "gorsel": {"type": "image", "query": "code syntax if block flowchart diagram"}}, {"baslik": "if-else Sentaksı", "altbaslik": "İki Kesin Alternatif Yol", "icerik": "if (kosul)\n{\n    // Koşul DOĞRU (true) ise çalışır\n}\nelse\n{\n    // Koşul YANLIŞ (false) ise çalışır\n}\n\nKural: if çalışırsa else asla çalışmaz; if çalışmazsa else mutlaka çalışır.", "gorsel": {"type": "image", "query": "forking pathway two choices if else structure"}}, {"baslik": "Karşılaştırma (İlişkisel) Operatörleri", "altbaslik": "C# Mantıksal Kıyaslama Tablosu", "icerik": "| Operatör | Anlamı | C# Örneği |\n| :---: | :---: | :--- |\n| == | Eşit mi? | if (sifre == \"1234\") |\n| != | Eşit Değil mi? | if (giris != \"admin\") |\n| < | Küçük mü? | if (yas < 18) |\n| > | Büyük mü? | if (puan > 50) |\n| <= | Küçük veya Eşit mi? | if (stok <= 0) |\n| >= | Büyük veya Eşit mi? | if (not >= 70) |", "gorsel": {"type": "image", "query": "comparison operators equality signs logic"}}, {"baslik": "Büyük Tuzak: = ile == Farkı", "altbaslik": "Atama ile Eşitlik Kontrolünü Karıştırmamak", "icerik": "- Tek Eşittir (=) -> Atama Operatörüdür (Kutunun içine değer koyar).\n  sayi = 10; (sayının içine 10 yaz)\n\n- Çift Eşittir (==) -> Soru / Karşılaştırma Operatörüdür (Eşit mi diye sorar).\n  if (sayi == 10) (sayı 10'a eşit mi?)", "gorsel": {"type": "image", "query": "single equals vs double equals comparison sign"}}, {"baslik": "Mantıksal Operatörler: Koşulları Birleştirmek", "altbaslik": "VE (&&) ve VEYA (||)", "icerik": "1. Mantıksal VE (&&):\n- Tüm şartların AYNI ANDA doğru olmasını şart koşar.\n- Örn: if (kullanici == \"admin\" && sifre == \"123\") (Her ikisi de doğru olmalı!)\n\n2. Mantıksal VEYA (||):\n- Şartlardan EN AZ BİRİNİN doğru olması yeterlidir.\n- Örn: if (gun == \"Cumartesi\" || gun == \"Pazar\") (Hafta sonu tatili)", "gorsel": {"type": "image", "query": "boolean logic gates AND OR truth table"}}, {"baslik": "Kısa Devre Değerlendirmesi (Short-Circuit)", "altbaslik": "C#'ın Akıllı Mantık Kontrolü", "icerik": "- && (VE) işleminde ilk şart yanlışsa (false), C# ikinci şarta hiç bakmaz (Sonuç kesin yanlıştır).\n- || (VEYA) işleminde ilk şart doğruysa (true), C# ikinci şarta hiç bakmaz (Sonuç kesin doğrudur).\nBu optimizasyon programın çok daha hızlı çalışmasını sağlar.", "gorsel": {"type": "image", "query": "short circuit evaluation logic efficiency electrical"}}, {"baslik": "Daktiloculuğu Önleyen 'Sınır Değeri Testi'", "altbaslik": "50 Puan Alan Geçer mi Kalır mı?", "icerik": "Tahtadaki koda bakın:\nint puan = 50;\nif (puan > 50) { lblSonuc.Text = \"Geçti\"; }\nelse { lblSonuc.Text = \"Kaldı\"; }\n\nSoru: Ekranda ne yazar?\nCevap: 'Kaldı' yazar! Çünkü > sembolü 50'yi kapsamaz. 50'yi dahil etmek için >= yazılmalıdır.", "gorsel": {"type": "image", "query": "boundary testing edge cases score threshold"}}, {"baslik": "Günün Büyük Uygulaması: Akıllı Sayı Tahmin Oyunu", "altbaslik": "Senaryo ve Arayüz Tasarımı", "icerik": "Senaryo: Bilgisayarın aklında tuttuğu gizli sayıyı (örn: 42) bulmaya çalışıyoruz.\n- Kullanıcı kutuya bir sayı yazar ve 'Tahmin Et' butonuna tıklar.\n- Program: 'Daha BÜYÜK bir sayı söyle!' veya 'Daha KÜÇÜK bir sayı söyle!' der.\n- Doğru bilince ekran yeşile döner ve kaçıncı denemede bildiği tebrik edilir.", "gorsel": {"type": "image", "query": "guessing game number prediction bullseye target"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Kontrol Listesi", "icerik": "Girdi: txtTahmin (Tahmin Kutusu)\nButon: btnTahminEt ('🎯 Tahmin Et')\nÇıktılar:\n- lblIpucu (Yönlendirme Etiketi - 14pt Bold)\n- lblDeneme (Deneme Sayacı)", "gorsel": {"type": "image", "query": "guessing game ui controls layout visual studio"}}, {"baslik": "Uygulama Kodları (Tam Çözüm)", "altbaslik": "Sayı Tahmin Karar Algoritması", "icerik": "// Form seviyesinde değişkenler\nint gizliSayi = 42;\nint denemeSayisi = 0;\n\nprivate void btnTahminEt_Click(object sender, EventArgs e)\n{\n    try\n    {\n        int tahmin = Convert.ToInt32(txtTahmin.Text);\n        denemeSayisi++;\n\n        if (tahmin == gizliSayi)\n        {\n            lblIpucu.Text = \"🎉 TEBRİKLER! \" + denemeSayisi + \". denemede BİLDİNİZ!\";\n            this.BackColor = Color.LightGreen;\n            btnTahminEt.Enabled = false; // Oyunu bitir\n        }\n        else if (tahmin < gizliSayi)\n        {\n            lblIpucu.Text = \"⬆️ Daha BÜYÜK bir sayı söyle!\";\n            this.BackColor = Color.LightSalmon;\n        }\n        else\n        {\n            lblIpucu.Text = \"⬇️ Daha KÜÇÜK bir sayı söyle!\";\n            this.BackColor = Color.LightSkyBlue;\n        }\n        txtTahmin.Clear();\n        txtTahmin.Focus();\n    }\n    catch { MessageBox.Show(\"Lütfen geçerli bir sayı giriniz!\"); }\n}", "gorsel": {"type": "image", "query": "csharp code number guessing if else structure"}}, {"baslik": "Ternary Operatörü (?:) Nedir?", "altbaslik": "Tek Satırlık Pratik if-else", "icerik": "Küçük kararlarda tek satırda atama yapmak için kullanılır:\n\nstring durum = (yas >= 18) ? \"Yetişkin\" : \"Çocuk\";\n\nKalıp: (Koşul) ? DoğruysaDeğer : YanlışsaDeğer;", "gorsel": {"type": "image", "query": "ternary operator conditional inline code expression"}}, {"baslik": "Sık Yapılan Karar Yapısı Hataları", "altbaslik": "Yazılımcı Tuzakları", "icerik": "1. if (kosul); -> if parantezinin hemen sonuna noktalı virgül koymak if'i etkisiz hale getirir!\n2. Küme parantezlerini { } yazmamak -> Tek satırdan sonraki komutlar if dışı kalır.\n3. Metinleri karşılaştırırken ToLower() unutmak (Büyük/Küçük harf uyuşmazlığı).", "gorsel": {"type": "image", "query": "semicolon bug error after if statement"}}, {"baslik": "Sektörel Vaka: Akıllı Ev Termostatı", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Akıllı kombi kontrol yazılımı:\n- if (odaSicakligi < 20) -> Kombiyi yak! (Arka plan Kırmızı)\n- else if (odaSicakligi > 24) -> Kombiyi kapat, klimayı aç! (Arka plan Mavi)\n- else -> Sıcaklık ideal, beklemede kal.", "gorsel": {"type": "image", "query": "smart home thermostat temperature control iot"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Mantıksal Operatörler", "icerik": "Soru: if (kullanici == \"admin\" && sifre == \"123\") koşulunun doğru olması için ne gereklidir?\n\nA) Sadece kullanıcının admin olması yeterlidir.\nB) Sadece şifrenin 123 olması yeterlidir.\nC) Hem kullanıcının hem şifrenin aynı anda doğru olması zorunludur.\nD) Hiçbirinin doğru olmasına gerek yoktur.\n\nDoğru Cevap: C (&& mantıksal VE operatörü her iki şartın da sağlanmasını zorunlu kılar).", "gorsel": {"type": "image", "query": "quiz question login authentication security"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Operatör Anlamları", "icerik": "Soru: C# dilinde 'Eşit Değildir' anlamına gelen karşılaştırma operatörü hangisidir?\n\nA) <>\nB) !=\nC) ==\nD) =!\n\nDoğru Cevap: B (!= operatörü eşit olmama durumunu kontrol eder).", "gorsel": {"type": "image", "query": "multiple choice question programming logic"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Karar Mantığı", "icerik": "Soru: int bakiye = 100; int cekilen = 150; if (cekilen <= bakiye) koşulu true mu döner false mu?\n\nA) true döner.\nB) false döner.\nC) Hata verir.\nD) 0 döner.\n\nDoğru Cevap: B (150 <= 100 yanlış olduğu için false döner).", "gorsel": {"type": "image", "query": "atm balance check withdrawal logic quiz"}}, {"baslik": "Sınıf İçi Tartışma ve Mini Alıştırma", "altbaslik": "Hız Radarı Cezası", "icerik": "Görev:\n- Hız sınırı 82 km/s olan bir yolda araç hızını kutudan okuyun.\n- if (hiz > 82) ise ekrana 'Ceza Kesildi: 1500 TL' yazın ve arka planı kırmızı yapın.", "gorsel": {"type": "image", "query": "speed camera radar traffic ticket police"}}, {"baslik": "Haftalık Kavram Sözlüğü", "altbaslik": "Bu Haftanın Anahtar Terimleri", "icerik": "- Control Flow (Akış Kontrolü): Kodların şartlara göre çalışma sırası.\n- Boolean: Sadece true (Doğru) veya false (Yanlış) değer alan mantıksal tip.\n- Relational Operators: Karşılaştırma operatörleri (==, !=, <, >).\n- Short-Circuit: Mantıksal şartlarda erken sonuçlandırma optimizasyonu.", "gorsel": {"type": "image", "query": "concept map glossary definitions terms"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- Program akışını yönlendiren if ve if-else yapılarını öğrendik.\n- Karşılaştırma (==, !=, <, >) ve Mantıksal (&&, ||) operatörleri kavradık.\n- Sınır değeri testlerinin ve = ile == ayrımının önemini gördük.\n- Akıllı Sayı Tahmin Oyunu ile etkileşimli bir oyun otomasyonu geliştirdik.", "gorsel": {"type": "image", "query": "summary roadmap knowledge learning complete"}}, {"baslik": "Mantıksal DEĞİL (!) Operatörü", "altbaslik": "Durumu Tersine Çevirmek", "icerik": "! operatörü boolean değeri tersine çevirir:\n- !true -> false\n- !false -> true\n\nÖrnek:\nbool sistemeGirdiMi = false;\nif (!sistemeGirdiMi) // Sisteme girmemişse\n{\n    lblUyari.Text = \"Lütfen önce giriş yapınız!\";\n}", "gorsel": {"type": "image", "query": "logical NOT operator inversion flip boolean"}}, {"baslik": "String Karşılaştırmalarında Büyük/Küçük Harf", "altbaslik": "Equals ve StringComparison", "icerik": "txtKullanici.Text == \"admin\" kontrolünde kullanıcı 'Admin' veya 'ADMIN' yazarsa eşitlik sağlanmaz!\n\nÇözüm 1: txtKullanici.Text.ToLower() == \"admin\"\nÇözüm 2: string.Equals(txtKullanici.Text, \"admin\", StringComparison.OrdinalIgnoreCase)", "gorsel": {"type": "image", "query": "case insensitive string comparison lowercase"}}, {"baslik": "İç İçe if Blokları (Nested if)", "altbaslik": "Şart İçinde Şart Aramak", "icerik": "if (kullaniciAdi == \"admin\")\n{\n    if (sifre == \"1234\")\n    {\n        lblSonuc.Text = \"Giriş Başarılı!\";\n    }\n    else\n    {\n        lblSonuc.Text = \"Kullanıcı doğru ama şifre yanlış!\";\n    }\n}", "gorsel": {"type": "image", "query": "nested boxes nested if logic branching"}}, {"baslik": "Form Elemanlarının Durumunu Kontrol Etmek", "altbaslik": "CheckBox ve RadioButton Şartları", "icerik": "Onay kutuları (CheckBox) ve seçenek düğmeleri (RadioButton) boolean değer taşır:\n\nif (chkSozlesme.Checked == true)\n{\n    btnKaydol.Enabled = true;\n}\nelse\n{\n    btnKaydol.Enabled = false;\n}", "gorsel": {"type": "image", "query": "checkbox checked toggle ui control forms"}}, {"baslik": "Kodlama Taktikleri: Erken Çıkış (Guard Clause)", "altbaslik": "İç İçe Kod Karmaşasını Engellemek", "icerik": "if (yas < 18)\n{\n    MessageBox.Show(\"Yaşınız yetersiz!\");\n    return; // Alt satırlara hiç inme!\n}\n// Buraya ulaştıysa yaş kesinlikle 18 veya büyüktür\nEhliyetIslemleriniBaslat();", "gorsel": {"type": "image", "query": "clean code guard clause early return pattern"}}, {"baslik": "Sektörel Vaka: E-Ticaret Stok Kontrolü", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Müşteri 'Satın Al' butonuna bastığında:\nif (stokMiktari >= talepEdilenAdet)\n{\n    StokDus(talepEdilenAdet);\n    SiparisiOnayla();\n}\nelse\n{\n    MessageBox.Show(\"Yetersiz Stok! Kalan: \" + stokMiktari);\n}", "gorsel": {"type": "image", "query": "inventory stock warehouse out of stock notice"}}, {"baslik": "Mantıksal DEĞİL (!) Operatörü", "altbaslik": "Durumu Tersine Çevirmek", "icerik": "! operatörü boolean değeri tersine çevirir:\n- !true -> false\n- !false -> true\n\nÖrnek:\nbool sistemeGirdiMi = false;\nif (!sistemeGirdiMi) // Sisteme girmemişse\n{\n    lblUyari.Text = \"Lütfen önce giriş yapınız!\";\n}", "gorsel": {"type": "image", "query": "logical NOT operator inversion flip boolean"}}, {"baslik": "String Karşılaştırmalarında Büyük/Küçük Harf", "altbaslik": "Equals ve StringComparison", "icerik": "txtKullanici.Text == \"admin\" kontrolünde kullanıcı 'Admin' veya 'ADMIN' yazarsa eşitlik sağlanmaz!\n\nÇözüm 1: txtKullanici.Text.ToLower() == \"admin\"\nÇözüm 2: string.Equals(txtKullanici.Text, \"admin\", StringComparison.OrdinalIgnoreCase)", "gorsel": {"type": "image", "query": "case insensitive string comparison lowercase"}}, {"baslik": "İç İçe if Blokları (Nested if)", "altbaslik": "Şart İçinde Şart Aramak", "icerik": "if (kullaniciAdi == \"admin\")\n{\n    if (sifre == \"1234\")\n    {\n        lblSonuc.Text = \"Giriş Başarılı!\";\n    }\n    else\n    {\n        lblSonuc.Text = \"Kullanıcı doğru ama şifre yanlış!\";\n    }\n}", "gorsel": {"type": "image", "query": "nested boxes nested if logic branching"}}, {"baslik": "Form Elemanlarının Durumunu Kontrol Etmek", "altbaslik": "CheckBox ve RadioButton Şartları", "icerik": "Onay kutuları (CheckBox) ve seçenek düğmeleri (RadioButton) boolean değer taşır:\n\nif (chkSozlesme.Checked == true)\n{\n    btnKaydol.Enabled = true;\n}\nelse\n{\n    btnKaydol.Enabled = false;\n}", "gorsel": {"type": "image", "query": "checkbox checked toggle ui control forms"}}, {"baslik": "Kodlama Taktikleri: Erken Çıkış (Guard Clause)", "altbaslik": "İç İçe Kod Karmaşasını Engellemek", "icerik": "if (yas < 18)\n{\n    MessageBox.Show(\"Yaşınız yetersiz!\");\n    return; // Alt satırlara hiç inme!\n}\n// Buraya ulaştıysa yaş kesinlikle 18 veya büyüktür\nEhliyetIslemleriniBaslat();", "gorsel": {"type": "image", "query": "clean code guard clause early return pattern"}}, {"baslik": "Sektörel Vaka: E-Ticaret Stok Kontrolü", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Müşteri 'Satın Al' butonuna bastığında:\nif (stokMiktari >= talepEdilenAdet)\n{\n    StokDus(talepEdilenAdet);\n    SiparisiOnayla();\n}\nelse\n{\n    MessageBox.Show(\"Yetersiz Stok! Kalan: \" + stokMiktari);\n}", "gorsel": {"type": "image", "query": "inventory stock warehouse out of stock notice"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Bir sayının hem 3'e hem de 5'e tam bölündüğünü kontrol eden if şartını C# ile yazınız.'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 9: Çoklu Karar Yapıları (if-else if-else Merdiveni)", "icerik": "Gelecek Hafta Neler Yapacağız?\n- 2'den fazla seçenek olduğunda ne yaparız?\n- AVM merdiveni analojisi ve basamak basamak şart kontrolü.\n- Not harf sistemi ve Otopark Ücret Hesaplama otomasyonu.", "gorsel": {"type": "image", "query": "ladder stairs multiple paths decision preview"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
