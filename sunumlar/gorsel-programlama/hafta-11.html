<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Görsel Programlama - Hafta 11 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #4f46e5;
            --accent-glow: #4f46e525;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 11", "altbaslik": "Döngüler: for Döngüsü, ListBox ve Akümülatör Mantığı", "icerik": "Program: Bilgisayar Programcılığı\nModül: Tekrarlı İşlemler ve Liste Yönetimi\nHaftalık Odak: for Döngüsü, ListBox Kontrolü, Sayaç/Kumbara Deseni (toplam += i)\nHedef: Binlerce veriyi saniyeler içinde işleyip ekrana listeleyen otomasyonlar üretmek.", "gorsel": {"type": "image", "query": "infinite loop circle repetition algorithm code"}}, {"baslik": "Neden Döngüleri Öğreniyoruz?", "altbaslik": "Sektörel Bağlam: Bilgisayarın Asıl Süper Gücü", "icerik": "Bir insan 1000 tane faturayı tek tek elle toplasa saatler sürer ve yorulur. Ama bir bilgisayara '1'den 1000'e kadar olan tüm faturaları topla' demek 2 satır kod ve 0.001 saniyedir!\n- Bilgisayarlar tekrarlı işlerden asla bıkmaz ve hata yapmaz.", "gorsel": {"type": "image", "query": "super computer fast data processing repetition"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. for döngüsünün 3 temel parçasını (Başlangıç, Koşul, Adım) açıklar.\n2. ListBox kontrolünü (Items.Add, Items.Clear, Items.Count) etkin kullanır.\n3. Akümülatör (Kumbara) deseniyle döngü içinde toplam biriktirir.\n4. Sonsuz döngülerin (Infinite Loop) nedenlerini ve çözümünü bilir.\n5. 'Süper Sayı Matik ve Çarpım Tablosu' projesini tamamlar.", "gorsel": {"type": "image", "query": "learning targets goals loops programming"}}, {"baslik": "Somut Analoji: Stadyumda 10 Tur Koşu", "altbaslik": "for Döngüsünü Zihinde Canlandırmak", "icerik": "Beden eğitimi öğretmeniniz 'Sahada 10 tur koş!' dedi:\n- int i = 1; -> 1. Turdan başlıyorsun (Başlangıç).\n- i <= 10; -> 10. tur bitene kadar koşmaya devam et (Koşul)!\n- i++ -> Her tur bittiğinde sayacını 1 artır (Adım).\n- for (int i = 1; i <= 10; i++)", "gorsel": {"type": "image", "query": "track runner stadium laps running race"}}, {"baslik": "for Döngüsü Temel Sentaksı", "altbaslik": "C# Döngü İskeleti", "icerik": "for (Başlatma; Koşul; İterasyon)\n{\n    // Her turda tekrarlanacak komutlar\n}\n\nÖrnek:\nfor (int i = 1; i <= 5; i++)\n{\n    listBox1.Items.Add(\"Sayı: \" + i);\n}", "gorsel": {"type": "image", "query": "for loop code block syntax flowchart"}}, {"baslik": "ListBox Kontrolü ile Tanışma", "altbaslik": "Kaydırılabilir Liste Kutusu", "icerik": "Verileri tek tek değil, alt alta şık bir liste halinde göstermek için ListBox kullanılır.\n\nTemel Metotları:\n- listBox1.Items.Add(\"Ali\"); -> Listeye yeni bir satır ekler.\n- listBox1.Items.Clear(); -> Listedeki her şeyi siler, sayfayı temizler.\n- listBox1.Items.Count; -> Listede toplam kaç satır olduğunu sayar.", "gorsel": {"type": "image", "query": "listbox ui control elements scrollable list"}}, {"baslik": "Geriye Doğru Sayım Döngüsü", "altbaslik": "i-- ile Eksiltme Mantığı", "icerik": "10'dan geriye doğru 1'e kadar saymak için:\n\nfor (int i = 10; i >= 1; i--)\n{\n    listBox1.Items.Add(i);\n}\n\nBaşlangıç 10, koşul >= 1, adım ise i-- (1 azalt) olur.", "gorsel": {"type": "image", "query": "countdown clock ten nine eight timer"}}, {"baslik": "Kumbara (Akümülatör) Mantığı", "altbaslik": "Döngü İçinde Toplam Biriktirmek", "icerik": "Döngüdeki her sayıyı bir toplamda biriktirmek için 'toplam += i;' kullanılır:\n\nint toplam = 0; // Boş kumbara\nfor (int i = 1; i <= 5; i++)\n{\n    toplam += i; // 0+1=1, 1+2=3, 3+3=6, 6+4=10, 10+5=15\n}\nlblSonuc.Text = \"Toplam: \" + toplam;", "gorsel": {"type": "image", "query": "piggy bank coins accumulator saving concept"}}, {"baslik": "Büyük Tuzak: Sonsuz Döngü (Infinite Loop)", "altbaslik": "Programın Kilitlenmesi ve Donması", "icerik": "for (int i = 1; i <= 10; ) // i++ UNUTULMUŞ!\n{\n    listBox1.Items.Add(i);\n}\n\nNeden Kilitlenir? i hep 1 kalır, 1 daima 10'dan küçüktür ve döngü ASLA bitmez! CPU %100'e vurur.\nDers: Döngünün bir çıkış kapısı (i++) olmak zorundadır.", "gorsel": {"type": "image", "query": "infinite loop spiral freeze lock error cpu"}}, {"baslik": "Döngü Kontrol Komutları: break ve continue", "altbaslik": "Akışı Kesmek veya Adım Atlamak", "icerik": "- break: Döngüyü anında sonlandırır ve dışarı fırlatır (Örn: Aranan isim bulununca aramayı durdur).\n- continue: O anki turun kalan kodlarını atlar ve hemen bir sonraki tura geçer (Örn: Çift sayıları atla, tekleri yaz).", "gorsel": {"type": "image", "query": "break continue flow skip step programming"}}, {"baslik": "Günün Büyük Uygulaması: Süper Sayı Matik", "altbaslik": "Senaryo ve Arayüz Tasarımı", "icerik": "Senaryo: Kullanıcının belirlediği aralıkta sayılar üreten ve analiz eden matematik motoru.\n- Kullanıcı Başlangıç, Bitiş ve Artış Adımını girer.\n- 'Listele' butonuna basınca sayılar ListBox'a dökülür, toplamları ve adetleri hesaplanır.\n- 'Çarpım Tablosu' butonuyla iç içe döngü çalıştırılır.", "gorsel": {"type": "image", "query": "math generator numbers calculator list interface"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Kontrol Listesi", "icerik": "Girdiler: txtBaslangic, txtBitis, txtAdim\nButonlar: btnListele, btnCarpimTablosu, btnTemizle\nListe: listBox1 (Geniş Liste Kutusu)\nÖzet: lblOzet (Adet ve Toplam Bilgisi)", "gorsel": {"type": "image", "query": "form layout listbox textboxes buttons ui"}}, {"baslik": "Uygulama Kodları: Dinamik Sayı Listeleme", "altbaslik": "Adım Adım Döngü ve Toplam Hesabı", "icerik": "private void btnListele_Click(object sender, EventArgs e)\n{\n    try\n    {\n        int baslangic = Convert.ToInt32(txtBaslangic.Text);\n        int bitis = Convert.ToInt32(txtBitis.Text);\n        int adim = Convert.ToInt32(txtAdim.Text);\n\n        listBox1.Items.Clear();\n        int toplam = 0;\n        int sayac = 0;\n\n        for (int i = baslangic; i <= bitis; i += adim)\n        {\n            listBox1.Items.Add(\"Sayı: \" + i);\n            toplam += i; // Kumbaraya at\n            sayac++;     // Adet say\n        }\n        lblOzet.Text = \"Adet: \" + sayac + \" | Toplam: \" + toplam;\n    }\n    catch { MessageBox.Show(\"Lü  adım miktarına göre döngü kurmak:\n\nint artis = Convert.ToInt32(txtAdim.Text);\nfor (int i = 0; i <= 100; i += artis)\n{\n    listBox1.Items.Add(i);\n}\nBu yapı sayesinde 3'er 3'er, 5'er 5'er veya 10'ar 10'ar esnek listeleme yapılabilir.", "gorsel": {"type": "image", "query": "step size incremental skip numbers ladder"}}, {"baslik": "Zaman Karmaşıklığı (Big-O): O(N) ve O(N²)", "altbaslik": "Akademik Arka Plan", "icerik": "- Tek bir for döngüsü N eleman için N adımda biter -> O(N) Doğrusal Zaman.\n- İç içe 2 for döngüsü (Çarpım Tablosu) N x N adım sürer -> O(N²) Karesel Zaman.\nVeri büyüdükçe iç içe döngülerin çalışma süresi hızla artar.", "gorsel": {"type": "image", "query": "big o notation complexity curve graph algorithm"}}, {"baslik": "Sık Yapılan Döngü Hataları", "altbaslik": "Yazılımcı Tuzakları", "icerik": "1. for satırının sonuna noktalı virgül koymak: for (int i=0; i<10; i++); -> Döngü içi boş kalır!\n2. Döngü değişkenini blok dışından okumaya çalışmak (Scope hatası).\n3. Başlangıç ve bitiş sınırlarını ters yazmak (i=10; i<=1; i++ -> Hiç çalışmaz).", "gorsel": {"type": "image", "query": "debugging loop errors visual studio compiler"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Döngü Değişkeni Kapsamı", "icerik": "Soru: for (int i = 0; i < 10; i++) yapısında tanımlanan 'i' değişkenine döngü bittikten sonra erişilebilir mi?\n\nA) Evet, tüm metot içinde erişilebilir.\nB) Hayır, sadece döngünün { } süslü parantezleri içinde geçerlidir (Block Scope).\nC) Sadece form kapatılırken erişilir.\nD) Sadece F5'e basınca erişilir.\n\nDoğru Cevap: B (Döngü değişkenleri blok kapsamına sahiptir, döngü bitince bellekten silinir).", "gorsel": {"type": "image", "query": "variable scope lifetime block curly braces quiz"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'for (int i = 1; i <= 10; i++) döngüsü bittiğinde i değişkeninin son değeri kaç olur?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 12: Koşullu Döngüler (while / do-while) ve ComboBox", "icerik": "Gelecek Hafta Neler Yapacağız?\n- Kaç tur döneceğini bilmediğimiz durumlar: while ve do-while.\n- Açılır liste: ComboBox kontrolü.\n- Akıllı ATM Banknot Dağıtıcı projesini geliştireceğiz.", "gorsel": {"type": "image", "query": "atm cash dispenser combobox preview next week"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
