<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Görsel Programlama - Hafta 13 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #4f46e5;
            --accent-glow: #4f46e525;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görsel Programlama: Hafta 13", "altbaslik": "Veri Yapıları: Tek Boyutlu Diziler (Arrays) ve Random", "icerik": "Program: Bilgisayar Programcılığı\nModül: Temel Veri Yapıları ve Algoritmalar\nHaftalık Odak: Dizi Tanımlama, 0 Tabanlı İndeks, Random Sınıfı, Min/Max Algoritması\nHedef: Çoklu verileri tek çatı altında toplayıp analiz eden algoritmalar üretmek.", "gorsel": {"type": "image", "query": "array data structure index boxes computer memory"}}, {"baslik": "Neden Dizi (Array) Kullanırız?", "altbaslik": "Sektörel Bağlam: Yüzlerce Veriyi Tek Çatıda Toplamak", "icerik": "Sınıfta 50 öğrenci varsa, 50 tane ayrı ayrı 'string ogr1, ogr2, ogr3... ogr50;' tanımlamak bir kabustur!\n- Diziler, aynı türdeki yüzlerce veriyi tek bir değişken adı altında yan yana sıraya dizen sabit boyutlu veri yapılarıdır.", "gorsel": {"type": "image", "query": "row of lockers pigeon holes mailboxes array concept"}}, {"baslik": "Haftanın Öğrenme Kazanımları", "altbaslik": "Bu Dersin Sonunda Neler Kazanacaksınız?", "icerik": "1. Dizi kavramını ve bellekteki ardışık yerleşim mantığını açıklar.\n2. C#'ta 0 tabanlı (Zero-based) indeksleme kurallarını uygular.\n3. Random sınıfı ile rastgele sayı üretip diziye aktarır.\n4. Dizi üzerinde for döngüsü ile En Büyük ve En Küçük sayıyı bulur (Lineer Arama).\n5. 'Süper Loto Çekiliş Simülatörü' projesini tamamlar.", "gorsel": {"type": "image", "query": "learning targets algorithms arrays coding"}}, {"baslik": "Somut Analoji: Otelin Numaralı Odaları", "altbaslik": "Dizileri Zihinde Canlandırmak", "icerik": "Bir otel binası düşünün, adı: sayilar\n- 5 odası var: new int[5];\n- Oda Numaraları (İndeksler): 0, 1, 2, 3, 4 (C#'ta oda numaraları DAİMA 0'dan başlar!)\n- Odaya Misafir Koymak: sayilar[0] = 45; (0 numaralı odaya 45 sayısını koyduk).", "gorsel": {"type": "image", "query": "hotel room doors numbered zero one two three"}}, {"baslik": "Dizi Tanımlama Sentaksı", "altbaslik": "C# Dizi Deklarasyonu", "icerik": "1. Yöntem: Boyut Belirterek (Boş Dizi Açmak)\nint[] sayilar = new int[6]; // 6 odalı boş sayı dizisi\nstring[] ogrenciler = new string[30]; // 30 kişilik öğrenci listesi\n\n2. Yöntem: Başlangıç Değerleriyle Açmak\nstring[] sehirler = { \"Giresun\", \"Ordu\", \"Trabzon\" }; // 3 elemanlı hazır dizi", "gorsel": {"type": "image", "query": "csharp array declaration code syntax"}}, {"baslik": "Büyük Tuzak: Dizi Sınırını Aşmak (IndexOutOfRange)", "altbaslik": "5 Kişilik Otelde 5 Numaralı Oda Yoktur!", "icerik": "int[] sayilar = new int[5];\nsayilar[5] = 99; // HATA! IndexOutOfRangeException\n\nNeden Hata Verir? 5 elemanlı dizinin indeksleri: 0, 1, 2, 3, 4'tür. 5 numaralı indeks yoktur!\nAltın Kural: N elemanlı bir dizinin son elemanı daima 'N - 1' indeksindedir.", "gorsel": {"type": "image", "query": "out of bounds barrier error warning sign"}}, {"baslik": "Dizi Boyutu: .Length Özelliği", "altbaslik": "Dizide Kaç Eleman Var?", "icerik": "Bir dizinin kaç elemanlı olduğunu elle yazmak yerine .Length özelliği kullanılır:\n\nfor (int i = 0; i < sayilar.Length; i++)\n{\n    listBox1.Items.Add(sayilar[i]);\n}\n\n.Length kullanımı kodun dinamik ve hatasız olmasını sağlar.", "gorsel": {"type": "image", "query": "array length property count measuring"}}, {"baslik": "Rastgele Sayı Üretici: Random Sınıfı", "altbaslik": "Bilgisayara Zar Attırmak", "icerik": "C#'ta rastgele sayı üretmek için Random nesnesi kullanılır:\n\nRandom rnd = new Random();\nint zar = rnd.Next(1, 7); // 1 ile 6 arasında rastgele sayı (7 dahil DEĞİLDİR!)\nint sansliSayi = rnd.Next(1, 50); // 1 ile 49 arası sayı", "gorsel": {"type": "image", "query": "dice rolling random number generator probability"}}, {"baslik": "En Büyük ve En Küçük Elemanı Bulma Algoritması", "altbaslik": "Lineer Arama (Linear Search)", "icerik": "Dizideki en büyük sayıyı bulmak için:\n1. İlk elemanı lider (en büyük) kabul ederiz: int enBuyuk = sayilar[0];\n2. Döngü ile diğer tüm odalara sırayla bakarız.\n3. Eğer baktığımız oda liderden daha büyükse, yeni lider o olur: enBuyuk = sayilar[i];", "gorsel": {"type": "image", "query": "searching leader algorithm podium winner first place"}}, {"baslik": "Günün Büyük Uygulaması: Süper Loto Simülatörü", "altbaslik": "Senaryo ve Arayüz Tasarımı", "icerik": "Senaryo: Milli Piyango canlı çekiliş simülasyonu.\n- 'Çekilişi Başlat' butonuna basılır.\n- Program 6 elemanlı diziye 1-49 arası rastgele 6 şanslı top üretir ve ListBox'a döker.\n- Tek bir döngü ile Çekilişin En Büyük Sayısı, En Küçük Sayısı ve Toplamı hesaplanır.", "gorsel": {"type": "image", "query": "lottery balls sphere draw winning numbers bingo"}}, {"baslik": "Form Arayüz Bileşenleri", "altbaslik": "Kontrol Listesi", "icerik": "Buton: btnCekilis ('🎲 Şanslı Çekilişi Başlat')\nListe: listBoxToplar (Geniş Liste Kutusu, 12pt Bold)\nİstatistik Etiketleri: lblEnBuyuk, lblEnKucuk, lblToplam (Alt Bilgi Paneli)", "gorsel": {"type": "image", "query": "lottery ui user interface layout screen forms"}}, {"baslik": "Uygulama Kodları (Tam Çözüm)", "altbaslik": "Çekiliş ve Analiz Algoritması", "icerik": "private void btnCekilis_Click(object sender, EventArgs e)\n{\n    int[] sansliSayilar = new int[6];\n    Random rnd = new Random();\n    listBoxToplar.Items.Clear();\n\n    // 1. Diziye Rastgele Sayıları Yükle ve Listele\n    for (int i = 0; i < sansliSayilar.Length; i++)\n    {\n        sansliSayilar[i] = rnd.Next(1, 50); // 1-49 arası\n        listBoxToplar.Items.Add((i + 1) + \". Şanslı Top: \" + sansliSayilar[i]);\n    }\n\n    // 2. En Büyük / En Küçük Bulma\n    int enBuyuk = sansliSayilar[0];\n    int enKucuk = sansliSayilar[0];\n    int toplam = 0;\n\n    for (int i = 0; i < sansliSayilar.Length; i++)\n    {\n        if (sansliSayilar[i] > enBuyuk) enBuyuk = sansliSayilar[i];\n        if (sansliSayilar[i] < enKucuk) enKucuk = sansliSayilar[i];\n        toplam += sansliSayilar[i];\n    }\n    lblEnBuyuk.Text = \"En Büyük Sayı: \" + enBuyuk;\n    lblEnKucuk.Text = \"En Küçük Sayı: \" + enKucuk;\n    lblToplam.Text  = \"Çekiliş Toplamı: \" + toplam;\n}", "gorsel": {"type": "image", "query": "csharp code array processing random max min logic"}}, {"baslik": "foreach Döngüsü ile Dizi Okuma", "altbaslik": "İndekssiz Hızlı Gezinme", "icerik": "Dizideki her elemanı sırayla okumak için 'foreach' kullanılır:\n\nstring[] sehirler = { \"Giresun\", \"Ordu\", \"Trabzon\" };\nforeach (string sehir in sehirler)\n{\n    listBox1.Items.Add(sehir);\n}\n\nforeach sadece okuma (read-only) yapar, diziye yeni değer yazamaz.", "gorsel": {"type": "image", "query": "foreach loop array traversal elements iteration"}}, {"baslik": "Sektörel Vaka: Hava Durumu Sensör Analizi", "altbaslik": "Gerçek Yaşam Senaryosu", "icerik": "Meteoroloji istasyonunda 24 saat boyunca her saat ölçülen sıcaklıklar:\ndouble[] saatlikSicaklik = new double[24];\nfor döngüsü ile günün EN SICAK ve EN SOĞUK anı belirlenir.\nSensör verileri diziler üzerinden modellenir.", "gorsel": {"type": "image", "query": "weather sensor temperature 24 hour chart meteorology"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Dizi İndeksleri", "icerik": "Soru: string[] gunler = new string[7]; dizisinin ilk ve son eleman indeksleri hangisidir?\n\nA) 1 ve 7\nB) 0 ve 6\nC) 0 ve 7\nD) 1 ve 6\n\nDoğru Cevap: B (C#'ta indeksler 0'dan başlar, 7 elemanlı dizinin son indeksi 7-1 = 6'dır).", "gorsel": {"type": "image", "query": "quiz test examination array index answer"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Random Sınıfı", "icerik": "Soru: rnd.Next(1, 10) kodu hangi aralıkta rastgele tam sayı üretir?\n\nA) 1 ile 10 arasında (10 dahil)\nB) 1 ile 9 arasında (10 dahil DEĞİL)\nC) 0 ile 10 arasında\nD) 2 ile 9 arasında\n\nDoğru Cevap: B (Next(min, max) metodunda üst sınır olan max değeri aralığa dahil edilmez).", "gorsel": {"type": "image", "query": "multiple choice exam correct answer question"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Dizi Özelliği", "icerik": "Soru: Bir dizinin toplam eleman sayısını veren özellik hangisidir?\n\nA) .Count\nB) .Size\nC) .Length\nD) .Total\n\nDoğru Cevap: C (.Length özelliği dizinin boyutunu tam sayı olarak döndürür).", "gorsel": {"type": "image", "query": "array length size quiz question"}}, {"baslik": "Sınıf İçi Tartışma ve Mini Alıştırma", "altbaslik": "En Yüksek Notu Bulma", "icerik": "Görev:\n- 5 elemanlı bir int[] notlar = { 65, 80, 45, 95, 70 }; dizisi tanımlayın.\n- for döngüsü ile sınıftaki en yüksek notu (95) bulup ekrana yazdırın.", "gorsel": {"type": "image", "query": "student exam scores maximum grade classroom"}}, {"baslik": "Haftalık Kavram Sözlüğü", "altbaslik": "Bu Haftanın Anahtar Terimleri", "icerik": "- Array (Dizi): Sabit boyutlu, ardışık bellek veri yapısı.\n- Index (İndeks): Dizi hücresinin 0 tabanlı sıra numarası.\n- Length: Dizinin toplam eleman kapasitesi.\n- Random: Rastgele sayı üreten sistem sınıfı.\n- Linear Search: Baştan sona sırayla arama algoritması.", "gorsel": {"type": "image", "query": "concept map glossary definitions terms"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Öğrendik?", "icerik": "- Dizi (Array) tanımlamayı ve 0 tabanlı indeks mimarisini kavradık.\n- Random sınıfı ile rastgele veri üretmeyi öğrendik.\n- Dizi üzerinde for döngüsü ile Min/Max ve toplam bulma algoritmasını uyguladık.\n- Süper Loto Çekiliş Simülatörü ile tam teşekküllü bir proje geliştirdik.", "gorsel": {"type": "image", "query": "summary roadmap knowledge learning complete"}}, {"baslik": "Dizilerde Arama: İkili Arama (Binary Search)", "altbaslik": "Akademik Algoritma", "icerik": "- Lineer Arama (Linear Search): Baştan sona tek tek bakar -> O(N)\n- İkili Arama (Binary Search): Dizi SIRALI ise ortadan bölerek arar -> O(log N)\n1 Milyon elemanlı bir listede Lineer arama 1 Milyon adım sürerken, Binary Search sadece 20 adımda bulur!", "gorsel": {"type": "image", "query": "binary search tree algorithm dividing list"}}, {"baslik": "Dizileri Sıralamak: Array.Sort()", "altbaslik": "Küçükten Büyüğe Otomatik Sıralama", "icerik": "C#'ın yerleşik sıralama metodu:\n\nint[] p r STACK bellekte doğrudan değerleriyle saklanır.\n- Diziler (Arrays) ve string tipleri HEAP bellekte saklanır; değişken adı ise Heap'teki adresi (referansı) tutar.", "gorsel": {"type": "image", "query": "stack vs heap memory architecture diagram"}}, {"baslik": "Çok Boyutlu Diziler (Matrisler)", "altbaslik": "Satır ve Sütun Tabloları", "icerik": "Satır ve sütunlardan oluşan 2 boyutlu tablolar:\n\nint[,] matris = new int[3, 4]; // 3 satır, 4 sütunlu matris\nmatris[0, 0] = 5;\n\nSatranç tahtası, harita ve pikseller çok boyutlu dizilerle modellenir.", "gorsel": {"type": "image", "query": "2d matrix grid table array rows columns"}}, {"baslik": "Dinamik Diziler: List<T> Koleksiyonu", "altbaslik": "Sınırları Olmayan Esnek Listeler", "icerik": "Standart dizilerin boyutu sabittir (new int[10]).\nBoyutu dinamik büyüyen esnek listeler için C#'ta 'List<T>' kullanılır:\n\nList<string> ogrenciListesi = new List<string>();\nogrenciListesi.Add(\"Mehmet\"); // İstedikçe eklenir, sınır yoktur!", "gorsel": {"type": "image", "query": "dynamic list collection expandable storage"}}, {"baslik": "Mini Quiz: Soru 4", "altbaslik": "Array.Sort", "icerik": "Soru: int[] sayilar = { 5, 2, 8, 1 }; dizisine Array.Sort(sayilar); uygulandıktan sonra sayilar[0] ne olur?\n\nA) 5\nB) 8\nC) 1\nD) 2\n\nDoğru Cevap: C (Array.Sort diziyi küçükten büyüğe sıralar, ilk eleman en küçük olan 1 olur).", "gorsel": {"type": "image", "query": "array sort result question quiz"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Random rnd = new Random(); rnd.Next(10, 20); kodu hangi en küçük ve en büyük sayıyı üretebilir?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Dersi Bitirmeden Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'10 elemanlı bir dizinin son elemanına hangi indeks numarasıyla erişilir?'\n\nCevabınızı kâğıda yazıp teslim ediniz.", "gorsel": {"type": "image", "query": "exit ticket paper test classroom"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 14: Dönem Sonu Büyük Final Projesi", "icerik": "Gelecek Hafta Neler Yapacağız?\n- 14 haftalık tüm bilgileri tek bir dev yazılımda birleştiriyoruz.\n- Paralel Diziler (Parallel Arrays) ile veritabanı simülasyonu.\n- Giresun MYO Öğrenci Not Kayıt, Raporlama ve İstatistik Otomasyonu.", "gorsel": {"type": "image", "query": "final project graduation trophy success software"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • C# & Windows Forms`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
