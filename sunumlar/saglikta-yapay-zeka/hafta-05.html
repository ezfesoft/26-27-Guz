            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #10b981;
            --accent-glow: #10b98140;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

ik": "- 1. Teknik (Foundational): İki sistemin kablo/ağ üzerinden birbirine veri paketi gönderebilmesi.\n- 2. Yapısal (Structural): Veri formatının ve alanlarının (ör. JSON/XML şeması) tanımlı olması.\n- 3. Anlamsal (Semantic): Verinin içeriğinin her iki tarafta da aynı tıbbi anlama gelmesi (Ör. SNOMED-CT).\n- 4. Organizasyonel: Kurumlar arası yasal, etik ve iş akışı uyumu.", "gorsel": {"type": "image", "query": "semantic interoperability healthcare data layers diagram"}}, {"baslik": "HL7'nin Evrimi: v2, v3 ve FHIR", "altbaslik": "Boru Hatlarından Modern Web Servislerine", "icerik": "- HL7 v2 (1989): Boru (|) ve şapka (^) karakterleriyle ayrılmış metin mesajları (Halen yaygın, ancak okunması zor).\n- HL7 v3: XML tabanlı, aşırı karmaşık ve hantal model (Sektörde adaptasyonu düşük kaldı).\n- HL7 FHIR (2014+): Modern RESTful API, JSON ve XML desteğiyle web geliştiricilerinin kolayca kullandığı yeni standart.", "gorsel": {"type": "image", "query": "HL7 v2 vs HL7 FHIR evolution JSON REST API healthcare"}}, {"baslik": "FHIR'ın Temel Yapı Taşı: Kaynaklar (Resources)", "altbaslik": "Modüler Tıbbi Veri Nesneleri", "icerik": "- Tanım: Sağlıkla ilgili her bir kavramın bağımsız bir 'Kaynak' (Resource) olarak modellenmesi.\n- Temel Kaynak Örnekleri:\n  * Patient (Hasta kimlik ve demografik bilgileri)\n  * Observation (Laboratuvar sonucu, tansiyon, nabız vb. ölçümler)\n  * Condition (Tanı ve hastalıklar)\n  * MedicationRequest (İlaç reçetesi ve istemi)\n  * Encounter (Hasta viziti ve muayene kaydı)", "gorsel": {"type": "image", "query": "FHIR resources patient observation condition modular healthcare"}}, {"baslik": "Örnek FHIR JSON Yapısı: Patient Kaynağı", "altbaslik": "Hasta Nesnesinin JSON İncelemesi", "icerik": "- resourceType: 'Patient'\n- identifier: Hasta TC veya Dosya Numarası\n- name: [{ 'family': 'Yılmaz', 'given': ['Ahmet'] }]\n- gender: 'male'\n- birthDate: '1985-06-15'\n- address: İl, ilçe ve posta kodu bilgileri\n- Tıbbi Veri Teknikeri Notu: JSON hiyerarşisi net, anahtar-değer (key-value) çiftleri şeffaftır.", "gorsel": {"type": "image", "query": "FHIR JSON patient resource code snippet healthcare schema"}}, {"baslik": "Örnek FHIR JSON Yapısı: Observation Kaynağı", "altbaslik": "Laboratuvar Ölçümünün JSON İncelemesi", "icerik": "- resourceType: 'Observation'\n- status: 'final'\n- code: LOINC Kodu (Ör. 15074-8 Glukoz [Serum])\n- subject: { 'reference': 'Patient/12345' }\n- valueQuantity: { 'value': 126, 'unit': 'mg/dL', 'system': 'http://unitsofmeasure.org' }\n- referenceRange: Normal referans aralığı (70-100 mg/dL)\n- Anlamsal Güvenlik: Ölçü birimi (unit) standart kodla tanımlanmıştır.", "gorsel": {"type": "image", "query": "FHIR observation JSON lab result blood glucose LOINC"}}, {"baslik": "LOINC ve UCUM Standartları", "altbaslik": "Laboratuvar ve Ölçü Birimi Evrensel Kodları", "icerik": "- LOINC (Logical Observation Identifiers Names and Codes): Laboratuvar testleri ve klinik gözlemlerin evrensel kodu.\n- UCUM (Unified Code for Units of Measure): Ölçü birimlerinin standart yazımı (Ör. mg/dL, mmol/L, mm[Hg]).\n- YZ Faydası: Farklı hastanelerdeki 'Açlık Kan Şekeri' testleri LOINC kodu sayesinde tek bir ortak veri sütununda birleşir.", "gorsel": {"type": "image", "query": "LOINC coding laboratory informatics UCUM units measurement"}}, {"baslik": "Standartsız Verinin Yarattığı 3 Büyük Kriz", "altbaslik": "Sahada Karşılaşılan Kaos Senaryoları", "icerik": "- 1. Birim Karmaşası: Bir laboratuvarın mg/dL, diğerinin mmol/L girmesi sonucu YZ'nin zehirlenme teşhisi koyması.\n- 2. Eşanlamlılık (Synonym) Kaosu: 'Şeker Hastalığı', 'Diyabet', 'DM Tip 2', 'NIDDM' ifadelerinin ayrı hastalık sanılması.\n- 3. Tarih Formatı Hatası: '04/05/2024' ifadesinin 4 Mayıs mı yoksa 5 Nisan mı olduğunun anlaşılamaması.", "gorsel": {"type": "image", "query": "healthcare data confusion unit mismatch medical error"}}, {"baslik": "Türkiye'de Sağlık Veri Standartları ve e-Nabız", "altbaslik": "Merkezi Ulusal Sağlık Sistemi Entegrasyonu", "icerik": "- USVS (Ulusal Sağlık Veri Sözlüğü): Sağlık Bakanlığı tarafından tanımlanan zorunlu veri setleri.\n- SKRS (Sağlık Kodlama Referans Sunucusu): Tanı, işlem, ilaç ve birim kodlarının merkezi sunucusu.\n- e-Nabız Mimarisi: Tüm kamu, özel ve üniversite hastanelerinden akan verilerin tek vatandaş portalında toplanması.\n- Veri Teknikeri Görevi: HBYS'den e-Nabız'a veri gönderim paketlerinin hata loglarını denetlemek.", "gorsel": {"type": "image", "query": "e-nabiz national health records turkey healthcare informatics"}}, {"baslik": "Python ile FHIR JSON Verisi Okuma Atölyesi", "altbaslik": "Pratik Veri Ayrıştırma (Parsing)", "icerik": "- Adım 1: JSON dosyasını Python json kütüphanesiyle yükleme.\n- Adım 2: 'resourceType' kontrolü yapma.\n- Adım 3: 'valueQuantity' altındaki sayısal değer ve birimi çekme.\n- Adım 4: Hasta ID'si ile eşleştirerek temiz bir pandas DataFrame oluşturma.\n- Sonuç: YZ modeline beslenecek temiz ve yapılandırılmış tablo çıktısı.", "gorsel": {"type": "image", "query": "python parsing JSON FHIR data jupyter notebook table"}}, {"baslik": "HBYS-YZ Entegrasyon Modelleri", "altbaslik": "Yapay Zeka Hastane Sistemine Nasıl Bağlanır?", "icerik": "- 1. Batch (Toplu) Entegrasyon: Gece saatlerinde günün tüm verilerinin YZ sunucusuna aktarılıp analiz edilmesi.\n- 2. Gerçek Zamanlı (Real-time API): Hekim HBYS'de 'Kaydet'e bastığı an FHIR JSON paketiyle YZ'ye gidip anında öneri dönmesi.\n- 3. PACS Entegrasyonu: Radyoloji çekiminin doğrudan YZ sunucusuna kopyalanıp DICOM SR raporu olarak geri dönmesi.", "gorsel": {"type": "image", "query": "hospital IT architecture real time API integration AI"}}, {"baslik": "SMART on FHIR Mimarisi", "altbaslik": "Sağlık Uygulamalarının 'App Store'u", "icerik": "- SMART on FHIR Nedir?: Herhangi bir sağlık uygulamasının, HBYS yazılımını değiştirmeden bir eklenti (plugin) gibi güvenle çalışabilmesi.\n- OAuth2 Güvenliği: Hekimin HBYS kullanıcı şifresiyle YZ uygulamasına güvenli giriş yapması.\n- Evrensel Uyumluluk: Bir kez geliştirilen YZ modülünün Epic, Cerner veya yerli HBYS sistemlerinin hepsinde çalışabilmesi.", "gorsel": {"type": "image", "query": "smart on fhir architecture medical app integration oauth2"}}, {"baslik": "Tıbbi Veri Teknikerinin Standart Yönetimindeki Rolü", "altbaslik": "Sistem Sağlığının Bekçisi", "icerik": "- 1. SKRS Kod Eşleme: Hastanede açılan yeni laboratuvar testlerinin bakanlık SKRS kodlarıyla eşleştirilmesi.\n- 2. Gönderim Hata Denetimi: e-Nabız veri paketlerindeki 'Zorunlu alan eksik' veya 'Geçersiz kod' hatalarını tespit edip düzeltmek.\n- 3. FHIR Şema Kontrolü: YZ projelerine aktarılacak JSON kaynaklarının veri bütünlüğünü test etmek.", "gorsel": {"type": "image", "query": "health data specialist monitoring e-nabiz dashboard error logs"}}, {"baslik": "Haftalık Özet: 5. Haftanın Ana Fikirleri", "altbaslik": "Akılda Kalması Gerekenler", "icerik": "- Birlikte çalışabilirlik olmadan sağlıkta yapay zeka sürdürülebilir olamaz.\n- HL7 FHIR; hafif, modüler ve JSON tabanlı yapısıyla küresel sağlık standardı haline gelmiştir.\n- Tıbbi kodlama sistemleri (LOINC, SNOMED, ICD) verinin anlamsal bütünlüğünü sağlar.\n- Tıbbi veri teknikeri, veri standartlarına uygunluk ve e-Nabız gönderim süreçlerinin kilit sorumlusudur.", "gorsel": {"type": "image", "query": "summary concept map HL7 FHIR medical standards"}}, {"baslik": "Ölçme-Değerlendirme: Kendinizi Sınayın (Soru 1-2)", "altbaslik": "Standartlar ve JSON Bilgi Kontrolü", "icerik": "- Soru 1: Bir kan şekeri tahlil sonucunu taşımak için en uygun FHIR Kaynağı (Resource) hangisidir?\n  Cevap: Observation kaynağı.\n- Soru 2: İki farklı hastane HBYS'sinin aynı tahlil sonucunu farklı birimlerde kaydetmesi hangi birlikte çalışabilirlik seviyesinin eksikliğidir?\n  Cevap: Anlamsal (Semantic) birlikte çalışabilirlik eksikliği.", "gorsel": {"type": "image", "query": "quiz questions FHIR JSON interoperability"}}, {"baslik": "Ölçme-Değerlendirme: Vaka Analizi", "altbaslik": "Operasyonel Veri Riski", "icerik": "- Senaryo: Özel bir hastane HBYS güncellemesi sonrası e-Nabız sistemine tansiyon verilerini 'mm-Hg' yerine 'KPa' biriminde göndermiştir.\n- Soru: Bu durum merkezi YZ erken uyarı sistemlerinde ne tür bir hataya yol açar?\n- Cevap: Değerler sayısal olarak çok küçük görüneceğinden sistem tüm hastaları 'şok/ağır hipotansiyon' sanarak yanlış alarmlar üretecektir.", "gorsel": {"type": "image", "query": "blood pressure unit conversion medical risk"}}, {"baslik": "Çıkış Kartı: 5. Hafta Geri Bildirimi", "altbaslik": "Dersten Ayrılmadan Önce Yanıtlayınız", "icerik": "- 1. JSON formatındaki bir FHIR Observation kaynağında en kritik alan sizce hangisidir?\n- 2. e-Nabız sisteminde standart kodlar kullanılmasaydı ne gibi sorunlar yaşanırdı?\n- 3. Gelecek hafta konusu: Veri Kalitesinin YZ Performansına Etkisi ve Eksik Veri Doldurma.", "gorsel": {"type": "image", "query": "exit ticket student classroom reflection medical"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "6. Hafta: Veri Kalitesinin YZ Performansına Etkisi", "icerik": "- Konu: Eksik veri doldurma (Imputation), gürültü temizleme, normalizasyon ve aykırı değerler.\n- Odak: Veri temizliğinin model doğruluğu ve klinik güvenilirlik üzerindeki doğrudan etkisi.\n- Hazırlık: Geçen dönem gördüğünüz eksik veri tamamlama yöntemlerini (ortalama, medyan, KNN) hatırlayınız.", "gorsel": {"type": "image", "query": "data preprocessing quality imputation preview"}}, {"baslik": "FHIR Condition Kaynağı (Tanılar ve Teşhisler)", "altbaslik": "Hastalıkların Standart JSON Yapısı", "icerik": "- resourceType: 'Condition'\n- clinicalStatus: 'active' veya 'resolved'\n- code: ICD-10 veya SNOMED Kodu (Ör. I10 Esansiyel Hipertansiyon)\n- subject: { 'reference': 'Patient/12345' }\n- onsetDateTime: Hastalığın başlangıç tarihi\n- Önemi: YZ modeli hastanın geçmiş kronik hastalık geçmişini bu kaynaktan okur.", "gorsel": {"type": "image", "query": "FHIR condition resource JSON schema diagnosis code"}}, {"baslik": "FHIR MedicationRequest Kaynağı (İlaç İstemleri)", "altbaslik": "Reçetelerin Standart Veri Mimarisi", "icerik": "- resourceType: 'MedicationRequest'\n- status: 'active'\n- medicationCodeableConcept: RxNorm veya SKRS İlaç Kodu\n- dosageInstruction: Doz miktarı (500 mg), sıklığı (2x1), kullanım yolu (Oral)\n- authoredOn: Reçete yazılış tarihi ve hekim bilgisi\n- CDSS Entegrasyonu: İlaç etkileşim kuralları bu kaynak tetiklendiğinde çalışır.", "gorsel": {"type": "image", "query": "FHIR medication request JSON prescription code"}}, {"baslik": "FHIR Encounter Kaynağı (Klinik Vizitler)", "altbaslik": "Hasta Yatış, Taburculuk ve Muayene Kaydı", "icerik": "- resourceType: 'Encounter'\n- class: 'inpatient' (Yatan), 'outpatient' (Ayaktan), 'emergency' (Acil)\n- period: Başlangıç ve bitiş zamanı (Yatış-çıkış süresi)\n- reasonCode: Başvuru şikayeti\n- serviceProvider: Hastane ve klinik birim bilgisi\n- YZ Kullanımı: Hastanede kalış süresi (Length of Stay - LOS) tahmin modelleri.", "gorsel": {"type": "image", "query": "FHIR encounter JSON hospital admission discharge"}}, {"baslik": "FHIR Bundle Yapısı: Tüm Dosyayı Tek Pakette Taşımak", "altbaslik": "Kaynakların Koleksiyon Paketi", "icerik": "- Bundle Nedir?: Hasta, tahlil, reçete ve tanı kaynaklarının tek bir büyük JSON belgesinde paketlenmesi.\n- type: 'transaction' veya 'searchset'\n- entry: İçindeki tüm kaynakların listesi\n- Kullanım: e-Nabız'a veya merkezi YZ analiz motoruna tüm vizit verisini tek API çağrısıyla göndermek.", "gorsel": {"type": "image", "query": "FHIR bundle JSON collection multiple resources"}}, {"baslik": "RESTful API ve Sağlıkta CRUD İşlemleri", "altbaslik": "Web Protokolleriyle Sağlık Verisi Yönetimi", "icerik": "- GET /Patient/12345: 12345 nolu hastanın verilerini çek.\n- POST /Observation: Yeni bir laboratuvar tahlil sonucu kaydet.\n- PUT /Condition/987: Mevcut bir tanıyı güncelle (Ör. Aktiften İyileşmişe).\n- DELETE: Hatalı mükerrer kaydı silme.\n- Standartlık: Dünyanın her yerindeki FHIR sunucuları aynı HTTP komutlarıyla çalışır.", "gorsel": {"type": "image", "query": "REST API HTTP GET POST PUT DELETE healthcare architecture"}}, {"baslik": "Sağlık Bilişimi Ağ Güvenliği ve HTTPS", "altbaslik": "Kablodaki Verinin Şifrelenmesi (TLS/SSL)", "icerik": "- Tehlike: Ağ üzerinden geçen şifresiz HL7 mesajlarının kötü niyetli kişilerce dinlenmesi (Sniffing).\n- Standart: Tüm FHIR ve HBYS iletişimleri zorunlu olarak TLS 1.3 / HTTPS şifrelemesiyle yapılmalıdır.\n- API Key & JWT Token: Sadece yetkili hastane ve YZ sunucularının veri çekebilmesini sağlayan dijital kimlik kartları.", "gorsel": {"type": "image", "query": "cybersecurity HTTPS TLS encryption health data network"}}, {"baslik": "Sağlık Veri Ambarı (Data Warehouse) ve OMOP CDM", "altbaslik": "Büyük Sağlık Araştırmaları Veri Modeli", "icerik": "- OMOP CDM (Observational Medical Outcomes Partnership): Farklı hastanelerin verilerini tek bir ortak analitik şemada birleştiren küresel standart.\n- OHDSI Ağı: Dünyada yüz milyonlarca hastanın verisi üzerinde güvenli YZ araştırmaları yapmayı sağlar.\n- Fark: FHIR operasyonel iletişim içindir; OMOP büyük veri analitiği içindir.", "gorsel": {"type": "image", "query": "OMOP CDM common data model OHDSI analytics relational schema"}}, {"baslik": "e-Nabız Entegrasyon Hata Kodları ve Çözümleri", "altbaslik": "Teknikerin Günlük Takip Listesi", "icerik": "- Hata 101: 'Hasta TC Kimlik Numarası MERNİS ile Doğrulanamadı' -> Nüfus bilgisi kontrolü.\n- Hata 204: 'SKRS Tıbbi İşlem Kodu Geçersiz veya Pasif' -> SKRS tablosunu güncelle.\n- Hata 305: 'Zorunlu Alan Boş (Birim veya Değer Eksik)' -> HBYS giriş formuna validasyon ekle.\n- Çözüm: Hatalı paketlerin derhal düzeltilip tekrar kuyruğa alınması.", "gorsel": {"type": "image", "query": "error log monitor dashboard e-nabiz transmission failure"}}, {"baslik": "Açık Sağlık Veri Havuzları ve Sentetik Veri (Synthea)", "altbaslik": "Öğrenci ve Araştırmacılar İçin Gerçekçi Veriler", "icerik": "- Synthea Aracı: Biyolojik kurallara uygun olarak tamamen yapay fakat %100 gerçekçi FHIR hasta kayıtları üreten simülatör.\n- Faydası: Hiçbir gerçek hastanın mahremiyetini ihlal etmeden milyonlarca yapay hasta verisiyle YZ modelleri eğitmek.\n- Standart: Synthea çıktıları doğrudan FHIR JSON formatındadır.", "gorsel": {"type": "image", "query": "synthea synthetic patient health data generator FHIR"}}, {"baslik": "HBYS Veri Tabanı Mimarisi: İlişkisel Tablolardan JSON'a", "altbaslik": "SQL vs NoSQL Sağlık Veritabanları", "icerik": "- SQL (İlişkisel): Hasta Tablosu, Tahlil Tablosu, Reçete Tablosu (Foreign Key ile bağlı).\n- NoSQL / Doküman Tabanlı: Tüm hasta geçmişinin tek bir FHIR JSON dokümanı olarak saklanması.\n- Hibrit Yaklaşım: Modern HBYS'ler hem SQL ilişkisel tabloları hem de hızlı JSON sütunlarını birlikte kullanır.", "gorsel": {"type": "image", "query": "SQL relational database vs NoSQL JSON document healthcare"}}, {"baslik": "Standartların Geleceği: Yapay Zeka Odaklı Sağlık Ağları", "altbaslik": "Veri Taşımadan Model Eğitme (Federated Learning)", "icerik": "- Klasik Model: Verileri tek bir merkezi sunucuya toplamak (Yasal ve güvenlik kısıtları vardır).\n- Federe Öğrenme (Federated Learning): YZ algoritmasının hastaneleri gezmesi; verinin hastaneden hiç çıkmaması.\n- Standart Şartı: Federe öğrenmenin çalışabilmesi için tüm hastanelerin FHIR/OMOP standardında olması şarttır!", "gorsel": {"type": "image", "query": "federated learning healthcare distributed AI privacy hospitals"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
