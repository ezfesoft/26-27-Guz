    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #059669;
            --accent-glow: #05966925;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Giyilebilir Teknolojiler ve Sürekli İzleme Verisi", "altbaslik": "Akıllı Cihazlar, PPG/EKG Sinyalleri ve Anomali Tespiti", "icerik": "- Odak: Hastane dışındaki sürekli fizyolojik veri akışı (Smartwatches, Patch sensörler, CGM).\n- Sinyal İşleme: Fotopletismografi (PPG) ve tek derivasyonlu EKG sinyallerinin YZ ile analizi.\n- Temel Uygulama: Atriyal Fibrilasyon (AF) gibi ölümcül ritim bozukluklarının erken uyarısı.\n- Mesleki Bağlam: Tele-tıp, uzaktan hasta izlemi (RPM) ve büyük veri akışlarının yönetimi.", "gorsel": {"type": "image", "query": "wearable healthcare devices smartwatch ecg ppg heart monitoring"}}, {"baslik": "Haftanın Öğrenme Çıktıları (Bologna / Bloom)", "altbaslik": "7. Hafta Hedefleri", "icerik": "- ÖÇ1: Giyilebilir sensörlerin (PPG, İvmeölçer, EKG) veri toplama ilkelerini açıklar.\n- ÖÇ2: Zaman serisi fizyolojik verilerde anomali tespiti mantığını kavrar.\n- ÖÇ3: Örnek bir nabız/EKG veri setinde basit anomali tespiti uygulaması yapar.\n- ÖÇ4: Giyilebilir cihazların ürettiği yanlış pozitif uyarıların klinik ve psikolojik etkilerini değerlendirir.", "gorsel": {"type": "image", "query": "learning goals wearable medical monitoring biosignals"}}, {"baslik": "Klinik Bağlam: Noktasal Ölçümden Sürekli İzleme", "altbaslik": "Yılda 1 Kez Muayene vs 7/24 Gerçek Zamanlı Takip", "icerik": "- Geleneksel Yöntem: Hastanede çekilen 10 saniyelik EKG (Paroksismal/geçici aritmileri yakalayamaz).\n- Giyilebilir Yaklaşım: Akıllı saat ile 24 saat kesintisiz nabız ve ritim izlemi.\n- Erken Müdahale: İnme (felç) riskini artıran sessiz Atriyal Fibrilasyon ataklarının anında tespiti.\n- Veri Patlaması: Tek bir hastadan günde milyonlarca veri noktası üretilir.", "gorsel": {"type": "image", "query": "continuous physiological monitoring vs spot check healthcare"}}, {"baslik": "Sensör Teknolojileri: PPG vs EKG", "altbaslik": "Işıkla ve Elektrikle Kalp Takibi", "icerik": "- PPG (Fotopletismografi): Cilde yeşil LED ışık gönderip damardaki kan hacmi değişimini ölçer (Optik yöntem - Akıllı saatler).\n- Tek Derivasyonlu EKG: Cihazın kuronuna ve arkasına dokunarak elektriksel kalp potansiyelini kaydeder.\n- Fark: PPG ritim düzensizliğini sezer; EKG kesin elektriksel tanıyı doğrular.\n- Sürekli Glikoz İzleme (CGM): Cilt altı interstisyel sıvıdan 5 dakikada bir şeker ölçümü.", "gorsel": {"type": "image", "query": "optical PPG sensor vs electrical ECG smartwatch technology"}}, {"baslik": "Fizyolojik Sinyallerde Gürültü ve Artefaktlar", "altbaslik": "Hareket, Ter ve Gevşek Kordon Sorunları", "icerik": "- Hareket Artefaktı (Motion Artifact): Koşarken saatin bilekte kayması sonucu sinyalin bozulması.\n- Kötü Temas: Cildin kuru veya kordonun gevşek olması nedeniyle zayıf sinyal.\n- YZ'nin Görevi: Sinyal Kalite İndeksi (SQI) hesaplayarak gürültülü veriyi elemek ve sadece kaliteli kısımları analiz etmek.\n- Yanılgı: Her düzensiz sinyal kalp krizi değildir; çoğu zaman hareket artefaktıdır!", "gorsel": {"type": "image", "query": "motion artifact ECG signal processing noise filtering"}}, {"baslik": "Zaman Serisi Verisinde Anomali Tespiti", "altbaslik": "Normallik Profilinden Sapmaları Yakalamak", "icerik": "- Dinamik Eşikler: Uyurken nabzın 45 olması normalken, merdiven çıkarken 45 olması anomalidir.\n- R-R Aralığı Değişkenliği (HRV): Kalp atımları arasındaki sürenin milisaniye düzeyinde analizi.\n- YZ Yöntemleri: İzolasyon Ormanları (Isolation Forest), LSTM (Derin Öğrenme) ve Otomatik Kodlayıcılar (Autoencoders).\n- Çıktı: 'Son 15 dakikada düzensiz ritim tespit edildi (Olasılık: %94)'.", "gorsel": {"type": "image", "query": "time series anomaly detection heart rate ECG spikes graph"}}, {"baslik": "Atriyal Fibrilasyon (AF) Tespiti", "altbaslik": "İnme Önleyici Erken Uyarı Mekanizması", "icerik": "- AF Nedir?: Kalbin kulakçıklarının düzensiz ve kaotik titremesi (Kan pıhtısı ve felç riski).\n- EKG Belirtisi: P dalgasının kaybolması ve R-R aralıklarının tamamen kaotik hale gelmesi.\n- Apple Heart Study & Fitbit Trials: Yüz binlerce kullanıcıda yapılan klinik çalışmalarla AF tespit doğruluğunun kanıtlanması.\n- Klinik Onay: FDA tarafından reçetesiz SaMD (Software as a Medical Device) onayı verilmiştir.", "gorsel": {"type": "image", "query": "atrial fibrillation ECG irregular rhythm p wave absence"}}, {"baslik": "Atölye: Basit Ritim Anomalisi Tespiti", "altbaslik": "Python / Spreadsheet ile Eşik Kontrolü", "icerik": "- Senaryo: 24 saatlik sentetik nabız verisi üzerinde çalışılır.\n- Kural 1: İstirahat halinde nabız > 120 bpm (Taşikardi anomalisi).\n- Kural 2: Ritim düzensizliği (R-R aralığı varyansı > %30).\n- Uygulama: Eşik değerleri aşan noktaları grafik üzerinde kırmızı noktalarla işaretleme.\n- Yorum: Yanlış alarmların hangi saatlerde (hareket anında) yoğunlaştığını gözlemleme.", "gorsel": {"type": "image", "query": "python plotting heart rate anomaly red flags graph"}}, {"baslik": "Klinik Yanlış Pozitifin Psikolojik ve Tıbbi Maliyeti", "altbaslik": "'Siberkondri' ve Acil Servis Yığılması", "icerik": "- Siberkondri (Cyberchondria): Akıllı saatinin yanlış uyarısı sonucu yoğun panik yaşayan sağlıklı bireyler.\n- Acile Başvuru: 'Saatim kalp krizin var dedi' diyerek acile koşan binlerce sağlıklı insan.\n- Klinik Yük: Gerçek acil hastaların sırasını işgal etme ve gereksiz EKG/EKO tetkik masrafları.\n- Denge: Tüketici cihazlarının uyarı hassasiyeti hekim gözetimiyle sınırlandırılmalıdır.", "gorsel": {"type": "image", "query": "patient worried looking at smartwatch emergency room"}}, {"baslik": "Giyilebilir Verilerin HBYS Entegrasyonu", "altbaslik": "Doktor Milyonlarca Veri Noktasına Nasıl Bakacak?", "icerik": "- Problem: Hekime 1 aylık ham nabız çizgisini göstermek klinik olarak anlamsızdır.\n- Özetleme: YZ'nin 1 aylık veriyi 'Haftalık ortalama, anomali atak sayısı, uyku kalitesi' şeklinde özetlemesi.\n- FHIR Entegrasyonu: Akıllı cihaz verilerinin 'Observation' kaynağı olarak HBYS'ye aktarılması.\n- Tıbbi Veri Teknikeri: Hasta takip portalındaki anomali özetlerini filtreleyip hekime sunmak.", "gorsel": {"type": "image", "query": "remote patient monitoring dashboard doctor tablet telemetry"}}, {"baslik": "Haftalık Özet: 7. Haftanın Ana Fikirleri", "altbaslik": "Akılda Kalması Gerekenler", "icerik": "- Giyilebilir cihazlar sağlığı hastane duvarlarının dışına taşımakta ve sürekli izleme sağlamaktadır.\n- PPG optik olarak nabzı izlerken, tek derivasyonlu EKG elektriksel doğrulamayı yapar.\n- Hareket artefaktları en büyük yanıltıcı unsurdur; sinyal kalite kontrolü zorunludur.\n- Yanlış pozitif alarmlar acil servislerde gereksiz yığılmalara ve hasta kaygısına yol açabilir.", "gorsel": {"type": "image", "query": "summary concept map wearable health sensors telemetry"}}, {"baslik": "Ölçme-Değerlendirme: Kendinizi Sınayın (Soru 1-2)", "altbaslik": "Giyilebilir Teknoloji ve Sinyal Kontrolü", "icerik": "- Soru 1: Akıllı saatlerin bilekte yeşil LED ışık ile kan hacmi değişimini ölçtüğü yönteme ne ad verilir?\n  Cevap: Fotopletismografi (PPG).\n- Soru 2: Koşu bandında koşan birinin akıllı saatinde nabzının aniden 220 çıkıp normale dönmesi en muhtemel neyle açıklanır?\n  Cevap: Hareket artefaktı (Motion artifact).", "gorsel": {"type": "image", "query": "quiz questions wearable sensors photoplethysmography"}}, {"baslik": "Ölçme-Değerlendirme: Klinik Senaryo Sorusu", "altbaslik": "Uzaktan Hasta Takip Kararı", "icerik": "- Senaryo: 70 yaşındaki kalp yetmezliği hastasının akıllı saati gece 03:00'te 30 saniye süren Atriyal Fibrilasyon atağı kaydetmiştir.\n- Soru: Tıbbi veri teknikeri sabah verileri incelerken bu kaydı nasıl raporlamalıdır?\n- Cevap: Sinyal kalite indeksi (artefakt var mı?) teyit edilmeli, atak süresi ve saat bilgisi hekime 'Kritik Aritmi Özeti' olarak ivedilikle iletilmelidir.", "gorsel": {"type": "image", "query": "telehealth nurse monitoring patient dashboard remote"}}, {"baslik": "Çıkış Kartı: 7. Hafta Geri Bildirimi", "altbaslik": "Dersten Ayrılmadan Önce Yanıtlayınız", "icerik": "- 1. Sürekli uzaktan hasta izleminin en büyük operasyonel zorluğu siz nsörler", "icerik": "- Sensörler: 3 eksenli İvmeölçer (Accelerometer) ve Jiroskop (Gyroscope).\n- Fiziksel Patern: Ani serbest düşüş ivmesi + Sert zemin çarpma şoku + Hareketsizlik.\n- YZ Kararı: 'Kullanıcı sert bir düşüş yaşadı ve 60 saniyedir hareket etmiyor!'\n- Acil Eylem: Otomatik olarak 112 Acil Servise GPS konumunu ve acil durum çağrısını iletme.", "gorsel": {"type": "image", "query": "elderly fall detection smartwatch emergency call GPS"}}, {"baslik": "Sürekli Glikoz İzleme (CGM) ve Yapay Pankreas", "altbaslik": "Diyabette Kapalı Devre İnsülin Yönetimi", "icerik": "- CGM Sensörü: Cilt altına yerleştirilen mikro iğne ile 5 dakikada bir interstisyel glukoz ölçümü.\n- YZ Tahmini: 'Kan şekeriniz 20 dakika sonra 60 mg/dL'ye (Hipoglisemi) düşecek!'\n- Yapay Pankreas (Closed-Loop): YZ tahminine göre akıllı insülin pompasının insülin akışını otomatik durdurması veya artırması.", "gorsel": {"type": "image", "query": "continuous glucose monitor CGM artificial pancreas insulin pump"}}, {"baslik": "Uyku Evreleri Analizi ve Uyku Apnesi Tespiti", "altbaslik": "Bilekten Polisomnografi", "icerik": "- Sensör Kombinasyonu: PPG (Nabız değişkenliği) + İvmeölçer (Vücut kıpırdamaları) + SpO2 (Kandaki oksijen).\n- Uyku Evreleri: Hafif Uyku, Derin Uyku ve REM Uykusu ayrımı.\n- Uyku Apnesi İkazı: Gece boyunca oksijen satürasyonunun defalarca %90'ın altına düşmesi ve solunum durması ataklarının raporlanması.", "gorsel": {"type": "image", "query": "sleep stage tracking REM deep sleep sleep apnea smartwatch"}}, {"baslik": "Stres ve Tükenmişlik Takibi: Elektrodermal Aktivite (EDA)", "altbaslik": "Cilt İletkenliğinden Otonom Sinir Sistemi Analizi", "icerik": "- EDA Sensörü: Ciltteki mikroskobik ter bezi aktivitesini ve elektriksel iletkenliği ölçer.\n- Sempatik Sinir Sistemi: Stres anında 'Savaş veya Kaç' tepkisiyle cilt iletkenliği aniden yükselir.\n- YZ Çıktısı: Günlük stres skorlaması ve nefes egzersizi önerileri.", "gorsel": {"type": "image", "query": "electrodermal activity EDA stress sensor skin conductance"}}, {"baslik": "Giyilebilir Verilerde Çözünürlük ve Frekans (Sampling Rate)", "altbaslik": "1 Hz vs 500 Hz: Veri Boyutu Yönetimi", "icerik": "- Örnekleme Frekansı: Tıbbi 12 derivasyonlu EKG 500-1000 Hz hızında ölçülürken, akıllı saat nabzı 1 Hz (saniyede 1 kez) kaydeder.\n- Veri Tasarrufu: 1 aylık 500 Hz ham EKG gigabaytlarca yer tutar.\n- Tekniker Görevi: Arşivleme için ham sinyal yerine özetlenmiş özellik matrislerinin saklanmasını organize etmek.", "gorsel": {"type": "image", "query": "sampling rate frequency biosignals hertz waveform graph"}}, {"baslik": "Klinik Doğrulama: Tüketici Cihazı vs Tıbbi Holter", "altbaslik": "Altın Standart Karşılaştırması", "icerik": "- 24 Saatlik Holter EKG: Göğse yapıştırılan 5-7 kabloyla hastanede takılan klinik referans cihaz.\n- Doğrulama Çalışması: 500 hastaya aynı anda hem Holter hem akıllı saat takılarak YZ algoritmasının Holter ile uyumu (Cohen Kappa katsayısı) ölçülür.\n- Regülasyon Kriteri: SaMD onayı için Holter ile Duyarlılık uyumunun >%95 olması şarttır.", "gorsel": {"type": "image", "query": "holter monitor ecg vs smartwatch clinical comparison"}}, {"baslik": "Giyilebilir Veri Yönetimi: HIPAA ve Bulut Güvenliği", "altbaslik": "Bilekten Buluta Akan Verinin Mahremiyeti", "icerik": "- Risk: Akıllı saat üreticisinin kullanıcıların kalp ritmi ve konum verilerini reklam şirketlerine satma tehlikesi.\n- Tıbbi Ayrım: Tüketici gizlilik sözleşmeleri ile klinik HIPAA/KVKK koruması arasındaki devasa yasal fark.\n- Hastane Protokolü: Yalnızca hastanenin onaylı şifreli tele-tıp sunucusuna doğrudan veri aktaran cihazlar reçete edilebilir.", "gorsel": {"type": "image", "query": "cloud cybersecurity health data privacy wearable telemetry"}}, {"baslik": "Tıbbi Veri Teknikerinin Tele-Tıp Operasyonundaki Rolü", "altbaslik": "Uzaktan İzleme Merkezinde Bir Gün", "icerik": "- 1. Günlük Alarm Taraması: 200 uzaktan izlenen hastanın gece ürettiği kırmızı/sarı alarmları listelemek.\n- 2. Artefakt Temizliği: Duş alma veya koşu kaynaklı yanlış alarmları elemek.\n- 3. Hekim Ön Brifingi: Gerçek aritmi şüphesi olan 3 hastanın EKG şeridini kardiyoloğun ekranına düşürmek.\n- 4. Hasta İletişimi: Cihazı kapalı olan veya şarjı biten hastaları arayarak takip sürekliliğini sağlamak.", "gorsel": {"type": "image", "query": "telehealth remote monitoring center technician working dashboards"}}, {"baslik": "Giyilebilir Teknolojilerde Eşitlik ve Dijital Bölünme", "altbaslik": "Pahalı Saatlere Kimlerin Erişimi Var?", "icerik": "- Sosyoekonomik Eşitsizlik: 500 dolarlık akıllı saatler çoğunlukla genç, varlıklı ve sağlıklı bireyler tarafından kullanılmaktadır.\n- Asıl İhtiyaç Sahibi: Kırsalda yaşayan, düşük gelirli ve kronik hastalığı olan yaşlı nüfus.\n- Sağlık Politikası: Sosyal güvenlik kurumlarının (SGK) riskli kalp hastalarına tıbbi sensörleri ücretsiz tahsis etmesi vizyonu.", "gorsel": {"type": "image", "query": "digital health divide healthcare disparity wearable access"}}, {"baslik": "Akıllı Tekstiller ve Biyouyumlu Yamalar (Smart Patches)", "altbaslik": "Saatin Ötesinde: Vücuda Yapışan Sensörler", "icerik": "- Biyo-Yama (Patch): Göğse yapıştırılan, suya dayanıklı, 14 gün boyunca kesintisiz 3 derivasyonlu EKG kaydeden esnek bantlar (Ör. Zio Patch).\n- Akıllı Giysiler: Dokusuna gümüş iletken iplikler örülmüş sporcu ve hasta tişörtleri.\n- Üstünlük: Saate göre hareket artefaktı çok daha düşüktür ve hasta uyumu yüksektir.", "gorsel": {"type": "image", "query": "smart patch ecg biosensor wearable chest medical"}}, {"baslik": "Giyilebilir Sensör Verileri İçin Python Görselleştirme", "altbaslik": "Ham Sinyalden Ritim Grafiği Çizimi", "icerik": "- Kütüphaneler: Scipy (Sinyal işleme / Bandpass filtre), Matplotlib / Plotly (İnteraktif grafikler).\n- Filtreleme: 0.5 Hz - 40 Hz aralığını geçiren filtre ile solunum kaynaklı taban çizgisi kaymasını (Baseline wander) yok etmek.\n- Tepe Tespiti (Peak Detection): scipy.signal.find_peaks ile R tepe noktalarını yakalayıp anlık nabız hesaplama.", "gorsel": {"type": "image", "query": "python signal processing ECG peak detection code graph"}}, {"baslik": "Giyilebilir YZ'de Yanlış Kararların Önlenmesi Protokolü", "altbaslik": "3 Aşamalı Güvenlik Filtresi", "icerik": "- Aşama 1: Sinyal Kalite Filtresi (SQI > 0.8 mi?). Değilse alarm üretme, 'Bileğinizi sıkın' uyarısı ver.\n- Aşama 2: Süre Kontrolü (Aritmi atağı en az 30 saniye sürdü mü?). Anlık teklemede gereksiz panik yaratma.\n- Aşama 3: Hastaya Soru ('Şu an baş dönmesi veya göğüs ağrısı hissediyor musunuz?').", "gorsel": {"type": "image", "query": "safety protocol clinical decision wearable alert triage"}}, {"baslik": "Geleceğin Giyilebilir Teknolojileri: Non-İnvaziv Sürekli İzlem", "altbaslik": "Biyokimya ve Optik Devrimi", "icerik": "- Geliştirilen Teknolojiler: Cildi delmeden optik sensörle sürekli tansiyon ve şeker ölçümü.\n- Akıllı Kontakt Lensler: Gözyaşından glukoz ve göz içi basıncı (Glokom) takibi.\n- Yutulabilir Sensörler: Mide-bağırsak kanalından sıcaklık, pH ve kanama sinyali gönderen akıllı haplar.", "gorsel": {"type": "image", "query": "future wearable technology smart contact lens smart pill"}}, {"baslik": "Dönem Ortası Tamamlama Sertifikası", "altbaslik": "7 Haftalık Temel Sağlık YZ Yetkinliği", "icerik": "- Tebrikler: Sağlıkta YZ'nin veri altyapısını, görüntü işlemeyi, NLP metin madenciliğini, karar desteği, veri standartlarını, kalite temizliğini ve giyilebilir sensörleri başarıyla tamamladınız!\n- Sırada: 8. Hafta Vaka Çalıştayı ile tüm bu bilgileri sahada çarpıştıracağız!", "gorsel": {"type": "image", "query": "certificate milestone achievement medical informatics learning"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
</html>
