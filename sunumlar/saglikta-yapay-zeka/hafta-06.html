<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sağlıkta Yapay Zeka - Hafta 06 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #059669;
            --accent-glow: #05966925;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Veri Kalitesinin YZ Performansına Etkisi", "altbaslik": "Eksik Veri Doldurma, Normalizasyon ve Aykırı Değerler", "icerik": "- Odak: Düşük kaliteli, gürültülü veya eksik sağlık verilerinin YZ modellerini nasıl bozduğu.\n- Temel Kural: 'Çöp Girdi, Çöp Çıktı' (Garbage In, Garbage Out) ilkesinin klinik sonuçları.\n- Uygulama: Eksik ve kirli bir veri seti ile temizlenmiş veri setinin model başarı farkı.\n- Mesleki Rol: Tıbbi veri teknikerinin veri ön işleme (Data Preprocessing) sorumluluğu.", "gorsel": {"type": "image", "query": "data quality healthcare data cleaning preprocessing analytics"}}, {"baslik": "Haftanın Öğrenme Çıktıları (Bologna / Bloom)", "altbaslik": "6. Hafta Hedefleri", "icerik": "- ÖÇ1: Sağlık verilerindeki kalite boyutlarını (Doğruluk, Tamlık, Tutarlılık, Güncellik) açıklar.\n- ÖÇ2: Eksik veri tiplerini (MCAR, MAR, MNAR) tanımlar ve uygun doldurma (Imputation) yöntemini seçer.\n- ÖÇ3: Normalizasyon ve standartizasyon işlemlerinin makine öğrenmesi modelleri için gerekliliğini savunur.\n- ÖÇ4: Kasıtlı bozulmuş bir veri setini temizleyerek model performansındaki değişimi raporlar.", "gorsel": {"type": "image", "query": "learning objectives data quality medical imputation"}}, {"baslik": "Sağlık Verisinde Kalite Boyutları", "altbaslik": "Bir Veri Seti Ne Zaman 'Klinik Olarak Güvenilirdir'?", "icerik": "- 1. Tamlık (Completeness): Zorunlu alanlarda (yaş, cinsiyet, tahlil sonucu) eksik değer olmaması.\n- 2. Doğruluk (Accuracy): Verinin hastanın gerçek fizyolojik durumunu yansıtması.\n- 3. Tutarlılık (Consistency): Farklı tablolardaki hasta verilerinin birbiriyle çelişmemesi.\n- 4. Geçerlilik (Validity): Verinin kabul edilebilir aralıkta olması (Ör. Nabız 450 bpm olamaz).\n- 5. Güncellik (Timeliness): Verinin zamanında sisteme girilmiş olması.", "gorsel": {"type": "image", "query": "data quality dimensions completeness accuracy validity timeliness"}}, {"baslik": "Eksik Veri (Missing Data) Türleri", "altbaslik": "Veri Neden Eksik Kalır?", "icerik": "- 1. MCAR (Missing Completely at Random): Eksikliğin hiçbir değişkenle ilgisi olmaması (Ör. Tüpün kırılması).\n- 2. MAR (Missing at Random): Eksikliğin gözlemlenen başka bir değişkenle ilişkili olması (Ör. Gençlerde rutin EKG istenmemesi).\n- 3. MNAR (Missing Not at Random): Eksikliğin doğrudan ölçülemeyen değerle ilişkili olması (Ör. Çok ağır hastanın tansiyonunun ölçülememesi).\n- Kritik Not: MNAR veriyi rastgele doldurmak modeli ciddi şekilde yanıltır!", "gorsel": {"type": "image", "query": "missing data mechanisms MCAR MAR MNAR statistics"}}, {"baslik": "Eksik Veri Doldurma (Imputation) Yöntemleri", "altbaslik": "Hangi Durumda Hangi Yöntem Seçilmeli?", "icerik": "- Silme (Deletion): Satırı tamamen silmek (Yalnızca veri kaybı <%5 ve MCAR ise uygundur).\n- Ortalama / Medyan ile Doldurma: Basittir; ancak veri dağılımındaki varyansı düşürür ve yapay standartlaşma yaratır.\n- En Sık Değer (Mod) ile Doldurma: Kategorik alanlar için uygundur (Ör. Kan grubu).\n- İleri Yöntemler (KNN / MICE): Benzer hastaların profilinden tahmin ederek doldurma (En güvenilir yaklaşım).", "gorsel": {"type": "image", "query": "data imputation methods mean median KNN multivariate MICE"}}, {"baslik": "KNN Imputation Nasıl Çalışır?", "altbaslik": "En Yakın Komşulardan Tahmin Etme", "icerik": "- Mantık: Eksik kan şekeri olan hastanın yaş, tansiyon ve vücut kitle indeksi gibi diğer dolu özelliklerine bakılır.\n- Mesafe: Bu özellikler açısından hastaya en benzeyen 5 hasta (k=5 komşu) tespit edilir.\n- Atama: Bu 5 benzer hastanın ortalama kan şekeri değeri eksik alana yazılır.\n- Üstünlük: Ortalama doldurmaya göre hastanın kişisel profilini çok daha iyi korur.", "gorsel": {"type": "image", "query": "knn imputation algorithm nearest neighbors medical dataset"}}, {"baslik": "Aykırı Değerler (Outliers) ve Tıbbi Anlamı", "altbaslik": "Cihaz Hatası mı, Ölümcül Klinik Kriz mi?", "icerik": "- İstatistiksel Aykırı Değer: Dağılımın çok dışında kalan veriler (Kutu grafiğinde çeyrekler açıklığı dışı).\n- İki Farklı Tip:\n  * Hatalı Veri Girişi: Hasta nabzı 750 girilmiş (Fizyolojik olarak imkansız -> Düzeltilmeli/Silinmeli).\n  * Kritik Patoloji: Troponin seviyesi 50 kat yüksek (Ölümcül kalp krizi -> Asla silinmemeli!).\n- Kural: Tıpta aykırı değerler körü körüne temizlenmez; klinik uzman görüşüyle filtrelenir!", "gorsel": {"type": "image", "query": "box plot outlier detection clinical laboratory values"}}, {"baslik": "Normalizasyon ve Standartizasyon (Scaling)", "altbaslik": "Farklı Birimlerin Modeli Yanıltmasını Önlemek", "icerik": "- Problem: Yaş (0-100), Glukoz (70-400 mg/dL), Lökosit (4000-11000 /uL).\n- Sonuç: Mesafe tabanlı modeller (KNN, YSA, SVM) büyük sayısal değerlere (Lökosit) aşırı ağırlık verir.\n- Min-Max Normalizasyon: Tüm değerleri 0 ile 1 arasına sıkıştırma.\n- Standartizasyon (Z-Score): Ortalamayı 0, standart sapmayı 1 yapma (Normal dağılan veriler için ideal).", "gorsel": {"type": "image", "query": "feature scaling normalization standardization min max z score"}}, {"baslik": "Atölye: Kirli Veri vs Temiz Veri Deneyi", "altbaslik": "Model Performansındaki Dramatik Fark", "icerik": "- Deney Tasarımı: Kalp yetmezliği açık veri seti seçilir.\n- Deney A (Kirli Veri): Eksik değerler rastgele 0 ile doldurulur, normalizasyon yapılmaz.\n- Deney B (Temiz Veri): KNN ile eksik değerler doldurulur, Z-score standartizasyonu yapılır.\n- Sonuç: Deney A model doğruluğu %62, Deney B model doğruluğu %89!\n- Çıkarım: Başarılı YZ'nin sırrı algoritma değil, kaliteli veridir.", "gorsel": {"type": "image", "query": "dirty data vs clean data experiment machine learning performance"}}, {"baslik": "Klinik Risk: Yanlış Doldurulan Verinin Bedeli", "altbaslik": "Sepsis Erken Uyarısında Yapılan Hata", "icerik": "- Senaryo: Yoğun bakımda laktat testi yapılmamış bir hastanın laktat değeri sisteme ortalama değer (1.0) olarak girildi.\n- Gerçek: Hastanın laktat değeri 4.5 idi (Ağır septik şok tablosu).\n- YZ Kararı: Sistem laktat normal olduğu için 'Düşük Risk' skoru verdi ve erken antibiyotik uyarısı üretmedi.\n- Klinik Sonuç: Tanı 6 saat gecikti ve hasta kaybedildi.", "gorsel": {"type": "image", "query": "intensive care sepsis monitoring lactate level clinical risk"}}, {"baslik": "Veri Kalitesi Kontrol Listesi (Data Audit)", "altbaslik": "Teknikerin Günlük Operasyon Rehberi", "icerik": "- 1. Eksik Değer Oranı Kontrolü: Hangi sütunda % kaç eksik var? (%30'dan fazla ise sütun elenebilir).\n- 2. Aralık Kontrolü: Değerler biyolojik sınırlar içinde mi? (Tansiyon 0-300 mmHg).\n- 3. Mantıksal Tutarlılık: Erkek hastada gebelik testi sonucu var mı?\n- 4. Mükerrer (Duplicate) Kayıt Kontrolü: Aynı test 1 dakika arayla iki kez girilmiş mi?", "gorsel": {"type": "image", "query": "data quality audit checklist health information management"}}, {"baslik": "Haftalık Özet: 6. Haftanın Ana Fikirleri", "altbaslik": "Akılda Kalması Gerekenler", "icerik": "- YZ modellerinin başarısı, beslendikleri verinin kalitesiyle doğrudan orantılıdır.\n- Eksik veriler rastgele silinmemeli; veri mekanizmasına (MCAR/MAR/MNAR) uygun doldurulmalıdır.\n- Tıpta aykırı değerler her zaman hata değildir; bazen en kritik klinik tanının işaretidir.\n- Özellik ölçekleme (scaling) algoritmaların adil ve doğru öğrenmesi için zorunludur.", "gorsel": {"type": "image", "query": "summary infographic data quality healthcare analytics"}}, {"baslik": "Ölçme-Değerlendirme: Kendinizi Sınayın (Soru 1-2)", "altbaslik": "Eksik Veri ve Ölçekleme Kontrolü", "icerik": "- Soru 1: Bir hastanın tansiyonu çok düştüğü için tansiyon aletinin ölçememesi hangi eksik veri türüdür?\n  Cevap: MNAR (Missing Not at Random).\n- Soru 2: KNN ve YSA gibi mesafe tabanlı modellerde yaş ve lökosit sayısının eşit ağırlıkta öğrenilmesi için hangi işlem yapılır?\n  Cevap: Normalizasyon / Standartizasyon (Feature Scaling).", "gorsel": {"type": "image", "query": "quiz questions data preprocessing statistics"}}, {"baslik": "Ölçme-Değerlendirme: Vaka Sorusu", "altbaslik": "Aykırı Değer Kararı", "icerik": "- lik": "Mükerrer Kayıtlar (Duplicate Records) ve Temizliği", "altbaslik": "Aynı Hastanın İki Farklı Dosyası Olursa", "icerik": "- Sorun: Aynı hastaya sehven iki ayrı protokol numarası açılması (Ahmet Yılmaz vs Ahmet YILMAZ).\n- Sonuç: Hastanın bir dosyasındaki ameliyat geçmişi ve alerjileri diğer dosyada görünmez.\n- YZ'ye Etkisi: Model aynı hastayı iki farklı kişi sanarak eğitimde aşırı ağırlık verir.\n- Çözüm: Deterministik ve olasılıksal hasta eşleştirme (Record Linkage) algoritmaları.", "gorsel": {"type": "image", "query": "duplicate medical records patient merge record linkage"}}, {"baslik": "Veri Gürültüsü (Data Noise) ve Filtreleme", "altbaslik": "Sinyal ve Laboratuvar Gürültüleri", "icerik": "- Tanım: Gerçek biyolojik değerin üzerine binen rastgele hatalar ve dalgalanmalar.\n- Örnek: Kan tahlili tüpünün hemoliz olması (alyuvarların parçalanması) sonucu potasyumun yapay yüksek çıkması.\n- Laboratuvar Kuralı: Hemolizli numune sonucu sisteme girilmemeli, numune tekrarı istenmelidir.\n- Veri Teknikeri Görevi: Laboratuvar ret (reject) loglarını inceleyerek gürültülü testleri veri setinden çıkarmak.", "gorsel": {"type": "image", "query": "hemolyzed blood sample laboratory quality control error"}}, {"baslik": "Zaman Damgası (Timestamp) Hataları ve Sıralama", "altbaslik": "Önce Tedavi mi, Önce Teşhis mi?", "icerik": "- Sorun: HBYS'de antibiyotik giriş saatinin tahlil sonucundan 2 saat önce görünmesi (Gecikmeli veri girişi).\n- YZ Yanılgısı: Model ilacın tahlili bozduğunu veya hastalığı yarattığını sanabilir!\n- Çözüm: Olayın gerçekleşme saati (Event time) ile sisteme kaydedilme saatinin (System time) ayrılması.", "gorsel": {"type": "image", "query": "timestamp sequence error medical chronology timeline"}}, {"baslik": "Kategorik Değişkenlerin Kodlanması (One-Hot Encoding)", "altbaslik": "Metin Sınıflarını Sayılara Dönüştürmek", "icerik": "- Problem: 'Kan Grubu: A, B, AB, 0' veya 'Servis: Acil, Dahiliye, Cerrahi' metinsel verilerdir.\n- Label Encoding Yanılgısı: A=1, B=2, AB=3, 0=4 yapmak modelin '0 grubu A'dan 4 kat büyüktür' sanmasına yol açar!\n- One-Hot Encoding: Her sınıf için 0 ve 1 içeren ayrı bir sütun açmak (Doğru ve adil matematiksel yaklaşım).", "gorsel": {"type": "image", "query": "one hot encoding diagram categorical variables machine learning"}}, {"baslik": "Dengesiz Veri Dağılımı (Imbalanced Data)", "altbaslik": "Nadir Hastalıkların Temsil Sorunu", "icerik": "- Durum: 10.000 kişilik veri setinde 9.900 sağlıklı, 100 kanser hastası.\n- Sorun: Model kanser hastalarını öğrenmeden herkese sağlıklı diyerek %99 doğruluk elde eder.\n- Çözüm 1: SMOTE (Sentetik Azınlık Aşırı Örnekleme) ile azınlık sınıfından yapay veriler üretmek.\n- Çözüm 2: Alt Örnekleme (Undersampling) ile çoğunluk sınıfından rastgele eleme yapmak.", "gorsel": {"type": "image", "query": "smote oversampling imbalanced dataset machine learning"}}, {"baslik": "Veri Ön İşleme Boru Hattı (Data Pipeline)", "altbaslik": "Adım Adım Sağlık Verisi Hazırlama", "icerik": "- 1. Adım: Ham HBYS/PACS verisinin çıkarılması (Extraction).\n- 2. Adım: Kimliksizleştirme ve KVKK filtrelemesi.\n- 3. Adım: Tip dönüşümleri (Tarih, sayı, kategori formatlama).\n- 4. Adım: Eksik veri doldurma (KNN Imputation).\n- 5. Adım: Aykırı değer filtreleme ve Z-score ölçekleme.\n- 6. Adım: Eğitim/Test veri setine bölme.", "gorsel": {"type": "image", "query": "data preprocessing pipeline flowchart machine learning steps"}}, {"baslik": "Python ile Eksik Veri Analizi: missingno Kütüphanesi", "altbaslik": "Eksiklik Matrisini Görselleştirmek", "icerik": "- missingno.matrix(df): Hangi satırlarda ve hangi sütunlarda eksik olduğunu çizgilerle gösterir.\n- Eksiklik Korelasyonu: 'Tansiyon eksik olduğunda EKG de her zaman eksik mi?' sorusunun görsel kanıtı.\n- Tıbbi Veri Teknikeri İpucu: Eksiklik paternleri hastanenin klinik iş akışındaki aksaklıkları ortaya çıkarır.", "gorsel": {"type": "image", "query": "missingno python matrix missing data visualization"}}, {"baslik": "Aykırı Değer Tespiti: Mahalanobis Mesafesi", "altbaslik": "Çok Değişkenli Aykırı Değerler", "icerik": "- Tek Değişkenli: Yaş=20 normal, Kalp Krizi normal; ancak Yaş=20 ve Kalp Krizi birlikte çok değişkenli bir aykırı durumdur.\n- Mahalanobis Mesafesi: Birden fazla değişkenin kovaryansını dikkate alarak çok boyutlu uzayda aykırı hastaları tespit eder.", "gorsel": {"type": "image", "query": "mahalanobis distance multivariate outlier detection scatter plot"}}, {"baslik": "Veri Profilleme ve Otomatik Kalite Raporu", "altbaslik": "Pandas Profiling / ydata-profiling", "icerik": "- Otomasyon: Tek satır kodla veri setinin tam sağlık karnesini (eksikler, dağılımlar, sıfır değerler) HTML raporu olarak üretmek.\n- Rapor Başlıkları: Veri tipleri, bellek kullanımı, korelasyon matrisi, uyarılar (Warnings).\n- Tekniker Sunumu: Başhekimliğe veya veri bilimi ekibine sunulacak hazır kalite raporu.", "gorsel": {"type": "image", "query": "pandas profiling html report dashboard dataset statistics"}}, {"baslik": "Klinik Veri Doğrulama Kuralları (Validation Rules)", "altbaslik": "Hatalı Verinin Veritabanına Girişini Engellemek", "icerik": "- Girişte Kontrol: 'Nabız < 30 veya > 250 girilirse uyarı ver ve onay iste.'\n- Mantıksal Kural: 'Gebelık haftası girildiyse cinsiyet zorunlu olarak Kadın olmalıdır.'\n- Tarih Kuralı: 'Taburculuk tarihi yatış tarihinden önce olamaz!'\n- Veri Teknikeri Rolü: HBYS formlarına bu doğrulama kurallarını tanımlamak.", "gorsel": {"type": "image", "query": "data validation rules input form hospital computer screen"}}, {"baslik": "Veri Çürümesi (Data Decay / Degradation)", "altbaslik": "Eski Verilerin Güncelliğini Yitirmesi", "icerik": "- Sorun: 10 yıl önceki tedavi protokolleri ve laboratuvar referans aralıkları bugünkünden farklıdır.\n- Model Bozulması: 2010 yılı verisiyle eğitilen model bugünkü antibiyotik direnç profillerini bilmediği için hatalı öneri üretir.\n- Çözüm: Eğitim verisinde zaman penceresi (Time-window) kullanmak (Ör. Son 3 yılın verisi).", "gorsel": {"type": "image", "query": "data decay concept outdated medical records time degradation"}}, {"baslik": "Tıbbi Veri Teknikerinin Veri Temizleme Günlüğü", "altbaslik": "Şeffaflık ve Tekrarlanabilirlik", "icerik": "- Veri Değişiklik Kaydı: Hangi sütundaki eksikler nasıl dolduruldu? Kaç satır aykırı değer silindi?\n- Orijinal Veriyi Koruma: Ham veri seti asla üzerine yazılmaz; temizlenmiş veri ayrı bir dosya (df_clean.csv) olarak kaydedilir.\n- Bilimsel Etik: Veri temizleme adımları makale ve raporlarda açıkça beyan edilmelidir.", "gorsel": {"type": "image", "query": "data transformation audit log reproducible research notebook"}}, {"baslik": "Veri Kalitesi Maliyeti: Önleme vs Telafi", "altbaslik": "Kalitesiz Verinin Hastaneye Faturası", "icerik": "- 1-10-100 Kuralı: Veriyi girişte doğru kaydetmek 1 TL, temizlemek 10 TL, hatalı verinin klinik malpraktis zararı 100 TL'dir!\n- Veri Teknikerinin Katma Değeri: Hatalı veri girişini kaynağında önleyerek hastaneyi milyonlarca liralık zarardan korur.", "gorsel": {"type": "image", "query": "1 10 100 rule quality cost healthcare error prevention"}}, {"baslik": "Büyük Veri Öncesi Son Kontrol: Model İçin Hazır mıyız?", "altbaslik": "Veri Kalitesi Onay Sertifikası", "icerik": "- [x] Eksik veriler klinik mekanizmaya göre dolduruldu mu?\n- [x] Tüm kategorik alanlar One-Hot Encoding ile sayısallaştırıldı mı?\n- [x] Sayısal sütunlar Z-score ile standartlaştırıldı mı?\n- [x] Hasta bazlı bağımsız Train/Test ayrımı yapıldı mı?\n- Onay: Veri seti YZ model eğitimine hazırdır!", "gorsel": {"type": "image", "query": "checklist approved green stamp data ready machine learning"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
</html>
