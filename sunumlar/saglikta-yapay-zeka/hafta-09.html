        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #10b981;
            --accent-glow: #10b98140;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>

    <script>
        const slides = [{"baslik": "Genomik Veri ve Kişiselleştirilmiş Tıp", "altbaslik": "Büyük Biyolojik Veri, NGS ve Hasta Segmentasyonu", "icerik": "- Kapsam: İnsan genom projesi, Yeni Nesil Dizileme (NGS) ve kişiye özel tedavi yaklaşımları.\n- Kişiselleştirilmiş Tıp (Precision Medicine): 'Tek beden herkese uymaz' ilkesiyle doğru hastaya doğru ilaç seçimi.\n- YZ Uygulaması: Genomik ve klinik verilerle hasta gruplarını K-Means ile kümeleme.\n- Mesleki Bağlam: Genomik veri boyutları, biyoinformatik veri akışları ve veri saklama standartları.", "gorsel": {"type": "image", "query": "genomics precision medicine DNA sequencing big data healthcare"}}, {"baslik": "Haftanın Öğrenme Çıktıları (Bologna / Bloom)", "altbaslik": "9. Hafta Hedefleri", "icerik": "- ÖÇ1: Genomik verinin hacim, çeşitlilik ve karmaşıklık özelliklerini açıklar.\n- ÖÇ2: Kişiselleştirilmiş tıp paradigmasında yapay zekanın rolünü tanımlar.\n- ÖÇ3: K-Means kümeleme algoritmasını hasta segmentasyonu için uygular ve yorumlar.\n- ÖÇ4: Genomik veri analizinde karşılaşılan boyutsallık laneti (Curse of Dimensionality) sorununu değerlendirir.", "gorsel": {"type": "image", "query": "learning goals genomics bioinformatics personalized medicine"}}, {"baslik": "Klinik Bağlam: Geleneksel Tıptan Kişiselleştirilmiş Tıbba", "altbaslik": "Deneme-Yanılma Tedavisinin Sonu", "icerik": "- Geleneksel Model: Aynı kanser türüne sahip 100 hastaya aynı kemoterapi ilacının verilmesi.\n- Gerçek: İlaç 40 hastada tümörü küçültürken, 30 hastada etkisiz kalmakta, 30 hastada ise toksik yan etki yaratmaktadır!\n- Genetik Faktör: İlaçların metabolize edilme hızı (Farmakogenomik) ve tümör mutasyonları kişiden kişiye değişir.\n- Çözüm: YZ ile hastaları genetik profillerine göre alt gruplara (subgroups) ayırmak.", "gorsel": {"type": "image", "query": "precision medicine personalized drug therapy patient subgroups"}}, {"baslik": "Genomik Verinin Büyüklüğü ve Formatları", "altbaslik": "Gigabaytlarca DNA Dizisi Nasıl Saklanır?", "icerik": "- İnsan Genomu: Yaklaşık 3.2 milyar baz çifti (A, T, C, G).\n- Ham Veri Boyutu: Tek bir tam genom dizilemesi (WGS) 100-200 GB ham veri üretir.\n- Standart Formatlar:\n  * FASTQ (Ham dizileme okumaları ve kalite skorları)\n  * BAM/SAM (Referans genoma hizalanmış diziler)\n  * VCF (Variant Call Format - Sadece mutasyon ve varyantların listesi)\n- Tıbbi Veri Teknikeri: VCF dosyalarındaki mutasyon kodlarını klinik veritabanlarıyla eşleştirmek.", "gorsel": {"type": "image", "query": "genomic data formats FASTQ BAM VCF DNA sequencing bioinformatics"}}, {"baslik": "Boyutsallık Laneti (Curse of Dimensionality)", "altbaslik": "20.000 Gen vs 100 Hasta Problemi", "icerik": "- Matematiksel Problem: p >> n durumu (Özellik sayısı p = 20.000 gen, Hasta sayısı n = 100).\n- Sonuç: Modelin rastgele gürültüleri gerçek biyolojik ilişki sanması (Aşırı öğrenme / Spurious correlations).\n- Çözüm: Boyut İndirgeme (Dimensionality Reduction - PCA) ve Özellik Seçimi (Feature Selection).\n- Klinik İlke: Sadece bilinen onkolojik biyobelirteç genlerin modele dahil edilmesi.", "gorsel": {"type": "image", "query": "curse of dimensionality high dimensional genomic data PCA graph"}}, {"baslik": "Temel Bileşenler Analizi (PCA) ile Boyut İndirgeme", "altbaslik": "20.000 Boyuttan 2 Boyuta Haritalama", "icerik": "- PCA Nedir?: Verideki en yüksek varyansı (farklılığı) açıklayan yeni yapay eksenler (Principal Components) oluşturma.\n- Görselleştirme: 20.000 genlik hasta verisini 2 boyutlu saçılım grafiğinde (PC1 vs PC2) çizme.\n- Kümeleme Kolaylığı: Genetik olarak benzer tümör tipleri grafikte doğal olarak yan yana kümelenir.", "gorsel": {"type": "image", "query": "PCA principal component analysis plot genomics clustering"}}, {"baslik": "Denetimsiz Öğrenme: Hasta Segmentasyonu", "altbaslik": "Etiketsiz Veride Gizli Alt Tipleri Keşfetmek", "icerik": "- Denetimli vs Denetimsiz: Önceden tanımlı sınıf etiketi olmadan benzer hastaları bir araya getirme.\n- Amaç: Bilinmeyen kanser alt tiplerini veya tedaviye dirençli hasta gruplarını keşfetmek.\n- Kullanılan Yöntem: Kümeleme (Clustering - K-Means, Hiyerarşik Kümeleme).\n- Klinik Değer: Benzer moleküler profile sahip hastaların benzer tedaviye yanıt vermesi.", "gorsel": {"type": "image", "query": "unsupervised clustering patient segmentation clusters scatter plot"}}, {"baslik": "K-Means Kümeleme Algoritmasının Hatırlanması", "altbaslik": "Geçen Dönem Bilgisiyle Köprü Kurmak", "icerik": "- 1. Adım: k adet rastgele merkez (Centroid) seçilir.\n- 2. Adım: Her hasta en yakın merkeze Öklid mesafesi ile atanır.\n- 3. Adım: Kümeye atanan hastaların ortalaması alınarak yeni merkez hesaplanır.\n- 4. Adım: Merkezler değişmeyene kadar işlem tekrarlanır.\n- Optimal K Seçimi: Dirsek Yöntemi (Elbow Method) ve Silhouette Skoru.", "gorsel": {"type": "image", "query": "k-means clustering algorithm centroid update steps diagram"}}, {"baslik": "Atölye: K-Means ile Diyabet / Genomik Hasta Kümeleme", "altbaslik": "Python / Orange ile Uygulama Adımları", "icerik": "- Veri Seti: 500 hastanın glukoz, insülin direnci ve 5 temel gen ekspresyon skoru.\n- Adım 1: Veriyi standartlaştırın (StandardScaler).\n- Adım 2: Elbow yöntemi ile ideal küme sayısını belirleyin (Ör. k=3).\n- Adım 3: Kümelerin klinik profillerini inceleyin:\n  * Küme 1: İnsülin Dirençli Ağır Tip\n  * Küme 2: Genetik Yatkın Genç Tip\n  * Küme 3: Hafif Yaşlı Tip", "gorsel": {"type": "image", "query": "elbow method silhouette score optimal clusters python code"}}, {"baslik": "Farmakogenomik ve İlaç Yanıtı Tahmini", "altbaslik": "Genlerin İlaç Yanıtına Etkisi", "icerik": "- Örnek İlaç: Varfarin (Kan sulandırıcı).\n- Genetik Etki: CYP2C9 ve VKORC1 genlerindeki varyasyonlar ilacın vücutta parçalanma hızını belirler.\n- YZ Modeli: Hastanın genotipi + yaşı + kilosu => Doğru başlangıç dozu tahmini.\n- Sonuç: Kanama ve pıhtılaşma komplikasyonlarının %40 oranında azaltılması.", "gorsel": {"type": "image", "query": "pharmacogenomics warfarin dosing genetic variant CYP2C9"}}, {"baslik": "Onkolojide Hedefe Yönelik Tedaviler (Targeted Therapy)", "altbaslik": "Tümör Mutasyonuna Özel Akıllı İlaçlar", "icerik": "- Akciğer Kanseri: EGFR mutasyonu olan hastaya kemoterapi yerine EGFR inhibitörü tablet verilmesi.\n- Meme Kanseri: HER2 geni aşırı çoğalan (amplifiye) hastalara Trastuzumab antikor tedavisi.\n- YZ'nin Katkısı: Biyopsi NGS raporundan mutasyon profilini okuyup en uygun ruhsatlı veya klinik araştırma aşamasındaki akıllı ilacı eşleştirmek.", "gorsel": {"type": "image", "query": "targeted cancer therapy EGFR HER2 mutation precision oncology"}}, {"baslik": "Etik ve Mahremiyet: Genomik Veri Asla Değiştirilemez!", "altbaslik": "Kişinin En Mahrem ve Değişmez Bilgisi", "icerik": "- Fark: Şifreniz çalınırsa değiştirebilirsiniz; ancak DNA diziniz çalınırsa ömür boyu değiştiremezsiniz!\n- Ailevi Risk: Kişinin genetik verisi çocuklarının ve akrabalarının da hastalık risklerini açığa çıkarır.\n- Genetik Ayrımcılık: Sigorta şirketlerinin ve işverenlerin genetik risk profillerini kötüye kullanma tehlikesi (GINA Yasası).\n- Güvenlik: Genomik veriler özel şifreli sunucularda saklanmalıdır.", "gorsel": {"type": "image", "query": "genetic privacy DNA cybersecurity ethics discrimination"}}, {"baslik": "Tıbbi Veri Teknikerinin Biyoinformatik Veri Rolü", "altbaslik": "Genetik Raporların HBYS'ye Entegrasyonu", "icerik": "- 1. VCF Dosyası Yönetimi: Genetik laboratuvarından gelen mutasyon listelerinin hasta dosyasına doğru formatta eklenmesi.\n- 2. Onkoloji Konsey Raporları: Tümör konseyi için genomik ve klinik verileri tek bir özet panelde birleştirmek.\n- 3. Veri Güvenliği: Genetik test sonuçlarının yetkisiz personelin erişimine karşı şifrelenmesi.", "gorsel": {"type": "image", "query": "bioinformatics data technician genetic records oncology dashboard"}}, {"baslik": "Haftalık Özet: 9. Haftanın Ana Fikirleri", "altbaslik": "Akılda Kalması Gerekenler", "icerik": "- Kişiselleştirilmiş tıp, tedaviyi bireyin genetik ve moleküler profiline uyarlamayı hedefler.\n- Genomik veri devasa lecek Haftaya Bakış", "altbaslik": "10. Hafta: İlaç Geliştirme ve Klinik Araştırmalarda YZ", "icerik": "- Konu: Yeni molekül keşfi, sanal tarama (Virtual Screening) ve klinik araştırma fazları (Faz I-IV).\n- Odak: İstatistiksel anlamlılık, p-değeri, hipotez testleri ve güven aralıkları.\n- Hazırlık: İlaç geliştirme süreçlerinin kaç yıl sürdüğünü ve maliyetini araştırınız.", "gorsel": {"type": "image", "query": "drug discovery pharmaceutical research clinical trials preview"}}, {"baslik": "DNA, RNA ve Protein: Santral Doğma", "altbaslik": "Genetik Bilginin Akışı", "icerik": "- Replikasyon: DNA'nın kendini kopyalaması.\n- Transkripsiyon: DNA'dan haberci RNA (mRNA) üretimi.\n- Translasyon: mRNA dizisinden amino asitlerin ve fonksiyonel proteinlerin sentezlenmesi.\n- YZ Uygulaması: Gen ekspresyonu (mRNA miktarı) verilerinden kanser teşhisi ve alt tip tahmini.", "gorsel": {"type": "image", "query": "central dogma molecular biology DNA RNA protein translation"}}, {"baslik": "Tek Nükleotid Polimorfizmi (SNP / Tek Harf Değişimi)", "altbaslik": "Bireysel Genetik Farklılıklarımızın Kaynağı", "icerik": "- SNP Nedir?: DNA dizisinde tek bir harfin (Ör. A yerine G) farklı olması.\n- Tıbbi Önemi: İnsanlar arasındaki genetik varyasyonların %90'ı SNP'lerden kaynaklanır.\n- Hastalık Riski: Belirli bir SNP kombinasyonuna sahip olmak diyabet veya Alzheimer yatkınlığını 3 kat artırabilir.\n- Poligenik Risk Skoru (PRS): YZ'nin binlerce SNP'yi ağırlıklandırarak bireyin toplam genetik riskini hesaplaması.", "gorsel": {"type": "image", "query": "single nucleotide polymorphism SNP genetic variation DNA"}}, {"baslik": "Gen Ekspresyon Verisi ve Mikroarray Analizi", "altbaslik": "Binlerce Genin Aynı Anda Aktivitesini Ölçmek", "icerik": "- Gen Ekspresyonu: Bir genin o hücrede ne kadar 'açık/aktif' olduğu (Üretilen mRNA miktarı).\n- Isı Haritası (Heatmap): Tümör dokusunda normal dokuya göre aşırı çalışan (kırmızı) ve suskunlaşan (mavi) genlerin matrisi.\n- Kümeleme: Benzer gen aktivite profiline sahip hastaların hiyerarşik kümeleme ile gruplanması.", "gorsel": {"type": "image", "query": "gene expression microarray heatmap hierarchical clustering"}}, {"baslik": "Silhouette Skoru ile Küme Kalitesi Ölçümü", "altbaslik": "Kümeler Birbirinden Ne Kadar İyi Ayrıldı?", "icerik": "- Silhouette Değeri: -1 ile +1 arasında değişen kalite metriği.\n- +1'e Yakın: Hasta kendi kümesine çok yakın, diğer kümelere çok uzaktır (Mükemmel kümeleme).\n- 0 Civarı: Kümeler birbiriyle iç içe geçmiştir (Sınırda hastalar).\n- -1'e Yakın: Hasta yanlış kümeye atanmıştır.\n- Kullanım: İdeal hasta alt grup sayısını doğrulamak.", "gorsel": {"type": "image", "query": "silhouette analysis score clustering validation plot"}}, {"baslik": "Hiyerarşik Kümeleme ve Dendrogram Grafiği", "altbaslik": "Ağaç Yapısında Hasta Benzerliği", "icerik": "- Dendrogram Nedir?: Hastaların genetik yakınlıklarını gösteren aile ağacı benzeri grafik.\n- Birleştirici (Agglomerative) Yaklaşım: Her hasta başlangıçta tek bir kümedir; en yakın olanlar adım adım birleşir.\n- Klinik Karar: Ağacı belirli bir yükseklikten keserek 2, 3 veya 4 ana hasta grubu elde etmek.", "gorsel": {"type": "image", "query": "dendrogram hierarchical clustering tree genomics data"}}, {"baslik": "AlphaFold ve 3D Protein Yapısı Devrimi", "altbaslik": "DeepMind'ın Biyolojiye En Büyük Katkısı", "icerik": "- 50 Yıllık Problem: Bir amino asit dizisinin 3 boyutlu uzayda nasıl katlanacağını (Protein Folding) tahmin etmek.\n- AlphaFold Başarısı: 200 milyondan fazla proteinin 3D yapısını atomik hassasiyette modelledi.\n- Tıbbi Devrim: İlaçların hedef proteinlere nasıl bağlanacağını laboratuvarda yıllarca beklemeden bilgisayarda görmek.", "gorsel": {"type": "image", "query": "alphafold 3d protein structure prediction molecular biology"}}, {"baslik": "Kişiselleştirilmiş İmmünoterapi ve Kanser Aşıları", "altbaslik": "Bağışıklık Sistemini Tümöre Karşı Eğitmek", "icerik": "- Neoantijen Keşfi: Kanserli hücrenin yüzeyinde oluşan ve sağlıklı hücrede olmayan mutasyonlu protein parçaları.\n- YZ Algoritması: Hastanın DNA dizisinden hangi neoantijenin bağışıklık sistemini (T hücrelerini) en güçlü tetikleyeceğini tahmin etme.\n- mRNA Aşısı: Hastaya özel tasarlanan mRNA kanser aşısı ile bağışıklığın sadece tümöre saldırmasını sağlamak.", "gorsel": {"type": "image", "query": "personalized cancer vaccine mRNA immunotherapy neoantigen"}}, {"baslik": "Sıvı Biyopsi (Liquid Biopsy) ve Dolaşımdaki Tümör DNA'sı (ctDNA)", "altbaslik": "Kandan Kanser Taraması", "icerik": "- Klasik Biyopsi: İğne veya ameliyatla organdan doku parçası almak (Ağrılı ve invaziv).\n- Sıvı Biyopsi: Basit bir kan tüpündeki serbest dolaşan tümör DNA kırıntılarını (ctDNA) NGS ile dizilemek.\n- YZ'nin Gücü: Milyonlarca normal DNA arasında binde bir oranındaki kanser mutasyonunu gürültüden ayıklamak.", "gorsel": {"type": "image", "query": "liquid biopsy circulating tumor DNA blood test cancer"}}, {"baslik": "Nadir Hastalıkların Genomik Tanısı", "altbaslik": "Yıllar Süren 'Tanısal Yolculuğu' Günlere İndirmek", "icerik": "- Problem: Nadir genetik hastalığı olan çocukların doğru tanı alana kadar ortalama 5-7 yıl hastane hastane gezmesi.\n- Çözüm: Bebeğin tam genom dizilemesi yapılıp YZ ile fenotip-genotip eşleştirmesi yapılması.\n- Başarı: Tanı süresinin 48 saate indirilmesi ve erken gen tedavisiyle kalıcı sakatlıkların önlenmesi.", "gorsel": {"type": "image", "query": "rare genetic disease diagnosis whole genome sequencing child"}}, {"baslik": "Biyoinformatik Veri Tabanları (NCBI, ClinVar, COSMIC)", "altbaslik": "Dünya Tıp Literatürünün Genetik Arşivi", "icerik": "- ClinVar: Hangi genetik mutasyonun hangi hastalığa yol açtığını gösteren açık klinik veritabanı.\n- COSMIC: Kanser mutasyonlarının küresel kataloğu.\n- dbSNP: Bilinen tüm tek harf varyasyonlarının veri tabanı.\n- Veri Teknikeri: Genetik raporları bu küresel kütüphanelerdeki ID kodlarıyla (rsID, COSMIC ID) eşleştirmek.", "gorsel": {"type": "image", "query": "bioinformatics databases NCBI ClinVar COSMIC genome browser"}}, {"baslik": "Genomik Veri Yönetiminde Bulut Mimarisi", "altbaslik": "Petabaytlarca Biyolojik Veriyi İşlemek", "icerik": "- Donanım İhtiyacı: 1.000 hastanın tam genomu 100 Terabayt yer tutar.\n- AWS Omics / Google Cloud Life Sciences: Genomik boru hatlarını paralel çalıştıran bulut altyapıları.\n- Maliyet Optimizasyonu: Ham FASTQ dosyalarını işlendikten sonra VCF varyant formatına dönüştürüp arşive almak.", "gorsel": {"type": "image", "query": "cloud computing genomics big data life sciences"}}, {"baslik": "Doğrudan Tüketiciye Genetik Testler (DTC-GT)", "altbaslik": "23andMe ve Tüketici Genetiği Riskleri", "icerik": "- Tanım: Tüketicinin internetten kit sipariş edip tükürük örneğiyle genetik risk raporu alması.\n- Tıbbi Risk: Klinik geçerliliği olmayan sahte risk raporlarının yarattığı gereksiz panik veya yalancı rahatlama.\n- Tıbbi İlke: Genetik testler mutlaka bir Tıbbi Genetik Uzmanı ve Genetik Danışman gözetiminde yorumlanmalıdır.", "gorsel": {"type": "image", "query": "direct to consumer genetic test kit saliva DNA"}}, {"baslik": "Genomik Çağda Tıbbi Dokümantasyonun Dönüşümü", "altbaslik": "Geleneksel Dosyadan Moleküler Sağlık Kaydına", "icerik": "- Yeni Standart: Hasta dosyasında sadece tansiyon değil; HLA doku grubu, CYP enzim hızı ve BRCA mutasyon durumu yer alacaktır.\n- Tekniker Yetkinliği: Moleküler terminolojiye aşinalık ve genetik test sonuçlarının gizlilik protokollerini yönetebilme becerisi.", "gorsel": {"type": "image", "query": "molecular electronic health record genomics EHR precision medicine"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            if (slide.gorsel && slide.gorsel.query) {
                bodyHTML += `<div class="visual-box">🖼️ <strong>Görsel Analoji & Tematik Kavram:</strong> ${slide.gorsel.query}</div>`;
            }
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
