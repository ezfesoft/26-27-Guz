<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sağlıkta Yapay Zeka - Hafta 02 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #059669;
            --accent-glow: #05966925;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "Görüntü Tabanlı Tanı Sistemleri", "altbaslik": "Radyoloji, Patoloji ve Dermatolojide Yapay Zeka", "icerik": "- Odak: Tıbbi görüntülerle çalışan yapay zeka modellerinin mimarisi, eğitimi ve denetimi.\n- Uygulama Alanları: Röntgen (X-Ray), Bilgisayarlı Tomografi (BT), MR, Dermatoskopi ve Dijital Patoloji.\n- Mesleki Bağlam: Tıbbi görüntü arşivleri (PACS), etiketleme standartları ve klinik onay süreçleri.\n- Temel Amaç: Görüntü işleme modellerinin klinik güvenilirlik sınırlarını kavramak.", "gorsel": {"type": "image", "query": "medical imaging radiology AI chest x-ray ct scan pathology"}}, {"baslik": "Haftanın Öğrenme Çıktıları (Bologna / Bloom)", "altbaslik": "2. Hafta Hedef Yetkinlikleri", "icerik": "- ÖÇ1: Görüntü tabanlı tıbbi YZ eğitimi için gerekli veri ve etiketleme koşullarını açıklar.\n- ÖÇ2: Bir sınıflandırma modelinin çıktı metriklerini klinik vaka üzerinden yorumlar.\n- ÖÇ3: FDA ve CE gibi düzenleyici onay süreçlerinin gerekliliğini ve sınırlarını değerlendirir.\n- ÖÇ4: No-code araçlarla (Teachable Machine / Orange) temel bir medikal görüntü sınıflandırıcı kurar.", "gorsel": {"type": "image", "query": "learning objectives medical imaging computer vision"}}, {"baslik": "Klinik Bağlam: Tıbbi Görüntülemenin Önemi", "altbaslik": "Pikselden Teşhise Giden Yol", "icerik": "- Yüksek Hacim: Modern bir hastanede günde binlerce radyolojik ve patolojik görüntü üretilir.\n- İnsan Faktörü: Radyolog ve patologların uzun nöbetlerdeki görsel yorgunluğu (Visual Fatigue).\n- Erken Teşhis: Milimetrik nodüllerin veya erken evre melanomların yakalanmasında YZ desteği.\n- Veri Teknikeri Görevi: Görüntülerin PACS sisteminden anonim ve standart formatta çıkarılması.", "gorsel": {"type": "image", "query": "radiologist working with dual screens pacs system hospital"}}, {"baslik": "Tıbbi Görüntü Formatları: DICOM Nedir?", "altbaslik": "Digital Imaging and Communications in Medicine", "icerik": "- Tanım: Tıbbi görüntülerin ve ilişkili hasta/cihaz üst verilerinin (metadata) uluslararası standardı.\n- Yapısı: Sadece görsel piksel verisi değil; çekim dozu, hasta kimliği, çekim açısı ve tarih bilgilerini de içerir.\n- YZ İçin Önemi: Modeller eğitilmeden önce DICOM üst verilerinin mahremiyet gereği anonimleştirilmesi zorunludur.\n- Yaygın Hata: DICOM piksellerini doğrudan JPEG'e dönüştürürken kontrast ve bit derinliği kaybı yaşamak.", "gorsel": {"type": "image", "query": "dicom file structure medical imaging metadata header"}}, {"baslik": "Piksel ve Voksel: 2D vs 3D Görüntüleme", "altbaslik": "Düz Grafilerden Hacimsel Kesitlere", "icerik": "- Piksel (2D): Röntgen ve mamografi gibi tek düzlemli görüntülerdeki en küçük resim hücresi.\n- Voksel (3D): Bilgisayarlı Tomografi (BT) ve MR gibi hacimsel kesitlerdeki 3 boyutlu piksel.\n- Hounsfield Birimi (HU): BT görüntülerinde dokuların yoğunluğunu ifade eden sayısal ölçek (Hava: -1000, Su: 0, Kemik: +1000 HU).\n- YZ Ön İşleme: Belirli dokuları (ör. kanama veya kemik) öne çıkarmak için HU pencereleme (windowing) yapılır.", "gorsel": {"type": "image", "query": "hounsfield unit ct scan windowing brain bone tissue"}}, {"baslik": "Evrişimli Sinir Ağları (CNN) Mimarisi", "altbaslik": "Tıbbi Görüntü Tanımanın Temel Motoru", "icerik": "- Evrişim (Convolution) Katmanı: Kenar, köşe, doku ve yoğunluk farklılıklarını otomatik filtreler.\n- Havuzlama (Pooling) Katmanı: Görüntü boyutunu küçülterek işlem hızını artırır ve hesaplama yükünü azaltır.\n- Tam Bağlantılı (Dense) Katman: Çıkarılan özellikleri birleştirerek nihai tanı olasılığını hesaplar.\n- Tıbbi Örnek: 'Zatürre (Pneumonia) var: %92, Sağlıklı: %8'.", "gorsel": {"type": "image", "query": "convolutional neural network CNN layers medical image classification"}}, {"baslik": "Etiketleme (Annotation) ve Uzman Doğrulaması", "altbaslik": "Kaliteli Modelin Temel Taşı: Ground Truth", "icerik": "- Etiketleme Türleri: Sınıflandırma (tüm görüntüye etiket), Sınırlayıcı Kutu (Bounding Box), Segmentasyon (Piksel piksel boyama).\n- Ground Truth (Altın Standart): Etiketin kesin doğruluğunu ifade eder (Biyopsi sonucu veya uzman konsensüsü).\n- İnter-Observer Variability: İki farklı radyoloğun aynı lezyona farklı yorum yapabilme gerçeği.\n- Çözüm: En az 3 bağımsız uzmanın ortak kararıyla oluşturulan etiket setleri.", "gorsel": {"type": "image", "query": "medical image annotation bounding box segmentation radiology"}}, {"baslik": "Görüntü Segmentasyonu (U-Net Mimarisi)", "altbaslik": "Lezyonun Sınırlarını Piksel Düzeyinde Çizmek", "icerik": "- Segmentasyon Nedir?: Tümörün, organın veya kanamanın tam sınırlarının piksellerle boyanması.\n- U-Net Modeli: Biyomedikal görüntü segmentasyonu için geliştirilmiş U şeklindeki özel derin öğrenme mimarisi.\n- Klinik Değer: Radyoterapide ışın verilecek tümör hacminin ve sağlıklı çevre dokuların tam korunması.\n- Başarı Metriği: Dice Katsayısı ve IoU (Intersection over Union - Kesişim/Birleşim Oranı).", "gorsel": {"type": "image", "query": "u-net architecture medical image segmentation tumor boundary"}}, {"baslik": "Radyolojide YZ Uygulamaları", "altbaslik": "Akciğer Grafisi, BT ve MR Analizleri", "icerik": "- Akciğer Röntgeni: Zatürre, tüberküloz, pnömotoraks ve nodül tespiti.\n- Beyin BT: İntrakraniyal kanama (acil inme triyajı) tespiti.\n- Meme MR: Yoğun meme dokusundaki malign lezyonların ayrımı.\n- Önceliklendirme (Triyaj): YZ, acil kanamalı hastanın filmini radyoloğun iş listesinde en üste taşır.", "gorsel": {"type": "image", "query": "chest x-ray pneumonia detection deep learning heat map"}}, {"baslik": "Dermatolojide YZ: Cilt Lezyonu Sınıflandırma", "altbaslik": "Melanom vs İyi Huylu Nevüs", "icerik": "- Yöntem: Dermatoskopik görüntülerin renk, simetri, sınır düzensizliği ve çap analizi.\n- Başarı Hikayesi: 2017 Stanford çalışması (CNN modelinin uzman dermatolog seviyesinde lezyon tanıması).\n- Sahadaki Sorun: Farklı ten renklerinde (cilt tiplerinde) ve yetersiz ışıkta model başarımının düşmesi.\n- Veri Teknikeri Notu: Veri setinde tüm cilt tiplerinin dengeli tems ;
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
</html>
