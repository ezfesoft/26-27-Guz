            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);

            flex-direction: column;

            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;

            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));

            -webkit-text-fill-color: transparent;

            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

            margin-bottom: 14px;
            white-space: pre-line;

            font-size: 0.95rem;

            padding: 16px;

            left: 0;

            left: 0;
            right: 0;

            display: none;

        .modal-overlay.active {

            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;

            border-radius: 12px;
            padding: 16px;

            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;

        @media (max-width: 768px) {
            .slide-card {

            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>

tection clinical NLP syntax parsing turkish"}}, {"baslik": "Otomatik Tıbbi Kodlama: ICD-10 ve SNOMED-CT", "altbaslik": "Serbest Metinden Standart Kodlara Geçiş", "icerik": "- ICD-10: Faturalandırma, morbidite ve resmi istatistikler için hastalık sınıflaması (Ör. I21.9 Akut MI).\n- SNOMED-CT: Klinik detayları ve ontolojileri ifade eden evrensel tıbbi terminoloji.\n- NLP'nin Rolü: Doktorun yazdığı 'Sağ bacakta kırık şüphesi' ifadesini doğru koda otomatik eşleme.\n- Risk: Yanlış kodlama geri ödeme kesintilerine ve yanlış klinik kayıtlara yol açar.", "gorsel": {"type": "image", "query": "medical coding ICD-10 SNOMED-CT ontology classification"}}, {"baslik": "Sesli Dikte ve Konuşmadan Metne (Speech-to-Text)", "altbaslik": "Klinisyen İş Yükünü Azaltan Çözümler", "icerik": "- Çalışma Prensibi: Doktorun mikrofonla anlattığı muayene bulgularının anında metne dökülmesi.\n- Tıbbi Terminoloji Zorluğu: Eşanlamlı kelimeler, hızlı konuşma, ortam gürültüsü ve latince terimler.\n- Veri Teknikeri Görevi: Sesli dikte çıktılarının imla, terim ve eksiklik kontrolünü yaparak onaylamak.", "gorsel": {"type": "image", "query": "doctor dictating medical notes speech to text software"}}, {"baslik": "Büyük Dil Modelleri (LLM) ve Sağlık", "altbaslik": "GPT, LLaMA ve Med-PaLM Mimarileri", "icerik": "- Transformer Mimarisi: Metindeki kelimeler arasındaki uzun mesafeli anlamsal ilişkileri kuran dikkat (Attention) mekanizması.\n- Tıbbi Yetenekler: Epikriz özetleme, taburculuk özeti hazırlama, hasta mektubu oluşturma, soru yanıtlama.\n- Temel Kural: LLM'ler birer 'bilgi tabanı' değil; istatistiksel kelime tahmin motorudur!", "gorsel": {"type": "image", "query": "large language models healthcare transformer architecture"}}, {"baslik": "Büyük Risk 1: Halüsinasyon (Uydurma Bilgi)", "altbaslik": "Modelin İkna Edici Biçimde Yanılması", "icerik": "- Tanım: Modelin metinde hiç geçmeyen bir laboratuvar sonucunu veya ilacı varmış gibi uydurması.\n- Örnek: Orijinal raporda alerji bilgisi yokken, LLM özetine ' m"}}, {"baslik": "Klinik Metin Denetim Protokolü (3T Kuralı)", "altbaslik": "Veri Teknikerinin Kalite Kontrol Standartı", "icerik": "- 1. Doğruluk (Truthfulness): Özetteki her ifade orijinal epikrizde birebir bulunuyor mu?\n- 2. Tamlık (Total Completeness): Alerjiler, kritik lab değerleri veya ameliyat notu atlanmış mı?\n- 3. Tutarlılık (Transparency): İlaç dozları ve tarih sıralaması mantıksal olarak doğru mu?\n- Kural: 3T kontrolünden geçmeyen hiçbir YZ özeti hasta dosyasına işlenemez!", "gorsel": {"type": "image", "query": "audit checklist medical records quality assurance"}}, {"baslik": "Atölye Çalışması: Epikriz Denetim Masası", "altbaslik": "Adım Adım İnsan Denetimi Uygulaması", "icerik": "- Adım 1: Anonimleştirilmiş karmaşık bir taburculuk epikrizi okuyun.\n- Adım 2: Bir LLM'e 'Bu metni 5 maddede özetle' komutu verin.\n- Adım 3: Çıktıyı kırmızı kalemle denetleyin (Halüsinasyon var mı? Eksik var mı? Bağlam doğru mu?).\n- Adım 4: Hataları sınıflandırın ve düzeltilmiş nihai epikriz özetini onaylayın.", "gorsel": {"type": "image", "query": "human auditor reviewing clinical notes side by side"}}, {"baslik": "Denetim Rubriği: Hata Tipleri Sınıflandırması", "altbaslik": "Hataları Nasıl Belgeleyeceğiz?", "icerik": "- Tip A: Uydurma Bilgi (Halüsinasyon - Metinde olmayan tanı/ilaç ekleme).\n- Tip B: Kritik Bilgi Eksikliği (Alerji veya ameliyat komplikasyonunu atlama).\n- Tip C: Özne Karışıklığı (Aile öyküsünü hastaya atama).\n- Tip D: Sayısal/Doz Hatası (Lab değeri veya ilaç dozu tahrifatı).\n- Raporlama: Denetim formu doldurularak aylık model güvenilirlik skoru çıkarılır.", "gorsel": {"type": "image", "query": "clinical error taxonomy rubric health data audit"}}, {"baslik": "Doğru ve Yanlış Kullanım Senaryoları", "altbaslik": "NLP Araçlarını Hastanede Nasıl Konumlandırmalıyız?", "icerik": "- YANLIŞ: LLM çıktısını okumadan doğrudan HBYS taburculuk raporuna yapıştırmak.\n- DOĞRU: LLM'i taslak üretici olarak kullanıp, tekniker/hekim onayından sonra sisteme kaydetmek.\n- sı: İngilizceye Çevirip Özetletme Yanılgısı", "altbaslik": "Çeviride Kaybolan Tıbbi Anlam", "icerik": "- Vaka: Bir hastane personelinin Türkçe epikrizi internet çevirisiyle İngilizceye çevirip LLM'e özetletmesi.\n- Hata: 'Hasta taburcu edildi' ifadesinin 'Patient was discharged' yerine 'Patient was fired' şeklinde çevrilmesi!\n- Sonuç: Epikrizde anlamsız ve tehlikeli tıbbi bozulmalar.\n- Kural: Sağlık metinleri yerel dilde eğitilmiş medikal modellerle işlenmelidir.", "gorsel": {"type": "image", "query": "translation error medical records language barrier"}}, {"baslik": "Hasta Portalı ve Sadeleştirilmiş Dil (Patient-Friendly)", "altbaslik": "Tıbbi Notları Hastanın Anlayacağı Dile Çevirmek", "icerik": "- Problem: Hastaların e-Nabız'daki epikrizlerinde geçen Latince terimleri anlayamaması ve kaygılanması.\n- YZ Görevi: Tıbbi epikrizi 8. sınıf okuma seviyesinde anlaşılır bir 'Hasta Bilgilendirme Mektubuna' dönüştürmek.\n- Örnek: 'Akut Gastroenterit' -> 'Mide-bağırsak iltihabı (Mide üşütmesi)'.\n- Tekniker Rolü: Sadeleştirilmiş metnin tıbbi anlamını kaybetmediğini teyit etmek.", "gorsel": {"type": "image", "query": "patient portal plain language medical summary communication"}}, {"baslik": "Haftalık Özet: 3. Haftanın Ana Fikirleri", "altbaslik": "Akılda Kalması Gerekenler", "icerik": "- Sağlık metinleri karmaşık, jargon dolu ve yapılandırılmamıştır; NLP bunları anlamlandırır.\n- LLM modelleri mükemmel dil yeteneğine sahip olsa da halüsinasyon ve bağlam kaybına açıktır.\n- Olumsuzluk (Negation) tespiti sağlıkta en kritik NLP adımlarından biridir.\n- İnsan denetimi (Human-in-the-Loop) klinik güvenliğin ve yasal uyumun vazgeçilmez şartıdır.", "gorsel": {"type": "image", "query": "summary concept mind map clinical natural language processing"}}, {"baslik": "Ölçme-Değerlendirme: Kendinizi Sınayın (Soru 1-2)", "altbaslik": "NLP ve LLM Riskleri Kontrolü", "icerik": "- Soru 1: Bir LLM'in hastanın dosyasında olmayan bir tanıyı raporda varmış gibi üretmesine ne ad verilir?\n  Cevap: Halüsinasyon (Hallucination).\n- Soru 2: 'Hastanın ailesinde diyabet var, hastanın kan şekeri normal' cümlesini 'Hasta diyabetiktir' şeklinde özetleyen model hangi hatayı yapmıştır?\n  Cevap: Bağlam kaybı (Context Loss).", "gorsel": {"type": "image", "query": "quiz questions clinical NLP hallucination evaluation"}}, {"baslik": "Ölçme-Değerlendirme: Denetim Protokolü Sorusu", "altbaslik": "Uygulamalı Mesleki Karar", "icerik": "- Soru: Bir sesli dikte sistemi 'Hipertansiyon yoktur' ifadesini 'Hipertansiyon çoktur' olarak algılamıştır. Bu hatanın önlenmesi için tekniker hangi kontrol mekanizmasını uygulamalıdır?\n- Cevap: Ses kaydı ile metin eşzamanlı çapraz kontrol edilmeli ve olumsuzluk bildiren kritik tıbbi ekler özel denetim filtresine tabi tutulmalıdır.", "gorsel": {"type": "image", "query": "speech to text audio verification workflow medical"}}, {"baslik": "Çıkış Kartı: 3. Hafta Geri Bildirimi", "altbaslik": "Dersten Ayrılmadan Önce Yanıtlayınız", "icerik": "- 1. Bir klinik özeti denetlerken ilk bakacağınız 3T kuralı maddesi hangisidir?\n- 2. LLM'lerin halüsinasyon yapmasını önlemek için hastanelerde hangi mimari (RAG) kullanılmalıdır?\n- 3. Gelecek hafta konusu: Klinik Karar Destek Sistemleri (CDSS) ve Karar Tabloları.", "gorsel": {"type": "image", "query": "exit ticket student classroom reflection medical"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "4. Hafta: Klinik Karar Destek Sistemleri (CDSS)", "icerik": "- Konu: Hekime tanı ve tedavide rehberlik eden karar destek sistemlerinin mimarisi.\n- Odak: Kural tabanlı sistemler vs Makine öğrenmesi modelleri, alarm yorgunluğu.\n- Ön Hazırlık: Hastanelerde ilaç etkileşim uyarılarının nasıl çalıştığını araştırınız.", "gorsel": {"type": "image", "query": "clinical decision support system hospital software preview"}}, {"baslik": "Klinik NLP'de Çoklu Dil ve Çeviri Riskleri", "altbaslik": "Türkçe Sağlık Metinlerinin Özellikleri", "icerik": "- Morfolojik Zenginlik: Türkçe sondan eklemeli bir dil olduğu için tıbbi ekler (Ör. -sizlik, -olojik, -itler) kökü değiştirir.\n- Dil Modeli Eğitimi: Doğrudan İngilizce modellerin Türkçeye uyarlanması yerine yerli medikal korpusla fine-tuning yapılmalıdır.\n- Veri Teknikeri Kontrolü: Çeviri araçlarının yarattığı anlam kaymalarını tespit etmek.", "gorsel": {"type": "image", "query": "turkish language medical NLP natural language processing"}}, {"baslik": "Tıbbi Sözlükler ve Ontolojiler (UMLS & MeSH)", "altbaslik": "Kavramları Birbirine Bağlayan Ağlar", "icerik": "- UMLS (Unified Medical Language System): Milyonlarca tıbbi terimi tek bir CUI (Concept Unique Identifier) altında toplayan devasa ontoloji.\n- MeSH (Medical Subject Headings): Tıbbi makale ve literatür indeksleme standartı.\n- NLP Entegrasyonu: Doktor 'Kalp yetmezliği' yazdığında modelin bunu UMLS kodu C0018801 ile eşleştirmesi.", "gorsel": {"type": "image", "query": "UMLS medical ontology ontology graph healthcare"}}, {"baslik": "Klinik NLP Kalite Güvence Tablosu", "altbaslik": "Haftalık Denetim Karnesi", "icerik": "- 1. İncelenen Epikriz Sayısı: 50 adet.\n- 2. LLM Halüsinasyon Oranı: %4 (2 adet yakalandı ve düzeltildi).\n- 3. ICD-10 Kod Doğruluk Oranı: %92.\n- 4. İnsan Müdahalesi Süresi: Epikriz başına ortalama 45 saniye.\n- Sonuç: Hekim zamanından %60 tasarruf, sıfır hatalı kayıt.", "gorsel": {"type": "image", "query": "quality assurance dashboard medical records NLP audit"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
