    <title>Sağlıkta Yapay Zeka - Hafta 08 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #059669;
            --accent-glow: #05966925;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

ge", "query": "midterm summary milestone achievement healthcare students"}}, {"baslik": "Çıkış Kartı: 8. Hafta Geri Bildirimi", "altbaslik": "İlk Yarı Değerlendirmesi", "icerik": "- 1. İlk 8 haftada öğrendiğiniz ve meslek hayatınızda en çok işe yarayacağını düşündüğünüz konu neydi?\n- 2. Kendinizi bir YZ makalesini eleştirecek düzeyde yetkin hissediyor musunuz?\n- 3. Gelecek hafta konusu: Genomik Veri ve Kişiselleştirilmiş Tıp (Dönemin İkinci Yarısı).", "gorsel": {"type": "image", "query": "exit ticket student classroom reflection medical"}}, {"baslik": "Gelecek Haftaya Bakış (Dönemin İkinci Yarısı)", "altbaslik": "9. Hafta: Genomik Veri ve Kişiselleştirilmiş Tıp", "icerik": "- Konu: DNA dizileme verileri, kişiselleştirilmiş tedavi ve hasta segmentasyonu.\n- Odak: Genomik büyük veri, K-Means kümeleme algoritmasının sağlıkta kullanımı.\n- Hazırlık: Geçen dönem öğrendiğiniz K-Means kümeleme mantığını ve mesafe hesaplamalarını tekrarlayınız.", "gorsel": {"type": "image", "query": "genomics precision medicine DNA sequencing preview"}}, {"baslik": "Vaka 5: 'YZ ile Yoğun Bakım Ölüm Riski Tahmini'", "altbaslik": "Etik ve Tedaviyi Sonlandırma İkilemi", "icerik": "- Senaryo: Yoğun bakımda hastaların 48 saat içindeki mortalite riskini tahmin eden bir YZ modeli.\n- Tehlike: Hekimlerin YZ skoru yüksek (ör. %95 ölüm riski) olan yaşlı hastalara daha az müdahale etmesi (Self-fulfilling prophecy / Kendi kendini gerçekleştiren kehanet!).\n- Etik Soru: Bir algoritma yaşam destek ünitesinin kapatılması kararına etki edebilir mi?\n- Sınıf Tartışması: Model skorları klinik ekiplere nasıl sunulmalıdır?", "gorsel": {"type": "image", "query": "intensive care bioethics end of life decision AI mortality"}}, {"baslik": "Vaka 6: 'Göz Dibi Fotoğraflarından Diyabetik Retinopati'", "altbaslik": "Başarılı Bir Saha Uygulaması Örneği", "icerik": "- Başarı Hikayesi: Google Health tarafından geliştirilen ve Hindistan ile Tayland'daki kırsal kliniklerde uygulanan retinopati tarama sistemi.\n- Model Başarısı: %90+ Duyarlılık ve Özgüllük ile uzman göz doktoru seviyesinde tarama.\n- Saha Engeli: Kırsaldaki elektrik kesintileri, internet yavaşlığı ve eski fundus kameralarının lens tozlanması!\n- Çıkarım: Mükemmel algoritma bile sahadaki altyapı gerçeklerine toslayabilir.", "gorsel": {"type": "image", "query": "diabetic retinopathy fundus photography rural clinic screening"}}, {"baslik": "Vaka 7: 'Acil Serviste YZ Triyajı ve Eşitsizlik'", "altbaslik": "Sosyoekonomik Durumun Triyaj Sırasına Etkisi", "icerik": "- Olay: Bir özel hastane YZ triyaj sisteminin özel sağlık sigortası olan hastaları acil iş listesinde daha üst sıralara yerleştirdiği fark edildi.\n- Hata Kaynağı: Eğitim verisindeki geçmiş yatış süreleri sigortalı hastalarda daha uzundu ve model bunu 'daha acil hasta' olarak yorumladı!\n- Düzeltme: Modelden fatura ve sigorta değişkenlerinin tamamen çıkarılması.", "gorsel": {"type": "image", "query": "emergency room triage algorithm fairness insurance"}}, {"baslik": "Vaka 8: 'Akıllı İlaç Dolabı ve Barkod Eşleme Hatası'", "altbaslik": "Donanım-Yazılım Entegrasyon Krizi", "icerik": "- Olay: Hastane akıllı ilaç dolabı (Pyxis) benzer isimli iki ilacı (Look-Alike / Sound-Alike) yanlış çekmeceden verdi.\n- YZ Denetimi: Barkod okuma ve reçete doğrulama modülünün 'İsim benzerliği %90' uyarısını hekimin fark etmeden geçmesi.\n- Önlem: Yüksek riskli ilaçlarda (ör. Potasyum Klorür) zorunlu ikinci hemşire biyometrik doğrulaması.", "gorsel": {"type": "image", "query": "automated medication dispensing cabinet pyxis hospital pharmacy"}}, {"baslik": "Çalıştay Raporlama Şablonu: Bölüm 1 - İddia Analizi", "altbaslik": "Haber/Makale Başlığı ve Temel İddia", "icerik": "- 1. Kaynak ve Yayın Tarihi: (Hangi dergi veya haber sitesi?).\n- 2. İddia Edilen Çözüm: (Hangi klinik problemi çözüyor?).\n- 3. İddia Edilen Başarı Oranı: (Ör. '%98 Doğruluk').\n- 4. İlk Eleştirel Şüphe: (Bu başarı kulağa gerçek olamayacak kadar iyi mi geliyor?).", "gorsel": {"type": "image", "query": "critical appraisal template worksheet medical analysis"}}, {"baslik": "Çalıştay Raporlama Şablonu: Bölüm 2 - Metodoloji Denetimi", "altbaslik": "Veri ve Modelin Röntgeni", "icerik": "- 1. Veri Büyüklüğü: Kaç hasta/görüntü kullanıldı?\n- 2. Dış Doğrulama: Model başka bir hastanenin verisinde test edildi mi?\n- 3. Referans Standart: Tanılar nasıl doğrulandı (Biyopsi, Uzman paneli)?\n- 4. Veri Sızıntısı: Train ve Test setlerinde aynı hastanın verisi var mı?", "gorsel": {"type": "image", "query": "methodology checklist scientific rigor evaluation"}}, {"baslik": "Çalıştay Raporlama Şablonu: Bölüm 3 - Klinik Güvenlik", "altbaslik": "Hasta Başında Ne Olur?", "icerik": "- 1. Yanlış Pozitif Senaryosu: Sağlıklı kişiye hasta denirse ne olur? (Gereksiz tetkik/stres).\n- 2. Yanlış Negatif Senaryosu: Hasta kişiye sağlıklı denirse ne olur? (Ölüm/gecikmiş tedavi).\n- 3. Alarm Yorgunluğu Riski: Günde kaç yanlış uyarı üretebilir?\n- 4. Hekim-YZ İşbirliği: Kararı kim onaylıyor?", "gorsel": {"type": "image", "query": "patient safety risk assessment matrix clinical"}}, {"baslik": "Çalıştay Raporlama Şablonu: Bölüm 4 - Nihai Karar", "altbaslik": "Tıbbi Veri Teknikerinin Kurul Raporu", "icerik": "- Karar Seçenekleri:\n  * [A] KABUL: Klinik kullanıma ve HBYS entegrasyonuna uygundur.\n  * [B] ŞARTLI KABUL: Dış doğrulama ve alt grup analizi yapıldıktan sonra pilot denenebilir.\n  * [C] RED: Metodolojik hatalar, veri sızıntısı veya aşırı yanlış negatif riski taşımaktadır.\n- Gerekçe: Kararınızı 3 somut bilimsel gerekçeyle yazınız.", "gorsel": {"type": "image", "query": "approval stamp accepted conditional rejected clinical board"}}, {"baslik": "Grup Çalışması Dinamikleri ve Rol Dağılımı", "altbaslik": "Birlikte Başarma ve Çatışma Yönetimi", "icerik": "- Zaman Planı: 10 dk bireysel okuma -> 15 dk grup tartışması -> 5 dk rapor yazımı.\n- Rol Sorumlulukları: Her üye kendi uzmanlık alanının (Veri, Metrik, Güvenlik) savunmasını yapar.\n- Prensip: Tartışmada rütbe veya kıdem değil, bilimsel kanıt ve mantıksal argümanlar esastır.", "gorsel": {"type": "image", "query": "effective teamwork healthcare simulation problem solving"}}, {"baslik": "Sözlü Sunum ve Savunma Becerileri", "altbaslik": "Bulguları 3 Dakikada Jüriye Sunmak", "icerik": "- Asansör Konuşması (Elevator Pitch): İlk 30 saniyede vakanın can alıcı sorununu söylemek.\n- Sayısal Kanıtlar: 'Model kötü' demek yerine 'Modelin duyarlılığı sadece %68'dir ve 100 hastanın 32'sini kaçırmaktadır' demek.\n- Özgüven: Sorulan eleştirel sorulara veriye dayanarak sakin cevap vermek.", "gorsel": {"type": "image", "query": "presentation pitch student defending thesis jury"}}, {"baslik": "Ara Sınav Konu Dağılımı ve Hazırlık Rehberi", "altbaslik": "Vize Sınavında Neler Çıkacak?", "icerik": "- %25: Temel Kavramlar ve Metrik Hesaplamaları (Sensitivity, Specificity, AUC, Hata Matrisi).\n- %25: Görüntüleme ve NLP Sistemleri (DICOM, CNN, SaMD, LLM Halüsinasyon, 3T Kuralı).\n- %25: CDSS ve Sağlık Veri Standartları (HL7, FHIR JSON, Kural Tabloları, Alarm Yorgunluğu).\n- %25: Veri Kalitesi ve Giyilebilir Cihazlar (Imputation, Aykırı Değer, PPG/EKG, Anomali Tespiti).", "gorsel": {"type": "image", "query": "midterm exam preparation guide pie chart topics"}}, {"baslik": "Örnek Soru 1: Metrik Hesaplama", "altbaslik": "Ara Sınav Hazırlık Sorusu", "icerik": "- Senaryo: 200 kişilik bir grupta 50 hasta, 150 sağlıklı birey vardır. Bir test 40 hastayı ve 30 sağlıklı bireyi pozitif olarak etiketlemiştir.\n- Soru: Bu testin Duyarlılığı (Sensitivity) ve Pozitif Tahmin Değeri (PPV) nedir?\n- Çözüm:\n  * TP = 40, FN = 10 -> Duyarlılık = 40 / 50 = %80\n  * TP = 40, FP = 30 -> PPV = 40 / 70 = %57.1", "gorsel": {"type": "image", "query": "diagnostic test calculation 2x2 table math"}}, {"baslik": "Örnek Soru 2: FHIR JSON Ayrıştırma", "altbaslik": "Ara Sınav Hazırlık Sorusu", "icerik": "- Soru: Bir FHIR Observation kaynağında kan şekeri değeri 180 mg/dL olarak verilmiştir. Bir tıbbi veri teknikeri bu değerin acil durum alarmı üretmesi için CDSS motoruna hangi kuralı yazmalıdır?\n- Çözüm:\n  if resource['resourceType'] == 'Observation' and resource['code']['coding'][0]['code'] == '15074-8':\n      if resource['valueQuantity']['value'] > 140:\n          trigger_alert('Postprandiyal Hiperglisemi!')", "gorsel": {"type": "image", "query": "python code snippet FHIR rule CDSS exam question"}}, {"baslik": "Örnek Soru 3: Veri Kalitesi Kararı", "altbaslik": "Ara Sınav Hazırlık Sorusu", "icerik": "- Senaryo: Bir veri setinde hastaların %40'ının 'Sigara Kullanımı' bilgisi boştur.\n- Soru: Bu sütun ortalama ile doldurulabilir mi? Neden?\n- Çözüm: Hayır! Sigara kullanımı kategorik (Evet/Hayır) bir değişkendir, ortalaması alınamaz. En sık değer (Mod) veya çoklu atama (MICE) kullanılmalı ya da eksiklik oranı çok yüksekse sütun elenmelidir.", "gorsel": {"type": "image", "query": "missing data categorical variable exam analysis"}}, {"baslik": "Çalıştay Değerlendirme Sonuçları ve Başarı Belgeleri", "altbaslik": "Sınıf İçi Sıralama ve Geribildirim", "icerik": "- En İyi Metodoloji Eleştirisi Ödülü: Grup Delta (COVID-19 Yanılgısı).\n- En İyi Klinik Risk Analizi Ödülü: Grup Beta (Sepsis Alarm Yorgunluğu).\n- En İyi Sunum ve Görselleştirme Ödülü: Grup Alfa.\n- Tüm öğrencilerimize aktif katılımları ve bilimsel olgunlukları için teşekkür ederiz!", "gorsel": {"type": "image", "query": "awards ceremony classroom student achievement trophies"}}, {"baslik": "Eleştirel Düşüncenin Gücü: Meslek Hayatında Bir Adım Önde", "altbaslik": "Teknikerlikten Karar Vericiliğe", "icerik": "- Unutmayın: Bir YZ yazılımını sadece kullanmak sizi teknisyen yapar; onu eleştirebilmek, açıklarını bulmak ve denetleyebilmek sizi vazgeçilmez bir 'Uzman' yapar.\n- Bu çalıştayın kazandırdığı sorgulayıcı zihin yapısı ömür boyu en büyük mesleki sermayeniz olacaktır.", "gorsel": {"type": "image", "query": "critical thinking leadership medical informatics career"}}, {"baslik": "Dönem Arası Motivasyon ve Yol Haritası", "altbaslik": "Dönemin İkinci Yarısında Neler Var?", "icerik": "- 9. Hafta: Genomik Veri ve Kişiselleştirilmiş Tıp (K-Means ile DNA analizi).\n- 10. Hafta: İlaç Geliştirme ve Klinik Araştırmalar (p-değeri, Güven aralığı).\n- 11. Hafta: Veri Mahremiyeti ve KVKK (Anonimleştirme, k-anonimlik).\n- 12. Hafta: Algoritmik Yanlılık ve Adillik (Bias, Eşitsizlik).\n- 13. Hafta: Sektörden Bakış ve Kariyer.\n- 14. Hafta: Final Projesi Savunması.", "gorsel": {"type": "image", "query": "curriculum roadmap second half semester journey"}}, {"baslik": "Vize Sınavı Başarı Dilekleri", "altbaslik": "Kendinize Güvenin!", "icerik": "- Sınav Kuralları: Sakin okuyunuz, senaryoyu iyi analiz ediniz, ezber cevaplar yerine klinik mantık yürütünüz.\n- Hepinize vize sınavında üstün başarılar dileriz!", "gorsel": {"type": "image", "query": "good luck on exam student success classroom"}}, {"baslik": "Dönemin İkinci Yarısına Giriş", "altbaslik": "Biyoinformatik ve İleri Konulara Merhaba", "icerik": "- Gelecek hafta DNA dizilerine, mutasyonlara ve kişiye özel akıllı tedavilere adım atıyoruz.\n- İyi tatiller ve başarılar!", "gorsel": {"type": "image", "query": "dna double helix science medicine future"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • Medikal YZ & Teşhis`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
</body>
</html>
