<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nesne Tabanlı Programlama II - Hafta 09 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #8b5cf6;
            --accent-glow: #8b5cf640;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --code-bg: #1e293b;
            --nav-bg: rgba(241, 245, 249, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header / Top Progress */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #38bdf8);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
            text-decoration: none;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-1px);
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 60px;
            margin-bottom: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1100px;
            min-height: 520px;
            max-height: calc(100vh - 160px);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .slide-header {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg-card-border);
            padding-bottom: 16px;
        }

        .slide-meta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slide-title {
            font-size: 2.1rem;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-subtitle {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 6px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 14px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .content-list-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--accent-color);
            padding: 12px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1.05rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        .visual-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Bottom Nav Controller */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 1.05rem;
            min-width: 90px;
            text-align: center;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--bg-card-border);
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 40px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.03);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .slide-card {
                padding: 24px;
                min-height: 440px;
            }
            .slide-title {
                font-size: 1.5rem;
            }
            .bottom-nav {
                padding: 0 12px;
            }
            .btn-nav span {
                display: none;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "NTP II: Hafta 9", "altbaslik": "Pydantic ve Veri Doğrulama (Data Validation)", "icerik": "Program: Bilgisayar Programcılığı (Önlisans)\nDers: Nesne Tabanlı Programlama II\nEğitmen: Öğr. Gör. Süleyman EZDEMİR\nKurum: Giresun Üniversitesi\nHaftalık Odak: Pydantic BaseModel, Field Kısıtlamaları, POST İstekleri ve 422 Doğrulama Hataları\nUygulama Teması: Kütüphane Kitap Kayıt & Öğrenci Başvuru Formu", "gorsel": {"type": "image", "query": "pydantic data validation schema form web api"}}, {"baslik": "Motivasyon: Kullanıcı Fiyat Yerine Harf Yazarsa?", "altbaslik": "Web Formlarında Akıllı Bekçi İhtiyacı", "icerik": "Bir web formunda:\n- Öğrenci yaşına '-5' yazılırsa,\n- Kitap sayfa sayısına 'beş yüz' yazılırsa,\n- E-posta yerine anlamsız metin girilirse ne olur?\nVeritabanımız bozulur ve sistem kilitlenir!\nİşte Pydantic, gelen veriyi veritabanına girmeden önce denetleyen süper zeki bekçidir.", "gorsel": {"type": "image", "query": "form validation error checkmark cross website"}}, {"baslik": "Pydantic Nedir?", "altbaslik": "Python Tip Belirteçleriyle Veri Modelleme", "icerik": "Pydantic, Python'ın en popüler veri doğrulama kütüphanesidir:\n- Sınıflarımızı `BaseModel`'den türetiriz.\n- Belirttiğimiz tiplere (str, int, float, bool) uyulmasını zorunlu kılar.\n- Yanlış veya eksik veri geldiğinde otomatik olarak detaylı hata mesajı (422) üretir.\n- FastAPI'nin arka planındaki gizli güçtür.", "gorsel": {"type": "image", "query": "pydantic logo data structure validation shield"}}, {"baslik": "Pydantic BaseModel Tanımlama", "altbaslik": "Kitap Kayıt Şablonu", "icerik": "from pydantic import BaseModel\n\nclass KitapKayit(BaseModel):\n    baslik: str\n    yazar: str\n    sayfa_sayisi: int\n    fiyat: float\n    mevcut_mu: bool = True  # Varsayılan değer", "gorsel": {"type": "image", "query": "python code pydantic class basemodel"}}, {"baslik": "Field ile Gelişmiş Kısıtlamalar", "altbaslik": "Sayı ve Metin Sınırları Koymak", "icerik": "from pydantic import BaseModel, Field\n\nclass KitapKayit(BaseModel):\n    baslik: str = Field(..., min_length=2, description='Kitap Adı')\n    sayfa_sayisi: int = Field(..., gt=0, description='Sayfa 0\\'dan büyük olmalı')\n    yayin_yili: int = Field(2024, ge=1800, le=2026)\n\n- `...`: Bu alanın ZORUNLU olduğunu belirtir.\n- `gt=0`: 0'dan büyük (greater than)\n- `ge=1800`: 1800'den büyük veya eşit", "gorsel": {"type": "image", "query": "input constraints rules validation settings"}}, {"baslik": "E-posta Doğrulaması (EmailStr)", "altbaslik": "Otomatik @ ve Domain Kontrolü", "icerik": "Pydantic e-posta formatını tek satırda denetleyebilir:\n\nfrom pydantic import BaseModel, EmailStr\n\nclass UyeKayit(BaseModel):\n    ad: str\n    eposta: EmailStr  # @ ve .com yoksa anında hata verir!", "gorsel": {"type": "image", "query": "email format validation checkmark inbox"}}, {"baslik": "HTTP POST Metodu Nedir?", "altbaslik": "Sunucuya Yeni Veri Göndermek", "icerik": "GET sadece okurken; POST sunucuya yeni bir kayıt kaydetmek için kullanılır.\n- Veriler URL'de değil, İstek Gövdesinde (Request Body / JSON) gizli ve güvenli gider.\n- `@app.post('/kitaplar', status_code=201)` ile tanımlanır (201 Created).", "gorsel": {"type": "image", "query": "http post request envelope data transfer"}}, {"baslik": "POST Endpoint ile Kitap Kaydetme", "altbaslik": "Pydantic ile FastAPI'yi Birleştirmek", "icerik": "from fastapi import FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI()\nkutuphane = []  # Geçici bellek listemiz\n\n@app.post('/kitaplar', status_code=201)\ndef kitap_ekle(kitap: KitapKayit):\n    yeni_veri = kitap.model_dump()  # Modeli Python sözlüğüne çevirir\n    yeni_veri['id'] = len(kutuphane) + 1\n    kutuphane.append(yeni_veri)\n    return {'mesaj': 'Kitap başarıyla eklendi! 🎉', 'kitap': yeni_veri}", "gorsel": {"type": "image", "query": "saving data server database success"}}, {"baslik": "Swagger UI'da POST Sihri!", "altbaslik": "Otomatik JSON Formu", "icerik": "Tarayıcıda `/docs` sayfasına gidin:\n- `POST /kitaplar` butonunun yeşil renkli olduğunu göreceksiniz.\n- İçine tıkladığınızda otomatik doldurulabilir örnek bir JSON şablonu çıkacaktır:\n  {\n    \"baslik\": \"Nutuk\",\n    \"yazar\": \"Atatürk\",\n    \"sayfa_sayisi\": 600,\n    \"fiyat\": 150.0\n  }\n- 'Execute' dediğinizde veriniz sunucuya kaydedilir!", "gorsel": {"type": "image", "query": "swagger ui post form input interactive documentation"}}, {"baslik": "Otomatik 422 Doğrulama Hatası", "altbaslik": "FastAPI Hataları Kendisi Yakalar", "icerik": "Swagger UI formunda `sayfa_sayisi` kutusuna `-50` veya `\"yüz\"` yazıp Execute deyin:\n- FastAPI anında `422 Unprocessable Entity` hatası döner.\n- Hatanın hangi alanda olduğunu ('loc': ['body', 'sayfa_sayisi']) ve sebebini Türkçe/İngilizce açıkça söyler.\n- Tek satır if-else yazmadan güvenli form elde ettiniz!", "gorsel": {"type": "image", "query": "http 422 validation error message json response"}}, {"baslik": "Laboratuvar Döngüsü 1: Kitap Şeması Oluşturma", "altbaslik": "Adım Adım Kodluyoruz", "icerik": "PyCharm'da `main.py` içine:\n1. `from pydantic import BaseModel, Field` ekleyin.\n2. `KitapKayit` şemasını yazın.\n3. `POST /kitaplar` endpoint'ini oluşturun.\n4. `/docs` üzerinden ilk kitabı kaydedin.", "gorsel": {"type": "image", "query": "coding pycharm editor pydantic model"}}, {"baslik": "Laboratuvar Döngüsü 2: Kitapları Listeleme (GET)", "altbaslik": "Eklenen Kitapları Görmek", "icerik": "@app.get('/kitaplar')\ndef kitaplari_getir():\n    return {\n        'toplam_kitap': len(kutuphane),\n        'kitaplar': kutuphane\n    }\n\nPOST ile 3 kitap ekledikten sonra GET /kitaplar çağırıp listenin büyüdüğünü izleyin!", "gorsel": {"type": "image", "query": "book catalog list display api response"}}, {"baslik": "Laboratuvar Döngüsü 3: Öğrenci Kayıt Formu", "altbaslik": "Yaş ve GPA Kısıtlamaları", "icerik": "class OgrenciBasvuru(BaseModel):\n    ad: str = Field(..., min_length=2)\n    soyad: str = Field(..., min_length=2)\n    yas: int = Field(..., ge=17, le=40)\n    gpa: float = Field(..., ge=0.0, le=4.0)\n\n@app.post('/ogrenciler/kayit')\ndef ogrenci_kayit(ogr: OgrenciBasvuru):\n    return {'durum': 'Başvuru Onaylandı 🎓', 'veri': ogr}", "gorsel": {"type": "image", "query": "university admission application form graduation"}}, {"baslik": "Laboratuvar Döngüsü 4: İsteğe Bağlı Alanlar (Optional)", "altbaslik": "Zorunlu Olmayan Bilgiler", "icerik": "from typing import Optional\n\nclass ProfilFormu(BaseModel):\n    kullanici_adi: str\n    eposta: str\n    biyografi: Optional[str] = None  # Doldurmak zorunlu değil\n    telefon: Optional[str] = 'Belirtilmedi'", "gorsel": {"type": "image", "query": "optional form fields profile settings"}}, {"baslik": "Çözümlü Uygulama 1: Kafe Sipariş Formu", "altbaslik": "Masa ve Ürün Siparişi", "icerik": "class SiparisFormu(BaseModel):\n    masa_no: int = Field(..., ge=1, le=50)\n    urun: str\n    adet: int = Field(1, gt=0)\n\n@app.post('/kafe/siparis')\ndef siparis_al(siparis: SiparisFormu):\n    return {'mesaj': f'Masa {siparis.masa_no} için {siparis.adet} adet {siparis.urun} mutfağa iletildi.'}", "gorsel": {"type": "image", "query": "digital order ticket kitchen restaurant cafe"}}, {"baslik": "Çözümlü Uygulama 2: Yemekhane Bakiye Yükleme", "altbaslik": "Tutar Doğrulama", "icerik": "class BakiyeYukleme(BaseModel):\n    kart_no: str = Field(..., min_length=5)\n    tutar: float = Field(..., ge=10.0, le=1000.0)\n\n@app.post('/yemekhane/yukle')\ndef yukleme_yap(islem: BakiyeYukleme):\n    return {'durum': 'Yüklendi', 'kart': islem.kart_no, 'miktar': islem.tutar}", "gorsel": {"type": "image", "query": "credit card top up balance terminal payment"}}, {"baslik": "Response Model ile Çıktı Süzme", "altbaslik": "Gizli Verileri Kullanıcıya Göstermemek", "icerik": "class KullaniciKayit(BaseModel):\n    kullanici_adi: str\n    sifre: str  # Gelen şifre\n\nclass KullaniciYanit(BaseModel):\n    kullanici_adi: str  # Şifre gizlendi!\n\n@app.post('/kayit', response_model=KullaniciYanit)\ndef kaydol(k: KullaniciKayit):\n    return k  # FastAPI response_model sayesinde sifre alanını otomatik filtreler!", "gorsel": {"type": "image", "query": "data filter security response model mask"}}, {"baslik": "Özel Doğrulayıcılar: @field_validator", "altbaslik": "Kendi Özel Kurallarımızı Yazmak", "icerik": "from pydantic import field_validator\n\nclass SifreFormu(BaseModel):\n    sifre: str\n\n    @field_validator('sifre')\n    @classmethod\n    def sifre_guclu_mu(cls, v):\n        if len(v) < 6:\n            raise ValueError('Şifre en az 6 karakter olmalıdır!')\n        return v", "gorsel": {"type": "image", "query": "password strength validator lock"}}, {"baslik": "Kod Okuma Alıştırması 1", "altbaslik": "Hatanın Sebebini Bulun", "icerik": "Hatalı Kod:\nclass Urun(BaseModel):\n    fiyat: float = Field(..., lt=0)\n\nProblem Nedir?\n`lt=0` (less than 0) fiyatın 0'dan KÜÇÜK olmasını zorunlu kılar! Eksi fiyatlı ürün girilemez.\nDoğrusu: `gt=0` (greater than 0) olmalıdır.", "gorsel": {"type": "image", "query": "logic error math condition bug"}}, {"baslik": "Kod Okuma Alıştırması 2", "altbaslik": "Çıktıyı Tahmin Edin", "icerik": "class Form(BaseModel):\n    yas: int = 18\n\nGelen JSON: `{}` (Boş veri)\nÇıktı: `{'yas': 18}` (Varsayılan değer otomatik devreye girer).", "gorsel": {"type": "image", "query": "default value fallback configuration"}}, {"baslik": "Sık Yapılan Hatalar", "altbaslik": "Pydantic Kullanırken 3 Hata", "icerik": "1. `BaseModel`'den miras almayı unutmak (Düz sınıf olursa doğrulama çalışmaz).\n2. `model_dump()` yerine eski Python sürümlerindeki `.dict()` metodunu kullanmak.\n3. POST endpoint'inde durum kodunu (status_code=201) belirtmemek.", "gorsel": {"type": "image", "query": "warning checklist code quality caution"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "BaseModel", "icerik": "Soru: Pydantic şeması oluştururken sınıflar hangi temel sınıftan türetilmelidir?\nA) Object\nB) BaseModel\nC) SchemaModel\nD) FastAPIModel\n\nDoğru Cevap: B (BaseModel).", "gorsel": {"type": "image", "query": "quiz test examination classroom students"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "HTTP Durum Kodu", "icerik": "Soru: Pydantic doğrulamasından geçemeyen geçersiz bir istek geldiğinde FastAPI hangi HTTP durum kodunu döner?\nA) 200 OK\nB) 404 Not Found\nC) 422 Unprocessable Entity\nD) 500 Server Error\n\nDoğru Cevap: C (422 Unprocessable Entity).", "gorsel": {"type": "image", "query": "http status code 422 error badge"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Field Özellikleri", "icerik": "Soru: Bir alanın 10 ile 100 arasında olmasını zorunlu kılan Field yazımı hangisidir?\nA) Field(min=10, max=100)\nB) Field(ge=10, le=100)\nC) Field(start=10, end=100)\nD) Field(between=[10, 100])\n\nDoğru Cevap: B (ge=greater/equal, le=less/equal).", "gorsel": {"type": "image", "query": "range slider validation boundary values"}}, {"baslik": "Sektörel Vaka: Bankacılık Form Güvenliği", "altbaslik": "Eksi Para Transferini Engellemek", "icerik": "Gerçek Dünyada:\nBir havale formunda kullanıcı transfer tutarına `-5000` yazarak karşı taraftan para çalmayı denemiştir.\nPydantic katmanında `tutar: float = Field(..., gt=0)` kuralı olduğu için istek sunucu veritabanına ulaşamadan 422 ile kapıda engellenmiştir.", "gorsel": {"type": "image", "query": "bank transaction security firewall validation"}}, {"baslik": "Ders Sonu Görevi (Boss Fight)", "altbaslik": "Kütüphane Kitap & Üye Kayıt API'si", "icerik": "Göreviniz:\n1. `UyeKayitFormu` şeması oluşturun:\n   - `ad_soyad` (min 3 karakter)\n   - `ogrenci_no` (tam 5 haneli)\n   - `eposta` (str)\n2. `POST /uyeler` endpoint'i ile üyeyi listeye ekleyin.\n3. `GET /uyeler` ile kayıtlı üyeleri listeleyin.\n4. Swagger UI üzerinde geçersiz öğrenci no ile 422 hatasını, doğru veri ile 201 kaydını test edin.\n\nSüre: 30 Dakika | Tek Başınıza Tamamlayınız!", "gorsel": {"type": "image", "query": "student registration task coding mission"}}, {"baslik": "Boss Fight İçin İskelet Kod", "altbaslik": "Başlangıç Desteği", "icerik": "class UyeKayitFormu(BaseModel):\n    ad_soyad: str = Field(..., min_length=3)\n    ogrenci_no: str = Field(..., min_length=5, max_length=5)\n    eposta: str\n\nuyeler_db = []\n@app.post('/uyeler', status_code=201)\ndef uye_ekle(uye: UyeKayitFormu):\n    # siz tamamlayınız...", "gorsel": {"type": "image", "query": "hints blueprint solution code help"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Kazandık?", "icerik": "- Pydantic verileri veritabanına girmeden önce filtreleyen akıllı kalkandır.\n- BaseModel ve Field ile zorunlu alanlar ve aralık sınırları konur.\n- POST metodu ile sunucuya güvenli veri paketleri gönderilir.\n- Geçersiz girdilerde FastAPI otomatik 422 hata yanıtı verir.", "gorsel": {"type": "image", "query": "summary roadmap achievements university"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 10: Kalıcı Veritabanı: SQLite ve SQLAlchemy (CRUD)", "icerik": "Ön Hazırlık:\n- Sunucuyu kapatıp açtığımızda verilerin silinmesini nasıl engelleriz?\n- SQLite veritabanı dosyası nasıl oluşturulur?\n- SQLAlchemy ORM ile Python sınıflarını veritabanı tablolarına dönüştüreceğiz!", "gorsel": {"type": "image", "query": "sqlite database storage persistence sqlalchemy"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Laboratuvardan Çıkmadan Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Pydantic ile bir UrunFormu tanımlayın (urun_adi: str, fiyat: float 0\\'dan büyük olmalı). Sınıf kodunu kâğıda yazınız.'\n\nİyi çalışmalar!", "gorsel": {"type": "image", "query": "exit ticket examination university"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • OOP & Mimari`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 50) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
