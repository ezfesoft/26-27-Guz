<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nesne Tabanlı Programlama II - Hafta 01 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #7c3aed;
            --accent-glow: #7c3aed25;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

ci)\n\nKullanıcı Enter tuşuna basana kadar program beklemede kalır.", "gorsel": {"type": "image", "query": "keyboard user input typing command line interface"}}, {"baslik": "BÜYÜK TUZAK: input() Her Zaman Metin Döner!", "altbaslik": "Daktilo Gibi Kopyalayanların En Çok Düştüğü Çukur", "icerik": "input() ile klavyeden '5' yazsanız bile Python bunu 5 (sayı) değil, '5' (yazı) olarak alır!\n\nsayi1 = input('1. Sayı: ')  # Kullanıcı 2 girdi\nsayi2 = input('2. Sayı: ')  # Kullanıcı 3 girdi\ntoplam = sayi1 + sayi2\nprint(toplam)  # ÇIKTI: 23 (Yan yana yapıştırdı, toplamadı!)", "gorsel": {"type": "image", "query": "warning trap bug error programming alert"}}, {"baslik": "Tip Dönüşümü (Type Casting)", "altbaslik": "Metni Sayıya Çevirme Zorunluluğu", "icerik": "Metin olarak gelen girdileri matematiksel işlemlere sokabilmek için dönüştürmeliyiz:\n\nint('123')    -> 123 (Tam sayıya çevirir)\nfloat('45.5') -> 45.5 (Ondalıklı sayıya çevirir)\nstr(30)       -> '30' (Metne çevirir)\n\nDoğru Toplama:\nsayi1 = int(input('1. Sayı: '))\nsayi2 = int(input('2. Sayı: '))\nprint(sayi1 + sayi2)  # 5", "gorsel": {"type": "image", "query": "data type conversion transformation arrows"}}, {"baslik": "f-String ile Şık Çıktılar Üretme", "altbaslik": "Artı (+) ile Metin Birleştirmeye Son!", "icerik": "Eski Yöntem:\nprint('Merhaba ' + ad + ' yaşınız: ' + str(yas))\n\nModern ve Okunabilir Yöntem (f-string):\nprint(f'Merhaba {ad}, yaşınız: {yas}')\n\nf harfi metnin başına konur ve süslü parantez {} içine değişkenler yazılır.", "gorsel": {"type": "image", "query": "string formatting code clean template"}}, {"baslik": "Parasal Çıktılarda Kuruş Hassasiyeti", "altbaslik": ":.2f Format Belirteci", "icerik": "Bölme işlemlerinde 33.3333333 gibi çirkin çıktılar yerine virgülden sonra 2 basamak sabitlemek için :.2f kullanılır:\n\nfiyat = 100 / 3\nprint(f'Tutar: {fiyat:.2f} TL')\n# Çıktı: Tutar: 33.33 TL\n\nBu format kasa ve fatura çıktılarında sektörel standarttır.", "gorsel": {"type": "image", "query": "calculator price currency finance digits"}}, {"baslik": "Laboratuvar Döngüsü 1: Kafe Karşılama", "altbaslik": "Adım Adım Birlikte Kodluyoruz", "icerik": "Hedef: Müşteri adını ve masa numarasını alıp karşılama mesajı üretmek.\n\nKod:\nmusteri_adi = input('Müşteri Adı: ')\nmasa_no = int(input('Masa Numarası: '))\n\nprint(f'Masa {masa_no} için hoş geldin {musteri_adi}!')", "gorsel": {"type": "image", "query": "coffee shop pos system welcoming screen"}}, {"baslik": "Laboratuvar Döngüsü 2: Tutar Hesaplama", "altbaslik": "Birim Fiyat x Adet Çarpımı", "icerik": "Hedef: Çay adedi ve birim fiyat üzerinden ara toplam bulmak.\n\nKod:\ncay_fiyati = 15.0\ncay_adedi = int(input('Kaç bardak çay içildi? '))\n\ntoplam_tutar = cay_adedi * cay_fiyati\nprint(f'{cay_adedi} adet çay = {toplam_tutar:.2f} TL')", "gorsel": {"type": "image", "query": "tea glasses on tray cafe billing"}}, {"baslik": "Laboratuvar Döngüsü 3: İndirimli Sipariş Fişi", "altbaslik": "Tam Bir Kasa Fişi Tasarımı", "icerik": "Kod:\nmusteri = input('Müşteri Adı: ')\ncay_sayisi = int(input('Çay Adedi: '))\ntost_sayisi = int(input('Tost Adedi: '))\n\nara_toplam = (cay_sayisi * 15.0) + (tost_sayisi * 50.0)\nogrenci_tutari = ara_toplam * 0.90  # %10 İndirim\n\nprint('='*30)\nprint(f'Müşteri: {musteri}')\nprint(f'Öğrenci Fiyatı: {ogrenci_tutari:.2f} TL')", "gorsel": {"type": "image", "query": "printed paper receipt bill payment counter"}}, {"baslik": "Kod Okuma Alıştırması 1", "altbaslik": "Bu Kodun Çıktısı Ne Olur?", "icerik": "Soru:\nx = '10'\ny = '20'\nprint(x + y)\n\nSeçenekler:\nA) 30\nB) 1020\nC) Hata verir\nD) 10 20\n\nCevap: B ('10' ve '20' metin (str) olduğu için yan yana yapışır).", "gorsel": {"type": "image", "query": "quiz test choice examination question"}}, {"baslik": "Kod Okuma Alıştırması 2", "altbaslik": "Hatanın Sebebini Bulun", "icerik": "Hatalı Kod:\nboy = input('Boyunuz (m): ')\nkilo = input('Kilonuz (kg): ')\nsonuc = kilo / (boy * boy)\n\nProblem Nedir?\ninput() str döndürdüğü için metinler birbirine bölünemez (TypeError).\nÇözüm: float(input(...)) kullanılmalıdır.", "gorsel": {"type": "image", "query": "debugging finding bugs code error screen"}}, {"baslik": "Sık Yapılan Hatalar ve Kaçınma Yolları", "altbaslik": "Yeni Başlayanların 4 Kritik Hatası", "icerik": "1. int() veya float() dönüşümünü unutmak.\n2. Değişken isimlerinde Türkçe karakter (ç, ş, ğ, ı, ö, ü) veya boşluk kullanmak.\n3. f-string yazarken metnin başına f koymayı unutmak.\n4. Ekrana basılan metinleri tırnak ('...') içine almamak.", "gorsel": {"type": "image", "query": "checklist warning error prevention software"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Değişken Adlandırma", "icerik": "Soru: Hangisi PEP 8 kurallarına göre doğru bir değişken adıdır?\nA) 1urun_fiyati\nB) urun fiyati\nC) urun_fiyati\nD) Urun-Fiyati\n\nDoğru Cevap: C (snake_case standartına uygundur, sayı ile başlamaz).", "gorsel": {"type": "image", "query": "multiple choice question classroom student test"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Veri Tipleri", "icerik": "Soru: ogrenci_mi = False satırındaki değişkenin tipi nedir?\nA) str\nB) int\nC) float\nD) bool\n\nDoğru Cevap: D (Mantıksal tiptir, sadece True veya False alır).", "gorsel": {"type": "image", "query": "boolean logic true false switch digital"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Format Belirteçleri", "icerik": "Soru: print(f'{15.789:.1f}') kodunun ekran çıktısı nedir?\nA) 15.7\nB) 15.8\nC) 15.789\nD) 16\n\nDoğru Cevap: B (Virgülden sonra 1 basamağa yuvarlar -> 15.8).", "gorsel": {"type": "image", "query": "mathematics rounding decimal point display"}}, {"baslik": "Sektörel Vaka: Market Kasa Yazılımı", "altbaslik": "Tip Dönüşümü İhmal Edilirse Ne Olur?", "icerik": "Gerçek Yaşam Senaryosu:\nBir süpermarket otomasyonunda barkod okuyucudan gelen adet verisi '2' (str) olarak sisteme girmiştir. Fiyat ise '100' TL'dir.\nTip dönüşümü yapılmadığında sistem çarpma yerine hata verip kasayı kilitlemiştir.\nSonuç: Tip güvenliği ve dönüşümler ticari yazılımların omurgasıdır.", "gorsel": {"type": "image", "query": "supermarket barcode scanner cash register terminal"}}, {"baslik": "Ders Sonu Görevi (Boss Fight)", "altbaslik": "Günün Menüsü Sipariş Otomasyonu", "icerik": "Göreviniz:\n1. Müşteri adını ve öğrenci olup olmadığını (Evet/Hayır) input ile alın.\n2. Günün yemeği (80 TL) ve içecek (25 TL) adetlerini sorun.\n3. Toplam tutarı hesaplayın.\n4. Öğrenci ise %15 indirim uygulayın.\n5. Fişi ekrana okunaklı şekilde bastırın.\n\nSüre: 30 Dakika | Tek Başınıza Tamamlayınız!", "gorsel": {"type": "image", "query": "coding challenge task target mission student"}}, {"baslik": "Boss Fight İçin İpucu ve İskelet Kod", "altbaslik": "Takılanlar İçin Başlangıç Desteği", "icerik": "# İskelet Yapı:\nmusteri = input('Müşteri: ')\nyemek_adet = int(input('Yemek Adedi: '))\nicecek_adet = int(input('İçecek Adedi: '))\n\ntutar = (yemek_adet * 80) + (icecek_adet * 25)\n# İndirim hesabını siz tamamlayınız...\nprint(f'Ödenecek Tutar: {tutar:.2f} TL')", "gorsel": {"type": "image", "query": "hint lightbulb idea solution support"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Bugün Neler Kazandık?", "icerik": "- Python girintilemeye (Tab) dayalı, okunabilir bir dildir.\n- Değişkenler bellekteki nesnelere yapıştırılan etiketlerdir.\n- int, float, str, bool temel 4 veri tipidir.\n- input() daima metin döner; sayılar için int() veya float() şarttır.\n- f-string ve :.2f ile temiz ve profesyonel çıktılar üretilir.", "gorsel": {"type": "image", "query": "summary checklist accomplishments graduation cap"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 2: Veri Yapıları (Listeler ve Sözlükler)", "icerik": "Ön Hazırlık:\n- Yüzlerce şarkıyı tek tek değişkene yazmak yerine tek bir listede nasıl tutarız?\n- Spotify çalma listesi nasıl kodlanır?\n- Telefon rehberi ve JSON mantığı nasıl çalışır?\nGelecek hafta listeleri ve sözlükleri keşfedeceğiz!", "gorsel": {"type": "image", "query": "music playlist digital interface spotify list"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Laboratuvardan Çıkmadan Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Kullanıcıdan fiyatı 45.75 TL olan bir ürün için adet alan ve toplam tutarı ekrana basan 3 satırlık Python kodunu kâğıda yazıp teslim ediniz.'\n\nİyi çalışmalar!", "gorsel": {"type": "image", "query": "exit ticket examination paper university"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • OOP & Mimari`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
