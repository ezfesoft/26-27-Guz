    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #7c3aed;
            --accent-glow: #7c3aed25;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 140px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
            gap: 6px;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-decoration: none;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: transparent;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 75px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .top-bar {
                padding: 0 10px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 60px;
            }
            .slide-card {
                padding: 20px 16px;
                min-height: 380px;
                max-height: calc(100vh - 124px);
            }
            .slide-title {
                font-size: 1.3rem;
            }
            .slide-subtitle {
                font-size: 0.95rem;
            }
            .slide-body {
                font-size: 0.92rem;
                line-height: 1.55;
            }
            .content-list-item {
                font-size: 0.88rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 8px;
            }
            .btn-nav {
                padding: 7px 10px;
                font-size: 0.8rem;
            }
            .nav-text {
                display: inline;
            }
            .slide-counter {
                font-size: 0.8rem;
                min-width: 60px;
                padding: 5px 8px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }
        }
    </style>

    <script>
        const slides = [{"baslik": "NTP II: Hafta 5", "altbaslik": "Kapsülleme ve Çok Biçimlilik", "icerik": "Program: Bilgisayar Programcılığı (Önlisans)\nDers: Nesne Tabanlı Programlama II\nEğitmen: Öğr. Gör. Süleyman EZDEMİR\nKurum: Giresun Üniversitesi\nHaftalık Odak: Veri Gizleme (Private __), Getter/Setter, Dinamik Çok Biçimlilik ve Gevşek Bağlılık\nUygulama Teması: Güvenli Banka/Yemekhane Kartı ve Kasada Çok Biçimli Ödeme Yöntemleri", "gorsel": {"type": "image", "query": "encapsulation polymorphism security object oriented programming"}}, {"baslik": "Motivasyon: Bakiyeyi Doğrudan Değiştirebilir miyiz?", "altbaslik": "Kontrolsüz Veri Girişi Sistemi Batırır!", "icerik": "Bir banka hesabı nesnesinde hesap.bakiye = -999999 yazılmasına izin verirsek ne olur?\n- Kötü niyetli kullanıcılar veya hatalı kodlar veritabanını bozar.\n- Verileri doğrudan dışarıya açmak yerine korumalı bir kasanın içine koymalıyız.\n- Bu koruma kalkanına Kapsülleme (Encapsulation) denir.", "gorsel": {"type": "image", "query": "safe vault lock banking security data protection"}}, {"baslik": "Kapsülleme (Encapsulation) Nedir?", "altbaslik": "Veri Gizleme (Data Hiding)", "icerik": "Kapsülleme, nesnenin durumunu (niteliklerini) dış müdahalelerden gizlemek ve verilere sadece belirlenen kurallı metotlarla erişilmesini sağlamaktır.\n- Veri Bütünlüğü: Eksi para yatırılamaz, geçersiz yaş girilemez.\n- Güvenlik: Kritik bilgiler dışarıdan rastgele bozulamaz.\n- Bakım Kolaylığı: İç kod değişse bile dışarıdaki kullanıcı etkilenmez.", "gorsel": {"type": "image", "query": "capsule pill data security shield shield"}}, {"baslik": "Python'da Erişim Belirleyicileri", "altbaslik": "Public, Protected ve Private", "icerik": "1. Public (Genel): Her yerden doğrudan erişilebilir (`self.ad`)\n2. Protected (Korumalı): Sadece kendi ve alt sınıflar erişmeli (`self._bakiye`)\n3. Private (Özel/Gizli): Dışarıdan doğrudan ERİŞİLEMEZ (`self.__bakiye`)\n\nPython'da çift alt çizgi (__) niteliği private yapar ve Name Mangling uygular.", "gorsel": {"type": "image", "query": "access control privacy padlock levels"}}, {"baslik": "Private Nitelik Tanımlama Örneği", "altbaslik": "Korumalı Banka Hesabı", "icerik": "class BankaHesabi:\n    def __init__(self, sahip, bakiye):\n        self.sahip = sahip\n        self.__bakiye = 0.0  # Private nitelik!\n        self.para_yatir(bakiye)\n\nh = BankaHesabi('Ahmet', 100)\n# print(h.__bakiye)  -> HATA VERİR (AttributeError)!", "gorsel": {"type": "image", "query": "private banking lock access denied"}}, {"baslik": "Getter Metotları (Okuma Kapısı)", "altbaslik": "Veriyi Sadece Görme İzni Vermek", "icerik": "Getter (Erişici), gizli veriyi dışarıya sadece okuma amacıyla sunan metottur:\n\nclass BankaHesabi:\n    # ...\n    def bakiye_ogren(self):  # Getter\n        return self.__bakiye\n\nh = BankaHesabi('Ahmet', 100)\nprint('Bakiye:', h.bakiye_ogren())  # Güvenli okuma: 100.0 TL", "gorsel": {"type": "image", "query": "read only document glass window display"}}, {"baslik": "Setter Metotları (Yazma & Denetim Kapısı)", "altbaslik": "İş Kuralları ve Doğrulama", "icerik": "Setter (Değiştirici), veriyi değiştirmeden önce kuralları denetleyen bekçidir:\n\nclass BankaHesabi:\n    # ...\n    def para_yatir(self, miktar):\n        if miktar > 0:\n            self.__bakiye += miktar\n            print(f'{miktar} TL yatırıldı. Yeni bakiye: {self.__bakiye} TL')\n        else:\n            print('HATA: Yatırılacak tutar 0\\'dan büyük olmalıdır!')", "gorsel": {"type": "image", "query": "security guard checkpoint validation gate"}}, {"baslik": "Para Çekme Metodu ve Bakiye Kontrolü", "altbaslik": "Eksiye Düşmeyi Önleme", "icerik": "class BankaHesabi:\n    # ...\n    def para_cek(self, miktar):\n        if 0 < miktar <= self.__bakiye:\n            self.__bakiye -= miktar\n            print(f'{miktar} TL çekildi. Kalan: {self.__bakiye} TL')\n        else:\n            print('HATA: Yetersiz bakiye veya geçersiz tutar!')", "gorsel": {"type": "image", "query": "atm cash withdrawal money transaction"}}, {"baslik": "Çok Biçimlilik (Polymorphism) Nedir?", "altbaslik": "Aynı Mesaj, Farklı Davranışlar!", "icerik": "Polymorphism (Çok Biçimlilik), farklı nesnelerin aynı metot çağrısına kendi tarzlarında yanıt verebilmesidir.\n- Günlük Hayat: 'Çal' komutu piyanoda tuşa basar, gitarda tele vurur, flütte üfler.\n- Yazılımda: 'ode(tutar)' komutu Kredi Kartında POS çeker, Nakitte para alır, Havalede IBAN'a yollar.", "gorsel": {"type": "image", "query": "musical instruments piano guitar flute polymorphism"}}, {"baslik": "Ödeme Yöntemlerini Modelleme", "altbaslik": "3 Farklı Ödeme Sınıfı", "icerik": "class NakitOdeme:\n    def ode(self, tutar):\n        print(f'💵 {tutar:.2f} TL nakit para kasaya alındı.')\n\nclass KrediKartiOdeme:\n    def __init__(self, kart_no):\n        self.kart_no = kart_no\n\n    def ode(self, tutar):\n        print(f'💳 {self.kart_no} nolu karttan {tutar:.2f} TL çekildi.')", "gorsel": {"type": "image", "query": "cash and credit card payment options"}}, {"baslik": "Üçüncü Ödeme Yöntemi: KampusKart", "altbaslik": "Öğrenci Yemekhane Kartı", "icerik": "class KampusKartOdeme:\n    def __init__(self, ogrenci_no):\n        self.ogrenci_no = ogrenci_no\n\n    def ode(self, tutar):\n        print(f'🎓 {self.ogrenci_no} nolu öğrenci kartından {tutar:.2f} TL temassız çekildi.')", "gorsel": {"type": "image", "query": "contactless smart card university payment"}}, {"baslik": "Polimorfik Kasa Fonksiyonu", "altbaslik": "Ödeme Aracına Bağımlı Olmayan Temiz Kod", "icerik": "def kasada_odeme_al(odeme_araci, tutar):\n    # Gelen nesnenin tipine bakmaksızın ode() çağırır!\n    odeme_araci.ode(tutar)\n\n# Test Edelim:\nnakit = NakitOdeme()\nkart = KrediKartiOdeme('1234-5678')\nogr = KampusKartOdeme('24101')\n\nkasada_odeme_al(nakit, 50)\nkasada_odeme_al(kart, 150)\nkasada_odeme_al(ogr, 25)", "gorsel": {"type": "image", "query": "point of sale cashier terminal checkout"}}, {"baslik": "Laboratuvar Döngüsü 1: Güvenli Cüzdan Sınıfı", "altbaslik": "Adım Adım Kodluyoruz", "icerik": "class Cuzdan:\n    def __init__(self, sahip, para):\n        self.sahip = sahip\n        self.__para = 0.0\n        if para > 0:\n            self.__para = para\n\n    def para_harca(self, miktar):\n        if miktar <= self.__para:\n            self.__para -= miktar\n            print(f'{miktar} TL harcandı. Kalan: {self.__para} TL')\n        else:\n            print('Cüzdanda yeterli para yok!')", "gorsel": {"type": "image", "query": "leather wallet money pocket digital"}}, {"baslik": "Laboratuvar Döngüsü 2: Kötü Niyetli Erişim Testi", "altbaslik": "Private Değişkeni Kırmaya Çalışmak", "icerik": "c = Cuzdan('Ali', 200)\n\n# Dışarıdan değiştirmeyi deniyoruz:\nc.__para = 1000000  # Bu sadece yeni sahte bir nitelik açar!\n\n# Gerçek harcamayı test edelim:\nc.para_harca(50)  # Kalan: 150 TL (1000000 TL olmadı!)\nprint('Cüzdan güvenliği başarılı!')", "gorsel": {"type": "image", "query": "hacker penetration test failed security shield"}}, {"baslik": "Laboratuvar Döngüsü 3: Bildirim Gönderici Polimorfizmi", "altbaslik": "SMS, E-posta, WhatsApp", "icerik": "class EpostaBildirim:\n    def gonder(self, mesaj):\n        print(f'📧 E-posta atıldı: {mesaj}')\n\nclass SMSBildirim:\n    def gonder(self, mesaj):\n        print(f'📱 SMS gönderildi: {mesaj}')\n\nkanallar = [EpostaBildirim(), SMSBildirim()]\nfor k in kanallar:\n    k.gonder('Sınav notunuz açıklandı!')", "gorsel": {"type": "image", "query": "notifications email sms smartphone alerts"}}, {"baslik": "Laboratuvar Döngüsü 4: Öğrenci Not Ortalaması Kapsülleme", "altbaslik": "0 ile 100 Arasında Not Kuralı", "icerik": "class OgrenciNot:\n    def __init__(self, ad):\n        self.ad = ad\n        self.__vize = 0\n\n    def vize_gir(self, not_degeri):\n        if 0 <= not_degeri <= 100:\n            self.__vize = not_degeri\n            print(f'{self.ad} vize notu: {self.__vize}')\n        else:\n            print('HATA: Not 0 ile 100 arasında olmalıdır!')", "gorsel": {"type": "image", "query": "exam grade input validation system"}}, {"baslik": "Çözümlü Uygulama 1: Ses Çalar Polimorfizmi", "altbaslik": "MP3, WAV, FLAC Çalar", "icerik": "class MP3Calici:\n    def cal(self, dosya):\n        print(f'🎵 MP3 oynatılıyor: {dosya}')\n\nclass WAVCalici:\n    def cal(self, dosya):\n        print(f'📻 WAV çalınıyor: {dosya}')\n\ndef sarki_oynat(oynatici, sarki):\n    oynatici.cal(sarki)", "gorsel": {"type": "image", "query": "audio player wave mp3 music format"}}, {"baslik": "Çözümlü Uygulama 2: Şifreli Kullanıcı Kaydı", "altbaslik": "Parolayı Gizleme", "icerik": "class Kullanici:\n    def __init__(self, eposta, parola):\n        self.eposta = eposta\n        self.__parola = parola\n\n    def parola_kontrol(self, girilen):\n        return self.__parola == girilen", "gorsel": {"type": "image", "query": "password asterisks login authentication"}}, {"baslik": "Kapsülleme ve Çok Biçimliliğin Uyumu", "altbaslik": "SOLID İlkeleri ile Bağlantı", "icerik": "1. Kapsülleme (Encapsulation) -> Veriyi korur, iç yapıyı gizler.\n2. Çok Biçimlilik (Polymorphism) -> Dış arayüzü sabit tutar, sistemi genişletilebilir yapar (Open/Closed Principle).\n\nİkisi birleştiğinde esnek, güvenli ve profesyonel yazılımlar doğar.", "gorsel": {"type": "image", "query": "gears mechanism clockwork synergy architecture"}}, {"baslik": "Kod Okuma Alıştırması 1", "altbaslik": "Hatanın Sebebini Bulun", "icerik": "Hatalı Kod:\nclass Kisi:\n    def __init__(self, tc):\n        self.__tc = tc\n\nk = Kisi('12345678901')\nprint(k.__tc)\n\nProblem Nedir?\n__tc niteliği private olduğu için sınıf dışından doğrudan okunamaz (AttributeError)!\nÇözüm: get_tc() metodu tanımlanmalıdır.", "gorsel": {"type": "image", "query": "bug inspection private attribute error code"}}, {"baslik": "Kod Okuma Alıştırması 2", "altbaslik": "Çıktıyı Tahmin Edin", "icerik": "class Kedi:\n    def ses(self): return 'Miyav'\n\nclass Kopek:\n    def ses(self): return 'Hav'\n\nhayvanlar = [Kedi(), Kopek()]\nfor h in hayvanlar:\n    print(h.ses())\n\nÇıktı:\nMiyav\nHav", "gorsel": {"type": "image", "query": "cat and dog cute animals polymorphism"}}, {"baslik": "Sık Yapılan Hatalar", "altbaslik": "Kapsülleme ve Polimorfizm Tuzakları", "icerik": "1. Private değişken yapıp getter/setter yazmayı unutmak (Veri ulaşılamaz hale gelir).\n2. Setter içinde doğrulama (if) kontrolü yapmamak (Kapsüllemenin anlamı kalmaz).\n3. Çok biçimli sınıflarda metot isimlerini farklı yazmak (Örn: Birine ode(), diğerine odeme_yap() demek ortak döngüyü bozar!).", "gorsel": {"type": "image", "query": "warning checklist software bugs caution"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "Erişim Belirleyicileri", "icerik": "Soru: Python'da bir değişkeni private (gizli) yapmak için isminin başına ne konur?\nA) @private\nB) Çift alt çizgi (__)\nC) Tek alt çizgi (_)\nD) # işareti\n\nDoğru Cevap: B (Çift alt çizgi __).", "gorsel": {"type": "image", "query": "quiz test choice classroom students"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Çok Biçimlilik Tanımı", "icerik": "Soru: Farklı nesnelerin aynı metot ismine kendilerine özgü yanıt vermesine ne ad verilir?\nA) Kapsülleme\nB) Kalıtım\nC) Çok Biçimlilik (Polymorphism)\nD) Derleme\n\nDoğru Cevap: C (Çok Biçimlilik).", "gorsel": {"type": "image", "query": "multiple choice examination question test"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "Getter/Setter Amacı", "icerik": "Soru: Setter metodunun temel görevi nedir?\nA) Veriyi ekrana basmak\nB) Gizli veriye kural denetimi yaparak yeni değer atamak\nC) Sınıfı silmek\nD) Dosya kaydetmek\n\nDoğru Cevap: B (Kurallı veri ataması yapmak).", "gorsel": {"type": "image", "query": "security check verification test question"}}, {"baslik": "Sektörel Vaka: E-Ticaret Ödeme Altyapısı", "altbaslik": "Iyzico, Stripe ve Garanti Nasıl Bağlanır?", "icerik": "Gerçek Dünyada:\nBir alışveriş sitesinde 10 farklı banka sanal POS'u vardır.\nYazılımcı her banka için if-else yazmak yerine ortak bir OdemeServisi arayüzü kurar.\nSite yeni bir banka eklediğinde ana kodlara dokunmaz, sadece yeni bir polimorfik sınıf ekler.", "gorsel": {"type": "image", "query": "payment gateway stripe pos integration online shopping"}}, {"baslik": "Ders Sonu Görevi (Boss Fight)", "altbaslik": "Kampüs Market Sepet Ödeme Simülatörü", "icerik": "Göreviniz:\n1. GuvenliKasa sınıfı yazın (__bakiye niteliği olsun, para_ekle ve para_dus metotları denetimli olsun).\n2. 2 ödeme yöntemi tanımlayın: KrediKarti (kart_no) ve HediyeCeki (cek_kodu).\n3. İki sınıfta da ode(tutar) metodu olsun.\n4. Kullanıcıdan sepet tutarını alıp seçtiği ödeme yöntemiyle kasadan ödemeyi tamamlayın.\n\nSüre: 30 Dakika | Tek Başınıza Tamamlayınız!", "gorsel": {"type": "image", "query": "supermarket checkout payment terminal mission"}}, {"baslik": "Boss Fight İçin İskelet Kod", "altbaslik": "Başlangıç Desteği", "icerik": "class HediyeCeki:\n    def __init__(self, kod):\n        self.kod = kod\n    def ode(self, tutar):\n        print(f'🎁 {self.kod} kodlu hediye çekiyle {tutar} TL ödendi.')\n\n# Kasa fonksiyonu:\ndef sepet_ode(yontem, tutar):\n    yontem.ode(tutar)", "gorsel": {"type": "image", "query": "gift card discount voucher code help"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Kazandık?", "icerik": "- Kapsülleme veriyi dış dünyadan korur ve veri bütünlüğü sağlar.\n- __ ile başlayan değişkenler private olur ve dışarıdan doğrudan değiştirilemez.\n- Getter ve Setter metotları kurallı okuma ve yazma sağlar.\n- Çok Biçimlilik aynı arayüz üzerinden farklı nesneleri tek merkezden yönetir.", "gorsel": {"type": "image", "query": "summary roadmap achievements university"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 6: Sihirli (Dunder) Metotlar ve try-except", "icerik": "Ön Hazırlık:\n- print(nesne) yazdığımızda ekranda güzel Türkçe açıklamayı nasıl görürüz (__str__)?\n- Programımızın kırmızı hata verip çökmesini nasıl engelleriz (try-except)?\n- Kütüphane arama sistemini çökmeyen hale getireceğiz!", "gorsel": {"type": "image", "query": "exception handling try except python programming"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Laboratuvardan Çıkmadan Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Bir Ogrenci sınıfında __yas niteliğini tanımlayan ve yaşın 0\\'dan küçük olmasını engelleyen bir set_yas(yeni_yas) metodunu kâğıda yazınız.'\n\nİyi çalışmalar!", "gorsel": {"type": "image", "query": "exit ticket examination university"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • OOP & Mimari`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
