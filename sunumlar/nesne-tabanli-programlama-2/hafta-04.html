<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nesne Tabanlı Programlama II - Hafta 04 Sunumu | ezfesoft 26-27 Güz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #7c3aed;
            --accent-glow: #7c3aed25;
            --code-bg: #1e293b;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --radius: 14px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --code-bg: #090d16;
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .desktop-only { display: inline; }
        .mobile-only { display: none; }

        /* Header Bar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            gap: 8px;
        }

        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #0284c7);
            width: 0%;
            transition: width 0.25s ease;
        }

        .course-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            min-width: 0;
            flex: 1;
            overflow: hidden;
        }

        .course-title-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-pill {
            background: var(--accent-glow);
            color: var(--accent-color);
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* Slide Viewport */
        .slide-container {
            flex: 1;
            margin-top: 56px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-card {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            max-height: calc(100vh - 136px);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 32px 36px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-header {
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--bg-card-border);
            padding-bottom: 12px;
        }

        .slide-meta {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .slide-title {
            font-size: 1.7rem;
            font-weight: 800;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .slide-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .slide-body {
            flex: 1;
            font-size: 1.0rem;
            line-height: 1.65;
            color: var(--text-primary);
        }

        /* Content Formatting */
        .content-paragraph {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .content-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
        }

        .content-list-item {
            background: rgba(0,0,0,0.03);
            border-left: 3.5px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        [data-theme="dark"] .content-list-item {
            background: rgba(255,255,255,0.04);
        }

        .content-list-item::before {
            content: "✦";
            color: var(--accent-color);
            font-weight: bold;
        }

        .step-badge {
            background: var(--accent-color);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            overflow-x: auto;
            margin: 14px 0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* Bottom Nav Dock */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--bg-card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: var(--accent-glow);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-color);
            color: #fff;
        }

        .slide-counter {
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 65px;
            text-align: center;
            background: var(--bg-card);
            padding: 6px 10px;
            border-radius: 16px;
            border: 1px solid var(--bg-card-border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Overview Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-overview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .thumb-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .thumb-card:hover, .thumb-card.active {
            border-color: var(--accent-color);
            transform: scale(1.02);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .thumb-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .thumb-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive Mobile Adjustments */
        @media (max-width: 640px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: inline !important; }

            .top-bar {
                padding: 0 8px;
            }
            .course-badge {
                font-size: 0.85rem;
            }
            .badge-pill {
                display: none;
            }
            .slide-container {
                padding: 8px;
                margin-top: 56px;
                margin-bottom: 56px;
            }
            .slide-card {
                padding: 18px 14px;
                min-height: 360px;
                max-height: calc(100vh - 120px);
            }
            .slide-title {
                font-size: 1.25rem;
            }
            .slide-subtitle {
                font-size: 0.9rem;
            }
            .slide-body {
                font-size: 0.9rem;
                line-height: 1.5;
            }
            .content-list-item {
                font-size: 0.85rem;
                padding: 8px 10px;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 10px;
            }
            .bottom-nav {
                padding: 0 6px;
                gap: 4px;
                height: 52px;
            }
            .nav-group {
                gap: 3px;
            }
            .btn-nav {
                padding: 6px 8px;
                font-size: 0.78rem;
                border-radius: 6px;
            }
            .slide-counter {
                font-size: 0.75rem;
                min-width: 50px;
                padding: 5px 6px;
            }
            .grid-overview {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }
        }
    </style>
</head>

    <script>
        const slides = [{"baslik": "NTP II: Hafta 4", "altbaslik": "Nesne Tabanlı Programlamada Kalıtım (Inheritance)", "icerik": "Program: Bilgisayar Programcılığı (Önlisans)\nDers: Nesne Tabanlı Programlama II\nEğitmen: Öğr. Gör. Süleyman EZDEMİR\nKurum: Giresun Üniversitesi\nHaftalık Odak: Miras Alma (Inheritance), super(), Metot Ezme (Override) ve Is-A İlişkisi\nUygulama Teması: Üniversite Kampüs Portalı ve Turnike Geçiş Sistemi", "gorsel": {"type": "image", "query": "inheritance hierarchy tree code architecture python"}}, {"baslik": "Kalıtım (Miras Alma) Nedir?", "altbaslik": "Kod Tekrarına Son Veren Süper Güç", "icerik": "Gerçek hayatta çocuklar anne ve babalarının genetik özelliklerini miras alır.\n- Yazılımda da bir sınıf, başka bir sınıfın özelliklerini ve metotlarını miras alabilir.\n- Temel Amaç: Kod tekrarını (DRY - Don't Repeat Yourself) önlemek ve kodun bakımını kolaylaştırmaktır.", "gorsel": {"type": "image", "query": "family generation inheritance genetic tree illustration"}}, {"baslik": "Is-A (Bir Şeydir) İlişkisi", "altbaslik": "Kalıtım Ne Zaman Kullanılır?", "icerik": "Kalıtım kurmak için sınıflar arasında 'Is-A' ilişkisi olmalıdır:\n- Öğrenci bir İnsandır (Ogrenci is-a Insan) -> Kalıtım UYGUNDUR.\n- Öğretmen bir İnsandır (Ogretmen is-a Insan) -> Kalıtım UYGUNDUR.\n\nUYARI:\n- Araba bir Motora sahiptir (Has-A) -> Kalıtım DEĞİL, Kompozisyon gerektirir.", "gorsel": {"type": "image", "query": "classification taxonomy hierarchy tree"}}, {"baslik": "Ana Sınıf (Base Class / Parent)", "altbaslik": "Tüm İnsanların Ortak Çatısı", "icerik": "class Insan:\n    def __init__(self, ad, soyad, eposta):\n        self.ad = ad\n        self.soyad = soyad\n        self.eposta = eposta\n\n    def kimlik_bilgisi(self):\n        print(f'Kişi: {self.ad} {self.soyad} | E-posta: {self.eposta}')", "gorsel": {"type": "image", "query": "parent class base model university identity"}}, {"baslik": "Alt Sınıf (Subclass / Child) ve super()", "altbaslik": "Ortak Özellikleri Miras Alıp Genişletmek", "icerik": "class Ogrenci(Insan):  # Insan sınıfından miras alıyoruz\n    def __init__(self, ad, soyad, eposta, ogrenci_no):\n        super().__init__(ad, soyad, eposta)  # Ana sınıfın yapıcısını çağırır!\n        self.ogrenci_no = ogrenci_no\n\n    def ders_calis(self):\n        print(f'{self.ad} ({self.ogrenci_no}) ders çalışıyor 📚')", "gorsel": {"type": "image", "query": "student studying reading laptop campus"}}, {"baslik": "İkinci Alt Sınıf: OgretimGorevlisi", "altbaslik": "Aynı Ana Sınıftan Başka Bir Varlık Türetmek", "icerik": "class OgretimGorevlisi(Insan):\n    def __init__(self, ad, soyad, eposta, unvan, bolum):\n        super().__init__(ad, soyad, eposta)\n        self.unvan = unvan\n        self.bolum = bolum\n\n    def ders_anlat(self):\n        print(f'{self.unvan} {self.ad} {self.bolum} dersi anlatıyor 👨‍🏫')", "gorsel": {"type": "image", "query": "professor teaching classroom chalkboard university"}}, {"baslik": "Üçüncü Alt Sınıf: Memur", "altbaslik": "İdari Personel Modeli", "icerik": "class Memur(Insan):\n    def __init__(self, ad, soyad, eposta, birim):\n        super().__init__(ad, soyad, eposta)\n        self.birim = birim\n\n    def evrak_isle(self, evrak_adi):\n        print(f'{self.ad} memuru {evrak_adi} evrakını onayladı.')", "gorsel": {"type": "image", "query": "office administrator processing documents stamp"}}, {"baslik": "Metot Ezme (Method Overriding)", "altbaslik": "Miras Alınan Davranışı Özelleştirme", "icerik": "Alt sınıf, ana sınıftaki bir metodu aynı isimle yeniden yazarak davranışını değiştirebilir:\n\nclass Ogrenci(Insan):\n    # ...\n    def kimlik_bilgisi(self):  # Ezme (Override)\n        print(f'🎓 Öğrenci: {self.ad} {self.soyad} | No: {self.ogrenci_no}')\n\nBu durum Çok Biçimliliğin (Polymorphism) temelini oluşturur.", "gorsel": {"type": "image", "query": "override customize replace behavior programming"}}, {"baslik": "super() ile Ana Sınıf Metodunu Genişletme", "altbaslik": "Silmek Yerine Üzerine Ekleme Yapmak", "icerik": "class OgretimGorevlisi(Insan):\n    # ...\n    def kimlik_bilgisi(self):\n        super().kimlik_bilgisi()  # Önce ana sınıfın çıktısını verir\n        print(f'Ünvan: {self.unvan} | Bölüm: {self.bolum}')  # Ekstra bilgi basar", "gorsel": {"type": "image", "query": "extending adding layers building architecture"}}, {"baslik": "Laboratuvar Döngüsü 1: Kampüs Nesnelerini Üretme", "altbaslik": "Adım Adım Kodluyoruz", "icerik": "ogr = Ogrenci('Zeynep', 'Kaya', 'zeynep@ogr.giresun.edu.tr', '24105')\nhoca = OgretimGorevlisi('Süleyman', 'EZDEMİR', 'suleyman@giresun.edu.tr', 'Öğr. Gör.', 'Bilgisayar')\nmemur = Memur('Ahmet', 'Demir', 'ahmet@giresun.edu.tr', 'Öğrenci İşleri')\n\nogr.kimlik_bilgisi()\nhoca.kimlik_bilgisi()\nmemur.kimlik_bilgisi()", "gorsel": {"type": "image", "query": "campus identity card badge university students"}}, {"baslik": "Laboratuvar Döngüsü 2: E-Ticaret Ürün Hiyerarşisi", "altbaslik": "Urun -> Telefon, Laptop", "icerik": "class Urun:\n    def __init__(self, baslik, fiyat):\n        self.baslik = baslik\n        self.fiyat = fiyat\n\nclass Telefon(Urun):\n    def __init__(self, baslik, fiyat, dahili_hafiza):\n        super().__init__(baslik, fiyat)\n        self.dahili_hafiza = dahili_hafiza\n\ntel = Telefon('Galaxy S24', 45000, 256)\nprint(f'{tel.baslik} ({tel.dahili_hafiza} GB) -> {tel.fiyat} TL')", "gorsel": {"type": "image", "query": "smartphone laptop electronic store catalog"}}, {"baslik": "Laboratuvar Döngüsü 3: Laptop Alt Sınıfı", "altbaslik": "İkinci Ürün Tipini Modelleme", "icerik": "class Laptop(Urun):\n    def __init__(self, baslik, fiyat, ram_gb):\n        super().__init__(baslik, fiyat)\n        self.ram_gb = ram_gb\n\n    def ozellikler(self):\n        print(f'💻 {self.baslik} - {self.ram_gb} GB RAM - {self.fiyat} TL')\n\nlap = Laptop('ThinkPad', 35000, 32)\nlap.ozellikler()", "gorsel": {"type": "image", "query": "laptop computer hardware specification notebook"}}, {"baslik": "Laboratuvar Döngüsü 4: Ortak İndirim Metodu", .", "gorsel": {"type": "image", "query": "polymorphic greeting message output code"}}, {"baslik": "Sık Yapılan Hatalar", "altbaslik": "Kalıtım Yazarken Dikkat Edilecekler", "icerik": "1. Alt sınıfın __init__ metodunda super().__init__(...) çağrısını unutmak (Ana sınıf nitelikleri boş kalır!).\n2. Sınıf parantezi içine ana sınıfın adını yazmayı unutmak (class Ogrenci: yerine class Ogrenci(Insan):).\n3. Gereksiz yere her şeye kalıtım uygulamak (Has-A durumlarında kompozisyon tercih edilmelidir).", "gorsel": {"type": "image", "query": "bug error warning checklist code"}}, {"baslik": "Mini Quiz: Soru 1", "altbaslik": "super() Fonksiyonu", "icerik": "Soru: super() fonksiyonunun temel amacı nedir?\nA) Programı hızlandırmak\nB) Alt sınıftan ana sınıfın metotlarına/yapıcısına erişmek\nC) Değişkenleri silmek\nD) Yeni kütüphane kurmak\n\nDoğru Cevap: B (Ana sınıfın kurucu ve metotlarına erişir).", "gorsel": {"type": "image", "query": "quiz test examination students classroom"}}, {"baslik": "Mini Quiz: Soru 2", "altbaslik": "Metot Ezme", "icerik": "Soru: Alt sınıfın ana sınıftan gelen bir metodu kendi ihtiyacına göre yeniden tanımlamasına ne ad verilir?\nA) Overloading\nB) Encapsulation\nC) Overriding (Metot Ezme)\nD) Casting\n\nDoğru Cevap: C (Method Overriding).", "gorsel": {"type": "image", "query": "overriding concept computer programming test"}}, {"baslik": "Mini Quiz: Soru 3", "altbaslik": "İlişki Türü", "icerik": "Soru: Hangisi kalıtım için doğru bir 'Is-A' ilişkisidir?\nA) Araba - Motor\nB) Kedi - Hayvan\nC) Ev - Kapı\nD) Bilgisayar - Klavye\n\nDoğru Cevap: B (Kedi bir hayvandır).", "gorsel": {"type": "image", "query": "animal classification taxonomy biology"}}, {"baslik": "Sektörel Vaka: Oyun Sektöründe Karakter Hiyerarşisi", "altbaslik": "Büyük Oyunlarda Kalıtım Nasıl Kullanılır?", "icerik": "Vaka Analizi:\nBir RPG oyununda 50 farklı düşman vardır (Zombi, Ejderha, Goblin).\nTüm düşmanlar Dusman ana sınıfından (can, hiz, konum) türer.\nYeni bir düşman eklemek için sadece 5 satır kod yazılır:\nclass Kurt(Dusman): ...\nKalıtım, oyun stüdyolarına aylar kazandırır.", "gorsel": {"type": "image", "query": "video game development character class hierarchy"}}, {"baslik": "Ders Sonu Görevi (Boss Fight)", "altbaslik": "Kampüs Turnike Geçiş Yetki Sistemi", "icerik": "Göreviniz:\n1. Gorevli ana sınıfı tanımlayın (ad, kart_no, yetki_seviyesi).\n2. Guvenlik ve Temizlik alt sınıflarını türetin.\n3. kapi_gecis(kapi_adi) metodunu her alt sınıfta ezin (override edin):\n   - Güvenlik: 'Tüm kapılara erişim İZİNLİ.'\n   - Temizlik: 'Sadece kat ve depo kapılarına İZİNLİ.'\n4. Kart okutulduğunda yetkiyi yazdıran simülasyonu çalıştırın.\n\nSüre: 30 Dakika | Tek Başınıza Tamamlayınız!", "gorsel": {"type": "image", "query": "security turnstile rfid access control badge"}}, {"baslik": "Boss Fight İçin İskelet Kod", "altbaslik": "Başlangıç Desteği", "icerik": "class Gorevli:\n    def __init__(self, ad, kart_no):\n        self.ad = ad\n        self.kart_no = kart_no\n\nclass Guvenlik(Gorevli):\n    def kapi_gecis(self, kapi):\n        print(f'🛡️ Güvenlik {self.ad} -> {kapi} kapısından GEÇTİ.')", "gorsel": {"type": "image", "query": "hints blueprint security badge programming"}}, {"baslik": "Haftalık Konu Özeti", "altbaslik": "Neler Kazandık?", "icerik": "- Kalıtım kod tekrarını önler ve Is-A ilişkisine dayanır.\n- super().__init__() ile ana sınıfın özellikleri miras alınır.\n- Metot Ezme (Overriding) ile alt sınıflar davranışı özelleştirir.\n- Hiyerarşik yapılar büyük sistemleri modüler ve sürdürülebilir kılar.", "gorsel": {"type": "image", "query": "summary roadmap achievements university"}}, {"baslik": "Gelecek Haftaya Bakış", "altbaslik": "Hafta 5: Kapsülleme ve Çok Biçimlilik", "icerik": "Ön Hazırlık:\n- Bir banka hesabında bakiyeyi doğrudan eksi yapabilir miyiz?\n- Private değişkenler (__) nasıl çalışır?\n- Kasada hem nakit hem kredi kartıyla ödeme nasıl polimorfik olarak işlenir?", "gorsel": {"type": "image", "query": "polymorphism encapsulation security banking card"}}, {"baslik": "Çıkış Bileti (Exit Ticket)", "altbaslik": "Laboratuvardan Çıkmadan Önce Cevaplayınız", "icerik": "Günün Sorusu:\n'Araba ana sınıfından türeyen ve super() ile marka, model bilgilerini miras alan ElektrikliAraba sınıfını kâğıda yazınız.'\n\nİyi çalışmalar!", "gorsel": {"type": "image", "query": "exit ticket examination university"}}];
        let currentIndex = 0;

        const slideTitle = document.getElementById('slideTitle');
        const slideSubtitle = document.getElementById('slideSubtitle');
        const slideBody = document.getElementById('slideBody');
        const slideMeta = document.getElementById('slideMeta');
        const slideCounter = document.getElementById('slideCounter');
        const progressBar = document.getElementById('progressBar');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCard = document.getElementById('slideCard');

        const themeToggle = document.getElementById('themeToggle');
        const overviewToggle = document.getElementById('overviewToggle');
        const overviewModal = document.getElementById('overviewModal');
        const closeModal = document.getElementById('closeModal');
        const gridOverview = document.getElementById('gridOverview');
        const fullscreenToggle = document.getElementById('fullscreenToggle');

        function formatContent(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            let inList = false;

            lines.forEach((line) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul class="content-list">';
                        inList = true;
                    }
                    html += `<li class="content-list-item">${trimmed.substring(2)}</li>`;
                }
                else if (/^\d+\.\s/.test(trimmed)) {
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    const match = trimmed.match(/^(\d+)\.\s+(.*)/);
                    if (match) {
                        html += `<div class="content-list-item"><span class="step-badge">${match[1]}</span><span>${match[2]}</span></div>`;
                    }
                }
                else if (trimmed.includes(';') || trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('print(') || trimmed.includes('def ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="code-block">${trimmed}</div>`;
                }
                else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<div class="content-paragraph">${trimmed}</div>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        function renderSlide(index) {
            if (index < 0 || index >= slides.length) return;
            currentIndex = index;
            const slide = slides[currentIndex];

            slideCard.style.animation = 'none';
            slideCard.offsetHeight;
            slideCard.style.animation = 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)';

            slideTitle.textContent = slide.baslik || 'Başlıksız Slayt';
            slideSubtitle.textContent = slide.altbaslik || '';
            
            let bodyHTML = formatContent(slide.icerik);
            slideBody.innerHTML = bodyHTML;

            slideMeta.textContent = `SLAYT ${currentIndex + 1} / ${slides.length} • OOP & Mimari`;
            slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
            
            const pct = ((currentIndex + 1) / slides.length) * 100;
            progressBar.style.width = `${pct}%`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;

            updateOverviewActive();
        }

        function buildOverviewGrid() {
            gridOverview.innerHTML = '';
            slides.forEach((slide, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="thumb-num">Slayt ${idx + 1}</div>
                    <div class="thumb-title">${slide.baslik || 'Başlıksız'}</div>
                `;
                card.onclick = () => {
                    renderSlide(idx);
                    overviewModal.classList.remove('active');
                };
                gridOverview.appendChild(card);
            });
        }

        function updateOverviewActive() {
            const cards = gridOverview.querySelectorAll('.thumb-card');
            cards.forEach((c, idx) => {
                if (idx === currentIndex) c.classList.add('active');
                else c.classList.remove('active');
            });
        }

        prevBtn.onclick = () => renderSlide(currentIndex - 1);
        nextBtn.onclick = () => renderSlide(currentIndex + 1);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                e.preventDefault();
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                renderSlide(currentIndex - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                renderSlide(0);
            } else if (e.key === 'End') {
                e.preventDefault();
                renderSlide(slides.length - 1);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'm' || e.key === 'M' || e.key === 'o' || e.key === 'O') {
                toggleOverview();
            } else if (e.key === 't' || e.key === 'T') {
                toggleTheme();
            }
        });

        function toggleOverview() {
            buildOverviewGrid();
            overviewModal.classList.toggle('active');
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        overviewToggle.onclick = toggleOverview;
        closeModal.onclick = () => overviewModal.classList.remove('active');
        themeToggle.onclick = toggleTheme;
        fullscreenToggle.onclick = toggleFullscreen;

        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) renderSlide(currentIndex + 1);
            if (touchEndX - touchStartX > 40) renderSlide(currentIndex - 1);
        });

        renderSlide(0);
        buildOverviewGrid();
    </script>
